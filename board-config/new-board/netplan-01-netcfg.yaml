network:
        version: 2
        ethernets:
                eth0:
                        # DHCP з домашнього роутера - заводський шлюз 192.168.0.1
                        # у цій мережі не існує, тому плата була без інтернету.
                        dhcp4: true
                        # Заводська адреса лишається другою: доступ до плати йде
                        # через неї зі старої плати, і якщо DHCP колись не
                        # відповість, цей шлях уціліє.
                        addresses: [192.168.0.123/24]
                        optional: true
                eth1:
                        dhcp4: true
                        optional: true
