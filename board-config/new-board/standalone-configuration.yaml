# --- Per-device energy accounting (added 2026-08-03) ---
#
# УВАГА: два сенсори бойлера створені як UI-помічники (config entries у
# .storage/core.config_entries), а НЕ цим файлом - на момент створення до плати
# не було SSH, лише REST API. Тому тут вони лише задокументовані. Якщо колись
# доведеться піднімати конфіг з нуля, розкоментуй блок нижче І видали
# відповідні помічники в UI, інакше сутності задублюються.
#
# Тепла підлога власних сенсорів не потребує: термостати Terneo самі віддають
# sensor.terneo_N_heating_energy у кВт-год (час замикання реле помножений на
# power_watts=2000, прошиту в самому термостаті - це оцінка, не вимір).
#
# Бойлер Midea лічильника енергії не має. Модель потужності:
#   * heating = False                    -> 0 Вт
#   * heating = True, heating_power > 0  -> heating_power (2200 Вт, верхній тен)
#   * heating = True, heating_power = 0  -> 800 Вт (працює лише нижній тен)
# Обидві цифри звірені зі стрибком загального лічильника будинку 2026-08-03:
# вимкнення верхнього тена давало -2.18 і -1.92 кВт, нижнього - близько -0.75 кВт.
#
# template:
#   - sensor:
#       - name: "Бойлер - потужність"
#         unique_id: boiler_power_estimated
#         unit_of_measurement: "W"
#         device_class: power
#         state_class: measurement
#         state: >
#           {% set e = 'water_heater.144036023323246_water_heater' %}
#           {% set hp = state_attr(e, 'heating_power') | float(0) %}
#           {{ 0 if not state_attr(e, 'heating') else (hp if hp > 0 else 800) }}
#
# sensor:
#   - platform: integration
#     source: sensor.boiler_potuzhnist
#     name: Бойлер - спожито
#     unique_id: boiler_energy_total
#     unit_prefix: k
#     unit_time: h
#     method: left
#     round: 3
#     max_sub_interval: "00:01:00"

# --- Насос поливу: облік енергії (додано 2026-08-03) ---
#
# Так само як бойлер, ці сутності створені як UI-помічники в .storage, а не тут:
#   input_number.nasos_polivu_potuzhnist        - калібрувальна потужність, Вт
#   sensor.nasos_polivu_potuzhnist_zaraz        - template, миттєва потужність
#   sensor.nasos_polivu_spozhito                - Riemann left -> кВт-год
#
# Реле Tuya Mini switch K601 лічильника енергії НЕ має (перевірено: у пристрою
# лише switch, timer і power_on_behavior). Тому енергія = час роботи реле,
# помножений на потужність.
#
# Потужність 1100 Вт ВИМІРЯНА 2026-08-03 по стрибку sensor.zagalne_navantazhennia,
# а не взята зі стелі:
#   * контрольований пуск (клапан -> насос, по 90 с) : 8.453 - 7.46  = 994 Вт
#   * реальний пуск 19:11:39 (41 вимір)              : 3.521 - 2.095 = 1426 Вт
#   * реальний пуск 19:13:19                         : 3.214 - 2.095 = 1119 Вт
# Взято медіану. Значення міняється з дашборда, YAML для цього правити не треба.
#
# Насос видно у HA двічі. ГОЛОВНА - локальна сутність; хмарна лише резерв:
#   {% set l = states('switch.mini_switch_k601_2_switch_1_2') %}
#   {% set c = states('switch.mini_switch_k601_2_switch_1') %}
#   {% set on = (l == 'on') if l in ['on','off'] else (c == 'on') %}
# Спершу була проста OR-логіка, але вона хибна: якщо локальна вже сказала off,
# а хмарна ще тримає застаріле on, облік нараховував би неіснуюче споживання.

# --- Двозонний тариф на електроенергію (додано 2026-08-03) ---
#
# Було: плоска ціна 2.5 грн/кВт-год у налаштуваннях Energy-дашборда
# (number_energy_price). Тобто ВЕСЬ день рахувався за нічною ставкою, і денне
# споживання недооцінювалося рівно вдвічі.
#
# Стало: Energy-дашборд бере ціну з сутності (entity_energy_price), а не число.
# Помічники (UI, .storage - як і решта):
#   input_number.tarif_den_07_00_22_59   = 5.00 грн/кВт-год
#   input_number.tarif_nich_23_00_06_59  = 2.50 грн/кВт-год
#   sensor.tarif_elektroenergii_zaraz    - template, перемикається за годиною:
#       {% set h = now().hour %}
#       {{ ден if 7 <= h < 23 else ніч }}
#   Межі перевірені: 03:00->2.5, 07:00->5.0, 14:00->5.0, 22:00->5.0, 23:00->2.5.
#
# Ставки редагуються з дашборда "Потужність" -> вкладка "Тариф".
#
# ВАЖЛИВО: перерахунок діє лише на споживання ПІСЛЯ 2026-08-03. Історія
# статистики вартості заднім числом не переписується - там лишається 2.5 грн.

# --- Камера "Двір": перегляд моменту виявлення руху (додано 2026-08-04) ---
#
# Hikvision сам не зберігає кадри для HA - camera.cam1 віддає лише живий потік.
# При кожному спрацюванні binary_sensor.cam1_motion автоматизація
# "hikvision_motion_snapshot" (automations.yaml) робить camera.snapshot і кладе
# файл у www/motion/ (роздається як /local/motion/motion_*.jpg), а також
# оновлює www/motion/latest.jpg. Окрема вкладка дашборда "Останній рух"
# (devices_dashboard.yaml, path: motion) показує latest.jpg через звичайний
# markdown-image БЕЗ jinja/cache-busting - той варіант з timestamp-текстом і
# query-параметром постійно ловив InvalidStateError у sections-грід (див.
# GOTCHA у dashboards.md) і картка зникала. Час останнього руху натомість
# видно на вкладці Камера (рядок "Рух", secondary_info: last-changed).
# НЕ через platform: local_file - той більше не підтримує YAML-налаштування
# в цій версії HA ("does not support platform setup").
# shell_command.update_motion_snapshot лишає останні 30 знімків, старі видаляє.

# --- Camera clips: is the NAS video share actually mounted? (added 2026-08-05) ---
# Guard for the motion-clip automation. If the NAS is unreachable the mount point
# is just an ordinary empty directory, and writing clips into it would fill
# /userdata - exactly the failure that took the whole system down earlier today.
command_line:
  # Стан файлової системи /userdata. Перевірка при завантаженні знята
  # (fstab pass 0), інакше пошкоджений розділ не монтується і HA не
  # стартує взагалі - тож роль сторожа виконує цей сенсор.
  - binary_sensor:
      name: Userdata FS poshkodzhena
      unique_id: userdata_fs_clean
      # Шукати саме "with errors", а не "clean": змонтована ext4 ЗАВЖДИ
      # позначена "not clean" - вона стає чистою лише при відмонтуванні, тож
      # перевірка на "clean" сигналила б тривогу цілодобово. Прапорець помилок
      # у суперблоці - це окрема річ, і саме він тут важливий.
      command: >-
        sudo dumpe2fs -h /dev/mmcblk0p8 2>/dev/null
        | grep -q "Filesystem state:.*with errors" && echo "ON" || echo "OFF"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: problem
      scan_interval: 3600
  # Вільне місце на розділі, де живе Home Assistant. Розділ 2.5 ГБ, і
  # заповнений він уже одного разу клав дім (5 серпня, полив стояв добу).
  # Корінь тепер тримає базу recorder, тож стежити треба за обома розділами.
  # Вільне місце на розділі, де живе Home Assistant. Розділ 2.5 ГБ, і
  # заповнений він уже одного разу клав дім (5 серпня, полив стояв добу).
  # Корінь тепер тримає базу recorder, тож стежити треба за обома розділами.
  - sensor:
      name: Vilne mistse korenia
      unique_id: root_free_mb
      command: "df -Pm / | awk 'NR==2{print $4}'"
      unit_of_measurement: MB
      state_class: measurement
      scan_interval: 600
  - sensor:
      name: Vilne mistse userdata
      unique_id: userdata_free_mb
      command: "df -Pm /userdata | awk 'NR==2{print $4}'"
      unit_of_measurement: MB
      state_class: measurement
      scan_interval: 600
  # Newest motion clips as JSON, for the gallery card on the Останній рух
  # tab. Path is the www bind mount, so the links need no auth token.
  - sensor:
      name: Motion clips list
      unique_id: motion_clips_list
      command: >-
        cd /userdata/hass/config/www/motion-clips 2>/dev/null &&
        ls -t */ruh_*.mp4 2>/dev/null | head -40 |
        awk -F/ '{split($2,a,"_"); t=substr(a[2],1,2)":"substr(a[2],3,2)":"substr(a[2],5,2);
        printf "%s{\"d\":\"%s\",\"t\":\"%s\",\"f\":\"%s\"}", (NR>1?",":""), $1, t, $2}'
        | awk 'BEGIN{printf "{\"clips\":["} {printf "%s", $0} END{printf "]}"}'
      value_template: "ok"
      json_attributes:
        - clips
      scan_interval: 120
  - binary_sensor:
      name: NAS videoarkhiv zmontovanyi
      unique_id: nas_video_mount_ok
      command: mountpoint -q /userdata/hass/config/media/video && echo ON || echo OFF
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 300
  - binary_sensor:
      name: CloudMate NAS Online
      unique_id: cloudmate_nas_online
      command: 'ping -W 1 -c 1 192.168.50.25 > /dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 30
      device_class: connectivity
      icon: mdi:nas
  - binary_sensor:
      name: TCL TV Online
      unique_id: tcl_tv_online
      command: 'ping -W 1 -c 1 192.168.50.175 > /dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 30
      device_class: connectivity
      icon: mdi:television
  - binary_sensor:
      name: Hikvision Camera Online
      unique_id: hikvision_camera_online
      command: 'ping -W 1 -c 1 192.168.50.201 > /dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 30
      device_class: connectivity
      icon: mdi:cctv

shell_command:
  # Keep the clip folder bounded. It lives on the NAS, but an unbounded
  # folder is still bad manners - and if the mount ever silently fell away
  # this would be running against the board's own disk.
  prepare_motion_dir: "d=/userdata/hass/config/media/video/ha-motion; mkdir -p $d/$(date +%Y-%m-%d); find $d -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +"
  rebuild_clip_gallery: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts-gen-gallery.py"
  update_motion_snapshot: "cd /userdata/hass/config/www/motion && ls -t motion_*.jpg 2>/dev/null | head -1 | xargs -I{} cp {} latest.jpg && ls -t motion_*.jpg 2>/dev/null | tail -n +31 | xargs -r rm --"
