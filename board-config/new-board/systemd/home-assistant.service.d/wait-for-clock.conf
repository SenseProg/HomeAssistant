# Drop-in for home-assistant.service (03.09.2026).
#
# The board has no working RTC: every boot starts on 2024-06-17 and only NTP
# (timesync-retry.timer, 90 s after boot) corrects it. Home Assistant used to
# start ~50 s after boot, i.e. BEFORE the clock was right: the recorder wrote
# states stamped 2024, camera clips landed in a "2024-06-17" folder, time
# triggers fired against a clock two years off, and then the whole process
# lived through a two-year time jump. Seen again on 03.09.2026 13:58 after the
# board lost power for an hour.
#
# Wait up to 5 minutes for a sane year before starting; start anyway after
# that, because a board with no NTP is still better with HA than without.
[Unit]
After=timesync-retry.service
Wants=timesync-retry.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ "$(date +%%Y)" -ge 2026 ] && exit 0; [ $i -eq 1 ] && systemctl restart systemd-timesyncd; sleep 5; done; logger -t home-assistant "clock still wrong after 5 min, starting anyway"; exit 0'
