- id: irrigation_pump_session_energy
  alias: Полив - фіксація лічильника на старті сесії
  description: На кожному вмиканні насоса запам'ятовує поточний показ наростаючого лічильника енергії,
    щоб сенсор "спожито за сесію" рахував від нуля.
  triggers:
  - trigger: state
    entity_id: switch.mini_switch_k601_2_switch_1_2
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.nasos_energiia_start
    data:
      value: '{{ states(''sensor.nasos_polivu_spozhito'') | float(0) }}'
  mode: single
- id: irrigation_close_valves_when_pump_idle
  alias: Полив - закрити клапани, якщо насос давно вимкнений
  description: Прибирає забутий відкритий клапан після ручного пуску. Irrigation Unlimited закриває свої
    клапани за 3 секунди після зупинки насоса, тому 5-хвилинна витримка у його роботу не втручається.
  triggers:
  - trigger: template
    value_template: "{{ is_state('switch.mini_switch_k601_2_switch_1_2', 'off')\n   and (is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_1',\
      \ 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_2', 'on')\n        or\
      \ is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_3', 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_4',\
      \ 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_5', 'on')) }}\n"
    for: 00:05:00
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.avtopoliv_kontroler_avtopoliv_klapan_1
      - switch.avtopoliv_kontroler_avtopoliv_klapan_2
      - switch.avtopoliv_kontroler_avtopoliv_klapan_3
      - switch.avtopoliv_kontroler_avtopoliv_klapan_4
      - switch.avtopoliv_kontroler_avtopoliv_klapan_5
  mode: single
- id: irrigation_fail_safe_on_ha_start
  alias: Полив - безпечний стан після запуску HA
  description: Після запуску Home Assistant вимикає насос і всі клапани.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: script.poliv_stop_all
  mode: single
- id: irrigation_pump_max_runtime_3h
  alias: Полив - максимальна робота насоса 3 години
  description: Примусово зупиняє полив після трьох годин безперервної роботи насоса.
  triggers:
  - trigger: state
    entity_id: switch.mini_switch_k601_2_switch_1_2
    to: 'on'
    for: 03:00:00
  conditions: []
  actions:
  - action: script.poliv_stop_all
  - action: persistent_notification.create
    data:
      title: Полив зупинено
      message: Насос досяг максимального безперервного часу роботи — 3 години.
  mode: single
- id: irrigation_scheduled_weekday
  alias: Полив - розклад за часом і днями тижня
  description: 'Слухає подію Smart Irrigation про початок поливу. Момент старту рахує сама SI: offset_minutes=0
    разом з account_for_duration означає "почати рівно за стільки, скільки триватиме полив, щоб він ЗАКІНЧИВСЯ
    на схід сонця". Для газону з дощуванням зверху це правильний час - вода встигає всотатися до спеки,
    а листя висихає одразу після сходу.

    За розкладом поливаються зони 1, 2 і 5 - усі три заведені у Smart Irrigation, і їхня сумарна тривалість
    задає зсув від сходу. Зона 5 додана до SI 2026-08-08: 100 м², 20 л/хв, тобто та сама інтенсивність
    12 мм/год, що й у зон 1-2 (200 м², 40 л/хв). Зони 3 і 4 автоматично не поливаються взагалі, лише вручну
    з дашборда.

    Виконує полив Irrigation Unlimited, бо тільки він керує насосом-майстром: прямий контроль клапанів
    у SI вимкнено навмисно - її valve_runner про насос не знає і відкривав би клапани всуху.

    УВАГА про нумерацію: Irrigation Unlimited нумерує зони ЗА ПОРЯДКОМ у списку controllers.zones, а не
    за zone_id. Зона 5 стоїть четвертою, тому її сутність - binary_sensor.irrigation_unlimited_c1_z4,
    а не ..._z5. Якщо порядок зон у configuration.yaml зміниться, ці посилання поїдуть.

    ДВА ТРИГЕРИ навмисно. Подія Smart Irrigation дає точний старт, але SI НЕ реєструє тригер узагалі,
    якщо сумарна тривалість її зон дорівнює нулю (а це нормальна ситуація наступного дня після поливу).
    Другий тригер від сонця на -75 хв лишається запобіжником на випадок, коли SI не реєструє свою подію
    (нульова сумарна тривалість). mode: single не дасть запуститися двічі, якщо спрацюють обидва.

    ЗАПИС АПАРАТНОГО ТАЙМЕРА (додано 2026-08-10, підтверджено вимірюванням). Уночі проти 10.08 усі три
    зони отримали по 10 хвилин замість 27/28/25, а насос пропрацював повні 80 хвилин, з них близько 50 -
    на закриті клапани.
    Причина виміряна тестом на зоні 5 того ж дня. Фаза A, без запису DP: клапан відкрито 10:26:18,
    закрито 10:36:21 - рівно 10 хв 03 с, - і при цьому IU z4, майстер і насос лишалися on ще 2,5 хвилини,
    поки IU дораховував свої 13 хвилин. Отже клапан закриває сам контролер DP-WBS01 за власним відліком
    (DP 13-20), а irrigation_unlimited.manual_run перемикає лише DP клапана і цей відлік не задає.
    Irrigation Unlimited раннього закриття не бачить: його check_back перевіряє клапан лише протягом
    ~90 секунд після команди (3 спроби через 30 с), а не весь полив.
    Фаза B, з записом DP 17 = 900 ДО старту зони, поки клапан закритий: клапан пробув відкритим усі
    13 хвилин без раннього закриття, а зупинив полив саме IU - спершу насос (10:54:09), потім клапан
    (10:54:13).
    Тому запис таймера стоїть ПЕРЕД manual_run, значення - тривалість IU плюс 60 секунд запасу:
    зупинку робить Home Assistant, а відлік контролера лишається страховкою, якщо HA впаде посеред
    поливу. Писати DP у вже відкритий клапан тут навмисно не робимо - це неперевірений шлях.
    Ручні скрипти з дашборда задають таймер разом з відкриттям клапана від початку, тому недолив бачили
    лише на нічному розкладі.'
  triggers:
  - trigger: event
    event_type: smart_irrigation_start_irrigation_all_zones
  - trigger: sun
    event: sunrise
    offset: -01:15:00
  conditions:
  - condition: state
    entity_id: input_boolean.poliv_avtomatika_dozvolena
    state: 'on'
  - condition: template
    value_template: "{{ is_state(['input_boolean.poliv_pn', 'input_boolean.poliv_vt',\n             'input_boolean.poliv_sr',\
      \ 'input_boolean.poliv_cht',\n             'input_boolean.poliv_pt', 'input_boolean.poliv_sb',\n\
      \             'input_boolean.poliv_nd'][now().weekday()], 'on') }}\n"
  actions:
  - variables:
      zona_1_seconds: "{% set smart = states('sensor.smart_irrigation_zona1') %} {% if is_number(smart)\
        \ %}\n  {{ smart | int(0) }}\n{% else %}\n  {{ (states('input_number.poliv_zona_1_hvylyn') | int(25))\
        \ * 60 }}\n{% endif %}"
      zona_2_seconds: "{% set smart = states('sensor.smart_irrigation_zona2') %} {% if is_number(smart)\
        \ %}\n  {{ smart | int(0) }}\n{% else %}\n  {{ (states('input_number.poliv_zona_2_hvylyn') | int(25))\
        \ * 60 }}\n{% endif %}"
      zona_5_seconds: "{% set smart = states('sensor.smart_irrigation_zona5') %} {% if is_number(smart)\
        \ %}\n  {{ smart | int(0) }}\n{% else %}\n  {{ (states('input_number.poliv_zona_5_hvylyn') | int(25))\
        \ * 60 }}\n{% endif %}"
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_golovna
    data:
      type: hourly
    response_variable: fc
  - variables:
      rain_now: "{{ states('weather.forecast_golovna') in\n   ['rainy', 'pouring', 'lightning-rainy',\
        \ 'snowy-rainy', 'hail'] }}\n"
      rain_soon: "{% set fl = (fc.get('weather.forecast_golovna', {}).get('forecast', []))[:6] %} {% set\
        \ ns = namespace(wet=false) %} {% for f in fl %}\n  {% if f.condition in ['rainy', 'pouring',\
        \ 'lightning-rainy', 'snowy-rainy', 'hail']\n        or (f.precipitation | default(0) | float(0))\
        \ > 0.2 %}\n    {% set ns.wet = true %}\n  {% endif %}\n{% endfor %} {{ ns.wet }}\n"
  - if:
    - condition: state
      entity_id: input_boolean.poliv_propustyty_zavtra
      state: 'on'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.poliv_propustyty_zavtra
    - action: input_text.set_value
      target:
        entity_id: input_text.poliv_ostannie_rishennia
      data:
        value: '{{ now().strftime(''%d.%m %H:%M'') }} · пропущено · рішення ухвалене звечора'
    - stop: Полив пропущено - так вирішили ввечері
  - if:
    - condition: template
      value_template: '{{ rain_now }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: poliv_dosh
        title: Полив пропущено · дощ
        message: 'Полив за розкладом о {{ now().strftime(''%H:%M'') }} пропущено: у момент старту йшов
          дощ. Питання не ставилося - його ставлять увечері за прогнозом, а дощ просто зараз скасовує
          полив без обговорення.'
    - action: input_text.set_value
      target:
        entity_id: input_text.poliv_ostannie_rishennia
      data:
        value: '{{ now().strftime(''%d.%m %H:%M'') }} · пропущено · дощ у момент старту'
    - stop: Полив пропущено через дощ
  - action: persistent_notification.dismiss
    data:
      notification_id: poliv_dosh
  - action: input_text.set_value
    target:
      entity_id: input_text.poliv_ostannie_rishennia
    data:
      value: '{{ now().strftime(''%d.%m %H:%M'') }} · полив стартував · зона 1 - {{ (zona_1_seconds |
        int(0) / 60) | round(0) }} хв, зона 2 - {{ (zona_2_seconds | int(0) / 60) | round(0) }} хв

        '
  - if:
    - condition: state
      entity_id: input_boolean.poliv_zona_1_vkl
      state: 'on'
    - condition: template
      value_template: '{{ zona_1_seconds | int(0) > 0 }}'
    then:
    - action: localtuya.set_dp
      data:
        device_id: bfb2143124def1078b549a
        dp: 13
        value: '{{ (zona_1_seconds | int(0)) + 60 }}'
    - action: irrigation_unlimited.manual_run
      data:
        entity_id: binary_sensor.irrigation_unlimited_c1_z1
        time: '{{ timedelta(seconds=zona_1_seconds | int(0)) }}'
        queue: true
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z1'', ''on'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z1'', ''off'') }}'
      timeout: 01:02:00
      continue_on_timeout: false
    - wait_template: "{{ is_state('binary_sensor.irrigation_unlimited_c1_m', 'off')\n   and is_state('switch.mini_switch_k601_2_switch_1_2',\
        \ 'off')\n   and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_1', 'off') }}"
      timeout: 00:01:00
      continue_on_timeout: false
    - delay: 00:00:10
  - if:
    - condition: state
      entity_id: input_boolean.poliv_zona_2_vkl
      state: 'on'
    - condition: template
      value_template: '{{ zona_2_seconds | int(0) > 0 }}'
    then:
    - action: localtuya.set_dp
      data:
        device_id: bfb2143124def1078b549a
        dp: 14
        value: '{{ (zona_2_seconds | int(0)) + 60 }}'
    - action: irrigation_unlimited.manual_run
      data:
        entity_id: binary_sensor.irrigation_unlimited_c1_z2
        time: '{{ timedelta(seconds=zona_2_seconds | int(0)) }}'
        queue: true
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z2'', ''on'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z2'', ''off'') }}'
      timeout: 01:02:00
      continue_on_timeout: false
    - wait_template: "{{ is_state('binary_sensor.irrigation_unlimited_c1_m', 'off')\n   and is_state('switch.mini_switch_k601_2_switch_1_2',\
        \ 'off')\n   and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_2', 'off') }}"
      timeout: 00:01:00
      continue_on_timeout: false
    - delay: 00:00:10
  - if:
    - condition: state
      entity_id: input_boolean.poliv_zona_5_vkl
      state: 'on'
    - condition: template
      value_template: '{{ zona_5_seconds | int(0) > 0 }}'
    then:
    - action: localtuya.set_dp
      data:
        device_id: bfb2143124def1078b549a
        dp: 17
        value: '{{ (zona_5_seconds | int(0)) + 60 }}'
    - action: irrigation_unlimited.manual_run
      data:
        entity_id: binary_sensor.irrigation_unlimited_c1_z4
        time: '{{ timedelta(seconds=zona_5_seconds | int(0)) }}'
        queue: true
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z4'', ''on'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z4'', ''off'') }}'
      timeout: 01:02:00
      continue_on_timeout: false
    - wait_template: "{{ is_state('binary_sensor.irrigation_unlimited_c1_m', 'off')\n   and is_state('switch.mini_switch_k601_2_switch_1_2',\
        \ 'off')\n   and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_5', 'off') }}"
      timeout: 00:01:00
      continue_on_timeout: false
    - delay: 00:00:10
  mode: single
- id: tcl_idle_slideshow_start
  alias: TCL - запустити фотозаставку після 5 хвилин простою
  description: Не вмикає телевізор. Стартує лише якщо вже ввімкнений TCL безперервно перебуває у стані
    idle п'ять хвилин.
  triggers:
  - trigger: state
    entity_id: media_player.televizor_tcl
    to: idle
    for: 00:05:00
  conditions:
  - condition: state
    entity_id: media_player.televizor_tcl
    state: idle
  actions:
  - action: script.turn_on
    target:
      entity_id: script.tv_idle_slideshow
  mode: restart
- id: tcl_idle_slideshow_stop_on_activity
  alias: TCL - зупинити фотозаставку при активності
  description: Не дає заставці перебивати відео чи застосунок, який запустив користувач. Дві секунди потрібні,
    щоб не прийняти власний запуск JPEG через стандартний Cast receiver за сторонню активність.
  triggers:
  - trigger: state
    entity_id: media_player.televizor_tcl
  - trigger: state
    entity_id: media_player.televizor_tcl
    attribute: app_id
  - trigger: state
    entity_id: media_player.televizor_tcl
    attribute: media_content_type
  conditions:
  - condition: state
    entity_id: script.tv_idle_slideshow
    state: 'on'
  actions:
  - delay: 00:00:02
  - condition: template
    value_template: "{% set tv = 'media_player.televizor_tcl' %} {% set st = states(tv) %} {% set app\
      \ = state_attr(tv, 'app_name') | default('', true) %} {% set kind = state_attr(tv, 'media_content_type')\
      \ | default('', true) %} {{ st in ['off', 'unavailable']\n   or (st not in ['idle']\n       and\
      \ kind != 'image/jpeg'\n       and app not in ['Default Media Receiver', 'Home Assistant Cast'])\
      \ }}"
  - action: script.turn_off
    target:
      entity_id: script.tv_idle_slideshow
  mode: restart
- id: hikvision_motion_snapshot
  alias: Камера - знімок при виявленні руху
  description: При спрацюванні binary_sensor.cam1_motion зберігає кадр з camera.cam1, оновлює www/motion/latest.jpg
    для дашборда і лишає останні 30 знімків.
  triggers:
  - trigger: state
    entity_id: binary_sensor.cam1_motion
    to: 'on'
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.cam1
    data:
      filename: /userdata/hass/config/www/motion/motion_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg
  - action: shell_command.update_motion_snapshot
  mode: queued
  max: 10
- id: hikvision_motion_clip
  alias: Камера - відеокліп при виявленні руху
  description: 'Пише 15 с відео на NAS від моменту руху. Пре-ролю немає навмисно: він потребує preload_stream,
    тобто постійного потоку з камери, а це розхитувало живлення плати. Умова про змонтовану шару обовʼязкова
    - без неї кліпи писалися б на саму плату.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.cam1_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.nas_videoarkhiv_zmontovanyi
    state: 'on'
  actions:
  - action: shell_command.prepare_motion_dir
  - action: camera.record
    target:
      entity_id: camera.cam1
    data:
      filename: /userdata/hass/config/media/video/ha-motion/{{ now().strftime('%Y-%m-%d') }}/ruh_{{ now().strftime('%H%M%S')
        }}.mp4
      duration: 15
  - action: shell_command.rebuild_clip_gallery
  # ПРИБРАНО 2026-08-10: тут викликався shell_command.prune_motion_clips, якого
  # не існує - ні в configuration.yaml, ні в жодній гілці репозиторію. Кожне
  # спрацювання автоматизації падало з "Service not found ... at pos 4", тобто
  # кліп записувався, а автоматизація завершувалася помилкою.
  # Окрема чистка й не потрібна: prepare_motion_dir на початку кожного запису
  # видаляє теки старші за 14 діб (find -mtime +14 -exec rm -rf).
  mode: queued
  max: 10
- id: tarif_peremknuty_lichylnyky
  alias: Тариф - перемкнути лічильники день/ніч
  description: 'Тримає всі utility_meter у тому самому тарифі, що й sensor.tarif_elektroenergii_zaraz:
    день 07:00-22:59, ніч 23:00-06:59.

    Без цієї автоматизації лічильники назавжди лишились би в тарифі, який був активний при створенні,
    і весь розподіл день/ніч був би неправильний.

    Тригер на старт Home Assistant обов''язковий: після перезапуску серед ночі лічильники інакше лишалися
    б у денному тарифі до наступної сьомої ранку. Затримка потрібна, щоб сутності utility_meter встигли
    з''явитися.'
  triggers:
  - trigger: time
    at: 07:00:00
  - trigger: time
    at: '23:00:00'
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:30
  - action: select.select_option
    target:
      entity_id:
      - select.merezha_za_tarifom
      - select.merezha_dobovyi
      - select.merezha_misiachnyi
      - select.boiler_za_tarifom
      - select.zariadka_za_tarifom
      - select.pidloha_1_za_tarifom
      - select.pidloha_2_za_tarifom
      - select.nasos_za_tarifom
    data:
      option: '{{ ''den'' if 7 <= now().hour < 23 else ''nich'' }}'
  mode: single
- id: irrigation_evening_rain_ask
  alias: Полив - вечірнє питання про дощ
  description: 'О 21:00 дивиться погодинний прогноз на завтрашній ранок (03:00-09:00 - вікно, у яке потрапляє
    старт за 1:15 до сходу) і, якщо очікується дощ, питає, чи поливати. Відповідь запам''ятовується у
    input_boolean.poliv_propustyty_zavtra, і ранковий розклад просто її виконує.

    Питати о 04:30, як було раніше, не мало сенсу: о пів на п''яту ніхто не бачить сповіщення, 30 хвилин
    минають, і день пропускається за замовчуванням. Тепер питання ставиться, коли на нього реально можуть
    відповісти.

    Мовчання = пропустити, як і просили. Але прапорець скидається на початку перевірки, тож якщо дощу
    не прогнозують, ранок поллється без жодних питань.'
  triggers:
  - trigger: time
    at: '21:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.poliv_avtomatika_dozvolena
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.poliv_propustyty_zavtra
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_golovna
    data:
      type: hourly
    response_variable: fc
  - variables:
      rain_morning: "{% set fl = fc.get('weather.forecast_golovna', {}).get('forecast', []) %} {% set\
        \ ns = namespace(wet=false, mm=0.0) %} {% for f in fl %}\n  {% set t = as_datetime(f.datetime)\
        \ | as_local %}\n  {% if t.date() == (now() + timedelta(days=1)).date() and 3 <= t.hour <= 9 %}\n\
        \    {% if f.condition in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']\n   \
        \     or (f.precipitation | default(0) | float(0)) > 0.2 %}\n      {% set ns.wet = true %}\n \
        \   {% endif %}\n    {% set ns.mm = ns.mm + (f.precipitation | default(0) | float(0)) %}\n  {%\
        \ endif %}\n{% endfor %} {{ ns.wet }}\n"
      rain_mm: "{% set fl = fc.get('weather.forecast_golovna', {}).get('forecast', []) %} {% set ns =\
        \ namespace(mm=0.0) %} {% for f in fl %}\n  {% set t = as_datetime(f.datetime) | as_local %}\n\
        \  {% if t.date() == (now() + timedelta(days=1)).date() and 3 <= t.hour <= 9 %}\n    {% set ns.mm\
        \ = ns.mm + (f.precipitation | default(0) | float(0)) %}\n  {% endif %}\n{% endfor %} {{ ns.mm\
        \ | round(1) }}\n"
  - if:
    - condition: template
      value_template: '{{ rain_morning }}'
    then:
    - action: notify.mobile_app_sm_s918b
      data:
        title: Полив завтра вранці
        message: На ранок прогнозують дощ ({{ rain_mm }} мм). Поливати попри це?
        data:
          tag: poliv_dosh_vechir
          actions:
          - action: POLIV_YES
            title: Поливати
          - action: POLIV_NO
            title: Пропустити
    - action: persistent_notification.create
      data:
        notification_id: poliv_dosh_vechir
        title: Полив завтра вранці · очікує рішення
        message: Met.no прогнозує на завтрашній ранок дощ ({{ rain_mm }} мм за 03:00-09:00). Питання надіслано
          на телефон о {{ now().strftime('%H:%M') }}. Якщо до 23:59 ніхто не натисне «Поливати», ранковий
          полив буде пропущено.
    - action: input_text.set_value
      target:
        entity_id: input_text.poliv_ostannie_rishennia
      data:
        value: '{{ now().strftime(''%d.%m %H:%M'') }} · чекаю відповіді · прогноз дощу на ранок {{ rain_mm
          }} мм'
    - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: POLIV_YES
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: POLIV_NO
      timeout: 02:59:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.trigger is none or wait.trigger.event.data.action != ''POLIV_YES'' }}'
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.poliv_propustyty_zavtra
      - action: notify.mobile_app_sm_s918b
        data:
          message: Завтрашній ранковий полив пропущено через дощ.
          data:
            tag: poliv_dosh_vechir
      - action: persistent_notification.create
        data:
          notification_id: poliv_dosh_vechir
          title: Завтрашній полив пропущено
          message: 'Ранковий полив завтра пропущено. Причина: прогноз дощу {{ rain_mm }} мм, а на питання
            {{ ''ніхто не відповів'' if wait.trigger is none else ''обрано «Пропустити»'' }}.'
      - action: input_text.set_value
        target:
          entity_id: input_text.poliv_ostannie_rishennia
        data:
          value: '{{ now().strftime(''%d.%m %H:%M'') }} · завтра пропустити · дощ {{ rain_mm }} мм · {{
            ''без відповіді'' if wait.trigger is none else ''обрано «Пропустити»'' }}'
      else:
      - action: persistent_notification.dismiss
        data:
          notification_id: poliv_dosh_vechir
      - action: input_text.set_value
        target:
          entity_id: input_text.poliv_ostannie_rishennia
        data:
          value: '{{ now().strftime(''%d.%m %H:%M'') }} · завтра поливати попри дощ · рішення підтверджено'
    else:
    - action: input_text.set_value
      target:
        entity_id: input_text.poliv_ostannie_rishennia
      data:
        value: '{{ now().strftime(''%d.%m %H:%M'') }} · дощу на ранок не прогнозують · поллється за розкладом'
  mode: single
- id: ev_schedule_window_start
  alias: Заряджання - старт вікна розкладу
  description: О часі початку вікна виставляє струм і дозволяє заряджання. Потрібне
    саме тут, а не в самій станції - її власні таймери set_delay_time і set_define_time
    відлічують час від підключення авто, а не за годинником, тому нічний тариф ними
    не спіймати.
  triggers:
  - trigger: time
    at: input_datetime.zariadka_pochatok
  conditions:
  - condition: state
    entity_id: input_boolean.zariadka_rozklad
    state: 'on'
  actions:
  - action: number.set_value
    target:
      entity_id: number.zariadka_7_5kvt_set_32a
    data:
      value: '{{ states(''input_number.zariadka_strum_rozklad'') | int(32) }}'
  - delay: 00:00:03
  - action: select.select_option
    target:
      entity_id: select.zariadka_7_5kvt_charge_state
    data:
      option: Open charging
  mode: single
- id: ev_schedule_window_end
  alias: Заряджання - кінець вікна розкладу
  description: О часі кінця вікна зупиняє заряджання. Зупиняє саме командою
    Close charging - перемикач switch.zariadka_7_5kvt на сесію не впливає, це
    перевірено 2026-08-09.
  triggers:
  - trigger: time
    at: input_datetime.zariadka_kinets
  conditions:
  - condition: state
    entity_id: input_boolean.zariadka_rozklad
    state: 'on'
  actions:
  - action: select.select_option
    target:
      entity_id: select.zariadka_7_5kvt_charge_state
    data:
      option: Close charging
  mode: single
- id: ev_schedule_car_plugged_inside_window
  alias: Заряджання - авто підключили всередині вікна
  description: Якщо машину під'єднали посеред дозволеного вікна, заряджання має
    початися одразу, а не чекати наступної ночі. Спрацьовує на виході станції зі
    стану no_connet.
  triggers:
  - trigger: state
    entity_id: sensor.zariadka_7_5kvt_device_state
    from: no_connet
  conditions:
  - condition: state
    entity_id: input_boolean.zariadka_rozklad
    state: 'on'
  - condition: template
    value_template: >
      {% set now_t = now().strftime('%H:%M') %}
      {% set a = states('input_datetime.zariadka_pochatok')[:5] %}
      {% set b = states('input_datetime.zariadka_kinets')[:5] %}
      {% if a <= b %}{{ a <= now_t < b }}{% else %}{{ now_t >= a or now_t < b }}{% endif %}
  actions:
  - action: number.set_value
    target:
      entity_id: number.zariadka_7_5kvt_set_32a
    data:
      value: '{{ states(''input_number.zariadka_strum_rozklad'') | int(32) }}'
  - delay: 00:00:03
  - action: select.select_option
    target:
      entity_id: select.zariadka_7_5kvt_charge_state
    data:
      option: Open charging
  mode: single
- id: irrigation_switch_source_log
  alias: Полив - журнал перемикань із джерелом
  description: 'Пише в журнал HA кожне перемикання насоса й клапанів 1-5 разом із тим, ХТО його зробив.
    Без цього в логах видно лише факт "клапан закрився", і неможливо відрізнити ручне натискання від
    роботи автоматизації чи від того, що клапан закрив сам контролер за власним відліком - а саме це
    питання виникло 10.08.2026 при розборі недоливу.

    Джерело визначається за контекстом Home Assistant:
    user_id заповнений і батьківського контексту немає - людина натиснула в інтерфейсі;
    parent_id заповнений - дію породила автоматизація або скрипт (можливо, запущені людиною);
    обидва порожні - команди з Home Assistant не було АБО її подала інтеграція власним контекстом.

    Контексту недостатньо, щоб відрізнити Irrigation Unlimited від самого контролера: IU викликає
    сервіси зі свіжим контекстом без parent_id, тому 10.08 його команди підписувалися як "пристрій сам".
    Тому в рядок додано стан IU, а окремим маркером POLIV-АНОМАЛІЯ позначається саме та ситуація, яка
    призвела до недоливу: клапан закрився, поки майстер IU ще поливає. IU так ніколи не робить - він
    спершу зупиняє насос і аж потім закриває клапан, - отже це апаратний відлік контролера.

    Пише через system_log на рівні warning, тому потрапляє і в journalctl, і в Налаштування - Журнали.
    Домени automation і script виключені з recorder, тому іншого сліду про авторство не лишається.'
  triggers:
  - trigger: state
    entity_id:
    - switch.mini_switch_k601_2_switch_1_2
    - switch.avtopoliv_kontroler_avtopoliv_klapan_1
    - switch.avtopoliv_kontroler_avtopoliv_klapan_2
    - switch.avtopoliv_kontroler_avtopoliv_klapan_3
    - switch.avtopoliv_kontroler_avtopoliv_klapan_4
    - switch.avtopoliv_kontroler_avtopoliv_klapan_5
    to:
    - 'on'
    - 'off'
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state
      }}'
  actions:
  - variables:
      source: "{% set c = trigger.to_state.context %} {% if c.user_id and not c.parent_id %}ВРУЧНУ (людина\
        \ в інтерфейсі){% elif c.parent_id %}АВТОМАТИЗАЦІЯ або скрипт{% elif c.user_id %}ВРУЧНУ через\
        \ автоматизацію, запущену людиною{% else %}БЕЗ КОНТЕКСТУ HA (інтеграція або сам контролер){% endif\
        \ %}"
      controller_closed: "{{ 'klapan' in trigger.entity_id\n   and trigger.to_state.state == 'off'\n \
        \  and is_state('binary_sensor.irrigation_unlimited_c1_m', 'on') }}\n"
  - action: system_log.write
    data:
      level: warning
      logger: homemate.poliv
      message: '{{ ''POLIV-АНОМАЛІЯ КОНТРОЛЕР ЗАКРИВ КЛАПАН, поки IU ще поливає: '' if controller_closed
        else ''POLIV '' }}{{ trigger.to_state.name }} {{ trigger.from_state.state }} -> {{ trigger.to_state.state
        }} · джерело: {{ source }} · IU майстер={{ states(''binary_sensor.irrigation_unlimited_c1_m'')
        }} · насос={{ states(''switch.mini_switch_k601_2_switch_1_2'') }} · context id={{ trigger.to_state.context.id[:8]
        }} parent={{ trigger.to_state.context.parent_id[:8] if trigger.to_state.context.parent_id else
        ''-'' }} user={{ trigger.to_state.context.user_id[:8] if trigger.to_state.context.user_id else
        ''-'' }}'
  mode: queued
  max: 25
- id: irrigation_credit_bucket_on_valve_close
  alias: Полив - зарахувати вилиту воду в баланс зони
  description: 'Додає вилиту воду до водного балансу Smart Irrigation після кожного закриття клапана -
    незалежно від того, хто його відкрив: розклад, кнопка на дашборді чи тумблер.

    НАВІЩО. Модуль observed watering усередині Smart Irrigation уміє це сам, але для зон 1 і 2 він
    мовчить: їм прив''язана сутність, яка ніколи не змінює стан (інцидент 0cfd77b0, найімовірніше
    застарілий хмарний дубль switch.avtopoliv_kontroler_switch_N). Прив''язка лежить у .storage і
    правиться лише з панелі Smart Irrigation, тому до її виправлення зарахування робить ця
    автоматизація. Без неї полив зон 1 і 2 не потрапляє ні в баланс, ні на графік "Вода за 7 днів",
    і дефіцит накопичується щодоби.

    ЧОМУ НЕ БУДЕ ПОДВІЙНОГО РАХУНКУ. Після закриття клапана автоматизація запам''ятовує баланс, чекає
    20 секунд і дивиться, чи він змінився сам. Якщо змінився - зарахував штатний модуль (так працює
    зона 5), і автоматизація не робить нічого. Дописує тільки там, де не зарахував ніхто. Через це її
    можна лишати ввімкненою і після виправлення прив''язки: вона просто перестане спрацьовувати.

    ЯК РАХУЄТЬСЯ. Тими самими числами, що й у самому модулі: мм = хвилини * продуктивність / площа.
    Зони 1 і 2 - 40 л/хв на 200 м², зона 5 - 20 л/хв на 100 м², тобто однакові 12 мм/год. Результат
    обрізається зверху максимальним балансом зони, інакше сервіс set_zone відхиляє значення.

    Пробіги коротші за 30 секунд ігноруються: це не полив, а перевірка клапана або збій зв''язку.'
  triggers:
  - trigger: state
    entity_id:
    - switch.avtopoliv_kontroler_avtopoliv_klapan_1
    - switch.avtopoliv_kontroler_avtopoliv_klapan_2
    - switch.avtopoliv_kontroler_avtopoliv_klapan_5
    from: 'on'
    to: 'off'
  conditions: []
  actions:
  - variables:
      zone_sensor: "{{ {'switch.avtopoliv_kontroler_avtopoliv_klapan_1': 'sensor.smart_irrigation_zona1',\n\
        \  'switch.avtopoliv_kontroler_avtopoliv_klapan_2': 'sensor.smart_irrigation_zona2',\n  'switch.avtopoliv_kontroler_avtopoliv_klapan_5':\
        \ 'sensor.smart_irrigation_zona5'}[trigger.entity_id] }}\n"
      seconds: "{{ (as_timestamp(trigger.to_state.last_changed)\n   - as_timestamp(trigger.from_state.last_changed))\
        \ | int(0) }}\n"
  - condition: template
    value_template: '{{ seconds >= 30 and seconds <= 7200 }}'
  - variables:
      bucket_before: '{{ state_attr(zone_sensor, ''bucket'') | float(0) }}'
  - delay: 00:00:20
  - variables:
      bucket_after: '{{ state_attr(zone_sensor, ''bucket'') | float(0) }}'
  - if:
    - condition: template
      value_template: '{{ (bucket_after - bucket_before) | abs > 0.001 }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: homemate.poliv
        message: 'POLIV-БАЛАНС {{ zone_sensor }}: зарахував штатний модуль ({{ bucket_before | round(3)
          }} -> {{ bucket_after | round(3) }}), автоматизація не втручається'
    - stop: Баланс уже поповнено самим Smart Irrigation
  - variables:
      applied_mm: "{{ (seconds / 60.0\n   * (state_attr(zone_sensor, 'throughput') | float(0))\n   /\
        \ (state_attr(zone_sensor, 'size') | float(1))) | round(3) }}\n"
  - condition: template
    value_template: '{{ applied_mm > 0 }}'
  - variables:
      new_bucket: "{{ [ bucket_after + (applied_mm | float(0)),\n     state_attr(zone_sensor, 'maximum_bucket')\
        \ | float(24) ] | min | round(3) }}\n"
  - action: smart_irrigation.set_zone
    data:
      entity_id: '{{ zone_sensor }}'
      new_bucket_value: '{{ new_bucket | float(0) }}'
  - action: system_log.write
    data:
      level: warning
      logger: homemate.poliv
      message: 'POLIV-БАЛАНС {{ zone_sensor }}: полив {{ (seconds / 60) | round(1) }} хв = {{ applied_mm
        }} мм, баланс {{ bucket_after | round(3) }} -> {{ new_bucket }} (зарахувала автоматизація, штатний
        модуль промовчав)'
  mode: queued
  max: 10
