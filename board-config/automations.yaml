- id: irrigation_pump_session_energy
  alias: Полив - фіксація лічильника на старті сесії
  description: На кожному вмиканні насоса запам'ятовує поточний показ наростаючого лічильника енергії, щоб сенсор "спожито за сесію" рахував від нуля.
  triggers:
  - trigger: state
    entity_id: switch.mini_switch_k601_2_switch_1_2
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.nasos_energiia_start
    data:
      value: '{{ states(''sensor.nasos_polivu_spozhito'') | float(0) }}'
  mode: single
- id: irrigation_manual_pump_opens_valve
  alias: Полив - ручний пуск насоса відкриває клапан
  description: Якщо насос увімкнули вручну - фізичною кнопкою на модулі або тумблером в інтерфейсі - і жоден клапан не відкритий, одразу відкриває зону, обрану в "Ручний пуск - яку зону відкривати". Спрацьовує
    за секунду, тому захист "насос без відкритого клапана" (10 с) не встигає вимкнути насос. Сам захист лишається недоторканим як останній рубіж, якщо клапан не відкриється.
  triggers:
  - trigger: state
    entity_id: switch.mini_switch_k601_2_switch_1_2
    from: 'off'
    to: 'on'
  conditions:
  - condition: template
    value_template: "{{ not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_1', 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_2', 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_3',\
      \ 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_4', 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_5', 'on') }}\n"
  actions:
  - action: switch.turn_on
    target:
      entity_id: "{% set z = states('input_select.poliv_ruchna_zona') %} {{ 'switch.avtopoliv_kontroler_avtopoliv_klapan_2' if z == 'Зона 2'\n   else 'switch.avtopoliv_kontroler_avtopoliv_klapan_3' if z == 'Зона 3'\n   else\
        \ 'switch.avtopoliv_kontroler_avtopoliv_klapan_4' if z == 'Зона 4'\n   else 'switch.avtopoliv_kontroler_avtopoliv_klapan_5' if z == 'Зона 5'\n   else 'switch.avtopoliv_kontroler_avtopoliv_klapan_1' }}\n"
  mode: single
- id: irrigation_close_valves_when_pump_idle
  alias: Полив - закрити клапани, якщо насос давно вимкнений
  description: Прибирає забутий відкритий клапан після ручного пуску. Irrigation Unlimited закриває свої клапани за 3 секунди після зупинки насоса, тому 5-хвилинна витримка у його роботу не втручається.
  triggers:
  - trigger: template
    value_template: "{{ is_state('switch.mini_switch_k601_2_switch_1_2', 'off')\n   and (is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_1', 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_2',\
      \ 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_3', 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_4', 'on')\n        or is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_5',\
      \ 'on')) }}\n"
    for: 00:05:00
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.avtopoliv_kontroler_avtopoliv_klapan_1
      - switch.avtopoliv_kontroler_avtopoliv_klapan_2
      - switch.avtopoliv_kontroler_avtopoliv_klapan_3
      - switch.avtopoliv_kontroler_avtopoliv_klapan_4
      - switch.avtopoliv_kontroler_avtopoliv_klapan_5
  mode: single
- id: irrigation_fail_safe_on_ha_start
  alias: Полив - безпечний стан після запуску HA
  description: Після запуску Home Assistant вимикає насос і всі клапани.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: script.poliv_stop_all
  mode: single
- id: irrigation_pump_without_open_valve
  alias: Полив - насос без відкритого клапана
  description: 'Глушить насос, якщо він працює без жодного відкритого клапана.

    ПЕРЕПИСАНО 2026-08-04 після реального збою: 04:24:44 ця автоматизація обірвала полив зони 5 на 10-й хвилині з 25. Клапан - хмарний Tuya з оновленням раз на ~216 с, він о 04:24:34 повідомив ''закрито'',
    хоча Irrigation Unlimited тримав зону активною до 04:39. Стара витримка 10 с спрацювала рівно через 10 секунд після хибного стану.

    Тепер сторож не втручається, поки IU веде свій цикл або поки виконується скрипт зони - вони знають правду краще за хмару. Витримку піднято з 10 с до 3 хв, щоб хмара встигла оновитися. Насос без клапана
    3 хвилини не постраждає: це не сухий хід, а лише підвищений тиск.'
  triggers:
  - trigger: template
    value_template: "{{ is_state('switch.mini_switch_k601_2_switch_1_2', 'on')\n   and not is_state('binary_sensor.irrigation_unlimited_c1_m', 'on')\n   and not is_state('script.poliv_zona_1', 'on')\n \
      \  and not is_state('script.poliv_zona_2', 'on')\n   and not is_state('script.poliv_zona_3', 'on')\n   and not is_state('script.poliv_zona_4', 'on')\n   and not is_state('script.poliv_zona_5', 'on')\n\
      \   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_1', 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_2', 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_3', 'on')\n\
      \   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_4', 'on')\n   and not is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_5', 'on') }}\n"
    for: 00:03:00
  conditions: []
  actions:
  - action: script.poliv_stop_all
  - action: persistent_notification.create
    data:
      title: Аварійна зупинка поливу
      notification_id: poliv_avariya
      message: Насос працював понад 3 хвилини без жодного відкритого клапана і без активного циклу Irrigation Unlimited. Полив зупинено о {{ now().strftime('%H:%M:%S') }}.
  mode: single
- id: irrigation_pump_max_runtime_3h
  alias: Полив - максимальна робота насоса 3 години
  description: Примусово зупиняє полив після трьох годин безперервної роботи насоса.
  triggers:
  - trigger: state
    entity_id: switch.mini_switch_k601_2_switch_1_2
    to: 'on'
    for: 03:00:00
  conditions: []
  actions:
  - action: script.poliv_stop_all
  - action: persistent_notification.create
    data:
      title: Полив зупинено
      message: Насос досяг максимального безперервного часу роботи — 3 години.
  mode: single
- id: irrigation_scheduled_weekday
  alias: Полив - розклад за часом і днями тижня
  description: 'Слухає подію Smart Irrigation про початок поливу. Момент старту рахує сама SI: offset_minutes=0 разом з account_for_duration означає "почати рівно за стільки, скільки триватиме полив, щоб
    він ЗАКІНЧИВСЯ на схід сонця". Для газону з дощуванням зверху це правильний час - вода встигає всотатися до спеки, а листя висихає одразу після сходу.

    За розкладом поливаються ТІЛЬКИ зони 1 і 2 - саме вони заведені у Smart Irrigation і саме їхня сумарна тривалість задає зсув від сходу. Зони 3, 4 і 5 автоматично не поливаються взагалі, лише вручну
    з дашборда (рішення користувача, 2026-08-04).

    Виконує полив Irrigation Unlimited, бо тільки він керує насосом-майстром: прямий контроль клапанів у SI вимкнено навмисно - її valve_runner про насос не знає і відкривав би клапани всуху.

    УВАГА про нумерацію: Irrigation Unlimited нумерує зони ЗА ПОРЯДКОМ у списку controllers.zones, а не за zone_id. Зона 5 стоїть четвертою, тому її сутність - binary_sensor.irrigation_unlimited_c1_z4,
    а не ..._z5. Якщо порядок зон у configuration.yaml зміниться, ці посилання поїдуть.

    ДВА ТРИГЕРИ навмисно. Подія Smart Irrigation дає точний старт, але SI НЕ реєструє тригер узагалі, якщо сумарна тривалість її зон дорівнює нулю (а це нормальна ситуація наступного дня після поливу).
    Зона 5 у SI не заведена і має поливатися незалежно, тому додано другий тригер від сонця на -75 хв (25 хв зони 5 плюс до 50 хв зон 1 і 2). mode: single не дасть запуститися двічі, якщо спрацюють обидва.'
  triggers:
  - trigger: event
    event_type: smart_irrigation_start_irrigation_all_zones
  - trigger: sun
    event: sunrise
    offset: -01:15:00
  conditions:
  - condition: state
    entity_id: input_boolean.poliv_avtomatika_dozvolena
    state: 'on'
  - condition: template
    value_template: "{{ is_state(['input_boolean.poliv_pn', 'input_boolean.poliv_vt',\n             'input_boolean.poliv_sr', 'input_boolean.poliv_cht',\n             'input_boolean.poliv_pt', 'input_boolean.poliv_sb',\n\
      \             'input_boolean.poliv_nd'][now().weekday()], 'on') }}\n"
  actions:
  - variables:
      zona_1_seconds: "{% set smart = states('sensor.smart_irrigation_zona1') %} {% if is_number(smart) %}\n  {{ smart | int(0) }}\n{% else %}\n  {{ (states('input_number.poliv_zona_1_hvylyn') | int(25))\
        \ * 60 }}\n{% endif %}"
      zona_2_seconds: "{% set smart = states('sensor.smart_irrigation_zona2') %} {% if is_number(smart) %}\n  {{ smart | int(0) }}\n{% else %}\n  {{ (states('input_number.poliv_zona_2_hvylyn') | int(25))\
        \ * 60 }}\n{% endif %}"
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_golovna
    data:
      type: hourly
    response_variable: fc
  - variables:
      rain_now: "{{ states('weather.forecast_golovna') in\n   ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] }}\n"
      rain_soon: "{% set fl = (fc.get('weather.forecast_golovna', {}).get('forecast', []))[:6] %} {% set ns = namespace(wet=false) %} {% for f in fl %}\n  {% if f.condition in ['rainy', 'pouring', 'lightning-rainy',\
        \ 'snowy-rainy', 'hail']\n        or (f.precipitation | default(0) | float(0)) > 0.2 %}\n    {% set ns.wet = true %}\n  {% endif %}\n{% endfor %} {{ ns.wet }}\n"
  - if:
    - condition: template
      value_template: '{{ rain_now or rain_soon }}'
    then:
    - action: notify.mobile_app_sm_s918b
      data:
        title: Полив за розкладом
        message: '{{ ''Зараз дощ.'' if rain_now else ''Найближчими годинами прогнозують дощ.'' }} Поливати попри це?'
        data:
          tag: poliv_dosh
          actions:
          - action: POLIV_YES
            title: Поливати
          - action: POLIV_NO
            title: Пропустити
    - action: persistent_notification.create
      data:
        notification_id: poliv_dosh
        title: Полив за розкладом · очікує рішення
        message: "{{ 'Зараз іде дощ за даними Met.no.' if rain_now else 'Дощу зараз\
          \ немає, але Met.no прогнозує опади в найближчі 6 годин.' }} Питання надіслано\
          \ на телефон о {{ now().strftime('%H:%M') }}. Якщо ніхто не натисне «Поливати»\
          \ протягом 30 хвилин, полив буде пропущено. Планувалося: зона 1 - {{ (zona_1_seconds\
          \ | int(0) / 60) | round(0) }} хв, зона 2 - {{ (zona_2_seconds | int(0) /\
          \ 60) | round(0) }} хв.\n"
    - action: input_text.set_value
      target:
        entity_id: input_text.poliv_ostannie_rishennia
      data:
        value: "{{ now().strftime('%d.%m %H:%M') }} · чекаю відповіді · {{ 'дощ зараз'\
          \ if rain_now else 'прогноз дощу на 6 год' }}\n"
    - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: POLIV_YES
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: POLIV_NO
      timeout: 00:30:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: "{{ wait.trigger is none\n   or wait.trigger.event.data.action != 'POLIV_YES' }}\n"
      then:
      - action: notify.mobile_app_sm_s918b
        data:
          message: Полив пропущено через дощ.
          data:
            tag: poliv_dosh
      - action: persistent_notification.create
        data:
          notification_id: poliv_dosh
          title: Полив пропущено
          message: "Полив за розкладом о {{ (now() - timedelta(minutes=30)).strftime('%H:%M')\
            \ }} пропущено. Причина: {{ 'на момент старту йшов дощ' if rain_now else\
            \ 'Met.no прогнозував опади в найближчі 6 годин' }}, а на питання «Поливати\
            \ попри це?» {{ 'ніхто не відповів протягом 30 хвилин' if wait.trigger\
            \ is none else 'була відповідь «Пропустити»' }}. Не полито: зона 1 - {{\
            \ (zona_1_seconds | int(0) / 60) | round(0) }} хв, зона 2 - {{ (zona_2_seconds\
            \ | int(0) / 60) | round(0) }} хв. Розумний полив про це рішення не знає\
            \ і перерахує баланс води о 19:55 незалежно від нього.\n"
      - action: input_text.set_value
        target:
          entity_id: input_text.poliv_ostannie_rishennia
        data:
          value: "{{ now().strftime('%d.%m %H:%M') }} · пропущено · {{ 'дощ' if rain_now\
            \ else 'прогноз дощу' }} · {{ 'без відповіді 30 хв' if wait.trigger is\
            \ none else 'обрано «Пропустити»' }}\n"
      - stop: Полив пропущено через дощ
  - action: persistent_notification.dismiss
    data:
      notification_id: poliv_dosh
  - action: input_text.set_value
    target:
      entity_id: input_text.poliv_ostannie_rishennia
    data:
      value: "{{ now().strftime('%d.%m %H:%M') }} · полив стартував · зона 1 - {{ (zona_1_seconds\
        \ | int(0) / 60) | round(0) }} хв, зона 2 - {{ (zona_2_seconds | int(0) / 60)\
        \ | round(0) }} хв\n"
  - if:
    - condition: state
      entity_id: input_boolean.poliv_zona_1_vkl
      state: 'on'
    - condition: template
      value_template: '{{ zona_1_seconds | int(0) > 0 }}'
    then:
    - action: irrigation_unlimited.manual_run
      data:
        entity_id: binary_sensor.irrigation_unlimited_c1_z1
        time: '{{ timedelta(seconds=zona_1_seconds | int(0)) }}'
        queue: true
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z1'', ''on'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z1'', ''off'') }}'
      timeout: 01:02:00
      continue_on_timeout: false
    - wait_template: "{{ is_state('binary_sensor.irrigation_unlimited_c1_m', 'off')\n   and is_state('switch.mini_switch_k601_2_switch_1_2', 'off')\n   and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_1',\
        \ 'off') }}"
      timeout: 00:01:00
      continue_on_timeout: false
    - delay: 00:00:10
  - if:
    - condition: state
      entity_id: input_boolean.poliv_zona_2_vkl
      state: 'on'
    - condition: template
      value_template: '{{ zona_2_seconds | int(0) > 0 }}'
    then:
    - action: irrigation_unlimited.manual_run
      data:
        entity_id: binary_sensor.irrigation_unlimited_c1_z2
        time: '{{ timedelta(seconds=zona_2_seconds | int(0)) }}'
        queue: true
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z2'', ''on'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z2'', ''off'') }}'
      timeout: 01:02:00
      continue_on_timeout: false
    - wait_template: "{{ is_state('binary_sensor.irrigation_unlimited_c1_m', 'off')\n   and is_state('switch.mini_switch_k601_2_switch_1_2', 'off')\n   and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_2',\
        \ 'off') }}"
      timeout: 00:01:00
      continue_on_timeout: false
    - delay: 00:00:10
  - if:
    - condition: state
      entity_id: input_boolean.poliv_zona_5_vkl
      state: 'on'
    then:
    - action: irrigation_unlimited.manual_run
      data:
        entity_id: binary_sensor.irrigation_unlimited_c1_z4
        time: '{% set m = states(''input_number.poliv_zona_5_hvylyn'') | int(25) %}{{ ''%02d:%02d:00'' | format(m // 60, m % 60) }}'
        queue: true
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z4'', ''on'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
    - wait_template: '{{ is_state(''binary_sensor.irrigation_unlimited_c1_z4'', ''off'') }}'
      timeout: 01:02:00
      continue_on_timeout: false
    - wait_template: "{{ is_state('binary_sensor.irrigation_unlimited_c1_m', 'off')\n   and is_state('switch.mini_switch_k601_2_switch_1_2', 'off')\n   and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_5',\
        \ 'off') }}"
      timeout: 00:01:00
      continue_on_timeout: false
    - delay: 00:00:10
  mode: single
- id: tcl_idle_slideshow_start
  alias: TCL - запустити фотозаставку після 5 хвилин простою
  description: Не вмикає телевізор. Стартує лише якщо вже ввімкнений TCL безперервно перебуває у стані idle п'ять хвилин.
  triggers:
  - trigger: state
    entity_id: media_player.televizor_tcl
    to: idle
    for: 00:05:00
  conditions:
  - condition: state
    entity_id: media_player.televizor_tcl
    state: idle
  actions:
  - action: script.turn_on
    target:
      entity_id: script.tv_idle_slideshow
  mode: restart
- id: tcl_idle_slideshow_stop_on_activity
  alias: TCL - зупинити фотозаставку при активності
  description: Не дає заставці перебивати відео чи застосунок, який запустив користувач. Дві секунди потрібні, щоб не прийняти власний запуск JPEG через стандартний Cast receiver за сторонню активність.
  triggers:
  - trigger: state
    entity_id: media_player.televizor_tcl
  - trigger: state
    entity_id: media_player.televizor_tcl
    attribute: app_id
  - trigger: state
    entity_id: media_player.televizor_tcl
    attribute: media_content_type
  conditions:
  - condition: state
    entity_id: script.tv_idle_slideshow
    state: 'on'
  actions:
  - delay: 00:00:02
  - condition: template
    value_template: "{% set tv = 'media_player.televizor_tcl' %} {% set st = states(tv) %} {% set app = state_attr(tv, 'app_name') | default('', true) %} {% set kind = state_attr(tv, 'media_content_type')\
      \ | default('', true) %} {{ st in ['off', 'unavailable']\n   or (st not in ['idle']\n       and kind != 'image/jpeg'\n       and app not in ['Default Media Receiver', 'Home Assistant Cast']) }}"
  - action: script.turn_off
    target:
      entity_id: script.tv_idle_slideshow
  mode: restart
- id: hikvision_motion_snapshot
  alias: Камера - знімок при виявленні руху
  description: При спрацюванні binary_sensor.cam1_motion зберігає кадр з camera.cam1, оновлює www/motion/latest.jpg для дашборда і лишає останні 30 знімків.
  triggers:
  - trigger: state
    entity_id: binary_sensor.cam1_motion
    to: 'on'
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.cam1
    data:
      filename: /userdata/hass/config/www/motion/motion_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg
  - action: shell_command.update_motion_snapshot
  mode: single
- id: hikvision_motion_clip
  alias: Камера - відеокліп при виявленні руху
  description: 'Пише 15 с відео на NAS від моменту руху. Пре-ролю немає
    навмисно: він потребує preload_stream, тобто постійного потоку з камери,
    а це розхитувало живлення плати. Умова про змонтовану шару обовʼязкова -
    без неї кліпи писалися б на саму плату.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.cam1_motion
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.nas_videoarkhiv_zmontovanyi
    state: 'on'
  actions:
  - action: camera.record
    target:
      entity_id: camera.cam1
    data:
      filename: /userdata/hass/config/media/video/ha-motion/ruh_{{ now().strftime('%Y%m%d_%H%M%S')
        }}.mp4
      duration: 15
  - action: shell_command.prune_motion_clips
  mode: single
  max_exceeded: silent
