# Головний дашборд «Огляд» — реалізація затвердженого макета v2 (08.08.2026).
# Джерело правди: board-config/overview_dashboard.yaml → /userdata/hass/config/overview_dashboard.yaml
views:
- title: Огляд
  path: overview
  icon: mdi:home-variant
  type: sections
  max_columns: 4
  # Бейджі над сторінкою (додано 02.09.2026): канали зв'язку і нові сповіщення.
  # Це «скромна іконка вгорі» - відповідь на питання, що хмарне, а що локальне,
  # без правки жодної плитки. Тап веде на «Пристрої → Зв'язок» / «Сповіщення».
  badges:
  - type: entity
    entity: binary_sensor.localtuya
    name: Локально
    show_name: true
    show_state: true
    tap_action:
      action: navigate
      navigation_path: /pristroi-dashboard/links
  - type: entity
    entity: binary_sensor.tuya_khmara
    name: Хмара
    show_name: true
    show_state: true
    tap_action:
      action: navigate
      navigation_path: /pristroi-dashboard/links
  - type: entity
    entity: binary_sensor.invertor_zviazok
    name: Інвертор
    show_name: true
    show_state: true
    tap_action:
      action: navigate
      navigation_path: /pristroi-dashboard/links
  - type: entity
    entity: sensor.spovishchennia_zhurnal
    name: Нові сповіщення
    icon: mdi:bell-badge-outline
    show_name: true
    show_state: true
    color: amber
    visibility:
    - condition: numeric_state
      entity: sensor.spovishchennia_zhurnal
      above: 0
    tap_action:
      action: navigate
      navigation_path: /spovishchennia-zhurnal/zhurnal
  sections:
  # --- Секція 1 · Hero: привітання, погода, полив, тариф, NAS ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        ## {% set h = now().hour %}{{ 'Доброго ранку' if 5 <= h < 12 else 'Доброго дня' if 12 <= h < 18 else 'Доброго вечора' if 18 <= h < 23 else 'Доброї ночі' }} · Дім Ковтуни
        {% set dni = ['понеділок','вівторок','середа','четвер','пʼятниця','субота','неділя'] %}{{ dni[now().weekday()] }}, {{ now().strftime('%d.%m') }} · схід {% set nr = state_attr('sun.sun','next_rising') %}{{ as_timestamp(nr) | timestamp_custom('%H:%M', true) if nr else '—' }} · тариф зараз: {{ states('sensor.tarif_elektroenergii_zaraz') }} грн/кВт·год
        🕘 {{ states('input_text.poliv_ostannie_rishennia') }}

        {%- set ns = namespace(bad=[]) -%}
        {%- if is_state('binary_sensor.userdata_fs_poshkodzhena','on') -%}
          {%- set ns.bad = ns.bad + ['файлова система плати'] -%}
        {%- endif -%}
        {%- set userdata = states('sensor.vilne_mistse_userdata') | int(-1) -%}
        {%- if userdata > -1 and userdata < 250 -%}
          {%- set ns.bad = ns.bad + ['на /userdata ' ~ userdata ~ ' МБ'] -%}
        {%- endif -%}
        {%- set korin = states('sensor.vilne_mistse_korenia') | int(-1) -%}
        {%- if korin > -1 and korin < 800 -%}
          {%- set ns.bad = ns.bad + ['на корені ' ~ korin ~ ' МБ'] -%}
        {%- endif -%}
        {%- if is_state('binary_sensor.nas_videoarkhiv_zmontovanyi','off') -%}
          {%- set ns.bad = ns.bad + ['відеоархів відмонтований'] -%}
        {%- endif -%}
        {%- if is_state('binary_sensor.hikvision_camera_online','off') -%}
          {%- set ns.bad = ns.bad + ['камера офлайн'] -%}
        {%- endif -%}
        {%- if is_state('binary_sensor.cloudmate_nas_online','off') -%}
          {%- set ns.bad = ns.bad + ['NAS недоступний'] -%}
        {%- endif -%}
        {# Канали зв'язку (02.09.2026): без логера Deye сповіщення про світло
           не працюють, а локальні розетки після знеструмлення повертаються не
           всі - саме про це hero мовчав, коли інвертор і насос свердловини
           випали одночасно. #}
        {%- if is_state('binary_sensor.invertor_zviazok','off') -%}
          {%- set ns.bad = ns.bad + ['інвертор поза звʼязком, сповіщення про світло не працюють'] -%}
        {%- endif -%}
        {%- set poza = state_attr('binary_sensor.localtuya','poza_zviazkom') or '' -%}
        {%- if poza -%}
          {%- set ns.bad = ns.bad + ['поза звʼязком: ' ~ poza] -%}
        {%- endif -%}
        {%- if is_state('binary_sensor.tuya_khmara','off') -%}
          {%- set ns.bad = ns.bad + ['хмара Tuya мовчить'] -%}
        {%- endif -%}
        {# Явний перенос: усі теги вище стоять із мінусом і з'їдають власні рядки,
           інакше статус прилипає до рядка про полив. #}
        {{ '\n' }}{% if ns.bad %}⚠️ {{ ns.bad | length }} {{ 'проблема' if ns.bad | length == 1 else 'проблеми' }}: {{ ns.bad | join('; ') }}{% else %}✅ Система: все гаразд{% endif %}
        {%- set novykh = states('sensor.spovishchennia_zhurnal') | int(0) -%}
        {{ '\n' }}{% if novykh > 0 %}🔔 {{ novykh }} {{ 'нове сповіщення' if novykh == 1 else 'нових сповіщень' }} · [журнал](/spovishchennia-zhurnal/zhurnal){% else %}🔕 Нових сповіщень немає · [журнал](/spovishchennia-zhurnal/zhurnal){% endif %}
        {%- if is_state('binary_sensor.vidkliuchennia_skoro', 'on') -%}
        {{ '\n' }}⚡ Планове відключення через {{ states('sensor.do_vidkliuchennia_hodyn') }} год · батарея {{ states('sensor.inverter_battery') }} % · [блекаут](/pristroi-dashboard/blackout)
        {%- endif %}
    - type: tile
      entity: switch.mini_switch_k601_2_switch_1_2
      name: Насос поливу · ручне керування
      icon: mdi:water-pump
      color: blue
      features_position: bottom
      features:
      - type: toggle
      grid_options:
        columns: 24
        rows: 1
    # Бойлер бабусі - та сама розетка Tuya з вимірюванням, що й на вкладці
    # Бойлер. Плитка навмисне така сама, як у насоса поливу вище: перемикач
    # унизу, щоб вмикати одним дотиком просто з Огляду. Сутність локальна
    # (LocalTuya): дотик до неї не залежить від хмари Tuya.
    - type: tile
      entity: switch.boiler_babusi_socket
      name: Бойлер бабусі
      icon: mdi:water-boiler
      color: red
      features_position: bottom
      features:
      - type: toggle
      grid_options:
        columns: 24
        rows: 1
    - type: custom:well-water-overview-card
      title: Вода свердловини · розрахунок
      energy_entity: sensor.t34_smart_plug_nasos_sverdlovini_spozhito
      coefficient_entity: input_number.sverdlovina_koefitsiient_vodi
      # Базову точку й енергетичну поправку картка бере з атрибута calibration
      # сенсора журналу, тому тут їх більше немає: одне число - одне місце.
      log_entity: sensor.zhurnal_pokaznykiv_vody
      time_zone: Europe/Kyiv
      navigation_path: /sverdlovina-dashboard/well
      grid_options:
        columns: 24
    - type: tile
      entity: weather.forecast_golovna
      name: Погода
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.poliv_stan_sistemi
      name: Полив
      icon: mdi:sprinkler-variant
      grid_options:
        columns: 12
        rows: 1
    # Тариф уже стоїть рядком у hero вище, тож плитка-дубль звільнила місце для
    # того, чого на головній не було взагалі: чи дім живиться з мережі.
    - type: tile
      entity: sensor.inverter_device_relay
      name: Живлення
      icon: mdi:transmission-tower
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: binary_sensor.cloudmate_nas_online
      name: NAS
      grid_options:
        columns: 12
        rows: 1
  # --- Секція 2 · Енергія ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Енергія
      icon: mdi:lightning-bolt
      grid_options:
        columns: full
    - type: gauge
      entity: sensor.zagalne_navantazhennia
      name: Навантаження
      min: 0
      max: 15
      needle: true
      severity:
        green: 0
        yellow: 6
        red: 11
      grid_options:
        columns: 6
    - type: gauge
      entity: sensor.inverter_battery
      name: Батарея
      unit: '%'
      min: 0
      max: 100
      needle: false
      severity:
        red: 0
        yellow: 25
        green: 40
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.naibilshii_spozhivach_zaraz
      name: Найбільший споживач
      grid_options:
        columns: 12
        rows: 1
    - type: statistic
      entity: sensor.vitrati_na_merezhu_razom
      stat_type: change
      name: Витрати сьогодні
      period:
        calendar:
          period: day
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.vitrati_na_merezhu_razom
      stat_type: change
      name: Витрати за місяць
      period:
        calendar:
          period: month
      grid_options:
        columns: 6
  # --- Секція 3 · Дім зараз ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Дім зараз
      icon: mdi:home-account
      grid_options:
        columns: full
    - type: tile
      entity: water_heater.144036023323246_water_heater
      name: Бойлер
      # Стан водонагрівача — сире "on" без перекладу; температура води корисніша
      state_content: current_temperature
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.boiler_sogodni
      name: Бойлер сьогодні
      icon: mdi:water-boiler
      grid_options:
        columns: 12
        rows: 1
    # Не switch.zariadka_7_5kvt: той перемикач нічим не керує і бреше про стан
    # (показував off, поки станція тягла 6.3 кВт), а на головній сторінці тумблер
    # означає, що ним будуть користуватись. Реальне керування - select нижче.
    - type: tile
      entity: select.zariadka_7_5kvt_charge_state
      name: Зарядка авто
      icon: mdi:ev-station
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.zariadka_7_5kvt_device_kw
      name: Потужність зарядки
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: person.dim_kovtuni
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: person.katerina
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: person.olesia
      grid_options:
        columns: 8
        rows: 1
  # --- Секція 4 · Клімат зараз ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Клімат зараз
      icon: mdi:home-thermometer
      grid_options:
        columns: full
    - type: tile
      entity: sensor.2_floor_inside_temperature
      name: Спальня батьків
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: sensor.2_floor_carbon_dioxide
      name: CO₂ спальня
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: sensor.terneo_2_floor_temperature
      name: Кухня · підлога
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: sensor.sonoff_a48001c18f_temperature
      name: Гостьова
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: sensor.siku_blauberg_fan_192_168_50_27_humidity
      name: Хлопці · вологість
      grid_options:
        columns: 8
        rows: 1
    - type: tile
      entity: sensor.2i_poverkh_t_h_temperature
      name: Дім бабусі
      grid_options:
        columns: 8
        rows: 1
  # --- Секція 5 · Камера ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Двір
      icon: mdi:cctv
      grid_options:
        columns: full
    - type: picture-entity
      entity: binary_sensor.cam1_motion
      camera_image: camera.cam1
      show_state: true
      show_name: false
      grid_options:
        columns: full
  # --- Секція 6 · Сьогодні (журнал подій) ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Сьогодні
      icon: mdi:timeline-clock
      grid_options:
        columns: full
    - type: logbook
      hours_to_show: 24
      grid_options:
        columns: full
      target:
        entity_id:
        - switch.mini_switch_k601_2_switch_1_2
        - binary_sensor.irrigation_unlimited_c1_m
        - input_boolean.poliv_avtomatika_dozvolena
        - water_heater.144036023323246_water_heater
        # Стан станції, а не її фіктивний перемикач: switch.zariadka_7_5kvt
        # змінюється сам собою і давав журнал подій, яких не було.
        - select.zariadka_7_5kvt_charge_state
        # binary_sensor.cam1_motion прибрано: десятки записів «Рух · Двір» за добу
        # топили рідкісні корисні події. Рух живе на вкладці «Камера і рух».
    - type: history-graph
      title: Відключення і полив · 24 години (тестування)
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: binary_sensor.svitlo_vidsutnie
        name: Мережа зникла
      - entity: binary_sensor.invertor_zviazok
        name: Зв'язок з інвертором
      - entity: switch.mini_switch_k601_2_switch_1_2
        name: Насос поливу
  # --- Секція 7 · Швидкі дії ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Швидкі дії
      grid_options:
        columns: full
    - type: button
      name: Автополив
      icon: mdi:sprinkler
      tap_action:
        action: navigate
        navigation_path: /pristroi-dashboard/poliv
      grid_options:
        columns: full
    - type: button
      name: Витрати
      icon: mdi:cash
      tap_action:
        action: navigate
        navigation_path: /power-dashboard/cost
      grid_options:
        columns: full
    - type: button
      name: Claude чат
      icon: mdi:message-text
      tap_action:
        action: navigate
        navigation_path: /claude-home
      grid_options:
        columns: full
    # Бойлер бабусі - розетка Tuya з вимірюванням, у яку він увімкнений.
    # Кнопка перемикає живлення локальним каналом; чи справді гріє, видно за
    # потужністю на вкладці Пристрої.
    - type: button
      name: Бойлер бабусі
      icon: mdi:water-boiler
      entity: switch.boiler_babusi_socket
      tap_action:
        action: toggle
      grid_options:
        columns: full
    - type: button
      name: Блекаут
      icon: mdi:transmission-tower-off
      tap_action:
        action: navigate
        navigation_path: /pristroi-dashboard/blackout
      grid_options:
        columns: full
    - type: button
      name: Стоп полив
      icon: mdi:stop-circle-outline
      tap_action:
        action: call-service
        service: script.poliv_stop_all
      grid_options:
        columns: full
