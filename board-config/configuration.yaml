
# Loads default set of integrations. Do not remove.
default_config:

# Preserve the raw 16 kHz WAV for every Assist voice run. The Claude chat panel
# exposes this private archive only to authenticated administrators so a long
# dictation can be played back and sent through STT again.
assist_pipeline:
  debug_recording_dir: /userdata/hass/config/.private/claude-code-conversation/voice-recordings

# Keep schedules and log timestamps aligned with the physical installation.
homeassistant:
  time_zone: Europe/Kyiv
  # Added 2026-08-18. external_url was unset, so the companion app had no
  # address to use away from home and push notifications had no callback
  # to come back to - the app had not contacted this instance in two days.
  # This is the Cloudflare tunnel hostname; nothing is forwarded on the
  # router, so it is the only way in from outside.
  external_url: https://ha.sonyachny.pp.ua
  internal_url: http://192.168.50.141:8123
  # camera.record refuses to write anywhere outside this list. The clip path
  # is an NFS mount of the NAS, so motion clips never land on the board's own
  # 2.5 GB partition.
  allowlist_external_dirs:
    # Home Assistant resolves the requested path to its REAL location before
    # comparing it against this list, while the list itself is compared as
    # written. switch-mode.sh makes /userdata/hass/config a symlink, and since
    # 03.09.2026 media/video is itself a symlink to /mnt/homemate_media/video
    # (the NAS share now lives outside the config tree - Core backups archive
    # everything under config, mounts included, which is how the nightly
    # archive grew to 5-9 GB and aborted every night). So a clip aimed at
    # /userdata/hass/config/media/video/... becomes
    # /mnt/homemate_media/video/... and must match THAT entry.
    #
    # Measured 2026-08-17: a missing real-path entry is why every motion clip
    # and snapshot failed with "no access to path" after the move to the
    # symlinked config - on the old board config was a real directory.
    # The older forms are kept too, harmlessly, until finish-video-move.sh has
    # run and in case a symlink is ever removed. www/motion-clips is gone: the
    # gallery reads clips through media_source with signed URLs.
    - /mnt/homemate_media/video
    - /userdata/hass/config-standalone/media/video
    - /userdata/hass/config-standalone/www/motion
    - /userdata/hass/config/media/video
    - /userdata/hass/config/www/motion

# Read-only local telemetry from the Tenda access point and range extender.
rest: !include network_monitoring.yaml

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  # This project keeps Lovelace itself in storage mode. In HA 2026.7 YAML
  # resources are ignored in that mode, so load our repository-owned card as
  # a frontend module without changing or overwriting storage resources.
  extra_module_url:
    - /local/home-energy-flow-card.js?v=20260822-thin

input_number:
  # --- Пороги сповіщень про відключення світла ---
  # Винесені в налаштування навмисне: правильне число залежить від сезону і від
  # того, скільки лишилось у батареї, а лізти в YAML заради 1.4 замість 1.5 кВт
  # не має сенсу.
  #
  # Без initial: (знято 02.09.2026). З initial: Home Assistant повертав значення
  # з YAML при КОЖНОМУ рестарті - тобто все, що виставили на дашборді, зникало
  # разом зі світлом (плата гасне при відключеннях). Без initial: HA відновлює
  # останнє значення з restore_state; типові числа (1.5 кВт, 3 хв, 25 %, 10 %)
  # діють лише при першому створенні помічника.
  bez_svitla_porih_kvt:
    name: Без світла - поріг споживання
    min: 0.2
    max: 6
    step: 0.1
    unit_of_measurement: кВт
    icon: mdi:flash-alert
  bez_svitla_zatrymka_hv:
    name: Без світла - затримка перед сповіщенням
    min: 1
    max: 30
    step: 1
    unit_of_measurement: хв
    icon: mdi:timer-sand
  batareia_porih_uvaha:
    name: Батарея - попередження
    min: 5
    max: 90
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-alert
  batareia_porih_krytychno:
    name: Батарея - критичний рівень
    min: 2
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant-outline
  poliv_zona_1_hvylyn:
    name: Зона 1 - хвилин поливу
    min: 1
    max: 60
    step: 1
    icon: mdi:timer-outline
  poliv_zona_2_hvylyn:
    name: Зона 2 - хвилин поливу
    min: 1
    max: 60
    step: 1
    icon: mdi:timer-outline
  poliv_zona_3_hvylyn:
    name: Зона 3 - хвилин поливу
    min: 1
    max: 60
    step: 1
    icon: mdi:timer-outline
  # Зони 4 і 5 додані 2026-08-03 на прохання - вони фізично існують.
  # У Smart Irrigation НЕ заведені навмисно: там лишаються тільки зони 1 і 2,
  # решта керується вручну з дашборда.
  poliv_zona_4_hvylyn:
    name: Зона 4 - хвилин поливу
    min: 1
    max: 60
    step: 1
    icon: mdi:timer-outline
  poliv_zona_5_hvylyn:
    name: Зона 5 - хвилин поливу
    min: 1
    max: 60
    step: 1
    icon: mdi:timer-outline

  # Показ лічильника енергії насоса на момент старту сесії поливу.
  # Заповнюється автоматизацією "Полив - фіксація лічильника на старті сесії".
  nasos_energiia_start:
    name: Насос - лічильник на старті сесії
    min: 0
    max: 1000000
    step: 0.001
    mode: box
    icon: mdi:counter

  # --- Знімки лічильників на старті ручного заміру (2026-08-22) ---
  # Автоматизація кладе сюди значення в момент увімкнення секундоміра, щоб на
  # зупинці порахувати різницю. Три джерела одразу: скільки часу зарахувала
  # система, скільки енергії нарахував Riemann і скільки - власний лічильник
  # розетки. За один пуск стає видно, який із них ближчий до правди.
  zamir_start_runtime:
    name: Замір - час роботи на старті
    min: 0
    max: 100000
    step: 0.0000001
    mode: box
    icon: mdi:timer-play
  zamir_start_riemann:
    name: Замір - Riemann на старті
    min: 0
    max: 1000000
    step: 0.0001
    mode: box
    icon: mdi:counter
  zamir_start_device:
    name: Замір - лічильник розетки на старті
    min: 0
    max: 1000000
    step: 0.0001
    mode: box
    icon: mdi:counter

  # --- Розклад заряджання авто (додано 2026-08-09) ---
  # Струм, який виставляється на станцію на початку вікна. 32 А - апаратна межа
  # цієї однофазної станції, тобто близько 7,4 кВт при 230 В.
  zariadka_strum_rozklad:
    name: Заряджання - струм у вікні розкладу
    min: 8
    max: 32
    step: 1
    unit_of_measurement: A
    icon: mdi:current-ac

  # --- Якір обліку мережі (додано 2026-08-23) ---
  #
  # Накопичувальний показ трифазного лічильника приходить ТІЛЬКИ хмарою Tuya:
  # локальний канал віддає самі миттєві значення (сирий DP фази декодується як
  # 2 байти напруги, 3 струму, 3 потужності - накопичувального регістру там
  # немає). Коли 9 серпня 2026 протух токен Tuya, облік усього вводу став
  # мертвий на десять днів, і помітили це лише 22-го.
  #
  # Тому показ будується як ЯКІР + локальний інтеграл від якоря. Поки хмара
  # жива, значення дорівнює її показу з точністю до останнього якоря - тобто
  # біллінгове. Коли хмара падає, сенсор продовжує рухатись локально й повільно
  # дрейфує, замість того щоб замерзнути.
  #
  # Той самий патерн уже працює для сесії насоса (nasos_energiia_start).
  merezha_yakir_pokaz:
    name: Мережа - якір, показ лічильника
    min: 0
    max: 1000000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
    icon: mdi:anchor
  merezha_yakir_integral:
    name: Мережа - якір, локальний інтеграл
    min: 0
    max: 1000000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
    icon: mdi:anchor

# --- Розклад заряджання авто: межі вікна (додано 2026-08-09) ---
# Типово збігається з нічним тарифом 23:00-06:59, бо кіловат уночі вдвічі
# дешевший. Значення редагуються на дашборді, YAML правити не треба.
input_datetime:
  # Бойлер бабусі. Вікно нагріву задається тут, а не в автоматизації, щоб його
  # можна було міняти з дашборда без правки YAML. За замовчуванням 04:00-07:00:
  # нічний тариф триває 23:00-06:59, тож вода встигає нагрітися найдешевше і
  # лишається гарячою до ранку.
  boiler_babusi_pochatok:
    name: Бойлер бабусі - початок нагріву
    has_date: false
    has_time: true
    icon: mdi:clock-start
  boiler_babusi_kinets:
    name: Бойлер бабусі - кінець нагріву
    has_date: false
    has_time: true
    icon: mdi:clock-end
  zariadka_pochatok:
    name: Заряджання - початок вікна
    has_date: false
    has_time: true
    icon: mdi:clock-start
  zariadka_kinets:
    name: Заряджання - кінець вікна
    has_date: false
    has_time: true
    icon: mdi:clock-end

# ВИДАЛЕНО 2026-08-08: input_select.poliv_ruchna_zona ("Ручний пуск - яку зону
# відкривати"). Насос вмикають часто й довільно - фізичною кнопкою на модулі,
# тумблером в інтерфейсі, зі шланга через водяну розетку. Це нормальний перебіг
# подій, а не аварія, тому жодного вибору зони і жодних умов для ручного пуску
# більше немає: увімкнули насос - він просто працює.
#
# Разом із цим helper видалено дві автоматизації, які на ньому трималися:
# irrigation_manual_pump_opens_valve (примусово відкривала клапан обраної зони)
# та irrigation_pump_without_open_valve (глушила насос через 3 хвилини роботи
# без клапана). Єдиним обмеженням лишається irrigation_pump_max_runtime_3h.

# Master commissioning gate. It starts off on first creation and is checked by
# every scheduled/weather-driven irrigation automation. Manual controls and
# emergency stop remain available independently.
input_boolean:
  # Чи вимикати важкі споживачі самотужки, щойно зникне світло. Увімкнено за
  # замовчуванням: бойлер на 2 кВт з'їдає автономію в рази швидше, ніж решта
  # будинку разом. Якщо колись заважатиме - вимикається тут, без правки YAML.
  bez_svitla_vymykaty:
    name: Без світла - вимикати важкі споживачі
    icon: mdi:power-plug-off
  # Вимикач самого розкладу. Off - бойлер лишається під ручним керуванням,
  # автоматика його не чіпає. Автоматизації перевіряють саме цей прапорець.
  boiler_babusi_rozklad:
    name: Бойлер бабусі - нагрів за розкладом
    icon: mdi:calendar-clock
  # Set by the 21:00 rain question, read and cleared by the morning run.
  # Off means "water normally" - so a missed evening check (HA down, no rain
  # forecast) never silently cancels irrigation.
  poliv_propustyty_zavtra:
    name: Полив - пропустити завтрашній ранок
    icon: mdi:weather-rainy
  poliv_avtomatika_dozvolena:
    name: Автоматичний полив дозволено
    icon: mdi:sprinkler-variant

  # --- Розклад поливу: дні тижня (додано 2026-08-03) ---
  poliv_pn:
    name: Полив - понеділок
    icon: mdi:calendar
  poliv_vt:
    name: Полив - вівторок
    icon: mdi:calendar
  poliv_sr:
    name: Полив - середа
    icon: mdi:calendar
  poliv_cht:
    name: Полив - четвер
    icon: mdi:calendar
  poliv_pt:
    name: Полив - п'ятниця
    icon: mdi:calendar
  poliv_sb:
    name: Полив - субота
    icon: mdi:calendar
  poliv_nd:
    name: Полив - неділя
    icon: mdi:calendar
  # Які зони бере розклад. Тривалість кожної - з input_number вище.
  poliv_zona_1_vkl:
    name: Зона 1 у розкладі
    icon: mdi:sprinkler
  poliv_zona_2_vkl:
    name: Зона 2 у розкладі
    icon: mdi:sprinkler
  poliv_zona_5_vkl:
    name: Зона 5 у розкладі
    icon: mdi:sprinkler

  # --- Розклад заряджання авто (додано 2026-08-09) ---
  # Станція має власні таймери set_delay_time і set_define_time, але вони
  # відлічують час ВІД ПІДКЛЮЧЕННЯ авто, а не за годинником. Щоб ловити нічний
  # тариф, розклад веде Home Assistant.
  zariadka_rozklad:
    name: Заряджання авто за розкладом
    icon: mdi:calendar-clock

  # --- Ручний секундомір насоса свердловини (2026-08-22) ---
  # Розетка звітує рідко, і скільки насос працює насправді, з її даних не видно.
  # Єдиний спосіб дізнатись похибку - засікти пуск людиною поруч із насосом.
  # Увімкнути на старті, вимкнути на зупинці; решту рахує автоматизація, тому
  # записувати щось на папері не потрібно.
  sverdlovina_sekundomir:
    name: Свердловина - ручний секундомір
    icon: mdi:timer-outline

# --- Журнал рішень про полив (додано 2026-08-08) ---
# Автоматизація розкладу пише сюди підсумок останнього рішення. До цього
# рішення жило тільки в пуші на телефон: якщо пуш не побачили, на дашборді
# не лишалося жодного сліду, чому полив не відбувся.
input_text:
  poliv_ostannie_rishennia:
    name: Полив - останнє рішення
    icon: mdi:clipboard-text-clock

  # Підсумок останнього ручного заміру насоса: реальні секунди проти зарахованих
  # системою, і скільки за той самий пуск нарахували обидва лічильники енергії.
  sverdlovina_zamir_rezultat:
    name: Свердловина - результат заміру
    max: 255
    icon: mdi:clipboard-check-outline

# --- Розподіл споживання на день і ніч (додано 2026-08-08) ---
#
# Energy-дашборд рахує загальну вартість, але не показує, скільки з неї
# припало на дорогий денний тариф, а скільки на дешевий нічний, і не рахує
# гривні по окремих пристроях. utility_meter із двома тарифами розводить
# кожен лічильник на дві гілки; перемикає їх автоматизація
# "tarif_peremknuty_lichylnyky" о 07:00 і о 23:00 - ті самі межі, що й у
# sensor.tarif_elektroenergii_zaraz.
#
# Лічильники БЕЗ cycle - наростаючі назавжди, з них будуються графіки витрат
# (statistics-graph зі stat_type change сам рахує приріст за день чи місяць).
# Лічильники з cycle: daily/monthly дають готові числа "сьогодні" і "цей
# місяць" без звернення до статистики.
#
# ВАЖЛИВО: лічильники починають рахувати з моменту створення. Історію до
# 2026-08-08 розділити на день і ніч неможливо - у статистиці збережена лише
# сумарна вартість без розбиття за тарифом.
utility_meter:
  # --- Паралельний лічильник на ПОКАЗ ЛІЧИЛЬНИКА (додано 23.08.2026) ---
  #
  # Джерело наявних лічильників - інвертор, а він бачить лише свою гілку:
  # заміряна різниця з лічильником доходила до 27 відсотків. Правильне джерело -
  # sensor.merezha_spozhyto, який тепер тримається на локальному DP 1.
  #
  # Але source наявного utility_meter міняти НЕ МОЖНА (розділ 2 специфікації):
  # історія не переноситься, лічильник продовжить з місця, де стояв, і на стику
  # вийде сходинка, яку потім шукатимуть як аномалію. Тому новий лічильник
  # поруч зі старим. Коли обидва відпрацюють доба-дві паралельно і числа
  # зійдуться - тоді перемикати картки, а старому дати доживати.
  lichylnyk_za_tarifom:
    name: Лічильник за тарифом
    source: sensor.merezha_spozhyto
    tariffs: [den, nich]
  lichylnyk_dobovyi:
    name: Лічильник за добу
    source: sensor.merezha_spozhyto
    cycle: daily
    tariffs: [den, nich]
  lichylnyk_misiachnyi:
    name: Лічильник за місяць
    source: sensor.merezha_spozhyto
    cycle: monthly
    tariffs: [den, nich]

  merezha_za_tarifom:
    name: Мережа за тарифом
    source: sensor.inverter_total_energy_import
    tariffs: [den, nich]
  merezha_dobovyi:
    name: Мережа за добу
    source: sensor.inverter_total_energy_import
    cycle: daily
    tariffs: [den, nich]
  merezha_misiachnyi:
    name: Мережа за місяць
    source: sensor.inverter_total_energy_import
    cycle: monthly
    tariffs: [den, nich]

  boiler_za_tarifom:
    name: Бойлер за тарифом
    source: sensor.boiler_spozhito
    tariffs: [den, nich]
  zariadka_za_tarifom:
    name: Зарядка авто за тарифом
    source: sensor.zariadka_avto_spozhito
    tariffs: [den, nich]
  pidloha_1_za_tarifom:
    name: Тепла підлога 1 за тарифом
    source: sensor.terneo_1_heating_energy
    tariffs: [den, nich]
  pidloha_2_za_tarifom:
    name: Тепла підлога 2 за тарифом
    source: sensor.terneo_2_heating_energy
    tariffs: [den, nich]
  nasos_za_tarifom:
    name: Насос поливу за тарифом
    source: sensor.nasos_polivu_spozhito
    tariffs: [den, nich]
  # Бойлер бабусі. Джерело - лічильник самої розетки Tuya (device_class energy,
  # state_class total_increasing, kWh), тому додаткового інтегрування не треба.
  boiler_babusi_za_tarifom:
    name: Бойлер бабусі за тарифом
    source: sensor.smart_plug_total_energy
    tariffs: [den, nich]

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Irrigation Unlimited is the execution layer. It owns the three zone valves
# and the master pump, but has no active schedule until commissioning. Negative
# pre/postamble values guarantee valve-first start and pump-first stop.
irrigation_unlimited:
  granularity: 5
  refresh_interval: 30
  history:
    enabled: true
    span: 30
    refresh_interval: 60
  controllers:
    - name: Система поливу
      controller_id: poliv
      entity_id: switch.mini_switch_k601_2_switch_1_2
      preamble: "-00:00:03"
      postamble: "-00:00:03"
      queue_manual: true
      show_sequence_status: true
      all_zones_config:
        minimum: "00:01:00"
        maximum: "01:00:00"
        show:
          timeline: true
      zones:
        - name: Зона 1
          zone_id: zona_1
          entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_1
          duration: "00:25:00"
        - name: Зона 2
          zone_id: zona_2
          entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_2
          duration: "00:25:00"
        - name: Зона 3
          zone_id: zona_3
          entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_3
          duration: "00:10:00"
        # Зона 5 у IU потрібна лише заради ЧЕРГИ і майстер-насоса.
        # У Smart Irrigation вона НЕ заведена навмисно - тривалість фіксована.
        - name: Зона 5
          zone_id: zona_5
          entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_5
          duration: "00:25:00"
      sequences:
        - name: Розумний полив
          sequence_id: rozumnyi_poliv
          enabled: true
          zones:
            - zone_id: zona_1
            - zone_id: zona_2
            - zone_id: zona_3

# --- Total load across all three phases (added 2026-08-02) ---
template:
  # --- Автономія батареї, годин (02.09.2026, сторінка «Блекаут») ---
  #
  # Ємність береться з налаштування самого інвертора (number.inverter_battery_
  # capacity, 200 А·год) помноженого на номінальні 51,2 В батареї 16S LiFePO4 -
  # тобто ~10,2 кВт·год. Окремого помічника «ємність» немає навмисно: одне
  # число - одне місце, і воно вже стоїть у Deye. Корисний запас рахується до
  # порога «критично» (input_number.batareia_porih_krytychno), нижче якого
  # інвертор і сам починає скидати навантаження.
  #
  # При навантаженні під 50 Вт (нічний мінімум) оцінка втрачає сенс і
  # обрізається на 99 годинах. Коли логер Deye поза звʼязком - unavailable,
  # а не застаріле число: hero «Блекауту» тоді каже «інвертор не відповідає».
  - sensor:
      - name: Avtonomiia batarei
        unique_id: battery_autonomy_hours
        unit_of_measurement: "год"
        icon: mdi:battery-clock
        state_class: measurement
        state: >-
          {% set soc = states('sensor.inverter_battery') | float(0) %}
          {% set floor = states('input_number.batareia_porih_krytychno') | float(10) %}
          {% set cap = states('number.inverter_battery_capacity') | float(200) * 51.2 / 1000 %}
          {% set load = states('sensor.inverter_load_power') | float(0) / 1000 %}
          {% set usable = [soc - floor, 0] | max / 100 * cap %}
          {{ [usable / load, 99] | min | round(1) if load > 0.05 else 99 }}
        availability: >-
          {{ has_value('sensor.inverter_battery') and has_value('sensor.inverter_load_power')
             and has_value('number.inverter_battery_capacity') }}
        attributes:
          iemnist_kvtg: >-
            {{ (states('number.inverter_battery_capacity') | float(200) * 51.2 / 1000) | round(1) }}

  # --- Відключення за графіком Yasno (інтеграцію налаштовано 02.09.2026, група 3.1) ---
  #
  # Два похідні від sensor.yasno_kiiv_3_1_*: години до найближчого відключення
  # (планове має пріоритет над імовірним) і прапорець «менше трьох годин до
  # планового» - саме він у ТЗ сонячного нагріву перемикає режим збереження
  # батареї, а на «Огляді» дає рядок у hero. Шаблон читає now(), тому HA
  # перераховує його щохвилини сам.
  - sensor:
      - name: Do vidkliuchennia hodyn
        unique_id: hours_to_next_outage
        unit_of_measurement: "год"
        icon: mdi:calendar-clock
        state: >-
          {% set pl = 'sensor.yasno_kiiv_3_1_next_planned_outage' %}
          {% set pr = 'sensor.yasno_kiiv_3_1_next_probable_outage' %}
          {% set t = states(pl) if has_value(pl) else states(pr) %}
          {{ (((t | as_timestamp(0)) - now().timestamp()) / 3600) | round(1) }}
        availability: >-
          {{ has_value('sensor.yasno_kiiv_3_1_next_planned_outage')
             or has_value('sensor.yasno_kiiv_3_1_next_probable_outage') }}
        attributes:
          typ: >-
            {{ 'планове' if has_value('sensor.yasno_kiiv_3_1_next_planned_outage') else 'імовірне' }}
  - binary_sensor:
      - name: Vidkliuchennia skoro
        unique_id: planned_outage_within_3h
        device_class: problem
        icon: mdi:transmission-tower-off
        state: >-
          {% set h = states('sensor.do_vidkliuchennia_hodyn') | float(99) %}
          {{ is_state_attr('sensor.do_vidkliuchennia_hodyn', 'typ', 'планове') and 0 <= h <= 3 }}

  # --- Вода свердловини як лічильник (03.09.2026) ---
  #
  # Картки «по днях · 30 днів» і «рік по місяцях» на сторінці свердловини читали
  # сиру історію, а recorder тримав 7 днів - тому 23 з 30 стовпчиків завжди
  # порожні. Довгострокова статистика (LTS) живе роками, але лише для сенсорів
  # зі state_class. Цей сенсор - розрахункова вода в м³ від контрольної точки
  # як total_increasing з device_class water: HA сам веде добові й місячні суми,
  # statistics-graph малює 30 днів і 12 місяців, а панель «Енергія» може
  # показати воду як джерело. Історію до створення сенсора імпортує
  # scripts/water_lts_import.py з LTS інтегратора × коефіцієнт.
  #
  # Чесно про коефіцієнт: він уточнюється після кожного механічного показника,
  # і тоді ВЕСЬ ряд перераховується в картках, а в LTS лишається старий. Різниця
  # - кілька відсотків; для «скільки води за місяць» це прийнятно, для
  # калібрування джерелом лишається журнал показників.
  - sensor:
      - name: Sverdlovina voda m3
        unique_id: well_water_total_m3
        unit_of_measurement: "m³"
        device_class: water
        state_class: total_increasing
        icon: mdi:water-pump
        state: >-
          {% set e = states('sensor.t34_smart_plug_nasos_sverdlovini_spozhito') | float(0) %}
          {% set cal = state_attr('sensor.zhurnal_pokaznykiv_vody', 'calibration') or {} %}
          {% set off = cal.get('energy_offset_kwh', 0) | float(0) %}
          {% set k = states('input_number.sverdlovina_koefitsiient_vodi') | float(0.802) %}
          {{ ([e + off, 0] | max * k) | round(3) }}
        availability: >-
          {{ has_value('sensor.t34_smart_plug_nasos_sverdlovini_spozhito')
             and has_value('input_number.sverdlovina_koefitsiient_vodi') }}

  # --- Насос свердловини: зв'язок і останній пуск (02.09.2026, бейджі «Обліку води») ---
  #
  # Власник: «не зрозуміло, чи підключений зараз насос і в якому стані; показати
  # останній запуск і скільки набрав». Зв'язок - чи віддає розетка T34 локальну
  # потужність. Останній пуск - тригерний сенсор: на старті запам'ятовує час і
  # показ інтегратора енергії, на зупинці рахує тривалість, енергію і воду за
  # чинним коефіцієнтом (м³/кВт·год × 1000). Стан - час старту, решта в
  # атрибутах; voda_txt і tryvalist_txt - готові рядки для бейджа.
  # Інтегратор Riemann на короткому пуску дораховує частину енергії вже після
  # зупинки, тому «набрав» за один пуск - оцінка знизу; добові суми точні.
  - binary_sensor:
      - name: Nasos sverdlovini zviazok
        unique_id: well_pump_local_link
        device_class: connectivity
        icon: mdi:power-socket-eu
        state: "{{ has_value('sensor.t34_smart_plug_power_2') }}"
  - trigger:
      - trigger: state
        entity_id: input_boolean.nasos_sverdlovini_pratsiuie
        from: 'off'
        to: 'on'
        id: start
      - trigger: state
        entity_id: input_boolean.nasos_sverdlovini_pratsiuie
        from: 'on'
        to: 'off'
        id: stop
    sensor:
      - name: Nasos sverdlovini ostannii pusk
        unique_id: well_pump_last_run
        icon: mdi:water-pump
        state: >-
          {% if trigger.id == 'start' %}{{ now().strftime('%H:%M') }}
          {% elif this is defined and this.state not in ['unknown', 'unavailable'] %}{{ this.state }}
          {% else %}{{ now().strftime('%H:%M') }}{% endif %}
        attributes:
          pochatok: >-
            {% if trigger.id == 'start' %}{{ now().isoformat() }}
            {% else %}{{ this.attributes.pochatok if this is defined else now().isoformat() }}{% endif %}
          enerhiia_start: >-
            {% if trigger.id == 'start' %}{{ states('sensor.t34_smart_plug_nasos_sverdlovini_spozhito') | float(0) }}
            {% else %}{{ this.attributes.enerhiia_start if this is defined else 0 }}{% endif %}
          tryvaie: "{{ trigger.id == 'start' }}"
          tryvalist_s: >-
            {% if trigger.id == 'stop' and this is defined and this.attributes.pochatok %}
              {{ (now().timestamp() - (this.attributes.pochatok | as_timestamp(0))) | round(0) | int }}
            {% else %}{{ this.attributes.tryvalist_s if this is defined and this.attributes.tryvalist_s is defined else 0 }}{% endif %}
          enerhiia_kvtg: >-
            {% if trigger.id == 'stop' and this is defined %}
              {{ [(states('sensor.t34_smart_plug_nasos_sverdlovini_spozhito') | float(0)) - (this.attributes.enerhiia_start | float(0)), 0] | max | round(4) }}
            {% else %}{{ this.attributes.enerhiia_kvtg if this is defined and this.attributes.enerhiia_kvtg is defined else 0 }}{% endif %}
          voda_l: >-
            {% if trigger.id == 'stop' and this is defined %}
              {{ (([(states('sensor.t34_smart_plug_nasos_sverdlovini_spozhito') | float(0)) - (this.attributes.enerhiia_start | float(0)), 0] | max) * (states('input_number.sverdlovina_koefitsiient_vodi') | float(0.802)) * 1000) | round(0) | int }}
            {% else %}{{ this.attributes.voda_l if this is defined and this.attributes.voda_l is defined else 0 }}{% endif %}
          voda_txt: >-
            {% if trigger.id == 'start' %}качає…{% else %}{{ ((([(states('sensor.t34_smart_plug_nasos_sverdlovini_spozhito') | float(0)) - (this.attributes.enerhiia_start | float(0)), 0] | max) * (states('input_number.sverdlovina_koefitsiient_vodi') | float(0.802)) * 1000) | round(0) | int) if this is defined else 0 }} л{% endif %}
          tryvalist_txt: >-
            {% if trigger.id == 'start' %}триває
            {% elif this is defined and this.attributes.pochatok %}{{ (now().timestamp() - (this.attributes.pochatok | as_timestamp(0))) | round(0) | int }} с
            {% else %}0 с{% endif %}

  # --- Канали зв'язку: локально / хмара / інвертор (додано 02.09.2026) ---
  #
  # Відповідь на «не зрозуміло, який пристрій хмарний, а який локальний, і що
  # злетіло». Три бінарні сенсори стоять бейджами вгорі «Огляду» і «Пристроїв»
  # і живлять агрегат проблем у hero; повна таблиця каналів - на вкладці
  # «Пристрої → Зв'язок». Стан - не частка доступних сутностей (половина
  # хмарних Tuya мертва давно і законно), а живі опорні сутності каналу.
  - binary_sensor:
      - name: LocalTuya
        unique_id: link_localtuya
        device_class: connectivity
        icon: mdi:lan-connect
        state: >-
          {% set bad = ['unavailable', 'unknown'] %}
          {{ states('switch.avtopoliv_kontroler_avtopoliv_klapan_1') not in bad
             and states('switch.mini_switch_k601_2_switch_1_2') not in bad
             and states('sensor.energy_meter_phase_a_power_2') not in bad }}
        attributes:
          # Локальні пристрої, яких зараз не видно. Насос свердловини і розетки
          # сюди входять, бо їх хочеться бачити в hero; телевізор - ні, він
          # вимкнений більшу частину доби і це норма.
          poza_zviazkom: >-
            {% set bad = ['unavailable', 'unknown'] %}
            {% set d = [
              ['контролер поливу', 'switch.avtopoliv_kontroler_avtopoliv_klapan_1'],
              ['насос поливу', 'switch.mini_switch_k601_2_switch_1_2'],
              ['лічильник вводу', 'sensor.energy_meter_phase_a_power_2'],
              ['зарядка авто', 'sensor.zariadka_7_5kvt_device_kw'],
              ['насос свердловини', 'switch.t34_smart_plug_switch_1_2'],
              ['бойлер бабусі', 'switch.boiler_babusi_socket'],
              ['мала пралка', 'switch.mala_pralna_mashina_socket'],
              ['сушарка', 'switch.sushka_socket']] %}
            {% set ns = namespace(l=[]) %}
            {% for n, e in d if states(e) in bad %}{% set ns.l = ns.l + [n] %}{% endfor %}
            {{ ns.l | join(', ') }}
          nedostupno: >-
            {% set bad = ['unavailable', 'unknown'] %}
            {% set ns = namespace(n=0) %}
            {% for e in integration_entities('localtuya') if states(e) in bad %}{% set ns.n = ns.n + 1 %}{% endfor %}
            {{ ns.n }}
          usoho: "{{ integration_entities('localtuya') | count }}"
      - name: Tuya khmara
        unique_id: link_tuya_cloud
        device_class: connectivity
        icon: mdi:cloud-outline
        # Два хмарні сенсори, які живі за нормальних умов: показ лічильника з
        # хмари і датчик у домі бабусі. Обидва мовчать - значить, мовчить хмара
        # (токен протух або немає інтернету), а не один датчик сів.
        state: >-
          {% set bad = ['unavailable', 'unknown'] %}
          {{ states('sensor.energy_meter_total_energy') not in bad
             or states('sensor.2i_poverkh_t_h_temperature') not in bad }}
        attributes:
          nedostupno: >-
            {% set bad = ['unavailable', 'unknown'] %}
            {% set ns = namespace(n=0) %}
            {% for e in integration_entities('tuya') if states(e) in bad %}{% set ns.n = ns.n + 1 %}{% endfor %}
            {{ ns.n }}
          usoho: "{{ integration_entities('tuya') | count }}"
      - name: Invertor zviazok
        unique_id: link_inverter
        device_class: connectivity
        icon: mdi:solar-power-variant
        # Батарея - перший сенсор, який зникає разом із логером. Поки він
        # unavailable, сповіщення про світло і пороги батареї не працюють.
        state: "{{ has_value('sensor.inverter_battery') }}"
  # --- Чи є світло в мережі ---
  # Питаємо інвертор, а не лічильник: лічильник живиться від тієї самої
  # мережі і при відключенні просто стає unavailable, а unavailable буває і
  # від пропалого Wi-Fi. Інвертор бачить саму мережу і переживає її зникнення.
  #
  # Частота підстраховує binary_sensor: якщо той на мить стане unknown,
  # нулі на всіх трьох фазах однаково скажуть правду.
  #
  # Півхвилини затримки в обидва боки - щоб коротке блимання не розсилало
  # людям пару повідомлень підряд.
  #
  # Другий свідок - лічильник вводу (додано 02.09.2026 на прохання власника).
  # Того дня логер Deye мовчав з 10:22 до 19:06, і сенсор показував «світло є»
  # лише тому, що не мав даних. Лічильник .219 живиться від мережі і опитується
  # локально: якщо він віддає напругу на будь-якій фазі - світло є, хоч би що
  # там з інвертором. Якщо мовчать обидва - стан невідомий, і сенсор лишається
  # off, а hero «Блекауту» каже про це прямо. Хто саме свідчить зараз, видно в
  # sensor.merezha_dzherelo нижче.
  - binary_sensor:
      - name: Svitlo vidsutnie
        unique_id: svitlo_vidsutnie
        device_class: problem
        icon: mdi:transmission-tower-off
        delay_on: "00:00:30"
        delay_off: "00:00:30"
        state: >-
          {% if has_value('binary_sensor.inverter_grid') %}
            {{ is_state('binary_sensor.inverter_grid', 'off')
               and (states('sensor.inverter_grid_frequency') | float(50)) < 45 }}
          {% elif is_state('binary_sensor.lichylnyk_zviazok', 'on') %}
            {{ (states('sensor.merezha_napruha_za_lichylnykom') | float(0)) < 100 }}
          {% else %}
            false
          {% endif %}
      # Чи відповідає лічильник вводу локально (LocalTuya, .219). Саме цей
      # прапорець робить лічильник другим свідком: без нього напруга «0» і
      # напруга «невідомо» виглядали б однаково.
      - name: Lichylnyk zviazok
        unique_id: meter_local_link
        device_class: connectivity
        icon: mdi:meter-electric-outline
        state: >-
          {{ has_value('sensor.energy_meter_phase_a_voltage_2')
             or has_value('sensor.energy_meter_phase_b_voltage_2')
             or has_value('sensor.energy_meter_phase_c_voltage_2') }}
  - sensor:
      # Найвища з трьох фаз: для питання «чи є світло» досить однієї живої фази.
      - name: Merezha napruha za lichylnykom
        unique_id: grid_voltage_by_meter
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:sine-wave
        state: >-
          {{ [states('sensor.energy_meter_phase_a_voltage_2') | float(0),
              states('sensor.energy_meter_phase_b_voltage_2') | float(0),
              states('sensor.energy_meter_phase_c_voltage_2') | float(0)] | max | round(0) }}
        availability: "{{ is_state('binary_sensor.lichylnyk_zviazok', 'on') }}"
      # Хто зараз свідчить про мережу: інвертор (головний), лічильник (запасний)
      # або ніхто. Плитка на «Блекауті» і умова в hero.
      - name: Merezha dzherelo
        unique_id: grid_truth_source
        icon: mdi:source-branch
        state: >-
          {% if has_value('binary_sensor.inverter_grid') %}інвертор{% elif is_state('binary_sensor.lichylnyk_zviazok', 'on') %}лічильник{% else %}невідомо{% endif %}
  # Те саме навантаження, що й sensor.inverter_load_power, тільки в кіловатах:
  # поріг у налаштуваннях теж у кіловатах, а numeric_state порівнює числа як є,
  # без перерахунку одиниць.
  - sensor:
      - name: Spozhyvannia zaraz kvt
        unique_id: spozhyvannia_zaraz_kvt
        unit_of_measurement: кВт
        device_class: power
        state_class: measurement
        state: >-
          {{ (states('sensor.inverter_load_power') | float(0) / 1000) | round(2) }}
  # --- Температура для смуги на телевізорі ---
  # Погодна сутність віддає 22.7, а на екрані потрібне ціле: десяті на такій
  # відстані не читаються і лише подовжують рядок. state-label округляти не
  # вміє, тому округлення живе тут.
  - sensor:
      - name: Pogoda temp korotko
        unique_id: pogoda_temp_korotko
        state: >-
          {% set t = state_attr('weather.forecast_golovna', 'temperature') %}
          {{ t | round(0) | int if t is not none else '—' }}
  # --- Кадр заставки як сутність-картинка ---
  # picture-elements показує саме сутність: щойно tv-photo-nav.py підготує
  # новий файл, URL зміниться і телевізор перемалює кадр сам. Поле image у
  # картці так не вміє - шлях там фіксований і живе до перезавантаження
  # сторінки.
  - image:
      name: TV kadr foto
      unique_id: tv_kadr_foto
      url: "http://127.0.0.1:8123{{ states('sensor.tv_kadr') }}"
  # --- Годинник для смуги на телевізорі ---
  # Саме trigger-сенсор, а не звичайний шаблон: звичайний перераховується лише
  # тоді, коли зміниться щось усередині нього, а now() зміною не вважається -
  # час на екрані просто стояв би.
  - trigger:
      - platform: time_pattern
        minutes: "*"
    sensor:
      - name: Chas zaraz
        unique_id: chas_zaraz
        state: "{{ now().strftime('%H:%M') }}"
  # --- «Інше»: скільки коштує все, на чому немає власного лічильника ---
  #
  # Різниця між усім, що куплено з мережі, і сумою п'яти пристроїв із власними
  # лічильниками. Це світло, розетки, побутова техніка, насоси опалення, сама
  # плата - усе, що ніхто окремо не міряє. Без цього рядка графік по пристроях
  # створює хибне враження, ніби вони вичерпують увесь рахунок.
  #
  # ВАЖЛИВО про монотонність. Ця величина - різниця, і сама по собі вона НЕ
  # монотонна: уночі полив нараховує гривні за нічним тарифом швидше, ніж росте
  # загальний рахунок, і різниця просідає на копійки. Для state_class total
  # кожне таке просідання recorder записує як від'ємну зміну, і на графіку
  # витрат по пристроях з'являється стовпчик униз.
  #
  # 2026-08-08 о 14:00 це вилилось у справжню аварію даних: під час перезапуску
  # sensor.vitrati_na_merezhu_razom на мить віддав нуль, різниця впала з 491 грн
  # майже до нуля, і накопичувальна сума відв'язалась від стану рівно на
  # 491.66 грн. На графіку 8 серпня лишився стовпчик -430 грн.
  #
  # Тодішній захист - max() із власним попереднім станом - тримає значення лише
  # доти, доки HA працює. Звичайний template-сенсор рахується наново при
  # кожному старті, this.state на той момент невідомий, і накопичений «підпір»
  # губиться. Саме це сталося після перезавантаження плати 2026-08-10 о 16:55:
  # -55.89 грн за 10 серпня.
  #
  # Тому сенсор тригерний: такий тип відновлює свій стан після перезапуску, і
  # max() працює наскрізь. Другий бік захисту - condition замість availability.
  # availability робив сенсор недоступним, а після повернення this.state читався
  # як 'unavailable' → 0, тобто дірка лишалась відкритою. Умова на тригері
  # просто не пускає поганий розрахунок усередину, і сенсор зберігає останнє
  # достовірне значення.
  #
  # Побічний ефект, про який треба знати: якщо джерела надовго відваляться,
  # сенсор не покаже 'unavailable', а завмре на останньому числі. Для
  # накопичувальної суми в гривнях це менше зло, ніж від'ємний стрибок.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.vitrati_na_merezhu_razom
          - sensor.vitrati_boiler
          - sensor.vitrati_zariadka_avto
          - sensor.vitrati_tepla_pidloga_1
          - sensor.vitrati_tepla_pidloga_2
          - sensor.vitrati_nasos_polivu
      # Страховка на випадок, якщо жодне джерело довго не змінюється, і
      # перерахунок одразу після старту - стан на той момент уже відновлений.
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >
          {{ has_value('sensor.vitrati_na_merezhu_razom')
             and (states('sensor.vitrati_na_merezhu_razom') | float(0)) > 0
             and has_value('sensor.vitrati_boiler')
             and has_value('sensor.vitrati_zariadka_avto')
             and has_value('sensor.vitrati_tepla_pidloga_1')
             and has_value('sensor.vitrati_tepla_pidloga_2')
             and has_value('sensor.vitrati_nasos_polivu') }}
    sensor:
      - name: "Витрати - інше без лічильника"
        unique_id: cost_device_other
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {% set calc = (states('sensor.vitrati_na_merezhu_razom') | float(0))
            - (states('sensor.vitrati_boiler') | float(0))
            - (states('sensor.vitrati_zariadka_avto') | float(0))
            - (states('sensor.vitrati_tepla_pidloga_1') | float(0))
            - (states('sensor.vitrati_tepla_pidloga_2') | float(0))
            - (states('sensor.vitrati_nasos_polivu') | float(0)) %}
          {% set prev = this.state | float(0) %}
          {{ [calc, prev, 0] | max | round(2) }}

  - sensor:
      # --- План поливу в хвилинах (додано 2026-08-11) ---
      #
      # sensor.smart_irrigation_zonaN має device_class: duration і одиницю "s",
      # тому плитка на дашборді показувала "2 949 s". Поряд, у текстовому
      # поясненні, те саме число вже було у хвилинах - два формати одного
      # значення на одній картці. Ці три сенсори дають хвилини одразу.
      #
      # Значення оновлюється лише на перерахунку Smart Irrigation (щодня о
      # 19:55 або кнопкою), тому вдень воно показує план, складений напередодні
      # ввечері. Після ранкового поливу він уже неактуальний - саме тому
      # текстовий підпис на картці зони показує його тільки тоді, коли полив ще
      # попереду.
      # Назва латиницею навмисно: entity_id збирається зі слага назви, і для
      # кирилиці його довелося б угадувати. Підпис на дашборді задає сама
      # картка ("Полив на ранок"), тому назва сенсора видно не буде.
      - name: "Poliv zona 1 plan hvylyn"
        unique_id: poliv_zona_1_plan_hvylyn
        unit_of_measurement: "хв"
        icon: mdi:timer-sand
        state: >
          {{ ((states('sensor.smart_irrigation_zona1') | float(0)) / 60) | round(0) }}
        availability: >
          {{ has_value('sensor.smart_irrigation_zona1') }}
      # Назва латиницею навмисно: entity_id збирається зі слага назви, і для
      # кирилиці його довелося б угадувати. Підпис на дашборді задає сама
      # картка ("Полив на ранок"), тому назва сенсора видно не буде.
      - name: "Poliv zona 2 plan hvylyn"
        unique_id: poliv_zona_2_plan_hvylyn
        unit_of_measurement: "хв"
        icon: mdi:timer-sand
        state: >
          {{ ((states('sensor.smart_irrigation_zona2') | float(0)) / 60) | round(0) }}
        availability: >
          {{ has_value('sensor.smart_irrigation_zona2') }}
      # Назва латиницею навмисно: entity_id збирається зі слага назви, і для
      # кирилиці його довелося б угадувати. Підпис на дашборді задає сама
      # картка ("Полив на ранок"), тому назва сенсора видно не буде.
      - name: "Poliv zona 5 plan hvylyn"
        unique_id: poliv_zona_5_plan_hvylyn
        unit_of_measurement: "хв"
        icon: mdi:timer-sand
        state: >
          {{ ((states('sensor.smart_irrigation_zona5') | float(0)) / 60) | round(0) }}
        availability: >
          {{ has_value('sensor.smart_irrigation_zona5') }}

      # --- Температура води в бойлері (додано 2026-08-22) ---
      #
      # Стан water_heater - це режим роботи, рядок, а не число. Картка
      # «Температура за 24 години» на вкладці «Бойлер» будувалась просто на
      # цій сутності й тому малювала стрічку «увімкнено/вимкнено»: температури,
      # яку обіцяв заголовок, там не було ніколи. history-graph не вміє малювати
      # атрибути, тому потрібен окремий числовий сенсор.
      - name: "Boiler temperatura vody"
        unique_id: boiler_water_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:water-thermometer
        state: >
          {{ state_attr('water_heater.144036023323246_water_heater', 'current_temperature') }}
        availability: >
          {{ state_attr('water_heater.144036023323246_water_heater', 'current_temperature')
             is not none }}

      # --- Показ мережі: локально, з якорем як мостом (переписано 23.08.2026) ---
      #
      # Спершу цей сенсор брав ЯКІР ІЗ ХМАРИ, бо вважалося, що накопичувального
      # регістру в локальному каналі немає. Це виявилося неправдою: DP 1
      # (`total_forward_energy`, scale 2) віддається локально й збігається з
      # хмарним показом до сотої. Тобто конструкція обходила обмеження, якого
      # не існує - див. розділ 1 специфікації.
      #
      # Тепер джерело локальне, а якір лишився мостом на ті три хвилини після
      # рестарту, поки LocalTuya піднімає зʼєднання. Хмара більше не потрібна
      # для обліку взагалі: коли підписка Tuya спливе, тут не зміниться нічого.
      #
      # max(0, ...) на дельті - не косметика: інтеграл після рестарту HA
      # починається з нуля, і без цього захисту різниця стала б великою
      # відʼємною, а total_increasing прочитав би це як скидання лічильника і
      # нарахував фантомне споживання на весь показ.
      - name: "Merezha spozhyto"
        unique_id: grid_total_anchored
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-import
        state: >
          {% set lok = states('sensor.energy_meter_local_total_energy_local') | float(0) / 100 %}
          {% if lok > 0 %}
            {{ lok | round(3) }}
          {% else %}
            {% set yakir = states('input_number.merezha_yakir_pokaz') | float(0) %}
            {% set base = states('input_number.merezha_yakir_integral') | float(0) %}
            {% set now_int = states('sensor.merezha_lokalnyi_integral') | float(0) %}
            {{ (yakir + [0, now_int - base] | max) | round(3) }}
          {% endif %}
        availability: >
          {{ (states('sensor.energy_meter_local_total_energy_local') | float(0)) > 0
             or ((states('input_number.merezha_yakir_pokaz') | float(0)) > 0
                 and has_value('sensor.merezha_lokalnyi_integral')) }}
        attributes:
          dzherelo: >
            {% set lok = states('sensor.energy_meter_local_total_energy_local') | float(0) %}
            {{ 'локальний DP 1' if lok > 0 else 'якір плюс інтеграл' }}
          rozbizhnist_z_hmaroiu: >
            {% set lok = states('sensor.energy_meter_local_total_energy_local') | float(0) / 100 %}
            {% set hmara = states('sensor.energy_meter_total_energy') | float(0) %}
            {{ (lok - hmara) | round(3) if lok > 0 and hmara > 0 else 'немає з чим звіряти' }}

      # --- Тривоги лічильника (додано 2026-08-23) ---
      #
      # DP 9 лічильника - бітова маска на двадцять тривог. Вона приходить
      # ЛОКАЛЬНО, без хмари: у localtuya її просто не було заведено сутністю,
      # тому в Home Assistant її не бачили зовсім.
      #
      # Сенсор віддає готовий людський перелік, а не число: "перевантаження,
      # перекіс напруг" однаково читається і з картки, і з push, а 1028 не
      # читається ніде. Сире значення лишається в атрибуті kod.
      #
      # Порядок міток - з опису продукту в кабінеті Tuya, біт 0 перший.
      - name: "Lichylnyk tryvohy"
        unique_id: meter_fault_decoded
        icon: mdi:alert-octagon-outline
        state: >
          {% set kod = states('sensor.energy_meter_fault') | int(-1) %}
          {% set mitky = [
            'коротке замикання', 'імпульсне перенапруження', 'перевантаження',
            'струм витоку', 'перегрів', 'пожежна тривога',
            'перевищення потужності', 'самотестування', 'перевищення струму',
            'перекіс струмів', 'перенапруга', 'знижена напруга',
            'втрата фази', 'зникнення живлення', 'магнітний вплив',
            'залишок коштів', 'нульовий баланс', 'порушення чергування фаз',
            'перекіс напруг', 'занизький струм'] %}
          {% if kod < 0 %}
            невідомо
          {% elif kod == 0 %}
            немає
          {% else %}
            {% set ns = namespace(perelik=[]) %}
            {% for i in range(20) %}
              {% if kod | bitwise_and(2 ** i) %}
                {% set ns.perelik = ns.perelik + [mitky[i]] %}
              {% endif %}
            {% endfor %}
            {{ ns.perelik | join(', ') if ns.perelik else 'код ' ~ kod }}
          {% endif %}
        availability: "{{ has_value('sensor.energy_meter_fault') }}"
        attributes:
          kod: "{{ states('sensor.energy_meter_fault') }}"

      # --- Вартість у гривнях (додано 2026-08-08) ---
      #
      # Кожен лічильник utility_meter уже розведений на денну і нічну гілку,
      # тому множення на ставку точне, а не усереднене: денні кВт-год множаться
      # на денну ставку, нічні - на нічну. Ставки беруться з тих самих
      # input_number, що й sensor.tarif_elektroenergii_zaraz, тому правка ставки
      # на вкладці "Тариф" одразу перераховує всі ці сенсори.
      #
      # state_class: total дає довгострокову статистику, тому картка
      # statistics-graph зі stat_type "change" сама покаже витрати за день або
      # за місяць у розрізі обраного періоду.
      - name: "Витрати вдень сьогодні"
        unique_id: cost_day_today
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_dobovyi_den') | float(0))
            * (states('input_number.tarif_den_07_00_22_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_dobovyi_den') }}

      - name: "Витрати вночі сьогодні"
        unique_id: cost_night_today
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_dobovyi_nich') | float(0))
            * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_dobovyi_nich') }}

      - name: "Витрати вдень цього місяця"
        unique_id: cost_day_month
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_misiachnyi_den') | float(0))
            * (states('input_number.tarif_den_07_00_22_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_misiachnyi_den') }}

      - name: "Витрати вночі цього місяця"
        unique_id: cost_night_month
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_misiachnyi_nich') | float(0))
            * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_misiachnyi_nich') }}

      # Наростаючі гілки день/ніч окремо - потрібні саме для графіка:
      # statistics-graph зі stat_type "change" будує з них стовпчики за день
      # або за місяць і показує співвідношення дорогого й дешевого тарифу.
      - name: "Витрати вдень разом"
        unique_id: cost_day_total
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_za_tarifom_den') | float(0))
            * (states('input_number.tarif_den_07_00_22_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_za_tarifom_den') }}

      - name: "Витрати вночі разом"
        unique_id: cost_night_total
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_za_tarifom_nich') | float(0))
            * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_za_tarifom_nich') }}

      - name: "Витрати на мережу разом"
        unique_id: cost_grid_total
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.merezha_za_tarifom_den') | float(0))
              * (states('input_number.tarif_den_07_00_22_59') | float(0))
            + (states('sensor.merezha_za_tarifom_nich') | float(0))
              * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.merezha_za_tarifom_den')
             and has_value('sensor.merezha_za_tarifom_nich') }}

      - name: "Витрати - бойлер"
        unique_id: cost_device_boiler
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.boiler_za_tarifom_den') | float(0))
              * (states('input_number.tarif_den_07_00_22_59') | float(0))
            + (states('sensor.boiler_za_tarifom_nich') | float(0))
              * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.boiler_za_tarifom_den')
             and has_value('sensor.boiler_za_tarifom_nich') }}

      - name: "Витрати - зарядка авто"
        unique_id: cost_device_ev
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.zariadka_za_tarifom_den') | float(0))
              * (states('input_number.tarif_den_07_00_22_59') | float(0))
            + (states('sensor.zariadka_za_tarifom_nich') | float(0))
              * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.zariadka_za_tarifom_den')
             and has_value('sensor.zariadka_za_tarifom_nich') }}

      - name: "Витрати - тепла підлога 1"
        unique_id: cost_device_floor1
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.pidloha_1_za_tarifom_den') | float(0))
              * (states('input_number.tarif_den_07_00_22_59') | float(0))
            + (states('sensor.pidloha_1_za_tarifom_nich') | float(0))
              * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.pidloha_1_za_tarifom_den')
             and has_value('sensor.pidloha_1_za_tarifom_nich') }}

      - name: "Витрати - тепла підлога 2"
        unique_id: cost_device_floor2
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.pidloha_2_za_tarifom_den') | float(0))
              * (states('input_number.tarif_den_07_00_22_59') | float(0))
            + (states('sensor.pidloha_2_za_tarifom_nich') | float(0))
              * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.pidloha_2_za_tarifom_den')
             and has_value('sensor.pidloha_2_za_tarifom_nich') }}

      - name: "Витрати - насос поливу"
        unique_id: cost_device_pump
        unit_of_measurement: "UAH"
        device_class: monetary
        state_class: total
        state: >
          {{ ((states('sensor.nasos_za_tarifom_den') | float(0))
              * (states('input_number.tarif_den_07_00_22_59') | float(0))
            + (states('sensor.nasos_za_tarifom_nich') | float(0))
              * (states('input_number.tarif_nich_23_00_06_59') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.nasos_za_tarifom_den')
             and has_value('sensor.nasos_za_tarifom_nich') }}

      # «Витрати - інше без лічильника» жив тут до 2026-08-11. Тепер це
      # тригерний сенсор на початку секції template: лише такий переживає
      # перезапуск зі збереженим станом. Причина переїзду описана там.

      - name: "Загальне навантаження"
        unique_id: total_load_power
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.energy_meter_phase_a_power_2') | float(0)
            + states('sensor.energy_meter_phase_b_power_2') | float(0)
            + states('sensor.energy_meter_phase_c_power_2') | float(0)) | round(3) }}
        availability: >
          {{ states('sensor.energy_meter_phase_a_power_2') not in ['unknown', 'unavailable']
             and states('sensor.energy_meter_phase_b_power_2') not in ['unknown', 'unavailable']
             and states('sensor.energy_meter_phase_c_power_2') not in ['unknown', 'unavailable'] }}

      # Фізична топологія вводу:
      #   мережа (трифазний лічильник) -> інвертор Deye + споживачі поза Deye.
      # Deye бачить тільки власну гілку, тому його sensor.inverter_grid_power не
      # можна показувати як повне споживання з мережі. Обидва сенсори нижче у W,
      # щоб картка потоку могла без додаткових перетворень показати розгалуження.
      - name: "Мережа - потужність усього вводу"
        unique_id: grid_total_input_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ ((states('sensor.zagalne_navantazhennia') | float(0)) * 1000) | round(0) }}
        availability: >
          {{ has_value('sensor.zagalne_navantazhennia') }}

      - name: "Споживання поза інвертором"
        unique_id: power_outside_inverter
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set total = (states('sensor.zagalne_navantazhennia') | float(0)) * 1000 %}
          {% set inverter_branch = states('sensor.inverter_grid_power') | float(0) %}
          {{ [total - inverter_branch, 0] | max | round(0) }}
        availability: >
          {{ has_value('sensor.zagalne_navantazhennia')
             and has_value('sensor.inverter_grid_power') }}

      - name: "Загальний струм"
        unique_id: total_load_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        state: >
          {{ (states('sensor.energy_meter_phase_a_current_2') | float(0)
            + states('sensor.energy_meter_phase_b_current_2') | float(0)
            + states('sensor.energy_meter_phase_c_current_2') | float(0)) | round(2) }}
        availability: >
          {{ states('sensor.energy_meter_phase_a_current_2') not in ['unknown', 'unavailable']
             and states('sensor.energy_meter_phase_b_current_2') not in ['unknown', 'unavailable']
             and states('sensor.energy_meter_phase_c_current_2') not in ['unknown', 'unavailable'] }}

      # --- Насос поливу (додано 2026-08-03) ---------------------------------
      # Потужність і наростаючий лічильник живуть як UI-помічники в .storage
      # (див. коментар нижче). Тут - лише те, чого там немає.
      # Насос на фазі B: встановлено по стрибку +1.1 кВт саме на цій фазі на
      # 6 незалежних вмиканнях/вимиканнях 2026-08-03; фази A і C не реагували.
      # Напруга, яку реально бачить насос: він на фазі B (встановлено тим самим
      # вимірюванням). Це показ домового лічильника, а не самого насоса.
      # Враховує всі вісім клапанів, а не лише перші три: полив зони 4 або 5
      # раніше показувався як "АВАРІЯ — НАСОС БЕЗ КЛАПАНА".
      #
      # Стану "аварія" тут більше немає взагалі. Насос без жодного відкритого
      # клапана - це полив зі шланга через водяну розетку, звичайна щоденна
      # справа, а не збій. Якщо працює насос і відкрита зона - показуємо зону,
      # якщо тільки насос - показуємо шланг.
      - name: "Полив - стан системи"
        unique_id: irrigation_system_status
        icon: >-
          {% set klapan = namespace(any=false) %}
          {% for n in range(1, 9) %}
            {% if is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_' ~ n, 'on') %}
              {% set klapan.any = true %}
            {% endif %}
          {% endfor %}
          {% if is_state('switch.mini_switch_k601_2_switch_1_2', 'on') %}
            mdi:sprinkler-variant
          {% elif klapan.any %}
            mdi:valve-open
          {% else %}
            mdi:water-off
          {% endif %}
        state: >-
          {% set pump = is_state('switch.mini_switch_k601_2_switch_1_2', 'on') %}
          {% set zone = namespace(id=0) %}
          {% for n in range(1, 9) %}
            {% if zone.id == 0
                  and is_state('switch.avtopoliv_kontroler_avtopoliv_klapan_' ~ n, 'on') %}
              {% set zone.id = n %}
            {% endif %}
          {% endfor %}
          {% if pump and zone.id %}ПОЛИВАЄ — ЗОНА {{ zone.id }}
          {% elif pump %}ПОЛИВАЄ — ШЛАНГ
          {% elif zone.id %}ПІДГОТОВКА/ЗУПИНКА — ЗОНА {{ zone.id }}
          {% else %}ЗУПИНЕНО
          {% endif %}

      - name: "Насос поливу - напруга"
        unique_id: pump_voltage_phase_b
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        state: >
          {{ states('sensor.energy_meter_phase_b_voltage_2') | float(0) | round(1) }}
        availability: >
          {{ states('sensor.energy_meter_phase_b_voltage_2')
             not in ['unknown', 'unavailable'] }}

      - name: "Насос поливу - спожито за сесію"
        unique_id: pump_energy_session
        unit_of_measurement: "kWh"
        icon: mdi:lightning-bolt
        state: >
          {% set tot = states('sensor.nasos_polivu_spozhito') | float(0) %}
          {% set base = states('input_number.nasos_energiia_start') | float(0) %}
          {{ [tot - base, 0] | max | round(3) }}

      - name: "Насос поливу - енергія сьогодні"
        unique_id: pump_energy_today
        unit_of_measurement: "kWh"
        icon: mdi:lightning-bolt
        state: >
          {% set p = states('input_number.nasos_polivu_potuzhnist') | float(1100) %}
          {{ ((states('sensor.nasos_polivu_robota_sogodni') | float(0))
              * p / 1000) | round(3) }}

# --- Recorder: keep detailed history longer for analysis (added 2026-08-02) ---
# Home Assistant дістається ззовні через Tailscale Serve, а той проксіює запит
# з 127.0.0.1. Без цих двох рядків HA вважав би локальним будь-кого, хто зайшов
# ззовні, і «тільки локальний доступ» на облікових записах не значив би нічого.
  # --- Енергія насоса за власним лічильником розетки (2026-08-22) ---
  #
  # Riemann по сенсору потужності занижує споживання насоса приблизно вп'ятеро,
  # і це не полагодити налаштуванням: розетка віддає ОДИН семпл на цикл насоса,
  # хоч через хмару, хоч локально (0.0553 проти 0.0555 кВт·год за ту саму добу).
  # Інтеграл по одній точці на дев'яностосекундний пуск — це груба оцінка.
  #
  # DP 20 (add_ele) — власний вимір самої розетки: скільки енергії пройшло з
  # моменту попереднього звіту. Прилад рахує його безперервно, тому короткі
  # пуски він не губить. Але це НЕ накопичувач: значення постійно скидається,
  # а `state_class: total_increasing` на sensor.t34_smart_plug_electricity
  # описує його неправильно. Тому суму збираємо тут, самі.
  #
  # Сенсор поки що ДОВІДКОВИЙ. Калібрування далі стоїть на Riemann, і замінити
  # джерело можна буде лише після наступного механічного показника — коли стане
  # видно, який із двох лічильників ближчий до правди. Поспішна заміна зсунула б
  # коефіцієнт іще раз, не довівши нічого.
  - trigger:
      - trigger: state
        entity_id: sensor.t34_smart_plug_electricity
    sensor:
      - name: Nasos sverdlovini enerhiia prystroiu
        unique_id: well_pump_device_energy_total
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set prev = states('sensor.nasos_sverdlovini_enerhiia_prystroiu') | float(0) %}
          {% set add = trigger.to_state.state | float(0) %}
          {{ (prev + add) | round(4) }}
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
  # Автоматичний бан після 5 невдалих спроб входу. Типове значення -1 означає
  # "не банити ніколи" - прийнятно, поки HA лише в локальній мережі, і ні,
  # щойно вона стає досяжною ззовні. Бани лягають у ip_bans.yaml, звідти ж і
  # знімаються.
  login_attempts_threshold: 5

recorder:
  # 30 days of 5-second inverter polling pushed the DB past 800 MB on a
  # 2.5 GB partition; 14 was not enough either - at ~130 MB a day it was
  # heading for 1.9 GB with 291 MB free (measured 2026-08-10). Seven days
  # stops the growth at roughly the current file size, because a purge
  # reuses freed pages rather than shrinking the file.
  # 2026-08-13: the HA venv (1.2 GB) moved off /userdata to the root
  # partition, leaving 2.0 GB free here instead of 846 MB. At the ~130 MB
  # a day measured above, seven days lands near 0.9 GB - so the three-day
  # value forced by the old cramped partition is no longer needed.
  # 2026-09-03 (власник: «збільши зберігання історії»). Виміряно на платі:
  # 3,87 млн рядків states за 7,3 доби, файл 1,24 ГБ, з них 385 МБ - вільні
  # сторінки, тобто ~110 МБ/добу справжніх даних. 42 % рядків писали
  # сутності, яких немає на жодному дашборді: дублі Deye («Load UPS» =
  # «Load», «Internal CT» = «Grid Lx», «Output Lx», «Power Losses», зовнішні
  # CT без датчиків), хмарні дублі локальних напруг/струмів, base64-«фази»
  # лічильника. Після їх виключення (другий зріз нижче) ~65 МБ/добу:
  # 21 доба ≈ 1,4 ГБ, на розділі 2,4 ГБ лишається ~0,8 ГБ. Сторож вільного
  # місця /userdata (command_line, поріг 250 МБ) - запобіжник: якщо кричить,
  # повертати 14. Довше на цій платі не вийде без іншого носія або зовнішньої
  # БД; наступний резерв - інтервал опитування Deye 5 → 10 с (ще ~−25 %).
  purge_keep_days: 21
  # Reduce SQLite/eMMC write frequency while keeping adequate history resolution.
  commit_interval: 30
  auto_purge: true
  # VACUUM другої неділі місяця потребує вільного місця на копію файлу
  # (~1,4 ГБ) - на розділі 2,4 ГБ його не буде, і на eMMC це зайве зношення.
  # Чистка без repack повторно використовує звільнені сторінки, тож файл
  # просто перестає рости, досягнувши розміру 21 доби.
  auto_repack: false
  exclude:
    domains:
      - update
      - automation
      - script
      - persistent_notification
    # Dynamic client-list attributes are useful on the live dashboard but
    # would create needless SQLite/eMMC churn when devices roam between APs.
    entities:
      # Журнал показників тримає всі рядки в атрибутах; писати цей блок у
      # SQLite при кожному опитуванні немає сенсу - файл сам собі історія.
      - sensor.zhurnal_pokaznykiv_vody
      # Журнал сповіщень так само тримає всі записи в атрибутах (40 записів
      # перевищують 16 КБ - recorder попереджав 7 разів за дві доби).
      - sensor.spovishchennia_zhurnal
      - sensor.prystroi_khytkist
      - sensor.tenda_ap_clients
      - sensor.tenda_ap_status
      - sensor.tenda_ap_security
      - sensor.tenda_repeater_status
      - sensor.tenda_repeater_clients
      # STOP-RECORDER-BLOAT (2026-08-08): the Deye reports 203 entities every
      # 5 s. These per-phase voltages and currents are referenced by no
      # dashboard, template or automation - they were simply filling the disk.
      # The ones the Інвертор tab and Energy dashboard do use are NOT here.
      - number.inverter_battery_generator_charging_current
      - number.inverter_battery_generator_charging_start_voltage
      - number.inverter_battery_grid_charging_current
      - number.inverter_battery_grid_charging_start_voltage
      - number.inverter_battery_low_voltage
      - number.inverter_battery_max_charging_current
      - number.inverter_battery_max_discharging_current
      - number.inverter_battery_restart_voltage
      - number.inverter_battery_shutdown_voltage
      - number.inverter_grid_voltage_protection_high
      - number.inverter_grid_voltage_protection_low
      - number.inverter_program_1_voltage
      - number.inverter_program_2_voltage
      - number.inverter_program_3_voltage
      - number.inverter_program_4_voltage
      - number.inverter_program_5_voltage
      - number.inverter_program_6_voltage
      - number.inverter_smartload_off_voltage
      - number.inverter_smartload_on_voltage
      - select.inverter_grid_voltage
      - sensor.inverter_external_ct1_current
      - sensor.inverter_external_ct2_current
      - sensor.inverter_external_ct3_current
      - sensor.inverter_generator_l1_voltage
      - sensor.inverter_generator_l2_voltage
      - sensor.inverter_generator_l3_voltage
      - sensor.inverter_internal_ct1_current
      - sensor.inverter_internal_ct2_current
      - sensor.inverter_internal_ct3_current
      - sensor.inverter_load_l1_voltage
      - sensor.inverter_load_l2_voltage
      - sensor.inverter_load_l3_voltage
      - sensor.inverter_output_l1_current
      - sensor.inverter_output_l1_voltage
      - sensor.inverter_output_l2_current
      - sensor.inverter_output_l3_current
      - sensor.inverter_output_l3_voltage
      - sensor.inverter_pv1_current
      - sensor.inverter_pv1_voltage
      - sensor.inverter_pv2_current
      - sensor.inverter_pv2_voltage
      # Другий зріз (2026-09-03, у дужках рядків за 7 діб). Deye: «Load UPS»
      # дублює «Load», «Internal CT» - «Grid Lx», «Output Lx Power»,
      # «Power Losses» і зовнішні CT (датчики не підключені - шум) ніде не
      # показуються; connection/update_interval міняють атрибути кожні 5 с,
      # їх стан вкладка читає наживо, а на «Зв'язку» історію веде
      # binary_sensor.invertor_zviazok.
      - binary_sensor.inverter_connection        # 70 700
      - sensor.inverter_update_interval          # 70 700
      - sensor.inverter_load_ups_power           # 68 700
      - sensor.inverter_load_ups_l1_power        # 65 900
      - sensor.inverter_load_ups_l2_power        # 59 000
      - sensor.inverter_load_ups_l3_power        # 63 700
      - sensor.inverter_internal_power           # 66 200
      - sensor.inverter_internal_ct1_power       # 63 700
      - sensor.inverter_internal_ct2_power       # 62 400
      - sensor.inverter_internal_ct3_power       # 62 600
      - sensor.inverter_output_l1_power          # 38 900
      - sensor.inverter_output_l2_power          # 53 800
      - sensor.inverter_output_l3_power          # 61 200
      - sensor.inverter_output_frequency         # 24 700
      - sensor.inverter_power_losses             # 60 100
      - sensor.inverter_external_power           # 42 500
      - sensor.inverter_external_ct1_power       # 13 400
      - sensor.inverter_external_ct2_power       # 37 800
      - sensor.inverter_external_ct3_power       # 25 200
      - datetime.inverter_date_time              # щохвилини
      # Sonoff «Ворота. Гараж.»: напруга двох каналів - 214 000 рядків,
      # найбільший записувач будинку; потужність і енергія лишаються.
      - sensor.sonoff_1001338bf7_voltage_1
      - sensor.sonoff_1001338bf7_voltage_2
      # Хмарні дублі локальних (_2) сутностей лічильника вводу .219 і
      # розеток: дашборди й автоматизації читають локальні; «phase_a/b/c»
      # без суфікса - base64-рядок, а не число.
      - sensor.energy_meter_phase_a
      - sensor.energy_meter_phase_b
      - sensor.energy_meter_phase_c
      - sensor.energy_meter_phase_a_current
      - sensor.energy_meter_phase_b_current
      - sensor.energy_meter_phase_c_current
      - sensor.energy_meter_phase_a_power
      - sensor.energy_meter_phase_b_power
      - sensor.energy_meter_phase_c_power
      - sensor.energy_meter_phase_a_voltage
      - sensor.energy_meter_phase_b_voltage
      - sensor.energy_meter_phase_c_voltage
      - sensor.energy_meter_power_factor_a
      - sensor.energy_meter_power_factor_b
      - sensor.energy_meter_power_factor_c
      - sensor.t34_smart_plug_voltage
      - sensor.t34_smart_plug_current
      - sensor.smart_plug_6_voltage
      - sensor.sushka_voltage_cloud
      - sensor.zariadka_7_5kvt_current_a

# --- Separate YAML dashboard with instantaneous power graphs ---
lovelace:
  # Блок resources: тут стояв і не робив нічого: у режимі storage Home Assistant
  # ігнорує YAML-ресурси повністю, а справжній список живе в .storage і
  # редагується через Налаштування → Дашборди → Ресурси. Шкода була не нульова:
  # він перелічував mushroom і card-mod так, ніби вони підключені, і перша ж
  # спроба редизайну з mushroom-картками дала 20 «Помилок конфігурації».
  # Фактичний перелік ресурсів описаний у docs/dashboard-layout.md.
  mode: storage
  dashboards:
    # url_path свідомо лишається power-dashboard: перейменування зламало б усі
    # наявні посилання, зокрема кнопку «Витрати» на головній сторінці «Огляд».
    power-dashboard:
      mode: yaml
      title: Енергія
      icon: mdi:home-lightning-bolt
      show_in_sidebar: true
      filename: power_dashboard.yaml
    pristroi-dashboard:
      mode: yaml
      title: Пристрої
      icon: mdi:devices
      show_in_sidebar: true
      filename: devices_dashboard.yaml
    ohliad-dashboard:
      mode: yaml
      title: Огляд
      icon: mdi:home-variant
      show_in_sidebar: true
      filename: overview_dashboard.yaml
    # Дашборд для телевізора. У бічному меню не потрібен: його ніхто не
    # відкриває руками, він існує тільки для Home Assistant Cast.
    tv-dashboard:
      mode: yaml
      title: Заставка ТВ
      icon: mdi:television-play
      show_in_sidebar: false
      filename: tv_dashboard.yaml

sensor:
  # Локальний інтеграл усього вводу: сума трьох фаз, проінтегрована в часі.
  # Це НЕ показ лічильника, а міст між хмарними оновленнями - див. якорі в
  # input_number вище і docs/energy-accounting-spec.md.
  #
  # max_sub_interval обовʼязковий: без нього інтеграл не рухається, поки не
  # зміниться джерело, а фазна потужність уночі може стояти хвилинами.
  - platform: integration
    source: sensor.zagalne_navantazhennia
    name: Merezha lokalnyi integral
    unique_id: grid_local_integral
    unit_time: h
    method: left
    round: 3
    max_sub_interval: "00:01:00"
  - platform: integration
    source: sensor.zariadka_7_5kvt_device_kw
    name: Зарядка авто - спожито
    unique_id: ev_charger_energy_total
    unit_time: h
    method: left
    round: 3
    max_sub_interval: "00:01:00"
  - platform: history_stats
    name: "Насос поливу - робота сьогодні"
    entity_id: switch.mini_switch_k601_2_switch_1_2
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  # --- Насос свердловини: тривалість роботи за добу (2026-08-22) ---
  # Потрібне для щоденної звірки: механічний показник ділиться на цей час і дає
  # подачу в літрах за хвилину, яку можна порівняти з паспортом насоса - без
  # жодної енергії в рівнянні. Це друга, незалежна перевірка коефіцієнта.
  #
  # ЧЕСНО ПРО ТОЧНІСТЬ. Сенсор рахує час, поки input_boolean тримається 'on', а
  # той перемикається за сенсором потужності. Розетка звітує рідко, тому межі
  # пуску відомі приблизно, і добова сума занижена рівно настільки ж, як енергія.
  # Секундної точності тут немає й не буде без окремого вимірювача; цифра
  # корисна для порівняння днів між собою, а не як абсолютна величина.
  # --- Блекаут: скільки сьогодні не було світла і скільки разів (03.09.2026) ---
  # Для сторінки «Блекаут»: відповідь на «як довго дім був без світла» одним
  # числом, а не читанням графіка. Обидва - з template binary_sensor
  # svitlo_vidsutnie, тобто з інвертора (або лічильника як другого свідка).
  - platform: history_stats
    name: "Bez svitla sohodni hodyn"
    unique_id: outage_today_hours
    entity_id: binary_sensor.svitlo_vidsutnie
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Vidkliuchen sohodni"
    unique_id: outage_today_count
    entity_id: binary_sensor.svitlo_vidsutnie
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Насос свердловини - робота сьогодні"
    unique_id: well_pump_runtime_today
    entity_id: input_boolean.nasos_sverdlovini_pratsiuie
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Зона 1 - полив сьогодні"
    entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_1
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Зона 2 - полив сьогодні"
    entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_2
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Зона 3 - полив сьогодні"
    entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_3
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  # Додано 2026-08-11: зони 5 тут не було, тому графік "Робота сьогодні" мовчав
  # про зону, яка поливається за розкладом, зате показував зону 3, яка зараз не
  # використовується взагалі.
  - platform: history_stats
    name: "Зона 5 - полив сьогодні"
    entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_5
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

# The AsusWRT library emits the same deprecation warning every 30 seconds.
# Keep real errors visible without filling the local journal with duplicates.
# ЗАСТОСОВАНО І ПРИБРАНО 2026-08-11: одноразовий компонент homemate_fixup
# виправив прив'язку зон Smart Irrigation (інцидент 0cfd77b0). Журнал показав,
# що зонам 1 і 2 були прив'язані застарілі хмарні дублі
# switch.avtopoliv_kontroler_switch_1 і _2, які постійно unavailable і подій не
# дають, - через це полив цих зон не зараховувався з 8 серпня. Замінено на
# фізичні клапани switch.avtopoliv_kontroler_avtopoliv_klapan_1 і _2.
# Зона 5 вже була прив'язана правильно, її не чіпали.

logger:
  logs:
    aioasuswrt.asuswrt: error
    # Знято 2026-08-22. Рядок стояв «тимчасово» з 5 серпня, поки не вдасться
    # ре-автентифікація Tuya - вона так і не відбулась, а debug тим часом писав
    # близько трьох рядків на секунду («Received update for device …» на кожен
    # MQTT-пакет хмари) і роздув home-assistant.log до 29 МБ. Це постійні записи
    # на eMMC і зайва робота на платі з 1.93 ГБ RAM. Коли до ре-автентифікації
    # дійдуть руки, рівень можна підняти на час самої спроби:
    #   homeassistant.components.tuya: debug
    # ЗНИЖЕНО 2026-08-09 після аварії: на рівні debug ця бібліотека пише КОЖЕН
    # MQTT-пакет хмари Tuya (кілька разів на секунду). За чотири доби лог виріс
    # до 74 МБ і разом із базою recorder заповнив розділ /userdata на 100%.
    # Home Assistant після цього не міг навіть створити файл блокування і падав
    # у циклі рестартів з OSError: [Errno 28] No space left on device.
    # Діагностика QR-логіну лишається на homeassistant.components.tuya вище -
    # вона на порядки менш балакуча.
    tuya_sharing: warning
    # УВІМКНЕНО 2026-08-10 для інциденту 0cfd77b0. У журналі не було жодного
    # рядка рівня info, тому про роботу observed watering можна було лише
    # здогадуватися за результатом - bucket, який не поповнився. На рівні info
    # модуль пише два потрібні рядки: скільки клапанів він узагалі відстежує
    # ("tracking N linked valve(s)" при старті) і скільки міліметрів зарахував
    # кожній зоні після закриття клапана. Компонент рахує раз на добу о 19:55
    # плюс події клапанів, тому балакучості, як у tuya_sharing, тут немає.
    # Вимкнути, коли зарахування зонам 1 і 2 буде налагоджене. Рівень info тут
    # лишається навмисно: саме він показує рядок зарахування "zone N -> +X mm",
    # за яким автоматизація POLIV-БАЛАНС звіряється зі штатним модулем.
    # Рівень debug знято 2026-08-11: він був потрібен, щоб довести, що подія
    # відкриття клапана до зон 1 і 2 не доходить. Це доведено, більше не треба.
    custom_components.smart_irrigation: info

# --- Per-device energy accounting (added 2026-08-03) ---
#
# УВАГА: два сенсори бойлера створені як UI-помічники (config entries у
# .storage/core.config_entries), а НЕ цим файлом - на момент створення до плати
# не було SSH, лише REST API. Тому тут вони лише задокументовані. Якщо колись
# доведеться піднімати конфіг з нуля, розкоментуй блок нижче І видали
# відповідні помічники в UI, інакше сутності задублюються.
#
# Тепла підлога власних сенсорів не потребує: термостати Terneo самі віддають
# sensor.terneo_N_heating_energy у кВт-год (час замикання реле помножений на
# power_watts=2000, прошиту в самому термостаті - це оцінка, не вимір).
#
# Бойлер Midea лічильника енергії не має. Модель потужності:
#   * heating = False                    -> 0 Вт
#   * heating = True, heating_power > 0  -> heating_power (2200 Вт, верхній тен)
#   * heating = True, heating_power = 0  -> 800 Вт (працює лише нижній тен)
# Обидві цифри звірені зі стрибком загального лічильника будинку 2026-08-03:
# вимкнення верхнього тена давало -2.18 і -1.92 кВт, нижнього - близько -0.75 кВт.
#
# template:
#   - sensor:
#       - name: "Бойлер - потужність"
#         unique_id: boiler_power_estimated
#         unit_of_measurement: "W"
#         device_class: power
#         state_class: measurement
#         state: >
#           {% set e = 'water_heater.144036023323246_water_heater' %}
#           {% set hp = state_attr(e, 'heating_power') | float(0) %}
#           {{ 0 if not state_attr(e, 'heating') else (hp if hp > 0 else 800) }}
#
# sensor:
#   - platform: integration
#     source: sensor.boiler_potuzhnist
#     name: Бойлер - спожито
#     unique_id: boiler_energy_total
#     unit_prefix: k
#     unit_time: h
#     method: left
#     round: 3
#     max_sub_interval: "00:01:00"

# --- Насос поливу: облік енергії (додано 2026-08-03) ---
#
# Так само як бойлер, ці сутності створені як UI-помічники в .storage, а не тут:
#   input_number.nasos_polivu_potuzhnist        - калібрувальна потужність, Вт
#   sensor.nasos_polivu_potuzhnist_zaraz        - template, миттєва потужність
#   sensor.nasos_polivu_spozhito                - Riemann left -> кВт-год
#
# Реле Tuya Mini switch K601 лічильника енергії НЕ має (перевірено: у пристрою
# лише switch, timer і power_on_behavior). Тому енергія = час роботи реле,
# помножений на потужність.
#
# Потужність 1100 Вт ВИМІРЯНА 2026-08-03 по стрибку sensor.zagalne_navantazhennia,
# а не взята зі стелі:
#   * контрольований пуск (клапан -> насос, по 90 с) : 8.453 - 7.46  = 994 Вт
#   * реальний пуск 19:11:39 (41 вимір)              : 3.521 - 2.095 = 1426 Вт
#   * реальний пуск 19:13:19                         : 3.214 - 2.095 = 1119 Вт
# Взято медіану. Значення міняється з дашборда, YAML для цього правити не треба.
#
# Насос видно у HA двічі. ГОЛОВНА - локальна сутність; хмарна лише резерв:
#   {% set l = states('switch.mini_switch_k601_2_switch_1_2') %}
#   {% set c = states('switch.mini_switch_k601_2_switch_1') %}
#   {% set on = (l == 'on') if l in ['on','off'] else (c == 'on') %}
# Спершу була проста OR-логіка, але вона хибна: якщо локальна вже сказала off,
# а хмарна ще тримає застаріле on, облік нараховував би неіснуюче споживання.

# --- Двозонний тариф на електроенергію (додано 2026-08-03) ---
#
# Було: плоска ціна 2.5 грн/кВт-год у налаштуваннях Energy-дашборда
# (number_energy_price). Тобто ВЕСЬ день рахувався за нічною ставкою, і денне
# споживання недооцінювалося рівно вдвічі.
#
# Стало: Energy-дашборд бере ціну з сутності (entity_energy_price), а не число.
# Помічники (UI, .storage - як і решта):
#   input_number.tarif_den_07_00_22_59   = 5.00 грн/кВт-год
#   input_number.tarif_nich_23_00_06_59  = 2.50 грн/кВт-год
#   sensor.tarif_elektroenergii_zaraz    - template, перемикається за годиною:
#       {% set h = now().hour %}
#       {{ ден if 7 <= h < 23 else ніч }}
#   Межі перевірені: 03:00->2.5, 07:00->5.0, 14:00->5.0, 22:00->5.0, 23:00->2.5.
#
# Ставки редагуються з дашборда "Потужність" -> вкладка "Тариф".
#
# ВАЖЛИВО: перерахунок діє лише на споживання ПІСЛЯ 2026-08-03. Історія
# статистики вартості заднім числом не переписується - там лишається 2.5 грн.

# --- Камера "Двір": перегляд моменту виявлення руху (додано 2026-08-04) ---
#
# Hikvision сам не зберігає кадри для HA - camera.cam1 віддає лише живий потік.
# При кожному спрацюванні binary_sensor.cam1_motion автоматизація
# "hikvision_motion_snapshot" (automations.yaml) робить camera.snapshot і кладе
# файл у www/motion/ (роздається як /local/motion/motion_*.jpg), а також
# оновлює www/motion/latest.jpg. Окрема вкладка дашборда "Останній рух"
# (devices_dashboard.yaml, path: motion) показує latest.jpg через звичайний
# markdown-image БЕЗ jinja/cache-busting - той варіант з timestamp-текстом і
# query-параметром постійно ловив InvalidStateError у sections-грід (див.
# GOTCHA у dashboards.md) і картка зникала. Час останнього руху натомість
# видно на вкладці Камера (рядок "Рух", secondary_info: last-changed).
# НЕ через platform: local_file - той більше не підтримує YAML-налаштування
# в цій версії HA ("does not support platform setup").
# shell_command.update_motion_snapshot лишає останні 30 знімків, старі видаляє.

# --- Camera clips: is the NAS video share actually mounted? (added 2026-08-05) ---
# Guard for the motion-clip automation. If the NAS is unreachable the mount point
# is just an ordinary empty directory, and writing clips into it would fill
# /userdata - exactly the failure that took the whole system down earlier today.
command_line:
  # --- Кадр фотозаставки телевізора ---
  # state.json складає tv-photo-nav.py. Там є те, чого сам шлях до файлу дати
  # не може: URL зменшеної копії, яку відкриє браузер телевізора, дата зйомки
  # з EXIF і місце кадру в історії - без нього стрілкам «назад» і «вперед» нема
  # на що спиратися.
  - sensor:
      name: TV kadr
      unique_id: tv_kadr
      command: "cat /userdata/hass/tv-photos/state.json"
      value_template: "{{ value_json.url }}"
      json_attributes:
        - taken
        - name
        - idx
        - total
        - album
        - ok
      scan_interval: 86400
      command_timeout: 20
  # --- Курси валют для смуги на екрані ---
  # Пів години між опитуваннями: курс обмінника за цей час не рухається, а
  # CoinGecko має обмеження на частоту звернень для безплатного доступу.
  - sensor:
      name: Kursy valiut
      unique_id: kursy_valiut
      command: "/userdata/hass/venv/bin/python /home/forlinx/tv-kursy.py"
      value_template: "{{ value_json.usd | default(0) }}"
      unit_of_measurement: "грн"
      json_attributes:
        - usd_txt
        - eur_txt
        - btc_txt
        - line
        - ok
      scan_interval: 1800
      command_timeout: 30
  # Одне випадкове фото для телевізійної заставки, з альбому, обраного в
  # input_select.tv_zastavka_album. Читає готовий список, побудований
  # tv-photo-cache.sh: в альбомі 87758 фотографій і повний обхід NAS триває
  # дві хвилини, а заставці треба новий шлях кожні 20 секунд.
  #
  # scan_interval добовий навмисне: сенсор оновлює не час, а скрипт заставки
  # через homeassistant.update_entity перед кожним показом. Опитувати його
  # самохіть означало б дарма будити NAS цілу добу.
  - sensor:
      name: TV zastavka foto
      unique_id: tv_zastavka_foto
      command: >-
        /home/forlinx/tv-photo-random.sh
        "{{ states('input_select.tv_zastavka_album') }}"
      scan_interval: 86400
      command_timeout: 15
  # Стан файлової системи /userdata. Перевірка при завантаженні знята
  # (fstab pass 0), інакше пошкоджений розділ не монтується і HA не
  # стартує взагалі - тож роль сторожа виконує цей сенсор.
  - binary_sensor:
      name: Userdata FS poshkodzhena
      unique_id: userdata_fs_clean
      # Шукати саме "with errors", а не "clean": змонтована ext4 ЗАВЖДИ
      # позначена "not clean" - вона стає чистою лише при відмонтуванні, тож
      # перевірка на "clean" сигналила б тривогу цілодобово. Прапорець помилок
      # у суперблоці - це окрема річ, і саме він тут важливий.
      command: >-
        sudo dumpe2fs -h /dev/mmcblk0p8 2>/dev/null
        | grep -q "Filesystem state:.*with errors" && echo "ON" || echo "OFF"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: problem
      scan_interval: 3600
  # Вільне місце на розділі, де живе Home Assistant. Розділ 2.5 ГБ, і
  # заповнений він уже одного разу клав дім (5 серпня, полив стояв добу).
  # Корінь тепер тримає базу recorder, тож стежити треба за обома розділами.
  # Вільне місце на розділі, де живе Home Assistant. Розділ 2.5 ГБ, і
  # заповнений він уже одного разу клав дім (5 серпня, полив стояв добу).
  # Корінь тепер тримає базу recorder, тож стежити треба за обома розділами.
  - sensor:
      name: Vilne mistse korenia
      unique_id: root_free_mb
      command: "df -Pm / | awk 'NR==2{print $4}'"
      unit_of_measurement: MB
      state_class: measurement
      scan_interval: 600
  - sensor:
      name: Vilne mistse userdata
      unique_id: userdata_free_mb
      command: "df -Pm /userdata | awk 'NR==2{print $4}'"
      unit_of_measurement: MB
      state_class: measurement
      scan_interval: 600
  # 03.09.2026: sensor.motion_clips_list знято - жоден дашборд його не читав
  # (галерея бере clips.json зі scripts-gen-gallery.py), а він щодві хвилини
  # ганяв ls по NFS. Разом із ним зник bind www/motion-clips.
  - binary_sensor:
      name: NAS videoarkhiv zmontovanyi
      unique_id: nas_video_mount_ok
      # Обидва шляхи навмисно: до finish-video-move.sh шара змонтована в
      # config-standalone/media/video, після - у /mnt/homemate_media/video
      # (а media/video - symlink). Так кліпи не зупиняються між деплоєм і рестартом.
      command: "{ mountpoint -q /mnt/homemate_media/video || mountpoint -q /userdata/hass/config-standalone/media/video; } && echo ON || echo OFF"
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 300
  - binary_sensor:
      name: CloudMate NAS Online
      unique_id: cloudmate_nas_online
      command: 'ping -W 1 -c 1 192.168.50.25 > /dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 30
      device_class: connectivity
      icon: mdi:nas
  - binary_sensor:
      name: TCL TV Online
      unique_id: tcl_tv_online
      command: 'ping -W 1 -c 1 192.168.50.175 > /dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 30
      device_class: connectivity
      icon: mdi:television
  - binary_sensor:
      name: Hikvision Camera Online
      unique_id: hikvision_camera_online
      command: 'ping -W 1 -c 1 192.168.50.201 > /dev/null 2>&1 && echo ON || echo OFF'
      payload_on: "ON"
      payload_off: "OFF"
      scan_interval: 30
      device_class: connectivity
      icon: mdi:cctv

  # --- Журнал показників лічильника свердловини (2026-08-22) ---
  # Записи живуть у water_readings.json, а не в слотах input_text: слоти
  # обмежені двадцятьма чотирма, не тримають історії правок і не пережили
  # падіння HA 21.08 - тоді збережений показник 815.89 зник із таблиці,
  # бо .storage/core.restore_state пишеться періодично, а не миттєво.
  # Стан сенсора - кількість записів (ліміт стану 255 символів), самі рядки
  # їдуть в атрибутах. Картка після кожного запису смикає update_entity,
  # тож scan_interval тут лише страхувальний.
  - sensor:
      name: Zhurnal pokaznykiv vody
      unique_id: well_water_readings_log
      command: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/water_readings.py export --limit 60 --include-deleted"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - readings
        - count
        - updated_at
        # Базова точка й енергетична поправка їдуть тим самим сенсором: картки
        # та автоматизації беруть їх звідси, тому число існує в одному місці.
        - calibration
      unit_of_measurement: "записів"
      icon: mdi:table-clock
      scan_interval: 600

  # --- Таблиця тарифів (2026-08-22) ---
  # Ставка - це часовий ряд, а жила вона як два input_number. Через це вся
  # минула вартість тихо перераховувалась за поточною ціною: до 3 серпня діяла
  # плоска 2,50 цілодобово, а рахувалося все денними 5,00. Тепер періоди з
  # датами дії лежать у tariffs.json, а скрипт віддає ставку на будь-який момент.
  # Стан - чинна ставка; історія й межі вікон - в атрибутах. Періоди цілком
  # (з примітками й джерелами) сюди свідомо не тягнемо: вони довгі, а сенсор
  # мусить лишатись легким.
  #
  # НАСТУПНИЙ КРОК, ще не зроблений: грошові template-сенсори досі множать на
  # input_number. Поки вони не почнуть питати цю таблицю, зміна ціни й далі
  # переписуватиме минуле - див. docs/cost-history-recalc.md.
  - sensor:
      name: Taryf tablytsia
      unique_id: tariff_table
      command: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/tariffs.py export"
      value_template: "{{ value_json.rate_now }}"
      json_attributes:
        - zone_now
        - zone_label
        - rates
        - periods_count
        - current_id
        - current_from
        - current_kind
        - currency
      unit_of_measurement: "UAH/kWh"
      icon: mdi:cash-clock
      scan_interval: 900

  # --- Глибина довгострокової статистики (2026-08-22) ---
  # 18 серпня корупція бази знищила всю статистику до цієї дати, і ніхто не
  # помітив: за глибиною не стежив ніхто. Побічний наслідок видно на вкладці
  # «Витрати» - картки «Цей місяць» і «Цей рік» показують однакове число, бо
  # обидва вікна вміщаються в те, що лишилось.
  #
  # Стан - кількість РІЗНИХ календарних днів із записами, а не різниця крайніх
  # дат: після втрати середини діапазону різниця бреше, а лічильник днів ні.
  # Скрипт відкриває базу лише на читання і за будь-якої біди віддає JSON із
  # полем error та кодом виходу 0 - інакше HA відкинув би вивід разом із
  # причиною, і сторож замовк би саме тоді, коли має кричати.
  - sensor:
      name: Hlybyna statystyky
      unique_id: lts_depth_days
      command: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/lts_depth.py --db /userdata/hass/config/home-assistant_v2.db"
      value_template: "{{ value_json.depth_days }}"
      json_attributes:
        - rows
        - metadata
        - hours
        - oldest_date
        - newest_date
        - span_days
        - lag_days
        - missing_days_total
        - error
      unit_of_measurement: "днів"
      state_class: measurement
      icon: mdi:database-clock
      scan_interval: 3600

  # Сповіщення видно в системі, а не лише в телефоні.
  #
  # Стан - кількість НЕПРОЧИТАНИХ. Спершу тут була кількість за добу, і вона не
  # спадала після прочитання: значок висів із одиницею, поки не мине доба. Тепер
  # це поштова модель - одна мітка часу останнього прочитання, усе старіше за
  # неї вважається прочитаним.
  #
  # Стан не текст, а число: у стану Home Assistant ліміт 255 символів, і одне
  # довге повідомлення зробило б сутність недоступною. Самі записи лежать в
  # атрибутах, де ліміту немає, і кожен має ознаку nove.
  - sensor:
      name: "Spovishchennia zhurnal"
      unique_id: notify_log_recent
      command: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/notify_log.py export --limit 40"
      value_template: "{{ value_json.unread }}"
      json_attributes:
        - unread
        - today
        - total
        - last_read
        - items
      unit_of_measurement: "непрочитаних"
      scan_interval: 300
      command_timeout: 30

  # --- Хто відвалюється: епізоди і час недоступності за 7 днів (02.09.2026) ---
  # Рахує scripts/flaky_devices.py з історії recorder. Раз на шість годин:
  # запит історії 22 сутностей за тиждень займає кілька секунд, частіше не
  # треба - це тижнева картина, а не жива телеметрія. Стан - кількість
  # пристроїв, недоступних понад 5 % часу; рядки таблиці в атрибуті rows.
  - sensor:
      name: Prystroi khytkist
      unique_id: flaky_devices_7d
      command: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/flaky_devices.py"
      value_template: "{{ value_json.flaky }}"
      json_attributes:
        - generated
        - days
        - rows
        - error
      unit_of_measurement: "пристроїв"
      icon: mdi:lan-disconnect
      scan_interval: 21600
      command_timeout: 120

input_button:
  spovishchennia_prochytano:
    name: Сповіщення - позначити прочитаними
    icon: mdi:email-open-outline

shell_command:
  # Стрілки заставки. Альбом підставляється шаблоном, тому нове фото береться
  # саме з того альбому, що обраний на панелі; «назад» альбому не потребує -
  # воно йде по вже переглянутому.
  tv_foto_next: >-
    /userdata/hass/venv/bin/python /home/forlinx/tv-photo-nav.py next
    "{{ states('input_select.tv_zastavka_album') }}"
  tv_foto_prev: "/userdata/hass/venv/bin/python /home/forlinx/tv-photo-nav.py prev"
  # Keep the clip folder bounded. It lives on the NAS, but an unbounded
  # folder is still bad manners - and if the mount ever silently fell away
  # this would be running against the board's own disk.
  # ...і прибирає *.tmp старші за годину: обірваний запис лишає їх назавжди
  # (сім штук за серпень), а бекап на такому файлі, що зникає посеред tar, падає.
  prepare_motion_dir: "d=/userdata/hass/config/media/video/ha-motion; mkdir -p $d/$(date +%Y-%m-%d); find $d -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +; find $d -name '*.tmp' -mmin +60 -delete"
  rebuild_clip_gallery: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts-gen-gallery.py"
  update_motion_snapshot: "cd /userdata/hass/config/www/motion && ls -t motion_*.jpg 2>/dev/null | head -1 | xargs -I{} cp {} latest.jpg && ls -t motion_*.jpg 2>/dev/null | tail -n +31 | xargs -r rm --"
  # --- Похвилинний рівень зберігання (додано 2026-08-23) ---
  # Штатних рівнів три - сира зміна, пʼятихвилинна і погодинна, - і кроку
  # «хвилина за 30 днів» серед них немає: purge_keep_days глобальний, не по
  # сутностях. Цей рівень живе у власній базі minute_rollup.db збоку, тому не
  # заважає recorder і переживає будь-яку операцію над основною базою.
  minute_rollup_sample: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/minute_rollup.py sample --entities sensor.zagalne_navantazhennia,sensor.merezha_spozhyto,sensor.merezha_potuzhnist_usogo_vvodu"
  minute_rollup_purge: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/minute_rollup.py purge --days 30"
  # Копія довгострокової статистики на NAS. Щоденні бекапи Home Assistant її
  # НЕ містять: у кожному backup.json стоїть "exclude_database": true, і ті
  # 5-8 ГБ - це медіа. Саме тому корупція бази 18.08.2026 забрала три тижні
  # безповоротно. Тут - 18 МБ незамінного замість 568 МБ усього.
  backup_statistics: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/backup_statistics.py"
  # Журнал сповіщень. Текст санітизується в автоматизації, а не тут:
  # shell_command розбирає рядок через shlex, і апостроф у повідомленні зламав
  # би розбір. Лапки, зворотні лапки й долар прибираються з тієї ж причини.
  notify_log: >-
    /userdata/hass/venv/bin/python /userdata/hass/config/scripts/notify_log.py log
    --service '{{ sluzhba }}' --title '{{ zagolovok }}' --message '{{ tekst }}'
    --key '{{ kliuch | default('') }}'
  notify_log_mark_read: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/notify_log.py mark-read"
  # Закрили одне сповіщення журналу в панелі HA - прочитаний саме цей запис.
  # Ключ - md5 (лише [0-9a-f]), для оболонки безпечний.
  notify_log_mark_read_key: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/notify_log.py mark-read --key '{{ kliuch }}'"
  # Додати, виправити, приховати або повернути показник лічильника свердловини.
  # Payload - це base64(JSON): Home Assistant рендерить команду в рядок і лише
  # потім ріже її shlex, тому ім'я автора з лапкою чи нотатка з крапкою з комою
  # ламали б виклик. Base64 складається тільки з [A-Za-z0-9+/=] і доїжджає цілим.
  water_reading_apply: "/userdata/hass/venv/bin/python /userdata/hass/config/scripts/water_readings.py apply --payload {{ payload }}"

# --- Сторож насоса свердловини (2026-08-22) ---
# У поливу є повний набір захисту - максимальна тривалість, закриття клапанів,
# безпечний стан після рестарту. У свердловини не було нічого: три автоматизації,
# і всі лише рахують воду. Насос керується реле тиску, тож HA його не вмикає -
# але якщо реле залипне, насос качатиме годинами, а система це мовчки порахує.
# Лічильники дають те, чого не видно з миттєвої потужності: скільки разів на добу
# насос стартував і скільки з того припало на ніч, коли розбору бути не повинно.
counter:
  nasos_sverdlovini_zapusky:
    name: Запуски насоса свердловини за добу
    icon: mdi:water-pump
    initial: 0
    step: 1
  nasos_sverdlovini_zapusky_nich:
    name: Нічні запуски насоса свердловини
    icon: mdi:weather-night
    initial: 0
    step: 1

# Вибір альбому для фотозаставки телевізора. Назви мусять збігатися з
# іменами списків у /userdata/hass/tv-photos - скрипт-вибірник шукає файл
# <назва>.list і мовчки відкочується на всі роки, якщо такого немає.

# --- PRANA: справжнє вимикання ---
# Прилад має три канали: supply, extract і bounded. Home Assistant показує
# лише перші два, а вимикає прилад цілком саме bounded. Команда fan.turn_off
# на окремому потоці поводиться як перемикач: на вимкненому приладі вона його
# вмикає. Тому для скидання навантаження PRANA гаситься напряму по HTTP.
rest_command:
  prana_stop:
    url: "http://192.168.50.246/setSpeedIsOn"
    method: POST
    content_type: "application/json"
    payload: >-
      {"value": false, "fanType": "bounded"}
    timeout: 10

