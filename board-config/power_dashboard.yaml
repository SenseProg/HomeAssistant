views:
# ============================================================================
# Дашборд «Енергія» — реалізація затверджених макетів (09.08.2026).
# Вісім вкладок зведено в п'ять: «3 години», «Місяць», «Пів року» і «Вибір
# періоду» відрізнялися лише глибиною тих самих чотирьох графіків, тому стали
# однією «Історією» з вибором періоду. «Тариф» переїхав у «Витрати», бо ставки —
# це вхідні дані для грошей. url_path лишився power-dashboard, а шляхи power,
# cost та inverter збережені, щоб не ламати наявні посилання.
# ============================================================================
- title: Зараз
  path: power
  icon: mdi:flash
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 0 · Потік енергії ---
  # Власна карта навмисно займає всю ширину: схема читається зліва направо,
  # а гілка поза інвертором відходить одразу після основного лічильника.
  - type: grid
    column_span: 4
    cards:
    - type: custom:home-energy-flow-card
      title: Потік енергії просто зараз
      entities:
        main_power: sensor.merezha_potuzhnist_usogo_vvodu
        inverter_input_power: sensor.inverter_grid_power
        outside_power: sensor.spozhivannia_poza_invertorom
        house_power: sensor.inverter_load_power
        inverter_status: sensor.inverter_device_state
        inverter_voltage: sensor.inverter_output_l2_voltage
        inverter_frequency: sensor.inverter_load_frequency
        battery_soc: sensor.inverter_battery
        battery_power: sensor.inverter_battery_power
        pv1_voltage: sensor.inverter_pv1_voltage
        pv1_current: sensor.inverter_pv1_current
        pv2_voltage: sensor.inverter_pv2_voltage
        pv2_current: sensor.inverter_pv2_current
        total_day_energy: sensor.energy_meter_budinok_spozhito_sogodni
        inverter_grid_day_energy: sensor.inverter_today_energy_import
        house_day_energy: sensor.inverter_today_load_consumption
        battery_charge_day_energy: sensor.inverter_today_battery_charge
        battery_discharge_day_energy: sensor.inverter_today_battery_discharge
      grid_options:
        columns: full
  # --- Секція 1 · Hero ---
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set p = states('sensor.zagalne_navantazhennia') | float(0) %}
        {% set rate = states('sensor.tarif_elektroenergii_zaraz') | float(0) %}
        {% set day = states('input_number.tarif_den_07_00_22_59') | float(0) %}
        {% set loads = [
             ('бойлер', 'sensor.boiler_potuzhnist', 0.001),
             ('зарядка авто', 'sensor.zariadka_7_5kvt_device_kw', 1),
             ('тепла підлога 1', 'sensor.terneo_1_current_power', 0.001),
             ('тепла підлога 2', 'sensor.terneo_2_current_power', 0.001),
             ('насос поливу', 'sensor.nasos_polivu_potuzhnist_zaraz', 0.001)
           ] %}
        {% set ns = namespace(known=0.0, active=[]) %}
        {% for name, ent, k in loads %}{% set v = (states(ent) | float(0)) * k %}{% if v > 0.05 %}{% set ns.known = ns.known + v %}{% set ns.active = ns.active + [name] %}{% endif %}{% endfor %}
        {% if p > 6 %}
        ## 🟠 Будинок бере {{ p | round(2) }} кВт
        {% elif p > 0 %}
        ## 🟢 Будинок бере {{ p | round(2) }} кВт
        {% else %}
        ## ⚪ Споживання не вимірюється
        {% endif %}

        {% if ns.active | count > 0 %}
        Причина: працює {{ ns.active | join(', ') }} — разом {{ ns.known | round(2) }} кВт із {{ p | round(2) }}.
        {% else %}
        Причина: великі споживачі вимкнені — бойлер, зарядка авто, обидві підлоги й насос стоять.
        Це фонове споживання дому.
        {% endif %}
        За поточним{{ ' денним' if rate == day else ' нічним' }} тарифом {{ rate | round(2) }} грн це коштує близько
        **{{ (p * rate) | round(2) }} грн за годину**.
    - type: tile
      entity: sensor.zagalne_navantazhennia
      name: Потужність зараз
      icon: mdi:flash
      color: amber
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.zagalnii_strum
      name: Струм сумарно
      icon: mdi:current-ac
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.tarif_elektroenergii_zaraz
      name: Тариф зараз
      icon: mdi:cash-clock
      color: purple
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.inverter_battery
      name: Батарея
      icon: mdi:battery-high
      color: green
      grid_options:
        columns: 12
        rows: 1
  # --- Секція 2 · Хто бере потужність ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Хто бере потужність
      icon: mdi:devices
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set total = states('sensor.zagalne_navantazhennia') | float(0) %}
        {% set loads = [
             ('Бойлер', 'sensor.boiler_potuzhnist', 0.001),
             ('Зарядка авто', 'sensor.zariadka_7_5kvt_device_kw', 1),
             ('Тепла підлога 1', 'sensor.terneo_1_current_power', 0.001),
             ('Тепла підлога 2', 'sensor.terneo_2_current_power', 0.001),
             ('Насос поливу', 'sensor.nasos_polivu_potuzhnist_zaraz', 0.001)
           ] %}
        {% set ns = namespace(rows=[], known=0.0) %}
        {% for name, ent, k in loads %}{% set v = (states(ent) | float(0)) * k %}{% if v > 0.05 %}{% set ns.rows = ns.rows + [(v, name)] %}{% set ns.known = ns.known + v %}{% endif %}{% endfor %}
        {% set other = total - ns.known %}
        {% if other > 0.05 %}{% set ns.rows = ns.rows + [(other, 'Інше — без власного лічильника')] %}{% endif %}

        | Споживач | Потужність | Частка |
        |---|---|---|
        {% for v, name in ns.rows | sort(reverse=true) -%}
        | {{ name }} | {{ v | round(2) }} кВт | {{ (100 * v / total) | round(0) | int if total > 0 else 0 }} % |
        {% endfor -%}
        {% if ns.rows | count == 0 %}
        | Нічого суттєвого не працює | {{ total | round(2) }} кВт | 100 % |
        {% endif %}

        {% if ns.known < 0.05 and total > 0.05 %}
        Зараз усе споживання фонове: холодильник, мережеве обладнання, освітлення,
        чергові режими техніки. Окремих лічильників на них немає, тому вони йдуть
        одним рядком «Інше».
        {% endif %}
    - type: tile
      entity: sensor.naibilshii_spozhivach_zaraz
      name: Найбільший споживач
      icon: mdi:trending-up
      grid_options:
        columns: full
        rows: 1
  # --- Секція 3 · Розподіл по фазах ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Розподіл по фазах
      icon: mdi:sine-wave
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set pa = states('sensor.energy_meter_phase_a_power_2') | float(0) %}
        {% set pb = states('sensor.energy_meter_phase_b_power_2') | float(0) %}
        {% set pc = states('sensor.energy_meter_phase_c_power_2') | float(0) %}
        {% set va = states('sensor.energy_meter_phase_a_voltage_2') | float(0) %}
        {% set vb = states('sensor.energy_meter_phase_b_voltage_2') | float(0) %}
        {% set vc = states('sensor.energy_meter_phase_c_voltage_2') | float(0) %}
        {% set sum = pa + pb + pc %}
        {% set vmin = [va, vb, vc] | min %}
        {% set vmax = [va, vb, vc] | max %}

        | Фаза | Потужність | Струм | Напруга |
        |---|---|---|---|
        | A | {{ pa | round(3) }} кВт{{ ' · ' ~ (100 * pa / sum) | round(0) | int ~ ' %' if sum > 0 else '' }} | {{ states('sensor.energy_meter_phase_a_current_2') }} А | {{ va | round(1) }} В |
        | B | {{ pb | round(3) }} кВт{{ ' · ' ~ (100 * pb / sum) | round(0) | int ~ ' %' if sum > 0 else '' }} | {{ states('sensor.energy_meter_phase_b_current_2') }} А | {{ vb | round(1) }} В |
        | C | {{ pc | round(3) }} кВт{{ ' · ' ~ (100 * pc / sum) | round(0) | int ~ ' %' if sum > 0 else '' }} | {{ states('sensor.energy_meter_phase_c_current_2') }} А | {{ vc | round(1) }} В |

        {% if vmin < 207 or vmax > 253 %}
        🔴 **Напруга вийшла за допустимі 207…253 В** ({{ vmin | round(1) }}…{{ vmax | round(1) }} В).
        Причина: проблема на боці мережі — це не налаштування дому.
        {% elif (vmax - vmin) > 20 %}
        🟠 **Перекіс фаз:** різниця напруг {{ (vmax - vmin) | round(1) }} В ({{ vmin | round(1) }}…{{ vmax | round(1) }} В),
        а найнавантаженіша фаза несе {{ (100 * [pa, pb, pc] | max / sum) | round(0) | int if sum > 0 else 0 }} % потужності.
        Причина: великі споживачі підключені переважно до однієї фази.
        {% else %}
        🟢 Фази навантажені рівномірно, напруга в межах 207…253 В.
        {% endif %}
  # --- Секція 4 · Історія за годину і за три ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Найближча історія
      icon: mdi:chart-line
      grid_options:
        columns: full
    - type: custom:mini-graph-card
      name: Потужність за останню годину
      hours_to_show: 1
      points_per_hour: 60
      update_interval: 30
      line_width: 3
      animate: true
      show:
        labels: true
        points: false
      grid_options:
        columns: 24
      entities:
      - entity: sensor.zagalne_navantazhennia
        name: Разом
    - type: custom:mini-graph-card
      name: Потужність за 3 години
      hours_to_show: 3
      points_per_hour: 20
      update_interval: 30
      line_width: 3
      animate: true
      show:
        labels: true
        points: false
      grid_options:
        columns: 24
      entities:
      - entity: sensor.zagalne_navantazhennia
        name: Разом
    - type: custom:mini-graph-card
      name: Весь ввід, гілка інвертора і повз інвертор · 3 години (тестування)
      hours_to_show: 3
      points_per_hour: 20
      update_interval: 30
      line_width: 2
      show:
        labels: true
        points: false
      grid_options:
        columns: 24
      entities:
      - entity: sensor.merezha_potuzhnist_usogo_vvodu
        name: Весь ввід, Вт
        color: '#1e88e5'
      - entity: sensor.inverter_grid_power
        name: Гілка Deye, Вт
        color: '#43a047'
      - entity: sensor.spozhivannia_poza_invertorom
        name: Повз інвертор, Вт
        color: '#fb8c00'
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Глибша історія — на вкладці **«Історія»**: там один вибір періоду керує
        графіками потужності, фаз, напруги і струму. Причина розділення: механізм
        вибору періоду в Home Assistant працює з добами й довшими проміжками,
        коротші за добу інтервали він не вміє.
  # --- Секція 5 · Довідка ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Довідка
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        <details><summary>Що таке «Інше» і чому воно найбільше</summary>

        Власні лічильники стоять лише на бойлері, зарядній станції, двох контурах
        теплої підлоги й насосі поливу. Усе решта — холодильник, освітлення,
        мережеве обладнання, дрібна техніка, чергові режими — вимірюється тільки
        загальним трифазним лічильником. Різниця між ним і сумою відомих пристроїв
        і є «Інше».

        Зменшити цей рядок можна лише одним способом: додати лічильники на
        конкретні лінії або розетки.

        </details>

        <details><summary>Перекіс фаз: коли це проблема, а коли ні</summary>

        Будинок підключений трифазно, і кожна фаза живить свою групу ліній.
        Нерівномірність сама по собі не аварія — вона стає проблемою, коли одна
        фаза стабільно перевантажена: на ній сильніше просідає напруга, більше
        гріється проводка, і саме на ній першою спрацює автомат.

        Допустимий діапазон напруги — 207…253 В (230 В ±10 %). Різниця понад
        20 В між фазами вказує, що навантаження варто перерозподілити.

        </details>

        <details><summary>Звідки беруться числа</summary>

        Миттєва потужність, струм і напруга — з трифазного лічильника
        `192.168.50.219`, опитування кожні 5 секунд локально. Накопичувальний
        імпорт із мережі й батарея — з інвертора Deye.

        Ці джерела показують **різні будинки**, і різниця не дрібна. Лічильник
        міряє весь ввід, інвертор — лише свою гілку, тож усе, що живиться повз
        Deye, у його число не входить: 7 серпня лічильник показав 36.45 кВт·год
        проти 31.70 у інвертора, 8 серпня — 33.37 проти 24.50. Це до 27 %.
        Заряджання й розряджання акумулятора теж додає розбіжності, але воно
        тут не головне.

        </details>
  # --- Відключення світла: пороги і поведінка ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Коли немає світла
      icon: mdi:transmission-tower-off
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% if is_state('binary_sensor.svitlo_vidsutnie','on') %}
        **Світла немає.** Батарея {{ states('sensor.inverter_battery') }}%,
        споживання {{ states('sensor.spozhyvannia_zaraz_kvt') }} кВт.
        {% else %}
        Мережа є. Батарея {{ states('sensor.inverter_battery') }}%.
        {% endif %}

        Повідомлення приходять на всі три телефони: коли світло зникає і
        повертається, коли без світла споживання тримається вище порога довше
        за витримку, і на кожному з двох рівнів заряду.
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: input_number.bez_svitla_porih_kvt
        name: Поріг споживання
      - entity: input_number.bez_svitla_zatrymka_hv
        name: Витримка перед сповіщенням
      - entity: input_number.batareia_porih_uvaha
        name: Батарея - попередження
      - entity: input_number.batareia_porih_krytychno
        name: Батарея - критично
      - entity: input_boolean.bez_svitla_vymykaty
        name: Вимикати бойлер автоматично
      - entity: binary_sensor.svitlo_vidsutnie
        name: Стан мережі
      - entity: water_heater.144036023323246_water_heater
        name: Бойлер
- title: Історія
  path: history
  icon: mdi:chart-timeline-variant
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 1 · Вибір періоду ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Період
      icon: mdi:calendar-search
      grid_options:
        columns: full
    - type: energy-date-selection
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Один вибір угорі керує всіма графіками на цій вкладці. Ця вкладка замінила
        три попередні — «3 години», «Місяць» і «Пів року», — які показували ті самі
        чотири графіки, лише з різною глибиною.

        Причина, чому «3 години» тут немає: перемикач періоду працює з добами й
        довшими проміжками. Коротші інтервали живуть на вкладці **«Зараз»**.
  # --- Секція 2 · Стан обліку ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set source = 'sensor.inverter_total_energy_import' %}
        {% set missing = ['unknown', 'unavailable', 'none', ''] %}
        {% if states(source) in missing %}
        ### ⚠️ Дані про енергію зараз не надходять
        Основне джерело `{{ source }}` має стан **{{ states(source) }}**.
        Причина: поки лічильник недоступний, Home Assistant не додає нові значення
        на графіки за сьогодні.
        {% else %}
        ### ✅ Облік працює
        З мережі сьогодні **{{ states('sensor.inverter_today_energy_import') }} кВт·год** ·
        навантаження будинку **{{ states('sensor.inverter_today_load_consumption') }} кВт·год**.
        Причина розбіжності між ними: частина енергії йде на заряджання акумулятора
        або, навпаки, надходить із нього.
        {% endif %}
        {% if states('sensor.energy_meter_total_energy') in missing %}

        Хмарний лічильник Tuya зараз **{{ states('sensor.energy_meter_total_energy') }}**.
        Це резервне джерело, на основний облік воно не впливає.
        {% endif %}

        ℹ️ Графіки нижче погодинні, і вибір періоду їх не спрощує: місяць — це
        720 точок на сутність, рік — 8760. Плата витягує приблизно два тижні;
        на довшому діапазоні картки лишаться порожніми, і це виглядатиме як
        зниклі секції, а не як довге завантаження.
  # --- Секція 3 · Загальна потужність ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Загальна потужність
      icon: mdi:flash
      grid_options:
        columns: full
    - type: statistics-graph
      # 03.09.2026: hour + вибір періоду давав 720-8760 точок і порожні картки;
      # добова статистика тримає будь-який період, погодинна - у фіксованому графіку нижче.
      period: day
      energy_date_selection: true
      stat_types:
      - mean
      - max
      chart_type: line
      grid_options:
        columns: full
      entities:
      - entity: sensor.zagalne_navantazhennia
        name: Разом
  # --- Секція 4 · Потужність фаз ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Потужність по фазах
      icon: mdi:sine-wave
      grid_options:
        columns: full
    - type: statistics-graph
      # 03.09.2026: hour + вибір періоду давав 720-8760 точок і порожні картки;
      # добова статистика тримає будь-який період, погодинна - у фіксованому графіку нижче.
      period: day
      energy_date_selection: true
      stat_types:
      - mean
      chart_type: line
      grid_options:
        columns: full
      entities:
      - entity: sensor.energy_meter_phase_a_power_2
        name: Фаза A
      - entity: sensor.energy_meter_phase_b_power_2
        name: Фаза B
      - entity: sensor.energy_meter_phase_c_power_2
        name: Фаза C
  # --- Секція 5 · Струм ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Струм
      icon: mdi:current-ac
      grid_options:
        columns: full
    - type: statistics-graph
      # 03.09.2026: hour + вибір періоду давав 720-8760 точок і порожні картки;
      # добова статистика тримає будь-який період, погодинна - у фіксованому графіку нижче.
      period: day
      energy_date_selection: true
      stat_types:
      - mean
      - max
      chart_type: line
      grid_options:
        columns: full
      entities:
      - entity: sensor.zagalnii_strum
        name: Разом
      - entity: sensor.energy_meter_phase_a_current_2
        name: Фаза A
      - entity: sensor.energy_meter_phase_b_current_2
        name: Фаза B
      - entity: sensor.energy_meter_phase_c_current_2
        name: Фаза C
  # --- Секція 6 · Напруга ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Напруга по фазах
      icon: mdi:flash-triangle
      grid_options:
        columns: full
    - type: statistics-graph
      # 03.09.2026: hour + вибір періоду давав 720-8760 точок і порожні картки;
      # добова статистика тримає будь-який період, погодинна - у фіксованому графіку нижче.
      period: day
      energy_date_selection: true
      stat_types:
      - min
      - mean
      - max
      chart_type: line
      grid_options:
        columns: full
      entities:
      - entity: sensor.energy_meter_phase_a_voltage_2
        name: Фаза A
      - entity: sensor.energy_meter_phase_b_voltage_2
        name: Фаза B
      - entity: sensor.energy_meter_phase_c_voltage_2
        name: Фаза C
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Допустимий діапазон — **207…253 В** (230 В ±10 %). Напруга найважливіша з
        трьох величин: саме її просідання псує техніку. Причина просідання зазвичай
        локальна — перекіс навантаження між фазами, а не аварія в мережі.
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: По годинах за фіксований тиждень (тестування)
      icon: mdi:chart-timeline-variant
      grid_options:
        columns: full
    - type: statistics-graph
      title: Загальна потужність по годинах · 7 днів
      period: hour
      days_to_show: 7
      stat_types:
      - mean
      - max
      chart_type: line
      grid_options:
        columns: full
      entities:
      - entity: sensor.zagalne_navantazhennia
        name: Разом, кВт
    - type: statistics-graph
      title: День і ніч по добах у вибраному періоді (локальний лічильник)
      period: day
      energy_date_selection: true
      stat_types:
      - change
      chart_type: bar
      grid_options:
        columns: full
      entities:
      - entity: sensor.lichylnyk_za_tarifom_den
        name: День, кВт·год
      - entity: sensor.lichylnyk_za_tarifom_nich
        name: Ніч, кВт·год
- title: Витрати
  path: cost
  icon: mdi:cash-multiple
  type: sections
  max_columns: 4
  dense_section_placement: false
  sections:
  # --- Секція 1 · Hero ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set d = states('sensor.vitrati_vden_tsogo_misiatsia') | float(0) %}
        {% set n = states('sensor.vitrati_vnochi_tsogo_misiatsia') | float(0) %}
        {% set total = d + n %}
        {% set today = (states('sensor.vitrati_vden_sogodni') | float(0)) + (states('sensor.vitrati_vnochi_sogodni') | float(0)) %}
        {% set kwh_today = (states('sensor.merezha_dobovyi_den') | float(0)) + (states('sensor.merezha_dobovyi_nich') | float(0)) %}
        ## {{ total | round(2) }} грн за {{ now().strftime('%B') | replace('August', 'серпень') | replace('July', 'липень') | replace('September', 'вересень') | replace('October', 'жовтень') | replace('November', 'листопад') | replace('December', 'грудень') | replace('January', 'січень') | replace('February', 'лютий') | replace('March', 'березень') | replace('April', 'квітень') | replace('May', 'травень') | replace('June', 'червень') }}

        {% if total > 0 %}
        Причина такої суми: **{{ (100 * d / total) | round(0) | int }} %** витрат припало на денний тариф
        {{ states('input_number.tarif_den_07_00_22_59') | float(0) | round(2) }} грн — уночі за ті самі
        кіловати платили б по {{ states('input_number.tarif_nich_23_00_06_59') | float(0) | round(2) }} грн.
        {% else %}
        Причина: за цей місяць витрат ще не зафіксовано.
        {% endif %}
        Сьогодні вже витрачено **{{ today | round(2) }} грн** за {{ kwh_today | round(1) }} кВт·год.

        <details><summary>Чому ці суми занижені й не збігаються з картками нижче</summary>

        Усі грошові лічильники беруть `sensor.inverter_total_energy_import` —
        тобто **лише гілку інвертора Deye**. Споживання поза нею не бачить
        жоден грошовий сенсор; заміряна різниця сягала 27 % (7 серпня 36.45
        проти 31.70 кВт·год, 8 серпня 33.37 проти 24.50). Реальний рахунок
        більший за те, що тут написано. Перевести облік на трифазний лічильник
        можна буде після ре-автентифікації Tuya.

        Картки «Сьогодні / Цей місяць / Цей рік» рахуються інакше — з
        довгострокової статистики `sensor.vitrati_na_merezhu_razom`, і якщо
        цю статистику створили або обнулили посеред місяця, «рік» дорівнює
        «місяцю», а сума розходиться з числом угорі. Виправляється в
        Інструменти розробника → Статистика.

        </details>
    - type: statistic
      entity: sensor.vitrati_na_merezhu_razom
      stat_type: change
      name: Сьогодні
      period:
        calendar:
          period: day
      grid_options:
        columns: 12
    - type: statistic
      entity: sensor.vitrati_na_merezhu_razom
      stat_type: change
      name: Цей місяць
      period:
        calendar:
          period: month
      grid_options:
        columns: 12
    - type: statistic
      entity: sensor.vitrati_na_merezhu_razom
      stat_type: change
      name: Цей рік
      period:
        calendar:
          period: year
      grid_options:
        columns: 12
    - type: statistic
      entity: sensor.vitrati_na_merezhu_razom
      stat_type: change
      name: Цей тиждень (тестування)
      period:
        calendar:
          period: week
      grid_options:
        columns: 12
    - type: statistic
      entity: sensor.inverter_total_energy_import
      stat_type: change
      name: Спожито за місяць
      period:
        calendar:
          period: month
      grid_options:
        columns: 12
  # --- Секція 2 · Тариф ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Тариф
      icon: mdi:cash-clock
      grid_options:
        columns: full
    - type: tile
      entity: sensor.tarif_elektroenergii_zaraz
      name: Діє зараз
      color: purple
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: input_number.tarif_den_07_00_22_59
      name: День · 07:00–22:59
      icon: mdi:white-balance-sunny
      color: orange
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: box
    - type: tile
      entity: input_number.tarif_nich_23_00_06_59
      name: Ніч · 23:00–06:59
      icon: mdi:weather-night
      color: purple
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: box
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set h = now().hour %}
        {% if 7 <= h < 23 %}
        {% set left = 23 - h %}
        Зараз діє **денна** ставка. Нічна ввімкнеться о 23:00 — приблизно через {{ left }} год.
        {% else %}
        {% set left = (7 - h) if h < 7 else (31 - h) %}
        Зараз діє **нічна** ставка. Денна ввімкнеться о 07:00 — приблизно через {{ left }} год.
        {% endif %}

        Ставки редагуються прямо тут, YAML правити не треба. Сутність тарифу сама
        перемикається о 07:00 і о 23:00, і саме за нею Energy-панель рахує вартість.
  # --- Секція 3 · День проти ночі ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Дорогий день і дешева ніч
      icon: mdi:theme-light-dark
      grid_options:
        columns: full
    - type: tile
      entity: sensor.vitrati_vden_sogodni
      name: Удень сьогодні
      icon: mdi:white-balance-sunny
      color: orange
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.vitrati_vnochi_sogodni
      name: Уночі сьогодні
      icon: mdi:weather-night
      color: purple
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.merezha_dobovyi_den
      name: Спожито вдень
      icon: mdi:transmission-tower-export
      color: orange
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.merezha_dobovyi_nich
      name: Спожито вночі
      icon: mdi:transmission-tower-export
      color: purple
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.vitrati_vden_tsogo_misiatsia
      name: Удень за місяць
      icon: mdi:white-balance-sunny
      color: orange
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.vitrati_vnochi_tsogo_misiatsia
      name: Уночі за місяць
      icon: mdi:weather-night
      color: purple
      grid_options:
        columns: 12
        rows: 1
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set kd = states('sensor.merezha_dobovyi_den') | float(0) %}
        {% set kn = states('sensor.merezha_dobovyi_nich') | float(0) %}
        {% set gd = states('sensor.vitrati_vden_sogodni') | float(0) %}
        {% set gn = states('sensor.vitrati_vnochi_sogodni') | float(0) %}
        {% if kd > 0 and kn > 0 %}
        Сьогодні вночі спожито {{ kn | round(1) }} кВт·год проти {{ kd | round(1) }} удень,
        а коштувало це {{ gn | round(2) }} проти {{ gd | round(2) }} грн.
        Причина різниці: нічна ставка вдвічі нижча. Що більше важкого —
        бойлера, заряджання авто, прання — переноситься на ніч, то менший рахунок.
        {% else %}
        Нічний тариф удвічі дешевший за денний. Переносьте на ніч усе, що можна
        відкласти: бойлер, заряджання авто, прання.
        {% endif %}
  # --- Секція 3.5 · Сьогодні по годинах ---
  #
  # Тайли в секції 3 дають два підсумкових числа за добу, але не криву: коли
  # саме витрачено. Спершу тут стояв period: 5minute - і саме тому 24.08.2026
  # завів incident 63bfcabf. Дані виявились правильними (окрема перевірка проти
  # sensor.zariadka_avto_spozhito за той самий вечір збіглася до сотих), а
  # проблема - у масштабі: 5-хвилинне вікно ловить нормальну пульсацію струму
  # зарядного пристрою, і піки в 12-14 кВт на око читаються як несправність,
  # хоча середнє за вечір - 6-8 кВт. На годинному кроці той самий вечір дає
  # плавну криву без оманливих піків. Подробиці - docs/energy-accounting-spec.md,
  # розділ 14.
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Сьогодні, по годинах
      icon: mdi:chart-timeline-variant
      grid_options:
        columns: full
    - type: statistics-graph
      title: Спожито з мережі, по годинах
      days_to_show: 1
      period: hour
      stat_types:
      - change
      chart_type: bar
      grid_options:
        columns: full
      entities:
      - entity: sensor.merezha_spozhyto
        name: Спожито

  # --- Секція 4 · Куди пішли гроші ---
  #
  # До 24.08.2026 картка не мала жодної позначки періоду, хоча шість
  # sensor.vitrati_* під нею - наростаючі лічильники БЕЗ cycle: (розділ
  # "Вартість у гривнях" у configuration.yaml), тобто рахують від дня, коли
  # кожному пристрою поставили власний лічильник, а не за місяць і не за
  # сьогодні. Власник побачив суму на екрані і не зміг здогадатися, який це
  # період. Перетворювати на щомісячний лічильник (новий utility_meter на
  # кожен з пʼяти пристроїв) означало б рестарт HA заради формулювання - тому
  # замість цього картку підписано чесно, а не перераховано.
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Куди пішли гроші (за весь час обліку)
      icon: mdi:devices
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set items = [
             ('Інше — без лічильника', 'sensor.vitrati_inshe_bez_lichilnika'),
             ('Зарядка авто', 'sensor.vitrati_zariadka_avto'),
             ('Бойлер', 'sensor.vitrati_boiler'),
             ('Насос поливу', 'sensor.vitrati_nasos_polivu'),
             ('Тепла підлога 1', 'sensor.vitrati_tepla_pidloga_1'),
             ('Тепла підлога 2', 'sensor.vitrati_tepla_pidloga_2')
           ] %}
        {% set ns = namespace(rows=[], total=0.0) %}
        {% for name, ent in items %}{% set v = states(ent) | float(0) %}{% set ns.rows = ns.rows + [(v, name)] %}{% set ns.total = ns.total + v %}{% endfor %}

        Наростаючим підсумком з дня, коли на пристрій поставили лічильник —
        **не місяць і не сьогодні**, найдавніший початок 2 серпня 2026. Те саме
        по днях і по місяцях — у розділах «Динаміка» і «По місяцях» нижче.

        {# Смуги малюються кольоровими емодзі-квадратами: Home Assistant вирізає з
           markdown увесь HTML зі стилями, тому справжні смуги без card-mod
           неможливі, а символи ░ ▓ рендеряться строкато. #}
        {% set bars = ['🟧', '🟦', '🟩', '🟪', '🟨', '🟥'] %}
        {% for v, name in ns.rows | sort(reverse=true) %}
        {%- set pct = (100 * v / ns.total) if ns.total > 0 else 0 -%}
        {%- set filled = (pct / 100 * 20) | round(0) | int -%}
        **{{ name }}** — {{ v | round(2) }} грн · {{ pct | round(0) | int }} %
        {{ bars[loop.index0 % 6] * filled }}{{ '⬛' * (20 - filled) }}
        {% endfor %}
        **Разом — {{ ns.total | round(2) }} грн**

        {% set other = states('sensor.vitrati_inshe_bez_lichilnika') | float(0) %}
        {% if ns.total > 0 and (100 * other / ns.total) > 50 %}
        🟠 **{{ (100 * other / ns.total) | round(0) | int }} % витрат не мають джерела.**
        Причина: власні лічильники стоять лише на п'яти пристроях, а решта дому —
        холодильник, освітлення, мережеве обладнання, дрібна техніка — вимірюється
        тільки загальним лічильником. Зменшити цей рядок можна єдиним способом:
        додати лічильники на конкретні лінії.
        {% endif %}
  # --- Секція 5 · Динаміка ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Динаміка витрат — по днях, останні 40 діб
      icon: mdi:chart-bar-stacked
      grid_options:
        columns: full
    # Окрема картка "день проти ночі за добу" стояла тут до 24.08.2026 і пішла:
    # її загальні суми (з інвертора) не сходилися з нижньою по-пристрійною
    # карткою для того самого дня, бо зарядка авто та інші прямі споживачі йдуть
    # повз інвертор і в його показ не потрапляють. День проти ночі лишається
    # видимим - тайлами в секції 3 і місячним графіком у секції 6, де для цього
    # порівняння інверторної глибини (11,5 діб) достатньо.
    #
    # Окрема картка "день проти ночі за добу" стояла тут до 24.08.2026 і пішла:
    # її загальні суми (з інвертора) не сходилися з нижньою по-пристрійною
    # карткою для того самого дня, бо зарядка авто та інші прямі споживачі йдуть
    # повз інвертор і в його показ не потрапляють. День проти ночі лишається
    # видимим - тайлами в секції 3 і місячним графіком у секції 6.
    #
    # days_to_show: 40 (24.08.2026). Раніше тут стояло 11 - тимчасове звуження,
    # поки sensor.vitrati_zariadka_avto й sensor.vitrati_nasos_polivu мали
    # хибний відʼємний change на межі порожньої зони (1-2 серпня). Причина -
    # graft_old_board_all.py 23.08.2026 не посадив найстаріші sum двадцяти
    # серій на нуль, лишивши їх на анкерному зсуві. Виправлено 24.08.2026:
    # rebase_statistics_sums.py + rebase_short_term_sums.py, обидві таблиці.
    # Перевірено після ребейзу: падінь немає, крім трьох сотих кВт-год у
    # насосній телеметрії старої плати - вони в самому джерелі, не тут.
    - type: statistics-graph
      title: Гривні за добу по пристроях · 14 днів
      days_to_show: 14
      period: day
      stat_types:
      - change
      chart_type: bar
      grid_options:
        columns: full
      entities:
      - entity: sensor.vitrati_boiler
        name: Бойлер
      - entity: sensor.vitrati_zariadka_avto
        name: Зарядка авто
      - entity: sensor.vitrati_tepla_pidloga_1
        name: Тепла підлога 1
      - entity: sensor.vitrati_tepla_pidloga_2
        name: Тепла підлога 2
      - entity: sensor.vitrati_nasos_polivu
        name: Насос поливу
      - entity: sensor.vitrati_inshe_bez_lichilnika
        name: Інше
  # --- Секція 6 · По місяцях ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: По місяцях — до 12 останніх місяців
      icon: mdi:calendar-month
      grid_options:
        columns: full
    # Джерело - лічильник, не інвертор (змінено 24.08.2026). Інвертор бачить
    # лише свою гілку і має лише 11,5 доби статистики; sensor.energy_meter_total_energy
    # - це показ самого трифазного лічильника, і 23.08.2026 його історію
    # прищепили зі старої плати аж до 26.07 - 29 діб за весь наявний період.
    #
    # days_to_show: 366 повернуто 24.08.2026. Найстаріший рядок цієї серії мав
    # sum=-1133.38 замість нуля (щеплення 23.08 не завершило крок 7 власної
    # інструкції), і будь-який запит, що сягав порожньої зони до 26.07, малював
    # на межі фантомний мінус - місяць "липень" ставав відʼємним стовпчиком.
    # Виправлено rebase_statistics_sums.py + rebase_short_term_sums.py по обох
    # таблицях; найстаріший sum тепер 0.0, липень і серпень чисті.
    - type: statistics-graph
      title: Спожито з мережі
      days_to_show: 366
      period: month
      stat_types:
      - change
      chart_type: bar
      grid_options:
        columns: full
      entities:
      - entity: sensor.energy_meter_total_energy
        name: З мережі (лічильник, хмара)
      - entity: sensor.merezha_spozhyto
        name: З мережі (локально, з 23.08) (тестування)
    - type: statistics-graph
      title: Гривні · день проти ночі
      days_to_show: 366
      period: month
      stat_types:
      - change
      chart_type: bar
      grid_options:
        columns: full
      entities:
      - entity: sensor.vitrati_vden_razom
        name: Удень
      - entity: sensor.vitrati_vnochi_razom
        name: Уночі
    # Відповідь на власну гіпотезу власника 24.08.2026: "якщо по пристроях -
    # то за місяць, то, можливо, його в історію" - те саме шість sensor.vitrati_*,
    # що й у секції 4 і 5, але тут period: month показує, скільки на кожен
    # пристрій пішло за кожен календарний місяць, а не наростаючим підсумком.
    - type: statistics-graph
      title: Гривні по пристроях, за місяцями
      days_to_show: 366
      period: month
      stat_types:
      - change
      chart_type: bar
      grid_options:
        columns: full
      entities:
      - entity: sensor.vitrati_boiler
        name: Бойлер
      - entity: sensor.vitrati_zariadka_avto
        name: Зарядка авто
      - entity: sensor.vitrati_tepla_pidloga_1
        name: Тепла підлога 1
      - entity: sensor.vitrati_tepla_pidloga_2
        name: Тепла підлога 2
      - entity: sensor.vitrati_nasos_polivu
        name: Насос поливу
      - entity: sensor.vitrati_inshe_bez_lichilnika
        name: Інше
  # --- Секція 7 · Довідка ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Довідка
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        <details><summary>Чому історія до 3 серпня порахована за старою ціною</summary>

        Двозонний тариф підключено 2026-08-03. Перерахунок стосується лише
        споживання після цієї дати; попередня історія порахована за старою плоскою
        ціною 2,5 грн і заднім числом не переписується.

        </details>

        <details><summary>Як зменшити «Інше»</summary>

        «Інше» — це різниця між загальним лічильником і сумою відомих пристроїв.
        Зменшити її можна лише додаванням лічильників: розумні розетки з
        вимірюванням на великих споживачах або окремі модулі на лінії в щитку.
        Найперші кандидати — холодильник, пральна машина, кондиціонери.

        </details>

        <details><summary>Офіційний облік Home Assistant</summary>

        Вкладка **«Облік HA»** показує ті самі дані очима вбудованої системи
        енергообліку: розподіл по джерелах, споживання по пристроях і вартість за
        тарифом. З 24.08.2026 вона бере імпорт із `sensor.energy_meter_total_energy`
        (сам лічильник, увесь ввід) замість інвертора, який бачив лише свою гілку
        і губив до 27% споживання. Будується з погодинної довгострокової
        статистики, тому остання неповна година може з'явитися із затримкою до
        однієї години.

        </details>

        <details><summary>Чи можна обрати довільний період або рік споживання</summary>

        Кожна картка на цій вкладці — фіксоване вікно, підписане в заголовку:
        сьогодні (по годинах), 40 діб (по днях) або до 12 місяців (по
        місяцях і в гривнях по пристроях за місяцями) — це і є огляд за рік.
        Картка `statistics-graph`, з якої вони всі зроблені, живого вибору
        дат не підтримує — така можливість є лише в офіційній вкладці
        **«Історія»** в бічному меню Home Assistant: там є календар з довільним
        діапазоном для будь-якого з цих сенсорів, включно з `sensor.vitrati_*`
        і `sensor.energy_meter_total_energy`.

        </details>
- title: Облік HA
  path: energy
  icon: mdi:home-lightning-bolt
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Офіційний облік енергії Home Assistant
      icon: mdi:home-lightning-bolt
      grid_options:
        columns: full
    - type: energy-date-selection
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Це вбудована система енергообліку Home Assistant, перенесена сюди з окремої
        панелі «Енергія». Причина перенесення: тримати всі енергетичні показники в
        одному дашборді, а не в двох різних розділах меню.

        Ці картки мають власний фіксований вигляд — вони не налаштовуються так, як
        решта сторінок проєкту.
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Споживання за період
      icon: mdi:chart-bar
      grid_options:
        columns: full
    - type: energy-usage-graph
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
