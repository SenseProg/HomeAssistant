      heading: Розподіл
      icon: mdi:chart-donut
      grid_options:
        columns: full
    - type: energy-distribution
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Джерела
      icon: mdi:table
      grid_options:
        columns: full
    - type: energy-sources-table
      grid_options:
        columns: full
  - type: grid
    column_span: 4
