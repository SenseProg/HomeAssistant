- title: Інвертор
  path: inverter
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:sunsynk-power-flow-card
      cardstyle: lite
      panel_mode: false
      large_font: true
      show_solar: false
      inverter:
        modern: true
        three_phase: true
        model: deye
        autarky: power
      battery:
        energy: 10000
        shutdown_soc: 15
        show_daily: true
        invert_power: false
        animation_speed: 6
        max_power: 5000
      load:
        show_daily: true
        animation_speed: 8
        max_power: 15000
        show_absolute: false
      grid:
        show_daily_buy: true
        show_daily_sell: true
        animation_speed: 8
        max_power: 15000
        invert_grid: false
      entities:
        inverter_status_59: sensor.inverter_device_state
        inverter_power_175: sensor.inverter_power
        inverter_voltage_154: sensor.inverter_output_l2_voltage
        load_frequency_192: sensor.inverter_load_frequency
        dc_transformer_temp_90: sensor.inverter_dc_temperature
        battery_soc_184: sensor.inverter_battery
        battery_power_190: sensor.inverter_battery_power
        battery_voltage_183: sensor.inverter_battery_voltage
        battery_current_191: sensor.inverter_battery_current
        battery_temp_182: sensor.inverter_battery_temperature
        day_battery_charge_70: sensor.inverter_today_battery_charge
        day_battery_discharge_71: sensor.inverter_today_battery_discharge
        grid_ct_power_172: sensor.inverter_grid_power
        grid_power_169: sensor.inverter_grid_power
        grid_ct_power_l2: sensor.inverter_grid_l2_power
        grid_ct_power_l3: sensor.inverter_grid_l3_power
        grid_voltage: sensor.inverter_grid_l1_voltage
        grid_connected_status_194: sensor.inverter_device_relay
        day_grid_import_76: sensor.inverter_today_energy_import
        day_grid_export_77: sensor.inverter_today_energy_export
        essential_power: sensor.inverter_load_power
        load_power_l1: sensor.inverter_load_l1_power
        load_power_l2: sensor.inverter_load_l2_power
        load_power_l3: sensor.inverter_load_l3_power
        day_load_energy_84: sensor.inverter_today_load_consumption
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: entities
      title: Батарея
      grid_options:
        columns: full
      entities:
      - entity: sensor.inverter_battery
        name: Заряд (SOC)
      - entity: sensor.inverter_battery_power
        name: Потужність
      - entity: sensor.inverter_battery_voltage
        name: Напруга
      - entity: sensor.inverter_battery_state
        name: Стан
      - entity: sensor.inverter_battery_soh
        name: Здоров'я (SOH)
      - entity: sensor.inverter_battery_temperature
        name: Температура
      - entity: sensor.inverter_total_battery_life_cycles
        name: Циклів за весь час
    - type: entities
      title: Інвертор і мережа
      grid_options:
        columns: full
      entities:
      - entity: sensor.inverter_device_state
        name: Стан пристрою
      - entity: sensor.inverter_device_relay
        name: Реле
      - entity: sensor.inverter_device_alarm
        name: Аварія
      - entity: sensor.inverter_grid_frequency
        name: Частота мережі
      - entity: sensor.inverter_dc_temperature
        name: Температура DC
      - entity: sensor.inverter_today_energy_import
        name: Спожито з мережі сьогодні
      - entity: sensor.inverter_today_load_consumption
        name: Навантаження сьогодні
- title: Тариф
  path: tariff
  icon: mdi:cash-clock
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Двозонний тариф
      grid_options:
        columns: full
    - type: tile
      entity: sensor.tarif_elektroenergii_zaraz
      name: Діє зараз
      grid_options:
        columns: full
    - type: tile
      entity: input_number.tarif_den_07_00_22_59
      name: День (07:00-22:59)
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: box
    - type: tile
      entity: input_number.tarif_nich_23_00_06_59
      name: Ніч (23:00-06:59)
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: box
    - type: entities
      title: Витрати
      grid_options:
        columns: full
      entities:
      - entity: sensor.energy_meter_total_energy_cost
        name: Вартість спожитого (наростаюча)
      - entity: sensor.energy_meter_total_energy
        name: Лічильник будинку
    - type: history-graph
      title: Перемикання тарифу за добу
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.tarif_elektroenergii_zaraz
        name: Ставка
    - type: markdown
      title: Як це працює
      grid_options:
        columns: full
      content: >
        Energy-дашборд рахує вартість не за фіксованою ціною, а за сутністю
        `sensor.tarif_elektroenergii_zaraz`, яка сама перемикається між денною
        і нічною ставкою о 07:00 і о 23:00. Ставки редагуються прямо тут -
        YAML правити не треба.

        Важливо: перерахунок стосується лише споживання ПІСЛЯ підключення
        тарифу (2026-08-03). Історія до цього моменту порахована за старою
        плоскою ціною 2.5 грн і заднім числом не переписується.
- title: Наживо
  path: live
  icon: mdi:pulse
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Потужність зараз
      grid_options:
        columns: full
    - type: tile
      entity: sensor.zagalne_navantazhennia
      name: Весь будинок
      grid_options:
        columns: full
    - type: tile
      entity: sensor.zariadka_7_5kvt_device_kw
      name: Зарядка авто
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.boiler_potuzhnist
      name: Бойлер
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.nasos_polivu_potuzhnist_zaraz
      name: Насос поливу
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.tarif_elektroenergii_zaraz
      name: Тариф
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Спожито сьогодні (оновлюється миттєво)
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.energy_meter_budinok_spozhito_sogodni
        name: Весь будинок
      - type: divider
      - entity: sensor.zariadka_avto_sogodni
        name: Зарядка авто
      - entity: sensor.boiler_sogodni
        name: Бойлер
      - entity: sensor.nasos_polivu_energiia_sogodni
        name: Насос поливу
      - entity: sensor.terneo_1_tepla_pidloga_1_sogodni
        name: Тепла підлога 1
  - type: grid
    cards:
    - type: heading
      heading: Деталізація по 5 хвилин
      grid_options:
        columns: full
    - type: statistics-graph
      title: Зарядка авто
      chart_type: bar
      period: 5minute
      days_to_show: 1
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.zariadka_avto_spozhito
        name: Зарядка
    - type: statistics-graph
      title: Весь будинок
      chart_type: bar
      period: 5minute
      days_to_show: 1
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.energy_meter_total_energy
        name: Будинок
  - type: grid
    cards:
    - type: markdown
      title: Чому Енергія показує менше
      grid_options:
        columns: full
      content: >
        Розділ "Енергія" малює ГОДИННУ статистику. Поточна година туди
        потрапляє лише після того, як вона закінчиться, тому о 23:40 там ще
        видно дані за 22:00 - і це не застарілість, а те, як влаштований
        дашборд. Оновлення сторінки не допоможе: годинного запису за поточну
        годину просто ще не існує.

        Перевірено 2026-08-03: годинна статистика зарядки давала 0.236 кВт-год
        за 22:00, тоді як 5-хвилинна вже показувала 3.992, а сам сенсор -
        4.125. Тому ця вкладка побудована на 5-хвилинній статистиці та на
        добових лічильниках, які є звичайними сутностями й оновлюються з
        кожною зміною - без очікування кінця години.
  - type: grid
    cards:
    - type: heading
      heading: Хто споживає зараз
      grid_options:
        columns: full
    - type: tile
      entity: sensor.naibilshii_spozhivach_zaraz
      name: Найбільший споживач
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: >
        {% set loads = [
          ('Зарядка авто','sensor.zariadka_7_5kvt_device_kw',1),
          ('Бойлер','sensor.boiler_potuzhnist',0.001),
          ('Насос поливу','sensor.nasos_polivu_potuzhnist_zaraz',0.001),
          ('Тепла підлога 1','sensor.terneo_1_current_power',0.001),
          ('Тепла підлога 2','sensor.terneo_2_current_power',0.001)] %}
        {% set total = states('sensor.zagalne_navantazhennia') | float(0) %}
        {% set ns = namespace(rows=[], known=0.0) %}
        {% for name, ent, k in loads %}
          {% set v = (states(ent) | float(0)) * k %}
          {% if v > 0.05 %}{% set ns.rows = ns.rows + [(v, name)] %}
          {% set ns.known = ns.known + v %}{% endif %}
        {% endfor %}
        {% set other = total - ns.known %}
        {% if other > 0.05 %}{% set ns.rows = ns.rows + [(other,'Інше (не враховане)')] %}{% endif %}
        {% if ns.rows | length == 0 %}
        Зараз нічого суттєвого не працює. Загальне навантаження **{{ total | round(2) }} кВт**.
        {% else %}
        {% for v, name in ns.rows | sort(reverse=true) %}
        **{{ name }}** — {{ v | round(2) }} кВт&nbsp;&nbsp;({{ (100 * v / total) | round(0) | int if total > 0 else 0 }}%)
        {% endfor %}
        ---
        Разом: **{{ total | round(2) }} кВт** · тариф {{ states('sensor.tarif_elektroenergii_zaraz') }} грн/кВт·год
        {% endif %}
    - type: markdown
      title: Про "Інше"
      grid_options:
        columns: full
      content: >
        Це різниця між показом загального лічильника і сумою тих приладів, у
        яких є власне вимірювання. Туди потрапляє все неметроване -
        холодильник, освітлення, техніка. Велике стабільне "Інше" вночі варте
        уваги: це або забутий прилад, або той самий нез'ясований циклічний
        навантажувач на фазі A, який досі не ідентифіковано.
