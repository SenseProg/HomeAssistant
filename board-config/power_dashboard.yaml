- title: Вибір періоду
  path: period
  icon: mdi:calendar-search
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: energy-date-selection
      grid_options:
        columns: full
    - type: markdown
      title: Стан обліку Energy
      grid_options:
        columns: full
      content: |
        {% set source = 'sensor.inverter_total_energy_import' %}
        {% set missing = ['unknown', 'unavailable', 'none', ''] %}
        {% if states(source) in missing %}
        ## ⚠️ Дані про енергію зараз не надходять

        Основне джерело `{{ source }}` має стан **{{ states(source) }}**. Поки
        лічильник недоступний, Home Assistant не може додати нові значення на
        графік за сьогодні.
        {% else %}
        ## ✅ Облік працює

        **З мережі сьогодні:** {{ states('sensor.inverter_today_energy_import') }} кВт·год  
        **Навантаження будинку сьогодні:** {{ states('sensor.inverter_today_load_consumption') }} кВт·год

        Офіційна панель «Енергія» бере імпорт із
        `sensor.inverter_total_energy_import`. Графік будується з погодинної
        довгострокової статистики, тому остання неповна година може з'явитися із
        затримкою до однієї години. Імпорт із мережі та навантаження будинку
        можуть відрізнятися через заряджання або розряджання акумулятора.
        {% endif %}

        {% if states('sensor.energy_meter_total_energy') in missing %}
        > Хмарний лічильник Tuya зараз **{{ states('sensor.energy_meter_total_energy') }}**.
        > Саме він був причиною порожнього графіка 5 серпня; тепер це резервне
        > джерело й на основний облік не впливає.
        {% endif %}
    - type: statistics-graph
      title: Загальна потужність за вибраний період
      period: hour
      energy_date_selection: true
      stat_types:
      - mean
      - max
      chart_type: line
      entities:
      - entity: sensor.zagalne_navantazhennia
        name: Разом
      grid_options:
        columns: full
    - type: statistics-graph
      title: Потужність фаз за вибраний період
      period: hour
      energy_date_selection: true
      stat_types:
      - mean
      chart_type: line
      entities:
      - entity: sensor.energy_meter_phase_a_power_2
        name: Фаза A
      - entity: sensor.energy_meter_phase_b_power_2
        name: Фаза B
      - entity: sensor.energy_meter_phase_c_power_2
        name: Фаза C
      grid_options:
        columns: full
    - type: statistics-graph
      title: Напруга за вибраний період (мін/сер/макс)
      period: hour
      energy_date_selection: true
      stat_types:
      - min
      - mean
      - max
      chart_type: line
      entities:
      - entity: sensor.energy_meter_phase_a_voltage_2
        name: Фаза A
      - entity: sensor.energy_meter_phase_b_voltage_2
        name: Фаза B
      - entity: sensor.energy_meter_phase_c_voltage_2
        name: Фаза C
      grid_options:
        columns: full
    - type: statistics-graph
      title: Струм за вибраний період
      period: hour
      energy_date_selection: true
      stat_types:
      - mean
      - max
      chart_type: line
      entities:
      - entity: sensor.zagalnii_strum
        name: Разом
      grid_options:
        columns: full
- title: Інвертор
  path: inverter
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:sunsynk-power-flow-card
      cardstyle: lite
      panel_mode: false
      large_font: true
      show_solar: false
      inverter:
        modern: true
        three_phase: true
        model: deye
        autarky: power
      battery:
        energy: 10000
        shutdown_soc: 15
        show_daily: true
        invert_power: false
        animation_speed: 6
        max_power: 5000
      load:
        show_daily: true
        animation_speed: 8
        max_power: 15000
        show_absolute: false
      grid:
        show_daily_buy: true
        show_daily_sell: true
        animation_speed: 8
        max_power: 15000
        invert_grid: false
      entities:
        inverter_status_59: sensor.inverter_device_state
        inverter_power_175: sensor.inverter_power
        inverter_voltage_154: sensor.inverter_output_l2_voltage
        load_frequency_192: sensor.inverter_load_frequency
        dc_transformer_temp_90: sensor.inverter_dc_temperature
        battery_soc_184: sensor.inverter_battery
        battery_power_190: sensor.inverter_battery_power
        battery_voltage_183: sensor.inverter_battery_voltage
        battery_current_191: sensor.inverter_battery_current
        battery_temp_182: sensor.inverter_battery_temperature
        day_battery_charge_70: sensor.inverter_today_battery_charge
        day_battery_discharge_71: sensor.inverter_today_battery_discharge
        grid_ct_power_172: sensor.inverter_grid_power
        grid_power_169: sensor.inverter_grid_power
        grid_ct_power_l2: sensor.inverter_grid_l2_power
        grid_ct_power_l3: sensor.inverter_grid_l3_power
        grid_voltage: sensor.inverter_grid_l1_voltage
        grid_connected_status_194: sensor.inverter_device_relay
        day_grid_import_76: sensor.inverter_today_energy_import
        day_grid_export_77: sensor.inverter_today_energy_export
        essential_power: sensor.inverter_load_power
        load_power_l1: sensor.inverter_load_l1_power
        load_power_l2: sensor.inverter_load_l2_power
        load_power_l3: sensor.inverter_load_l3_power
        day_load_energy_84: sensor.inverter_today_load_consumption
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: entities
      title: Батарея
      grid_options:
        columns: full
      entities:
      - entity: sensor.inverter_battery
        name: Заряд (SOC)
      - entity: sensor.inverter_battery_power
        name: Потужність
      - entity: sensor.inverter_battery_voltage
        name: Напруга
      - entity: sensor.inverter_battery_state
        name: Стан
      - entity: sensor.inverter_battery_soh
        name: Здоров'я (SOH)
      - entity: sensor.inverter_battery_temperature
        name: Температура
      - entity: sensor.inverter_total_battery_life_cycles
        name: Циклів за весь час
    - type: entities
      title: Інвертор і мережа
      grid_options:
        columns: full
      entities:
      - entity: sensor.inverter_device_state
        name: Стан пристрою
      - entity: sensor.inverter_device_relay
        name: Реле
      - entity: sensor.inverter_device_alarm
        name: Аварія
      - entity: sensor.inverter_grid_frequency
        name: Частота мережі
      - entity: sensor.inverter_dc_temperature
        name: Температура DC
      - entity: sensor.inverter_today_energy_import
        name: Спожито з мережі сьогодні
      - entity: sensor.inverter_today_load_consumption
        name: Навантаження сьогодні
- title: Тариф
  path: tariff
  icon: mdi:cash-clock
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Двозонний тариф
      grid_options:
        columns: full
    - type: tile
      entity: sensor.tarif_elektroenergii_zaraz
      name: Діє зараз
      grid_options:
        columns: full
    - type: tile
      entity: input_number.tarif_den_07_00_22_59
      name: День (07:00-22:59)
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: box
    - type: tile
      entity: input_number.tarif_nich_23_00_06_59
      name: Ніч (23:00-06:59)
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: box
    - type: entities
      title: Витрати
      grid_options:
        columns: full
      entities:
      - entity: sensor.inverter_total_energy_import_cost
        name: Вартість спожитого (наростаюча)
      - entity: sensor.inverter_total_energy_import
        name: Імпорт із мережі (лічильник інвертора)
    - type: custom:mini-graph-card
      name: Перемикання тарифу за добу
      hours_to_show: 24
      points_per_hour: 4
      line_width: 3
      animate: true
      show:
        labels: true
        points: false
      grid_options:
        columns: full
      entities:
      - entity: sensor.tarif_elektroenergii_zaraz
        name: Ставка
    - type: markdown
      title: Як це працює
      grid_options:
        columns: full
      content: 'Energy-дашборд рахує вартість не за фіксованою ціною, а за сутністю `sensor.tarif_elektroenergii_zaraz`,
        яка сама перемикається між денною і нічною ставкою о 07:00 і о 23:00. Ставки редагуються прямо
        тут - YAML правити не треба.

        Важливо: перерахунок стосується лише споживання ПІСЛЯ підключення тарифу (2026-08-03). Історія
        до цього моменту порахована за старою плоскою ціною 2.5 грн і заднім числом не переписується.

        '
