views:
- title: Зараз
  path: power
  icon: mdi:flash
  cards:
  - type: gauge
    entity: sensor.zagalne_navantazhennia
    name: Навантаження зараз
    unit: kW
    min: 0
    max: 15
    needle: true
    severity:
      green: 0
      yellow: 6
      red: 11
  - type: markdown
    title: Хто бере потужність зараз
    content: "{% set loads = [\n            ('Зарядка авто','sensor.zariadka_7_5kvt_device_kw',1),\n \
      \           ('Бойлер','sensor.boiler_potuzhnist',0.001),\n            ('Насос поливу','sensor.nasos_polivu_potuzhnist_zaraz',0.001),\n\
      \            ('Тепла підлога 1','sensor.terneo_1_current_power',0.001),\n            ('Тепла підлога\
      \ 2','sensor.terneo_2_current_power',0.001)] %}\n          {% set total = states('sensor.zagalne_navantazhennia')\
      \ | float(0) %}\n          {% set ns = namespace(rows=[], known=0.0) %}\n          {% for name,\
      \ ent, k in loads %}\n            {% set v = (states(ent) | float(0)) * k %}\n            {% if\
      \ v > 0.05 %}{% set ns.rows = ns.rows + [(v, name)] %}\n            {% set ns.known = ns.known +\
      \ v %}{% endif %}\n          {% endfor %}\n          {% set other = total - ns.known %}\n      \
      \    {% if other > 0.05 %}{% set ns.rows = ns.rows + [(other,'Інше (не враховане)')] %}{% endif\
      \ %}\n          {% if ns.rows | length == 0 %}\n          Зараз нічого суттєвого не працює — **{{\
      \ total | round(2) }} кВт**.\n          {% else %}\n          {% for v, name in ns.rows | sort(reverse=true)\
      \ %}\n          **{{ name }}** — {{ v | round(2) }} кВт&nbsp;&nbsp;({{ (100 * v / total) | round(0)\
      \ | int if total > 0 else 0 }}%)\n          {% endfor %}\n          ---\n          Разом **{{ total\
      \ | round(2) }} кВт** · тариф {{ states('sensor.tarif_elektroenergii_zaraz') }} грн/кВт·год\n  \
      \        {% endif %}"
  - type: tile
    entity: sensor.naibilshii_spozhivach_zaraz
    name: Найбільший споживач
  - type: entities
    title: Миттєві показники (локально, опитування 5 с)
    entities:
    - entity: sensor.zagalne_navantazhennia
      name: Загальна потужність
    - entity: sensor.zagalnii_strum
      name: Загальний струм
    - type: divider
    - entity: sensor.energy_meter_phase_a_power_2
      name: Фаза A - потужність
    - entity: sensor.energy_meter_phase_b_power_2
      name: Фаза B - потужність
    - entity: sensor.energy_meter_phase_c_power_2
      name: Фаза C - потужність
    - type: divider
    - entity: sensor.energy_meter_phase_a_voltage_2
      name: Фаза A - напруга
    - entity: sensor.energy_meter_phase_b_voltage_2
      name: Фаза B - напруга
    - entity: sensor.energy_meter_phase_c_voltage_2
      name: Фаза C - напруга
  - type: custom:mini-graph-card
    name: Потужність за останню годину
    hours_to_show: 1
    points_per_hour: 60
    update_interval: 10
    line_width: 3
    animate: true
    show:
      labels: true
      points: false
    entities:
    - entity: sensor.zagalne_navantazhennia
      name: Разом
  - type: statistics-graph
    title: Потужність - 5-хвилинні зрізи за добу
    days_to_show: 1
    period: 5minute
    stat_types:
    - mean
    - max
    chart_type: line
    entities:
    - sensor.zagalne_navantazhennia
