views:
- title: Зараз
  path: power
  icon: mdi:flash
  cards:
  - type: gauge
    entity: sensor.zagalne_navantazhennia
    name: Навантаження зараз
    unit: kW
    min: 0
    max: 15
    needle: true
    severity:
      green: 0
      yellow: 6
      red: 11
  - type: entities
    title: Миттєві показники (локально, опитування 5 с)
    entities:
    - entity: sensor.zagalne_navantazhennia
      name: Загальна потужність
    - entity: sensor.zagalnii_strum
      name: Загальний струм
    - type: divider
    - entity: sensor.energy_meter_phase_a_power_2
      name: Фаза A - потужність
    - entity: sensor.energy_meter_phase_b_power_2
      name: Фаза B - потужність
    - entity: sensor.energy_meter_phase_c_power_2
      name: Фаза C - потужність
    - type: divider
    - entity: sensor.energy_meter_phase_a_voltage_2
      name: Фаза A - напруга
    - entity: sensor.energy_meter_phase_b_voltage_2
      name: Фаза B - напруга
    - entity: sensor.energy_meter_phase_c_voltage_2
      name: Фаза C - напруга
  - type: history-graph
    title: Потужність за останню годину (сирі дані)
    hours_to_show: 1
    entities:
    - entity: sensor.zagalne_navantazhennia
      name: Разом
  - type: statistics-graph
    title: Потужність - 5-хвилинні зрізи за добу
    days_to_show: 1
    period: 5minute
    stat_types:
    - mean
    - max
    chart_type: line
    entities:
    - sensor.zagalne_navantazhennia
- title: 3 години
  path: last-3h
  icon: mdi:clock-time-three-outline
  cards:
  - type: history-graph
    title: Загальна потужність за 3 години (сирі дані)
    hours_to_show: 3
    entities:
    - entity: sensor.zagalne_navantazhennia
      name: Разом
  - type: history-graph
    title: Потужність фаз за 3 години
    hours_to_show: 3
    entities:
    - entity: sensor.energy_meter_phase_a_power_2
      name: Фаза A
    - entity: sensor.energy_meter_phase_b_power_2
      name: Фаза B
    - entity: sensor.energy_meter_phase_c_power_2
      name: Фаза C
  - type: history-graph
    title: Струм за 3 години
    hours_to_show: 3
    entities:
    - entity: sensor.zagalnii_strum
      name: Разом
    - entity: sensor.energy_meter_phase_a_current_2
      name: Фаза A
    - entity: sensor.energy_meter_phase_b_current_2
      name: Фаза B
    - entity: sensor.energy_meter_phase_c_current_2
      name: Фаза C
  - type: history-graph
    title: Напруга за 3 години
    hours_to_show: 3
    entities:
    - entity: sensor.energy_meter_phase_a_voltage_2
      name: Фаза A
    - entity: sensor.energy_meter_phase_b_voltage_2
      name: Фаза B
    - entity: sensor.energy_meter_phase_c_voltage_2
      name: Фаза C
- title: Місяць
  path: month
  icon: mdi:calendar-month
  cards:
  - type: statistics-graph
    title: Загальна потужність за місяць (погодинно)
    days_to_show: 31
    period: hour
    stat_types:
    - mean
    - max
    chart_type: line
    entities:
    - entity: sensor.zagalne_navantazhennia
      name: Разом
  - type: statistics-graph
    title: Потужність фаз за місяць (погодинно)
    days_to_show: 31
    period: hour
    stat_types:
    - mean
    chart_type: line
    entities:
    - entity: sensor.energy_meter_phase_a_power_2
      name: Фаза A
    - entity: sensor.energy_meter_phase_b_power_2
      name: Фаза B
    - entity: sensor.energy_meter_phase_c_power_2
      name: Фаза C
  - type: statistics-graph
    title: Напруга за місяць (мін/сер/макс)
    days_to_show: 31
    period: hour
    stat_types:
    - min
    - mean
    - max
    chart_type: line
    entities:
    - entity: sensor.energy_meter_phase_a_voltage_2
      name: Фаза A
    - entity: sensor.energy_meter_phase_b_voltage_2
      name: Фаза B
    - entity: sensor.energy_meter_phase_c_voltage_2
      name: Фаза C
  - type: statistics-graph
    title: Струм за місяць (погодинно)
    days_to_show: 31
    period: hour
    stat_types:
    - mean
    - max
    chart_type: line
    entities:
    - entity: sensor.zagalnii_strum
      name: Разом
- title: Пів року
  path: half-year
  icon: mdi:calendar-range
  cards:
