poliv_zona_1:
  alias: Полити зону 1
  icon: mdi:sprinkler-variant
  mode: single
  max_exceeded: warning
  sequence:
  - action: switch.turn_on
    target:
      entity_id: switch.avtopoliv_kontroler_switch_1
  - delay:
      seconds: 3
  - action: switch.turn_on
    target:
      entity_id: switch.mini_switch_k601_2_switch_1_2
  - delay:
      minutes: '{{ states(''input_number.poliv_zona_1_hvylyn'') | int(10) }}'
  - action: switch.turn_off
    target:
      entity_id: switch.mini_switch_k601_2_switch_1_2
  - delay:
      seconds: 3
  - action: switch.turn_off
    target:
      entity_id: switch.avtopoliv_kontroler_switch_1
