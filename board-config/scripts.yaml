poliv_zona_1:
  alias: Полити зону 1
  icon: mdi:sprinkler-variant
  mode: single
  max_exceeded: warning
  sequence:
  - variables:
      minutes: '{{ states(''input_number.poliv_zona_1_hvylyn'') | int(25) }}'
      seconds: '{{ minutes * 60 }}'
      duration: '{{ ''%02d:%02d:00'' | format(minutes // 60, minutes % 60) }}'
  - action: localtuya.set_dp
    data:
      device_id: bf9f1d7fc7c912452cndy4
      value:
        '1': true
        '13': '{{ seconds }}'
  - wait_template: '{{ is_state(''switch.avtopoliv_kontroler_avtopoliv_klapan_1'', ''on'') }}'
    timeout: 00:00:08
    continue_on_timeout: true
  - choose:
    - conditions: '{{ is_state(''switch.avtopoliv_kontroler_avtopoliv_klapan_1'', ''on'') }}'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: poliv_zona_1_fault
    default:
    - action: localtuya.set_dp
      data:
        device_id: bf9f1d7fc7c912452cndy4
        value:
          '1': false
          '13': 0
    - action: persistent_notification.create
      data:
        notification_id: poliv_zona_1_fault
        title: Полив зони 1 не запущено
        message: Контролер не підтвердив відкриття клапана за 8 секунд. Насос не вмикався. Перевірте 24 В живлення контролера, спільний провід і котушку/проводку клапана зони 1.
    - stop: Клапан зони 1 не відкрився; запуск насоса заблоковано
      error: false
  - action: irrigation_unlimited.manual_run
    data:
      entity_id: binary_sensor.irrigation_unlimited_c1_z1
      time: '{{ duration }}'
      queue: false
  - action: localtuya.set_dp
    data:
      device_id: bf9f1d7fc7c912452cndy4
      dp: 13
      value: '{{ seconds }}'
  - action: timer.start
    target:
      entity_id: timer.poliv_zoni_1
    data:
      duration: '{{ duration }}'
