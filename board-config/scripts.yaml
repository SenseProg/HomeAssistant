poliv_stop_all:
  alias: Аварійно зупинити полив
  icon: mdi:stop-circle
  mode: restart
  sequence:
  - action: irrigation_unlimited.cancel
    data:
      entity_id: binary_sensor.irrigation_unlimited_c1_m
  - action: script.turn_off
    target:
      entity_id:
      - script.poliv_zona_1
      - script.poliv_zona_2
      - script.poliv_zona_3
      - script.poliv_zona_4
      - script.poliv_zona_5
  - wait_template: '{{ is_state(''switch.mini_switch_k601_2_switch_1_2'', ''off'') }}'
    timeout: 00:00:08
    continue_on_timeout: true
  - action: switch.turn_off
    target:
      entity_id: switch.mini_switch_k601_2_switch_1_2
  - delay:
      seconds: 3
  - action: switch.turn_off
    target:
      entity_id:
      - switch.avtopoliv_kontroler_avtopoliv_klapan_1
      - switch.avtopoliv_kontroler_avtopoliv_klapan_2
      - switch.avtopoliv_kontroler_avtopoliv_klapan_3
      - switch.avtopoliv_kontroler_avtopoliv_klapan_4
      - switch.avtopoliv_kontroler_avtopoliv_klapan_5
      - switch.avtopoliv_kontroler_avtopoliv_klapan_6
      - switch.avtopoliv_kontroler_avtopoliv_klapan_7
      - switch.avtopoliv_kontroler_avtopoliv_klapan_8
  - action: timer.cancel
    target:
      entity_id:
      - timer.poliv_zoni_1
      - timer.poliv_zoni_2
      - timer.poliv_zoni_3
      - timer.poliv_zoni_4
      - timer.poliv_zoni_5
tv_idle_slideshow:
  alias: TCL - фотозаставка у режимі простою
  description: Показує випадкові JPEG з двох перевірених альбомів NAS кожні 20 секунд. Запускається автоматизацією лише після 5 хвилин idle. Вимкнений телевізор не будить. Цикл завершується, коли телевізор
    стає недоступним, вимикається або користувач запускає інший застосунок/медіа.
  icon: mdi:image-multiple
  mode: restart
  sequence:
  - variables:
      tv: media_player.televizor_tcl
      photos:
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180126_170841_001.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180126_170859_001.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_001.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_002.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_003.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_004.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_005.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_006.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_007.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_008.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_009.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_010.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_011.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_012.jpg
      - media-source://media_source/local/foto/2018/01-18/Карпаты/20180127_132828_013.jpg
      - media-source://media_source/local/foto/2015/11-2015/Бахмут/20151105_104444.jpg
      - media-source://media_source/local/foto/2015/11-2015/Бахмут/20151105_104500.jpg
      - media-source://media_source/local/foto/2015/11-2015/Бахмут/20151105_104524.jpg
      - media-source://media_source/local/foto/2015/11-2015/Бахмут/20151105_104541.jpg
      - media-source://media_source/local/foto/2015/11-2015/Бахмут/image-5ded100ffad0124b665e242c5d0c0cfb02ea6a163da864284dcec8cc7138a858-V.jpg
  - repeat:
      while:
      - condition: template
        value_template: "{% set st = states(tv) %} {% set app = state_attr(tv, 'app_name') | default('', true) %} {% set kind = state_attr(tv, 'media_content_type') | default('', true) %} {{ st == 'idle'\n\
          \   or (st in ['playing', 'paused']\n       and (kind == 'image/jpeg'\n            or app in ['Default Media Receiver', 'Home Assistant Cast'])) }}"
      sequence:
      - variables:
          photo: '{{ photos | random }}'
      - action: media_player.play_media
        target:
          entity_id: '{{ tv }}'
        data:
          media_content_id: '{{ photo }}'
          media_content_type: image/jpeg
      - delay: 00:00:20
