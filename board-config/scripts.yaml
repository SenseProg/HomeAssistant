poliv_stop_all:
  alias: Аварійно зупинити полив
  icon: mdi:stop-circle
  mode: restart
  sequence:
  - action: irrigation_unlimited.cancel
    data:
      entity_id: binary_sensor.irrigation_unlimited_c1_m
  - action: script.turn_off
    target:
      entity_id:
      - script.poliv_zona_1
      - script.poliv_zona_2
      - script.poliv_zona_3
      - script.poliv_zona_4
      - script.poliv_zona_5
  - wait_template: '{{ is_state(''switch.mini_switch_k601_2_switch_1_2'', ''off'') }}'
    timeout: 00:00:08
    continue_on_timeout: true
  - action: switch.turn_off
    target:
      entity_id: switch.mini_switch_k601_2_switch_1_2
  - delay:
      seconds: 3
  - action: switch.turn_off
    target:
      entity_id:
      - switch.avtopoliv_kontroler_avtopoliv_klapan_1
      - switch.avtopoliv_kontroler_avtopoliv_klapan_2
      - switch.avtopoliv_kontroler_avtopoliv_klapan_3
      - switch.avtopoliv_kontroler_avtopoliv_klapan_4
      - switch.avtopoliv_kontroler_avtopoliv_klapan_5
      - switch.avtopoliv_kontroler_avtopoliv_klapan_6
      - switch.avtopoliv_kontroler_avtopoliv_klapan_7
      - switch.avtopoliv_kontroler_avtopoliv_klapan_8
  - action: timer.cancel
    target:
      entity_id:
      - timer.poliv_zoni_1
      - timer.poliv_zoni_2
      - timer.poliv_zoni_3
      - timer.poliv_zoni_4
      - timer.poliv_zoni_5
tv_idle_slideshow:
  alias: TCL - фотозаставка у режимі простою
  description: Показує випадкові фото з NAS кожні 20 секунд, з альбому, обраного
    в input_select.tv_zastavka_album. Запускається автоматизацією лише після 5
    хвилин idle. Вимкнений телевізор не будить. Цикл завершується, коли телевізор
    стає недоступним, вимикається або користувач запускає інший застосунок/медіа.
  icon: mdi:image-multiple
  mode: restart
  sequence:
  - variables:
      tv: media_player.televizor_tcl
  # Телевізор показує не голе фото, а сторінку Home Assistant. Інакше на екран
  # не можна було б винести ні дату зйомки, ні час, ні погоду з курсами:
  # play_media вміє тільки картинку, накласти на неї нічого не можна.
  - action: cast.show_lovelace_view
    data:
      entity_id: '{{ tv }}'
      dashboard_path: tv-dashboard
      view_path: foto
  - repeat:
      while:
      - condition: template
        value_template: "{% set st = states(tv) %} {% set app = state_attr(tv, 'app_name') | default('', true) %} {% set kind = state_attr(tv, 'media_content_type') | default('', true) %} {{ st == 'idle'
          \   or (st in ['playing', 'paused']
       and (kind == 'image/jpeg'
            or app in ['Default Media Receiver', 'Home Assistant Cast'])) }}"
      sequence:
      # Сам скрипт готує наступний кадр і оновлює sensor.tv_kadr, а сторінка на
      # телевізорі перемальовується від зміни сутності. Нічого пересилати на
      # екран щокадру більше не потрібно.
      - action: script.tv_foto_nastupne
      - delay: 00:00:20
poliv_zona_4:
  alias: Полити зону 4
  icon: mdi:sprinkler-variant
  mode: single
  max_exceeded: warning
  sequence:
  # Зона 4 - єдина, що керує насосом напряму і глушить його через delay. Якщо
  # запустити її під час циклу Irrigation Unlimited, це вимкнення заб'є чужий
  # полив: IU думатиме, що поливає, вода не потече, а сторож не спрацює, бо
  # клапан IU відкритий. Тихий недолив, який нічим не помітити.
  - if:
    - condition: state
      entity_id: binary_sensor.irrigation_unlimited_c1_m
      state: 'on'
    then:
    - action: persistent_notification.create
      data:
        notification_id: poliv_zona_4_fault
        title: Зону 4 не запущено
        message: Зараз працює автоматичний полив. Запустіть зону 4 після його
          завершення - інакше вимкнення насоса обірве поточний цикл.
    - stop: Активний цикл Irrigation Unlimited; ручний пуск зони 4 заблоковано
      error: false
  - variables:
      minutes: '{{ states(''input_number.poliv_zona_4_hvylyn'') | int(25) }}'
      seconds: '{{ minutes * 60 }}'
      duration: '{{ ''%02d:%02d:00'' | format(minutes // 60, minutes % 60) }}'
  - action: localtuya.set_dp
    data:
      device_id: bfb2143124def1078b549a
      value:
        '4': true
        # +180 с запасу, як у нічному розкладі: апаратний відлік контролера
        # має пережити зупинку від Home Assistant, а не обірвати полив
        # раніше за неї. Без запасу клапан закривався приблизно тоді ж,
        # коли зупинявся IU, і насос устигав кілька секунд качати в глухий кут.
        '16': '{{ seconds + 180 }}'
  - wait_template: '{{ is_state(''switch.avtopoliv_kontroler_avtopoliv_klapan_4'', ''on'') }}'
    timeout: 00:00:08
    continue_on_timeout: true
  - choose:
    - conditions: '{{ is_state(''switch.avtopoliv_kontroler_avtopoliv_klapan_4'', ''on'') }}'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: poliv_zona_4_fault
    default:
    - action: localtuya.set_dp
      data:
        device_id: bfb2143124def1078b549a
        value:
          '4': false
          '16': 0
    - action: persistent_notification.create
      data:
        notification_id: poliv_zona_4_fault
        title: Полив зони 4 не запущено
        message: Контролер не підтвердив відкриття клапана за 8 секунд. Насос не вмикався. Перевірте 24 В живлення контролера, спільний провід і котушку/проводку клапана зони 4.
    - stop: Клапан зони 4 не відкрився; запуск насоса заблоковано
      error: false
  - action: timer.start
    target:
      entity_id: timer.poliv_zoni_4
    data:
      duration: '{{ duration }}'
  - action: switch.turn_on
    target:
      entity_id: switch.mini_switch_k601_2_switch_1_2
  - delay:
      minutes: '{{ minutes }}'
  - action: switch.turn_off
    target:
      entity_id: switch.mini_switch_k601_2_switch_1_2
  - delay:
      seconds: 3
  - action: switch.turn_off
    target:
      entity_id: switch.avtopoliv_kontroler_avtopoliv_klapan_4
  - action: timer.cancel
    target:
      entity_id: timer.poliv_zoni_4
