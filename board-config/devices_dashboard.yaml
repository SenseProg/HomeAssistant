        **Без світла - вимкнути важкі споживачі** — Знімає з батареї все, що гріє і крутиться: підлогу, рекуператори, насоси, пральню. Велику пральну машину при цьому не вимикає, а ставить на паузу, щоб не лишити воду в баку.
