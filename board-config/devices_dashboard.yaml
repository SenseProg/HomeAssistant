    - type: markdown
      title: Як рахується електроенергія
      grid_options:
        columns: full
      content: '`sensor.zariadka_avto_spozhito` інтегрує фактичну потужність `sensor.zariadka_7_5kvt_device_kw`
        у часі. Стовпчики показують приріст цього накопичувального лічильника за кожну добу; графік живлення
        та потужності показує частоту і тривалість сесій.

        Датчик струму самої інтеграції зараз має неправильний масштаб та навіть помилкову одиницю «V»,
        тому на головній картці струм обчислюється як `потужність × 1000 / напруга` і явно позначений
        як приблизний.'
