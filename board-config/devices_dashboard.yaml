views:
- title: Мережа
  path: router
  icon: mdi:router-wireless
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: ASUS RT-AX55 · основний роутер «Отаке»
      icon: mdi:router-wireless
      grid_options:
        columns: full
    - type: entities
      title: ASUS RT-AX55 · 192.168.50.1
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_devices_connected
        name: Пристроїв підключено
      - entity: sensor.spalnia_batkiv_192_168_50_1_cpu_temperature
        name: Температура CPU
      - entity: sensor.spalnia_batkiv_192_168_50_1_5ghz_temperature
        name: Температура 5GHz радіо
      - type: divider
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_1_min
        name: Навантаження (1 хв)
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_5_min
        name: Навантаження (5 хв)
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_15_min
        name: Навантаження (15 хв)
    - type: entities
      title: Швидкість LAN-опитування
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
        name: Швидкість завантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload_speed
        name: Швидкість вивантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_download
        name: Завантажено (лічильник)
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload
        name: Вивантажено (лічильник)
    - type: history-graph
      title: Швидкість за 3 години
      hours_to_show: 3
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
        name: Завантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload_speed
        name: Вивантаження
    - type: markdown
      title: Про WAN-сенсори
      grid_options:
        columns: full
      content: >
        Вбудовані сенсори WAN-статусу і зовнішньої IP (через UPnP/IGD)
        на цьому роутері нестабільні і завжди повертають
        unavailable/0.0.0.0 - це обмеження прошивки ASUS, не Home
        Assistant. Прибрано з дашборда свідомо.
    - type: markdown
      title: Усі активні клієнти та їхня точка підключення
      grid_options:
        columns: full
      content: |
        **Позначення:** 🔌 Ethernet · 📶 Wi-Fi · частота/покоління вказуються
        лише тоді, коли їх повідомляє точка доступу. Сама частота 5 ГГц ще не
        доводить, що клієнт працює саме у Wi-Fi 5 або Wi-Fi 6.

        {% set ap_clients = state_attr('sensor.tenda_ap_clients', 'onlineList') or [] %}
        {% set repeater_clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set missing = ['unknown', 'unavailable', 'none', ''] %}
        {% set ap = namespace(macs=[]) %}
        {% set repeater = namespace(macs=[]) %}
        {% for client in ap_clients if client.qosListConnectType | default('') == 'wifi' and client.qosListMac is defined %}
          {% set ap.macs = ap.macs + [client.qosListMac | lower] %}
        {% endfor %}
        {% for client in repeater_clients if client.devMac is defined %}
          {% set repeater.macs = repeater.macs + [client.devMac | lower] %}
        {% endfor %}
        {% set names = {
          'device_tracker.homemate': 'HomeMate (ПК)',
          'device_tracker.ok3568': 'Плата Home Assistant MB35x8',
          'device_tracker.s23_ultra_dvk': 'Samsung S23 Ultra — Дмитро',
          'device_tracker.s24_koristuvaca_kateryna': 'Samsung S24 — Катерина',
          'device_tracker.s20_fe_koristuvaca_kateryna': 'Samsung S20 FE — Олеся',
          'device_tracker.s21_pol_zovatela_kateryna': 'Samsung Galaxy S21 — бабуся Сіма',
          'device_tracker.a24_koristuvaca_vasilij': 'Samsung Galaxy A24 — Василь',
          'device_tracker.galaxy_j8': 'Samsung Galaxy J8',
          'device_tracker.laptop_u1i8pnmk': 'Ноутбук LAPTOP-U1I8PNMK',
          'device_tracker.cloudmate': 'CloudMate — NAS QNAP',
          'device_tracker.esp_eea5c5': 'Blauberg №1 — кімната хлопців',
          'device_tracker.esp_eea84e': 'Blauberg №2 — кімната Олесі'
        } %}
        {% set ip_names = {
          '192.168.50.13': 'Термостат Terneo — контур 1',
          '192.168.50.25': 'CloudMate — NAS QNAP',
          '192.168.50.27': 'Blauberg №1 — кімната хлопців',
          '192.168.50.36': 'Зарядна станція авто — 7,5 кВт',
          '192.168.50.118': 'Бойлер Midea',
          '192.168.50.157': 'Термостат Terneo — контур 2',
          '192.168.50.164': 'SONOFF ZBBridge — Zigbee-шлюз',
          '192.168.50.176': 'Контролер гаражних воріт — Sonoff/eWeLink',
          '192.168.50.179': 'Інвертор Deye',
          '192.168.50.219': 'Трифазний лічильник електроенергії будинку',
          '192.168.50.221': 'Контролер автополиву Tuya — 8 зон'
        } %}
        {% set mac_names = {
          '00:08:9B:ED:62:EF': 'CloudMate — NAS QNAP',
          '04:D6:F4:70:AD:B3': 'Бойлер Midea',
          '08:3A:F2:2D:32:30': 'Контролер гаражних воріт — Sonoff/eWeLink',
          '14:2B:2F:E1:54:60': 'Рекуператор PRANA — спальня батьків',
          '30:83:98:C1:6E:AC': 'Термостат Terneo — контур 1',
          '3C:0B:59:11:9A:13': 'Зарядна станція авто — 7,5 кВт',
          '80:64:7C:46:E8:D1': 'Насос автополиву K601',
          '84:CC:A8:96:28:A7': 'SONOFF ZBBridge — Zigbee-шлюз',
          '98:F4:AB:EE:A5:C5': 'Blauberg №1 — кімната хлопців',
          '98:F4:AB:EE:A8:4E': 'Blauberg №2 — кімната Олесі',
          'D4:27:87:50:23:6C': 'Інвертор Deye',
          'D8:D6:68:31:BA:49': 'Трифазний лічильник електроенергії будинку',
          'E0:98:06:AF:B7:41': 'Термостат Terneo — контур 2',
          'DC:6A:E7:A1:09:F2': 'Xiaomi — модель не визначена',
          '62:1A:51:F4:B2:EE': 'Samsung Galaxy A24 — Василь',
          '38:2C:E5:2D:5B:32': 'Контролер автополиву Tuya — 8 зон'
        } %}
        {% set connection_types = {
          '00:08:9b:ed:62:ef': '🔌 Ethernet',
          '66:55:7e:21:d0:ac': '🔌 Ethernet',
          'b4:0f:3b:38:3f:50': '🔌 Ethernet',
          '10:12:fb:f7:95:ad': '🔌 Ethernet',
          '34:6f:24:b5:ad:4b': '📶 Wi-Fi · 5 ГГц',
          '06:55:69:ba:91:6f': '📶 Wi-Fi · 5 ГГц',
          '28:07:08:a8:10:66': '📶 Wi-Fi · 5 ГГц',
          '5e:82:f5:51:3c:0d': '📶 Wi-Fi · 5 ГГц',
          '70:09:71:a2:44:f4': '📶 Wi-Fi · 5 ГГц',
          '04:d6:f4:70:ad:b3': '📶 Wi-Fi · 2,4 ГГц',
          '08:3a:f2:2d:32:30': '📶 Wi-Fi · 2,4 ГГц',
          '14:2b:2f:e1:54:60': '📶 Wi-Fi · 2,4 ГГц',
          '30:83:98:c1:6e:ac': '📶 Wi-Fi · 2,4 ГГц',
          '3c:0b:59:11:9a:13': '📶 Wi-Fi · 2,4 ГГц',
          '38:2c:e5:2d:5b:32': '📶 Wi-Fi · 2,4 ГГц',
          'f0:35:75:b3:31:80': '📶 Wi-Fi',
          '80:64:7c:46:e8:d1': '📶 Wi-Fi · 2,4 ГГц',
          '84:cc:a8:96:28:a7': '📶 Wi-Fi · 2,4 ГГц',
          '98:f4:ab:ee:a5:c5': '📶 Wi-Fi · 2,4 ГГц',
          '98:f4:ab:ee:a8:4e': '📶 Wi-Fi · 2,4 ГГц',
          'd4:27:87:50:23:6c': '📶 Wi-Fi · 2,4 ГГц',
          'd8:d6:68:31:ba:49': '📶 Wi-Fi · 2,4 ГГц',
          'e0:98:06:af:b7:41': '📶 Wi-Fi · 2,4 ГГц'
        } %}
        {% set ns = namespace(found=false, seen=[]) %}
        {% set cloudmate_mac = '00:08:9b:ed:62:ef' %}
        {% set ns.found = true %}
        {% set ns.seen = ns.seen + [cloudmate_mac] %}
        - **CloudMate — NAS QNAP** — `192.168.50.25` · `00:08:9B:ED:62:EF` ·
          **🔌 Ethernet** · {{ '🟢 доступний' if is_state('binary_sensor.cloudmate_nas_online', 'on') else ('🔴 недоступний' if is_state('binary_sensor.cloudmate_nas_online', 'off') else '🟡 стан визначається') }}
        {% set tcl_mac = 'f0:35:75:b3:31:80' %}
        {% set ns.found = true %}
        {% set ns.seen = ns.seen + [tcl_mac] %}
        - **Телевізор TCL** — `192.168.50.175` · `F0:35:75:B3:31:80` ·
          **📶 Wi-Fi** · {{ '🟢 увімкнений і в мережі' if is_state('binary_sensor.tcl_tv_online', 'on') else ('🔴 вимкнений або недоступний' if is_state('binary_sensor.tcl_tv_online', 'off') else '🟡 стан визначається') }}
        {% set camera_mac = '10:12:fb:f7:95:ad' %}
        {% set ns.found = true %}
        {% set ns.seen = ns.seen + [camera_mac] %}
        - **Камера Hikvision — двір** — `192.168.50.201` · `10:12:FB:F7:95:AD` ·
          **🔌 Ethernet** · {{ '🟢 доступна' if is_state('binary_sensor.hikvision_camera_online', 'on') else ('🔴 недоступна' if is_state('binary_sensor.hikvision_camera_online', 'off') else '🟡 стан визначається') }}
        {% for tracker in states.device_tracker if tracker.state == 'home' %}
          {% set source = tracker.attributes.source_type | default('') %}
          {% set ip = tracker.attributes.ip | default('', true) %}
          {% set mac = tracker.attributes.mac | default('', true) | lower %}
          {% if source == 'router' and ip %}
            {% set ns.found = true %}
            {% set ns.seen = ns.seen + [mac] %}
            {% if mac in ap.macs %}
              {% set connection = 'Tenda AC10 · «Промінь»' %}
            {% elif mac in repeater.macs %}
              {% set connection = 'Tenda A9 · повторювач «Отаке»' %}
            {% else %}
              {% set connection = 'ASUS RT-AX55 · «Отаке»' %}
            {% endif %}
            {% set link = namespace(type=connection_types.get(mac, '❔ тип з’єднання не повідомлено')) %}
            {% set interface = tracker.attributes.interface | default('', true) | lower %}
            {% if mac in ap.macs %}
              {% for client in ap_clients if client.qosListMac | default('') | lower == mac %}
                {% set access = client.qosListAccessType | default('') %}
                {% set link.type = '📶 Wi-Fi 4 · 2,4 ГГц' if access == 'wifi_2G' else ('📶 Wi-Fi 5 · 5 ГГц' if access == 'wifi_5G' else '📶 Wi-Fi') %}
              {% endfor %}
            {% elif mac in repeater.macs %}
              {% set link.type = '📶 Wi-Fi 4 · 2,4 ГГц' %}
            {% elif interface in ['2.4g', '2.4ghz', 'wifi_2g'] %}
              {% set link.type = '📶 Wi-Fi · 2,4 ГГц' %}
            {% elif interface in ['5g', '5ghz', 'wifi_5g'] %}
              {% set link.type = '📶 Wi-Fi · 5 ГГц' %}
            {% elif interface in ['6g', '6ghz', 'wifi_6g'] %}
              {% set link.type = '📶 Wi-Fi 6E · 6 ГГц' %}
            {% else %}
              {% set link.type = connection_types.get(mac, '❔ тип з’єднання не повідомлено') %}
            {% endif %}
        - **{{ names.get(tracker.entity_id, tracker.name) }}** — `{{ ip }}` · `{{ mac | upper }}` · **{{ link.type }}** · **{{ connection }}**
          {% endif %}
        {% endfor %}
        {% set irrigation_mac = '38:2c:e5:2d:5b:32' %}
        {% if states('switch.avtopoliv_kontroler_avtopoliv_klapan_1') not in missing
              and irrigation_mac not in ns.seen %}
          {% set ns.found = true %}
          {% set ns.seen = ns.seen + [irrigation_mac] %}
        - **Контролер автополиву Tuya — 8 зон** — `192.168.50.221` · `38:2C:E5:2D:5B:32` · **📶 Wi-Fi · 2,4 ГГц** · **ASUS RT-AX55 · «Отаке»**
        {% endif %}
        {% for client in ap_clients if client.qosListConnectType | default('') == 'wifi' and client.qosListMac is defined %}
          {% set mac = client.qosListMac | lower %}
          {% if mac not in ns.seen %}
            {% set ns.found = true %}
            {% set ns.seen = ns.seen + [mac] %}
            {% set ip = client.qosListIP | default('IP не отримано', true) %}
            {% set fallback = client.qosListHostname if client.qosListHostname | default('Unknown') not in ['', 'Unknown'] else 'Невідомий пристрій' %}
            {% set access = client.qosListAccessType | default('') %}
            {% set link_type = '📶 Wi-Fi 4 · 2,4 ГГц' if access == 'wifi_2G' else ('📶 Wi-Fi 5 · 5 ГГц' if access == 'wifi_5G' else '📶 Wi-Fi') %}
        - **{{ ip_names.get(ip, mac_names.get(mac | upper, fallback)) }}** — `{{ ip }}` · `{{ mac | upper }}` · **{{ link_type }}** · **Tenda AC10 · «Промінь»**
          {% endif %}
        {% endfor %}
        {% for client in repeater_clients if client.devMac is defined %}
          {% set mac = client.devMac | lower %}
          {% if mac not in ns.seen %}
            {% set ns.found = true %}
            {% set ns.seen = ns.seen + [mac] %}
            {% set ip = client.devIp | default('IP не отримано', true) %}
            {% set fallback = client.devName if client.devName | default('UnKnown') not in ['', 'UnKnown'] else 'Невідомий пристрій' %}
        - **{{ ip_names.get(ip, mac_names.get(mac | upper, fallback)) }}** — {% if ip != 'UnKnown' %}`{{ ip }}`{% else %}IP не отримано{% endif %} · `{{ mac | upper }}` · **📶 Wi-Fi 4 · 2,4 ГГц** · **Tenda A9 · повторювач «Отаке»**
          {% endif %}
        {% endfor %}
        {% if not ns.found %}
        Немає активних клієнтів або мережеві пристрої недоступні.
        {% endif %}
    - type: markdown
      title: CloudMate · NAS QNAP
      grid_options:
        columns: full
      content: |
        {% if is_state('binary_sensor.cloudmate_nas_online', 'on') %}
        ## 🟢 CloudMate у мережі
        {% elif is_state('binary_sensor.cloudmate_nas_online', 'off') %}
        ## 🔴 CloudMate недоступний
        {% else %}
        ## 🟡 Перевіряється після перезапуску Home Assistant
        {% endif %}

        **IP:** `192.168.50.25` · **MAC:** `00:08:9B:ED:62:EF`<br>
        **Тип підключення:** 🔌 **Ethernet**<br>
        **DHCP:** адреса закріплена в ASUS RT-AX55
    - type: markdown
      title: Телевізор TCL · Google Cast
      grid_options:
        columns: full
      content: |
        {% if is_state('binary_sensor.tcl_tv_online', 'on') %}
        ## 🟢 Телевізор увімкнений і в мережі
        {% elif is_state('binary_sensor.tcl_tv_online', 'off') %}
        ## 🔴 Телевізор вимкнений або недоступний
        {% else %}
        ## 🟡 Перевіряється після перезапуску Home Assistant
        {% endif %}

        **IP:** `192.168.50.175` · **MAC:** `F0:35:75:B3:31:80`<br>
        **Тип підключення:** 📶 **Wi-Fi**<br>
        **DHCP:** адреса закріплена в ASUS RT-AX55<br>
        **Модель:** TCL BeyondTV · Google Cast

        Коли телевізор вимкнений, його мережевий модуль також вимикається.
        Тому червоний стан у цей момент нормальний: пристрій більше не зникає
        з дашборда, але керувати ним або надсилати фото до ввімкнення неможливо.
    - type: markdown
      title: Камера Hikvision · двір
      grid_options:
        columns: full
      content: |
        {% if is_state('binary_sensor.hikvision_camera_online', 'on') %}
        ## 🟢 Камера доступна
        {% elif is_state('binary_sensor.hikvision_camera_online', 'off') %}
        ## 🔴 Камера недоступна
        {% else %}
        ## 🟡 Стан визначається
        {% endif %}

        **IP:** `192.168.50.201` · **MAC:** `10:12:FB:F7:95:AD`<br>
        **Тип підключення:** 🔌 **Ethernet**<br>
        **DHCP:** адреса закріплена в ASUS RT-AX55<br>
        **Сервіси:** HTTP `80` · RTSP `554` · Hikvision SDK `8000`

        Ця картка показує мережеву доступність. Живе відео та датчики руху
        залишаються на окремій вкладці «Камера».
    - type: markdown
      title: Контролер автополиву · мережевий стан
      grid_options:
        columns: full
      content: |
        {% set entity = 'switch.avtopoliv_kontroler_avtopoliv_klapan_1' %}
        {% if states(entity) in ['on', 'off'] %}
        ## 🟢 Підключений локально

        **Пристрій:** Tuya Smart Sprinkler Controller · 8 зон<br>
        **IP:** `192.168.50.221` · **MAC:** `38:2C:E5:2D:5B:32`<br>
        **Підключення:** ASUS RT-AX55 · основна мережа «Отаке»<br>
        **LocalTuya:** працює · протокол 3.4 · опитування кожні 5 с

        Старий IP `192.168.50.223` більше не використовується. Контролер не
        з'являвся в загальному списку, бо AsusWRT не створив для нього окремий
        `device_tracker`, а до Tenda AC10/A9 він не підключений.
        {% else %}
        ## 🔴 Локальний зв'язок відсутній

        Контролер очікується на `192.168.50.221` (`38:2C:E5:2D:5B:32`), але
        LocalTuya зараз має стан **{{ states(entity) }}**. Клапани в такому стані
        не слід запускати до відновлення зв'язку.
        {% endif %}
  - type: grid
    cards:
    - type: heading
      heading: Хто зараз удома
      icon: mdi:home-account
      grid_options:
        columns: full
    - type: entities
      title: Люди
      grid_options:
        columns: full
      entities:
      - entity: person.dim_kovtuni
        name: Дмитро
      - entity: person.katerina
        name: Катерина
      - entity: person.olesia
        name: Олеся
      - entity: person.babusia_sima
        name: Бабуся Сіма
    - type: markdown
      grid_options:
        columns: full
      content: >-
        Людина має стан **удома**, коли хоча б один прив'язаний телефон бачить
        Home Assistant або основний роутер ASUS. Точка Wi-Fi не має значення:
        клієнти ASUS, Tenda «Промінь» і Tenda-повторювача належать до однієї
        домашньої мережі.
  - type: grid
    cards:
    - type: heading
      heading: Tenda AC10 · точка доступу «Промінь»
      icon: mdi:access-point
      grid_options:
        columns: full
    - type: entities
      title: Tenda AC10 v3 · 192.168.50.2 · SSID «Промінь»
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_ap_status
        name: Прошивка
      - entity: sensor.tenda_ap_clients
        name: Прямих Wi-Fi клієнтів
      - entity: sensor.tenda_ap_download_speed
        name: Поточне завантаження клієнтів
      - entity: sensor.tenda_ap_upload_speed
        name: Поточне вивантаження клієнтів
      - entity: sensor.tenda_ap_security
        name: Пароль адміністратора
    - type: markdown
      title: Підключені безпосередньо до точки доступу
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_ap_clients', 'onlineList') or [] %}
        {% set wifi = clients | selectattr('qosListConnectType', 'equalto', 'wifi') | list %}
        {% set names = {
          '1E:C0:D2:73:2C:C9': 'Samsung Galaxy S21 — бабуся Сіма',
          'C0:35:32:C4:8A:4B': 'Ноутбук LAPTOP-U1I8PNMK'
        } %}
        {% if wifi | count == 0 %}
        Немає активних прямих Wi-Fi-клієнтів.
        {% else %}
        {% for client in wifi %}
        - **{{ names.get(client.qosListMac | upper, client.qosListHostname if client.qosListHostname not in ['', 'Unknown'] else 'Невідомий пристрій') }}**
          — `{{ client.qosListIP }}` · `{{ client.qosListMac | upper }}` ·
          {{ '2,4 ГГц' if client.qosListAccessType | default('') == 'wifi_2G' else ('5 ГГц' if client.qosListAccessType | default('') == 'wifi_5G' else 'Wi-Fi') }} ·
          ↓ {{ client.qosListDownSpeed | float(0) | round(1) }} кБ/с ·
          ↑ {{ client.qosListUpSpeed | float(0) | round(1) }} кБ/с
        {% endfor %}
        {% endif %}
    - type: history-graph
      title: Трафік точки доступу за 3 години
      hours_to_show: 3
      grid_options:
