- title: Автополив
  path: poliv
  icon: mdi:sprinkler-variant
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Що система вирішила про полив
      icon: mdi:clipboard-text-clock
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: '### {{ states(''input_text.poliv_ostannie_rishennia'') }}


        {% set lt = state_attr(''automation.poliv_rozklad_za_chasom_i_dniami_tizhnia'', ''last_triggered'')
        %} Останній розгляд розкладу: {{ (lt | as_datetime | as_local).strftime(''%d.%m.%Y о %H:%M'')
        if lt else ''ще не було'' }}.


        Розумний полив зараз просить: зона 1 — {{ (states(''sensor.smart_irrigation_zona1'') | float(0)
        / 60) | round(0) }} хв, зона 2 — {{ (states(''sensor.smart_irrigation_zona2'') | float(0) / 60)
        | round(0) }} хв. Баланс води зони 1: {{ states(''sensor.smart_irrigation_zona1_bucket'') }} мм
        ({{ ''дефіцит, ґрунт сухий'' if states(''sensor.smart_irrigation_zona1_bucket'') | float(0) <
        0 else ''запас після дощу або поливу'' }}).'
    - type: markdown
      grid_options:
        columns: full
      content: '### Скільки води просить Розумний полив і чому


        {%- set zones = [(''Зона 1'', ''zona1'', 200), (''Зона 2'', ''zona2'', 200), (''Зона 5'', ''zona5'',
        100)] %}

        {%- set ns = namespace(total=0) %}

        {% for label, key, area in zones %}

        {%- set secs = states(''sensor.smart_irrigation_'' ~ key) | float(0) %}

        {%- set bucket = states(''sensor.smart_irrigation_'' ~ key ~ ''_bucket'') | float(0) %}

        {%- set deficit = states(''sensor.smart_irrigation_'' ~ key ~ ''_et_deficiency'') | float(0) %}

        {%- set ns.total = ns.total + secs %}

        **{{ label }}** ({{ area }} м²) —

        {%- if secs > 0 %} полив {{ (secs / 60) | round(1) }} хв.

        Причина: ґрунту бракує {{ (bucket | abs) | round(2) }} мм води, і саме стільки треба долити.

        {%- elif bucket > 0 %} поливати не треба.

        Причина: у ґрунті ще є запас {{ bucket | round(2) }} мм — дощу вистачило.

        {%- else %} поливати не треба.

        Причина: баланс нульовий, дефіциту немає{% if deficit != 0 %} (розрахунковий баланс за добу {{
        deficit | round(2) }} мм){% endif %}.

        {%- endif %}

        {% endfor %}


        {% if ns.total > 0 -%}

        **Разом на ранок: {{ (ns.total / 60) | round(0) }} хв.** Старт розрахований так, щоб полив

        закінчився приблизно на схід сонця.

        {%- else -%}

        **Разом: поливу не буде.** Жодна зона не має дефіциту вологи.

        {%- endif %}


        ### Звідки береться дощ у розрахунку


        Датчика дощу на ділянці немає. Опади беруться з **Open-Meteo** — безкоштовного

        погодного сервісу, за координатами будинку із налаштувань Home Assistant. Розумний

        полив опитує його **кожні 30 хвилин** і накопичує показники за добу.


        Так само звідти надходять температура, вологість, тиск, вітер, точка роси й сонячна

        радіація — усі дев''ять полів групи датчиків. З них модуль PyETO рахує випаровування

        (евапотранспірацію) за формулою Пенмана-Монтейта.


        Це прогноз і модель для місцевості, а не вимір на твоєму газоні: якщо злива пройшла

        смугою повз ділянку, система про це не дізнається.


        ### Як рахується тривалість


        Для кожної зони ведеться «відро води» в міліметрах: дощ наповнює, спека й вітер

        випаровують, надлишок стікає вглиб.


        - **Мінус** — ґрунту бракує води, на цю нестачу призначається полив.

        - **Нуль або плюс** — вологи вистачає, полив пропускається.


        Хвилини рахуються з площі та продуктивності: зони 1 і 2 — 200 м² при 40 л/хв, зона 5 —

        100 м² при 20 л/хв. Це однакова інтенсивність 12 мм/год, тому за однакової посухи всі

        три поливаються приблизно однаково довго.


        Перерахунок — **щодня о 19:55** за погодою минулої доби. Дощ, який іде просто зараз,

        потрапить у розрахунок аж увечері, а не в момент поливу.

        '
    - type: tile
      entity: input_boolean.poliv_propustyty_zavtra
      name: Пропустити завтрашній ранок
      icon: mdi:weather-rainy
      color: red
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      grid_options:
        columns: full
      content: '### Як приймається рішення


        Питання про дощ ставиться **звечора о 21:00**, коли ти ще не спиш, а не о пів на п''яту ранку.
        Увечері система дивиться прогноз саме на завтрашній ранок (з 03:00 до 09:00) і, якщо очікує дощ,
        питає, чи пропустити полив.


        - Натиснув «Пропустити» → вмикається прапорець нижче, і вранці поливу не буде.

        - Натиснув «Поливати» або нічого не натиснув → полив іде як звичайно.


        **Мовчання означає «поливати».** Це навмисно: якщо ввечері ніхто не відповів, або Home Assistant
        був вимкнений, або прогноз не справдився — полив не має тихо зникнути.


        Вранці полив скасовує лише дві речі: увімкнений прапорець «пропустити завтрашній ранок» і **фактичний
        дощ у момент старту**. Прогноз уранці вже нічого не вирішує, і ніяких 30 хвилин очікування відповіді
        немає.


        ### Два різні механізми, які легко переплутати


        **Скільки поливати — Розумний полив.** Щодня о 19:55 перераховує баланс води в ґрунті: випарувалося
        мінус випало дощу, і з цього виводить тривалість. Він **ніколи не скасовує** полив — максимум
        видає нуль. Дощ, який іде просто зараз, він побачить аж на перерахунку о 19:55.


        **Чи поливати взагалі — автоматизація розкладу.** За 1 годину 15 хвилин до сходу сонця запитує
        погодинний прогноз Met.no і перевіряє дві речі: чи йде дощ у цю хвилину і чи прогнозують понад
        0,2 мм опадів у найближчі 6 годин.


        **Дощ визначається за прогнозом Met.no з інтернету, а не за датчиком у дворі** — власного датчика
        дощу немає. Тому «дощу не було, а полив скасовано» — очікувана ситуація: скасовує прогноз, а не
        факт.'
