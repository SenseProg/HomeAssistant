  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.svitlo_zniklo
        name: "Світло - зникло"
      - entity: automation.svitlo_z_iavilos
        name: "Світло - з'явилось"
      - entity: automation.bez_svitla_zavelike_spozhivannia
        name: "Без світла - завелике споживання"
      - entity: automation.batareia_poperedzhennia
        name: "Батарея - попередження"
      - entity: automation.batareia_kritichnii_riven
        name: "Батарея - критичний рівень"
      - entity: automation.bez_svitla_vimknuti_vazhki_spozhivachi
        name: "Без світла - вимкнути важкі споживачі"
      - entity: automation.invertor_nemaie_zviazku
        name: "Інвертор - немає звʼязку"
      - entity: automation.invertor_zviazok_vidnovleno
        name: "Інвертор - звʼязок відновлено"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Світло - зникло** — Повідомляє всім, щойно зникла мережа, і одразу перелічує великі споживачі, які лишились увімкненими - поки вони працюють, батарея сідає у кілька разів швидше.

        **Світло - з'явилось** — Парне повідомлення до попереднього, щоб не доводилось заходити в застосунок і перевіряти самому.

        **Без світла - завелике споживання** — Поки немає мережі, кожен зайвий кіловат - це години автономії. Поріг і витримка беруться з input_number, тож їх можна змінити з панелі, не чіпаючи автоматизацію.

        **Батарея - попередження** — Перший рівень тривоги. Спрацьовує лише без світла - при мережі просадка заряду нічого не означає.

        **Батарея - критичний рівень** — Другий рівень, зі звуком навіть у тихому режимі. Нижче цього інвертор невдовзі почне вимикати навантаження сам.

        **Без світла - вимкнути важкі споживачі** — Вимикає важкі споживачі, поки будинок живиться від батареї. Тригерів три, а не один: окрім самого зникнення мережі, автоматизація реагує на вмикання кожного з приладів - інакше бойлер, увімкнений вручну через годину після початку відключення, працював би до самого кінця.

        **Інвертор - немає звʼязку** — Десять хвилин витримки навмисне: коротка втрата пакета трапляється щодня і сама минає, а ось десять хвилин мовчання - це вже справжня втрата звʼязку.

        **Інвертор - звʼязок відновлено** — Парне повідомлення, щоб було видно, що моніторинг знову бачить дім.
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.bez_svitla_vimknuti_vazhki_spozhivachi
        name: "Без світла - вимкнути важкі споживачі"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Без світла - вимкнути важкі споживачі** — Гасить бойлер, теплу підлогу, сушарку, PRANA і рекуператори, щойно дім переходить на батарею — і знову, якщо хтось увімкнув їх посеред відключення. Вимикач нижче.
  # --- Сповіщення відокремлено від автоматизацій 02.09.2026 на прохання власника:
  #     інформаційний засіб живе окремо, з власним перемикачем і часом останнього спрацювання. ---
  - type: grid
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.svitlo_zniklo
        name: "Світло - зникло"
        secondary_info: last-triggered
      - entity: automation.svitlo_z_iavilos
        name: "Світло - з'явилось"
        secondary_info: last-triggered
      - entity: automation.bez_svitla_zavelike_spozhivannia
        name: "Без світла - завелике споживання"
        secondary_info: last-triggered
      - entity: automation.batareia_poperedzhennia
        name: "Батарея - попередження"
        secondary_info: last-triggered
      - entity: automation.batareia_kritichnii_riven
        name: "Батарея - критичний рівень"
        secondary_info: last-triggered
      - entity: automation.invertor_nemaie_zviazku
        name: "Інвертор - немає звʼязку"
        secondary_info: last-triggered
      - entity: automation.invertor_zviazok_vidnovleno
        name: "Інвертор - звʼязок відновлено"
        secondary_info: last-triggered
      - entity: automation.storozh_gotovnist_do_vidkliuchennia
        name: "Сторож - готовність до відключення"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      grid_options:
        columns: full
      content: |-
        **Світло - зникло** — Мережа зникла: пуш усім із зарядом батареї, споживанням і переліком великих споживачів, які лишились увімкненими.

        **Світло - з'явилось** — Парне повідомлення: мережа повернулась, батарея, споживання.

        **Без світла - завелике споживання** — На батареї споживання вище порогу довше за витримку (обидва — помічники нижче) — пуш «варто вимкнути зайве».

        **Батарея - попередження** — Батарея нижче порогу «увага» без світла.

        **Батарея - критичний рівень** — Батарея нижче критичного порогу без світла — термінове, зі звуком навіть у тихому режимі.

        **Інвертор - немає звʼязку** — Десять хвилин без даних від логера Deye — термінове сповіщення: поки так, сповіщення про світло, пороги батареї і автовимикання не працюють.

        **Інвертор - звʼязок відновлено** — Парне «на звʼязку» з витримкою три хвилини, щоб хитання логера не давало десятки пушів.

        **Сторож - готовність до відключення** — Кожні шість годин і після старту перевіряє, чи ввімкнені всі автоматизації блекауту і чи на звʼязку прилади, які вони мають гасити.
- title: Бойлер
  path: midea
  icon: mdi:water-boiler
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: thermostat
      entity: water_heater.144036023323246_water_heater
      name: Електричний водонагрівач
      grid_options:
        columns: full
    - type: entities
      title: Деталі
      grid_options:
        columns: full
      entities:
      - entity: water_heater.144036023323246_water_heater
        name: Стан
    # Раніше цей графік будувався просто на water_heater: його стан - режим
    # роботи, рядок, тому виходила стрічка «увімкнено/вимкнено», а температури,
    # яку обіцяв заголовок, не було ніколи. sensor.boiler_temperatura_vody
    # (configuration.yaml) дістає її з атрибута current_temperature числом.
    - type: history-graph
      title: Температура за 24 години
      hours_to_show: 24
      entities:
      - entity: sensor.boiler_temperatura_vody
        name: Температура води
    - type: history-graph
      title: Режими роботи за 24 години
      hours_to_show: 24
      entities:
      - entity: water_heater.144036023323246_water_heater
        name: Водонагрівач
  - type: grid
    cards:
    - type: heading
      heading: Спожита електроенергія
      grid_options:
        columns: full
    - type: tile
      entity: sensor.boiler_potuzhnist
      name: Потужність зараз
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.boiler_spozhito
      name: Спожито всього
      grid_options:
        columns: 6
    - type: statistics-graph
      title: Спожито за добу
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.boiler_spozhito
        name: Бойлер
    - type: custom:mini-graph-card
      name: Потужність бойлера · 24 години
      hours_to_show: 24
      points_per_hour: 4
      line_width: 3
      animate: true
      show:
        labels: true
        points: false
      color_thresholds:
      - value: 0
        color: '#43a047'
      - value: 1000
        color: '#fb8c00'
      - value: 2200
        color: '#e53935'
      grid_options:
        columns: full
      entities:
      - entity: sensor.boiler_potuzhnist
        name: Потужність тена
    - type: markdown
      title: Як рахується
      grid_options:
        columns: full
      content: 'Бойлер не має вбудованого лічильника енергії, тому споживання оцінюється. Апарат повідомляє
        прапорець `heating` (тен працює) і поле `heating_power`, яке дорівнює 2200 Вт лише коли увімкнений
        верхній тен; коли гріє лише нижній, воно дорівнює нулю. Тому формула бере `heating_power`, а якщо
        той нульовий при активному нагріві - підставляє 800 Вт. Обидві цифри звірені зі стрибком загального
        лічильника будинку: вимкнення верхнього тена давало -2.18 і -1.92 кВт, нижнього - близько -0.75
        кВт. Похибка очікується в межах 10-15 %.

        '
  # Бойлер бабусі - окремий будинок, окремий пристрій. Це не водонагрівач
  # Midea вище: тут немає ані термостата, ані температури води, бо HA бачить
  # лише розетку Tuya з вимірюванням, у яку бойлер увімкнений. Тримається
  # окремою секцією свідомо - щоб вимкнений бойлер бабусі не прочитався як
  # вимкнений домашній.
  #
  # Керування і миттєві покази - ЛОКАЛЬНІ (boiler_babusi_*, LocalTuya). Хмарні
  # smart_plug_* лишились тільки в плитці "Спожито всього": це джерело
  # utility_meter boiler_babusi_za_tarifom, і підміна сенсора обірвала б
  # накопичений показ. Розділення навмисне, а не недогляд.
