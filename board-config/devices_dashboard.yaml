      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.poliv_fiksatsiia_lichilnika_na_starti_sesii
        name: "Полив - фіксація лічильника на старті сесії"
      - entity: automation.poliv_zakriti_klapani_iakshcho_nasos_davno_vimknenii
        name: "Полив - закрити клапани, якщо насос давно вимкнений"
      - entity: automation.poliv_bezpechnii_stan_pislia_zapusku_ha
        name: "Полив - безпечний стан після запуску HA"
      - entity: automation.poliv_maksimalna_robota_nasosa_3_godini
        name: "Полив - максимальна робота насоса (0 = без ліміту)"
      - entity: automation.poliv_rozklad_za_chasom_i_dniami_tizhnia
        name: "Полив - розклад за часом і днями тижня"
      - entity: automation.poliv_zhurnal_peremikan_iz_dzherelom
        name: "Полив - журнал перемикань із джерелом"
      - entity: automation.poliv_zarakhuvati_vilitu_vodu_v_balans_zoni
        name: "Полив - зарахувати вилиту воду в баланс зони"
      - entity: automation.poliv_storozh_maister_polivaie_a_klapan_zakritii
        name: "Полив - сторож: майстер поливає, а клапан закритий"
      - entity: automation.poliv_rankovii_pererakhunok_smart_irrigation
        name: "Полив - ранковий перерахунок Smart Irrigation"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Полив - фіксація лічильника на старті сесії** — На кожному вмиканні насоса запам'ятовує поточний показ наростаючого лічильника енергії, щоб сенсор "спожито за сесію" рахував від нуля.

        **Полив - закрити клапани, якщо насос давно вимкнений** — Прибирає забутий відкритий клапан після ручного пуску. Irrigation Unlimited закриває свої клапани за 3 секунди після зупинки насоса, тому 5-хвилинна витримка у його роботу не втручається.

        **Полив - безпечний стан після запуску HA** — Після запуску Home Assistant вимикає насос і всі клапани.

        **Полив - максимальна робота насоса (0 = без ліміту)** — Ліміт 0 навмисно вимикає автостоп за часом. Насос використовується не лише автоматичними зонами, а й вручну зі шлангом, коли жоден клапан зон не відкритий, тому вимикати насос через відсутність відкритого клапана або через фіксовані 3 години не можна. Щоб повернути часовий захист, встановити max_runtime_hours > 0.

        **Полив - розклад за часом і днями тижня** — Слухає подію Smart Irrigation про початок поливу. Момент старту рахує сама SI: offset_minutes=0 разом з account_for_duration означає "почати рівно за стільки, скільки триватиме полив, щоб він ЗАКІНЧИВСЯ на схід сонця". Для газону з дощуванням зверху це правильний час - вода встигає всотатися до спеки, а листя висихає одразу після сходу. За розкладом поливаються зони 1, 2 і 5 - усі три заведені у Smart Irrigation, і їхня сумарна тривалість задає зсув від сходу. Зона 5 додана до SI 2026-08-08: 100 м², 20 л/хв, тобто та сама інтенсивність 12 мм/год, що й у зон 1-2 (200 м², 40 л/хв). Зони 3 і 4 автоматично не поливаються взагалі, лише вручну з дашборда. Виконує полив Irrigation Unlimited, бо тільки він керує насосом-майстром: прямий контроль клапанів у SI вимкнено навмисно - її valve_runner про насос не знає і відкривав би клапани всуху. УВАГА про нумерацію: Irrigation Unlimited нумерує зони ЗА ПОРЯДКОМ у списку controllers.zones, а не за zone_id. Зона 5 стоїть четвертою, тому її сутність - binary_sensor.irrigation_unlimited_c1_z4, а не ..._z5. Якщо порядок зон у configuration.yaml зміниться, ці посилання поїдуть. ДВА ТРИГЕРИ навмисно. Подія Smart Irrigation дає точний старт, але SI НЕ реєструє тригер узагалі, якщо сумарна тривалість її зон дорівнює нулю (а це нормальна ситуація наступного дня після поливу). Другий тригер від сонця на -75 хв лишається запобіжником на випадок, коли SI не реєструє свою подію (нульова сумарна тривалість). mode: single не дасть запуститися двічі, якщо спрацюють обидва. ЗАПИС АПАРАТНОГО ТАЙМЕРА (додано 2026-08-10, підтверджено вимірюванням). Уночі проти 10.08 усі три зони отримали по 10 хвилин замість 27/28/25, а насос пропрацював повні 80 хвилин, з них близько 50 - на закриті клапани. Причина виміряна тестом на зоні 5 того ж дня. Фаза A, без запису DP: клапан відкрито 10:26:18, закрито 10:36:21 - рівно 10 хв 03 с, - і при цьому IU z4, майстер і насос лишалися on ще 2,5 хвилини, поки IU дораховував свої 13 хвилин. Отже клапан закриває сам контролер DP-WBS01 за власним відліком (DP 13-20), а irrigation_unlimited.manual_run перемикає лише DP клапана і цей відлік не задає. Irrigation Unlimited раннього закриття не бачить: його check_back перевіряє клапан лише протягом ~90 секунд після команди (3 спроби через 30 с), а не весь полив. Фаза B, з записом DP 17 = 900 ДО старту зони, поки клапан закритий: клапан пробув відкритим усі 13 хвилин без раннього закриття, а зупинив полив саме IU - спершу насос (10:54:09), потім клапан (10:54:13). Тому запис таймера стоїть ПЕРЕД manual_run, значення - тривалість IU плюс 180 секунд запасу. Запас піднято з 60 до 180 секунд 2026-08-11: у першу ж ніч кожна зона відпрацювала приблизно на хвилину довше за номінал (зона 2 - 50,3 хв при плані 49,35), тобто від апаратного відліку лишалося менше секунд, ніж здавалося. Зупинку однаково робить Home Assistant, а відлік контролера лишається страховкою, якщо HA впаде посеред поливу. Писати DP у вже відкритий клапан тут навмисно не робимо - це неперевірений шлях. Ручні скрипти з дашборда задають таймер разом з відкриттям клапана від початку, тому недолив бачили лише на нічному розкладі.

        **Полив - журнал перемикань із джерелом** — Пише в журнал HA кожне перемикання насоса й клапанів 1-5 разом із тим, ХТО його зробив. Без цього в логах видно лише факт "клапан закрився", і неможливо відрізнити ручне натискання від роботи автоматизації чи від того, що клапан закрив сам контролер за власним відліком - а саме це питання виникло 10.08.2026 при розборі недоливу. Джерело визначається за контекстом Home Assistant: user_id заповнений і батьківського контексту немає - людина натиснула в інтерфейсі; parent_id заповнений - дію породила автоматизація або скрипт (можливо, запущені людиною); обидва порожні - команди з Home Assistant не було АБО її подала інтеграція власним контекстом. Контексту недостатньо, щоб відрізнити Irrigation Unlimited від самого контролера: IU викликає сервіси зі свіжим контекстом без parent_id, тому 10.08 його команди підписувалися як "пристрій сам". Тому в рядок додано стан IU, а окремим маркером POLIV-АНОМАЛІЯ позначається саме та ситуація, яка призвела до недоливу: клапан закрився, поки майстер IU ще поливає. IU так ніколи не робить - він спершу зупиняє насос і аж потім закриває клапан, - отже це апаратний відлік контролера. Пише через system_log на рівні warning, тому потрапляє і в journalctl, і в Налаштування - Журнали. Домени automation і script виключені з recorder, тому іншого сліду про авторство не лишається.

        **Полив - зарахувати вилиту воду в баланс зони** — Додає вилиту воду до водного балансу Smart Irrigation після кожного закриття клапана - незалежно від того, хто його відкрив: розклад, кнопка на дашборді чи тумблер. НАВІЩО. Модуль observed watering усередині Smart Irrigation уміє це сам, але для зон 1 і 2 він мовчить: їм прив'язана сутність, яка ніколи не змінює стан (інцидент 0cfd77b0, найімовірніше застарілий хмарний дубль switch.avtopoliv_kontroler_switch_N). Прив'язка лежить у .storage і правиться лише з панелі Smart Irrigation, тому до її виправлення зарахування робить ця автоматизація. Без неї полив зон 1 і 2 не потрапляє ні в баланс, ні на графік "Вода за 7 днів", і дефіцит накопичується щодоби. ЧОМУ НЕ БУДЕ ПОДВІЙНОГО РАХУНКУ. Після закриття клапана автоматизація запам'ятовує баланс, чекає 20 секунд і дивиться, чи він змінився сам. Якщо змінився - зарахував штатний модуль (так працює зона 5), і автоматизація не робить нічого. Дописує тільки там, де не зарахував ніхто. Через це її можна лишати ввімкненою і після виправлення прив'язки: вона просто перестане спрацьовувати. ЯК РАХУЄТЬСЯ. Тими самими числами, що й у самому модулі: мм = хвилини * продуктивність / площа. Зони 1 і 2 - 40 л/хв на 200 м². Результат обрізається зверху максимальним балансом зони, інакше сервіс set_zone відхиляє значення. ЗОНА 5 СЮДИ НЕ ВХОДИТЬ навмисно. Їй штатний модуль зараховує сам: його внутрішній id 2 прив'язаний саме до клапана 5. 11.08 о 05:15 обидва спрацювали разом і зона отримала 6,82 мм обліку на 3,41 мм вилитої води, бо модуль дописує в ту саму секунду, коли клапан закрився, - тобто до першого заміру балансу цією автоматизацією. Пробіги коротші за 30 секунд ігноруються: це не полив, а перевірка клапана або збій зв'язку.

        **Полив - сторож: майстер поливає, а клапан закритий** — Зупиняє полив, якщо Irrigation Unlimited вважає, що поливає, а жоден клапан не відкритий. Це той стан, у якому насос працює в глухий кут. НАВІЩО ОКРЕМО ВІД ЗАПИСУ ТАЙМЕРА. Запис DP лікує одну конкретну причину - апаратний відлік контролера. Сторож ловить весь клас: обрив LocalTuya посеред поливу, відмову котушки клапана, ручне закриття клапана під час циклу, збій контролера. У ніч проти 10.08 така ситуація тривала близько 50 хвилин і ніхто її не помітив, бо check_back у Irrigation Unlimited перевіряє клапан лише ~90 секунд після команди. ВИТРИМКА ХВИЛИНА навмисна. Між зонами Irrigation Unlimited на кілька секунд лишає всі клапани закритими при увімкненому майстрі - це нормальний перехід, і без витримки сторож рубав би кожен багатозонний полив. Хвилини вистачає з запасом: 11.08 найдовший такий перехід тривав 17 секунд. Зупиняє через той самий script.poliv_stop_all, що й кнопка на дашборді, тобто у правильному порядку: спершу насос, потім клапани.

        **Полив - ранковий перерахунок Smart Irrigation** — Перераховує зони о 07:00, коли нічний полив уже завершився і зарахований. НАВІЩО. Тривалість зберігається в зоні і перераховується ЛИШЕ на розрахунку. Автоматичний був один - о 19:55, - тому цілий день на панелі й на картках висів учорашній план, який до реальності вже не мав стосунку. 11.08 зона 2 показувала запас +2.63 мм і поруч "3021 секунда", бо це число порахували ще при дефіциті -10.07. Ранковий розрахунок робить денну картину чесною: після нього тривалість відповідає балансу, який лишився після поливу. НА НІЧНИЙ ПОЛИВ ЦЕ НЕ ВПЛИВАЄ. Полив бере тривалість з розрахунку о 19:55, а він відбувається пізніше і перезаписує ранкову. ПРО ПОГОДНІ ДАНІ. Кожен розрахунок застосовує накопичене випаровування і стирає використані дані. Тепер доба ділиться на дві частини: 23:59-07:00 і 07:00-19:55. Сумарне випаровування від цього не змінюється - воно просто застосовується двома порціями замість однієї. Пропускаємо, якщо в цю мить іде полив: розрахунок посеред циклу міняв би тривалість зони, яку Irrigation Unlimited уже виконує.
  # --- Сповіщення відокремлено від автоматизацій 02.09.2026 на прохання власника:
  #     інформаційний засіб живе окремо, з власним перемикачем і часом останнього спрацювання. ---
  - type: grid
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.poliv_vechirnie_pitannia_pro_doshch
        name: "Полив - вечірнє питання про дощ"
        secondary_info: last-triggered
      - entity: automation.zviazok_kontroler_polivu_nedostupnii
        name: "Звʼязок - контролер поливу недоступний"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      grid_options:
        columns: full
      content: |-
        **Полив - вечірнє питання про дощ** — О 21:00 дивиться погодинний прогноз на завтрашній ранок (03:00-09:00 - вікно, у яке потрапляє старт за 1:15 до сходу) і, якщо очікується дощ, питає, чи поливати. Відповідь запам'ятовується у input_boolean.poliv_propustyty_zavtra, і ранковий розклад просто її виконує. Питати о 04:30, як було раніше, не мало сенсу: о пів на п'яту ніхто не бачить сповіщення, 30 хвилин минають, і день пропускається за замовчуванням. Тепер питання ставиться, коли на нього реально можуть відповісти. Мовчання = пропустити, як і просили. Але прапорець скидається на початку перевірки, тож якщо дощу не прогнозують, ранок поллється без жодних питань.

        **Звʼязок - контролер поливу недоступний** — Контролер клапанів .221 недоступний понад 10 хвилин — пуш. Це про звʼязок, а не про режим насоса: насос без відкритого клапана — норма.
- title: Свердловина
  path: well
  icon: mdi:water-pump
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # Насос свердловини - розетка T34-Smart Plug+ з вимірюванням. Окремо від
  # Автополиву свідомо: свердловина живить не тільки полив, і на спільній
  # вкладці вимкнений полив читався б як вимкнена вода.
  #
  # Сутності тут з суфіксом _2 - це копія LocalTuya. Розетка заведена тричі:
  # у двох акаунтах офіційної tuya (звідси в журналі "already exists -
  # ignoring") і ще раз у LocalTuya. Обидві копії живі й показують однакове,
  # але взято локальну: вона не залежить від інтернету, нею ж користується
  # картка в Огляді, і лише в неї накопичується спожита енергія - хмарний
  # sensor.t34_smart_plug_total_energy стоїть на нулі.
  #
  # Якщо дублікати колись розберуть, суфікси _2 зникнуть і ці посилання
  # доведеться поправити.
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Насос свердловини
      icon: mdi:water-pump
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set on = is_state('switch.t34_smart_plug_switch_1_2', 'on') %}
        {% set w = states('sensor.t34_smart_plug_power_2') | float(0) %}
        {% set v = states('sensor.t34_smart_plug_voltage_2') | float(0) %}
        ## {% if not on %}Вимкнено{% elif w > 100 %}Качає — {{ w | round(0) }} Вт{% else %}Живлення є, насос не качає{% endif %}
        {% if on and v > 0 %}Напруга {{ v | round(0) }} В{% endif %}
    - type: tile
      entity: switch.t34_smart_plug_switch_1_2
      name: Живлення насоса
      icon: mdi:water-pump
      color: blue
      grid_options:
        columns: full
        rows: 1
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Споживання
      icon: mdi:flash
      grid_options:
        columns: full
    - type: tile
      entity: sensor.t34_smart_plug_power_2
      name: Потужність
      icon: mdi:flash
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.t34_smart_plug_nasos_sverdlovini_spozhito
      name: Спожито всього
      icon: mdi:counter
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.t34_smart_plug_voltage_2
      name: Напруга
      icon: mdi:sine-wave
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.t34_smart_plug_current_2
      name: Струм
      icon: mdi:current-ac
      grid_options:
        columns: 6
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.sverdlovina_onoviti_rozrakhunkovu_vodu
        name: "Свердловина — оновити розрахункову воду"
      - entity: automation.sverdlovina_koefitsiient_iz_zhurnalu_pokaznikiv
        name: "Свердловина — коефіцієнт із журналу показників"
      - entity: automation.sverdlovina_pochatok_ruchnogo_zamiru
        name: "Свердловина — початок ручного заміру"
      - entity: automation.sverdlovina_pidsumok_ruchnogo_zamiru
        name: "Свердловина — підсумок ручного заміру"
      - entity: automation.sverdlovina_stan_roboti_nasosa
        name: "Свердловина — стан роботи насоса"
      - entity: automation.sverdlovina_rakhuvati_zapuski_nasosa
        name: "Свердловина — рахувати запуски насоса"
      - entity: automation.sverdlovina_obnuliti_dobovi_lichilniki_nasosa
        name: "Свердловина — обнулити добові лічильники насоса"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Свердловина — оновити розрахункову воду** — Оновлює накопичувальну оцінку води за енергією насоса і зафіксованим коефіцієнтом.

        **Свердловина — коефіцієнт із журналу показників** — Джерелом показників стала таблиця water_readings.json, тож коефіцієнт м³/кВт·год тепер рахується від останнього живого рядка журналу, а не від кнопки «Зберегти показник». Так само працює запис заднім числом і виправлення помилки: щойно журнал змінився, калібрування перераховується саме. Базову точку та енергетичну поправку бере з атрибута calibration того ж сенсора — числа в шаблоні лишилися тільки як запас на випадок, коли сенсор недоступний.

        **Свердловина — початок ручного заміру** — Знімає показання трьох лічильників у момент, коли людина біля насоса вмикає секундомір. Без цього знімка на зупинці не буде від чого рахувати різницю.

        **Свердловина — підсумок ручного заміру** — Порівнює живий час із зарахованим. Реальні секунди беруться з того, скільки секундомір був увімкнений; зараховані — з приросту history_stats, який живиться тими самими рідкими семплами розетки. Відношення між ними і є шуканою похибкою: якщо система зараховує третину справжнього часу, то стільки ж вона втрачає і в енергії, а отже коефіцієнт калібрування завищений рівно настільки.

        **Свердловина — стан роботи насоса** — Тримає прапорець «насос працює» за потужністю понад 20 Вт: локальний power_2 первинний, хмарний — резерв, поки локальний недоступний.

        **Свердловина — рахувати запуски насоса** — Рахує пуски за добу і окремо нічні: за лічильниками видно залипле реле тиску або гідроакумулятор без тиску (інцидент 07c087e7).

        **Свердловина — обнулити добові лічильники насоса** — Опівночі обнуляє обидва добові лічильники пусків.
  # --- Сповіщення відокремлено від автоматизацій 02.09.2026 на прохання власника:
  #     інформаційний засіб живе окремо, з власним перемикачем і часом останнього спрацювання. ---
  - type: grid
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.sverdlovina_nasos_ne_zupiniaietsia
        name: "Свердловина — насос не зупиняється"
        secondary_info: last-triggered
      - entity: automation.sverdlovina_anomalna_kilkist_zapuskiv
        name: "Свердловина — аномальна кількість запусків"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      grid_options:
        columns: full
      content: |-
        **Свердловина — насос не зупиняється** — Насос працює довше за нормальний пуск — реле тиску залипло або є витік. Пуш і запис у панель.

        **Свердловина — аномальна кількість запусків** — Пусків за добу або вночі більше за поріг — ознака витоку чи гідроакумулятора без тиску.
- title: Заряджання авто
  path: ev-charging
  icon: mdi:ev-station
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 1 · Hero: що зі станцією просто зараз ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set power = states('sensor.zariadka_7_5kvt_device_kw') | float(0) %}
        {% set voltage = states('sensor.zariadka_7_5kvt_voltage_a') | float(0) %}
        {% set dev = states('sensor.zariadka_7_5kvt_device_state') | lower %}
        {% set fault = is_state('binary_sensor.zariadka_7_5kvt_fault', 'on') %}
        {# Стан беремо ТІЛЬКИ з device_state і потужності. switch.zariadka_7_5kvt
           тут свідомо не використовується: він не відображає, чи йде сесія. #}
        {% set blocked = is_state('select.zariadka_7_5kvt_charge_state', 'Close charging') %}
        {% if fault %}
        ## 🔴 Несправність зарядної станції
        Причина: станція повідомила про помилку. Заряджання не почнеться, доки її не усунути.
        {% elif power > 0.1 or dev in ['charing', 'charging'] %}
        ## 🟢 Заряджання триває · {{ power | round(2) }} кВт
        Причина: автомобіль підключений і приймає струм{% if voltage > 0 %} — приблизно {{ (power * 1000 / voltage) | round(0) }} А при {{ voltage | round(1) }} В{% endif %}.
        {% elif blocked %}
        ## ⚪ Заряджання зупинено командою
        Причина: станції надіслано «Close charging». Щоб дозволити знову — оберіть
        «Open charging» у секції керування.
        {% elif dev in ['no_connet', 'no_connect', 'disconnected'] %}
        ## ⚪ Автомобіль не підключений
        Причина: станція справна й готова — чекає, доки вставлять кабель у машину.
        {% elif dev == 'finish' %}
        ## ⚪ Заряджання завершено
        Причина: станція повідомила «finish» — сесія закінчилась, струм не подається.
        {% else %}
        ## 🟡 Станція готова, заряджання не йде
        Причина: станція повідомляє стан «{{ dev }}» і зараз не віддає потужність.
        {% endif %}

        Спожито від початку обліку **{{ states('sensor.zariadka_avto_spozhito') | float(0) | round(2) }} кВт·год**
        на суму **{{ states('sensor.vitrati_zariadka_avto') | float(0) | round(2) }} грн**{% set kwh = states('sensor.zariadka_avto_spozhito') | float(0) %}{% if kwh > 0 %} — у середньому {{ (states('sensor.vitrati_zariadka_avto') | float(0) / kwh) | round(2) }} грн за кВт·год{% endif %}.
        Витрати рахуються за фактичним тарифом на момент кожної сесії, день і ніч окремо.
    - type: tile
      entity: sensor.zariadka_7_5kvt_device_kw
      name: Потужність зараз
      icon: mdi:flash
      color: amber
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.zariadka_avto_spozhito
      name: Спожито всього
      icon: mdi:counter
      color: blue
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.vitrati_zariadka_avto
      name: Витрати всього
      icon: mdi:cash
      color: orange
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: select.zariadka_7_5kvt_charge_state
      name: Керування сесією
      icon: mdi:ev-plug-type2
      color: green
      grid_options:
        columns: 12
        rows: 1
  # --- Секція 2 · Потужність ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Потужність
      icon: mdi:gauge
      grid_options:
        columns: full
    - type: gauge
      entity: sensor.zariadka_7_5kvt_device_kw
      name: Зараз
      min: 0
      max: 7.5
      needle: true
      severity:
        green: 0
        yellow: 3
        red: 7
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set p = states('sensor.zariadka_7_5kvt_device_kw') | float(0) %}
        {% if p > 0.1 %}
        Станція віддає {{ p | round(2) }} кВт із можливих 7,5.
        {% else %}
        **Заряджання не йде.** Нуль тут — нормальний стан більшість доби,
        а не помилка: кабель просто не підключений до автомобіля.
        {% endif %}
  # --- Секція 3 · Мережа живлення ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Мережа живлення
      icon: mdi:sine-wave
      grid_options:
        columns: full
    - type: tile
      entity: sensor.zariadka_7_5kvt_voltage_a
      name: Напруга · фаза A
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set p = states('sensor.zariadka_7_5kvt_device_kw') | float(0) %}
        {% set v = states('sensor.zariadka_7_5kvt_voltage_a') | float(0) %}
        Станція однофазна — фази B і C не задіяні.

        **Струм зараз:** {{ (p * 1000 / v) | round(1) if (p > 0 and v > 0) else 0 }} А ·
        **апаратна межа:** {{ states('sensor.zariadka_7_5kvt_max_set_ampere') }}

        Струм обчислюється як потужність × 1000 ÷ напруга. Причина: власний
        датчик струму інтеграції має неправильний масштаб і навіть помилкову
        одиницю «V», тому йому не можна довіряти.
  # --- Секція 4 · Стан обладнання ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Стан обладнання
      icon: mdi:thermometer
      grid_options:
        columns: full
    - type: tile
      entity: sensor.zariadka_7_5kvt_device_temperature
      name: Температура станції
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: binary_sensor.zariadka_7_5kvt_fault
      name: Несправність
      icon: mdi:alert-circle
      color: red
      grid_options:
        columns: full
        rows: 1
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.zariadka_7_5kvt_device_state
        name: Стан пристрою
      - entity: select.zariadka_7_5kvt_charge_state
        name: Стан заряджання
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set t = states('sensor.zariadka_7_5kvt_device_temperature') | float(0) %}
        {% if t < 45 %}
        🟢 Температура в нормі. Причина: у холостому режимі станція майже не гріється.
        {% elif t < 60 %}
        🟠 Станція помітно нагрілася — це очікувано під навантаженням.
        {% else %}
        🔴 Станція гаряча ({{ t }} °C). Перевірте вентиляцію і навантаження.
        {% endif %}
  # --- Секція 5 · Керування заряджанням ---
  # Перевірено 2026-08-09: сесією керує ТІЛЬКИ select charge_state. Команда
  # «Close charging» зупинила заряджання за дві секунди — 6,3 кВт впали до нуля,
  # device_state став finish. Перемикач switch.zariadka_7_5kvt на сесію не
  # впливає взагалі: він стояв у off чотири хвилини, поки станція заряджала.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Керування заряджанням
      icon: mdi:ev-station
      grid_options:
        columns: full
    # Дві великі кнопки замість дрібної випадайки: користувач скаржився, що
    # контрол «настільки малий, що його щоразу складно знайти».
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: button
        name: ЗАПУСТИТИ
        icon: mdi:play-circle
        icon_height: 64px
        show_state: false
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.zariadka_7_5kvt_charge_state
          data:
            option: Open charging
      - type: button
        name: ЗУПИНИТИ
        icon: mdi:stop-circle
        icon_height: 64px
        show_state: false
        tap_action:
          action: call-service
          service: select.select_option
          target:
            entity_id: select.zariadka_7_5kvt_charge_state
          data:
            option: Close charging
          confirmation:
            text: Зупинити заряджання автомобіля?
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set st = states('select.zariadka_7_5kvt_charge_state') %}
        {% set p = states('sensor.zariadka_7_5kvt_device_kw') | float(0) %}
        {% set dev = states('sensor.zariadka_7_5kvt_device_state') | lower %}
        {% if p > 0.1 or dev in ['charing', 'charging'] %}
        ## 🟢 Заряджання йде · {{ p | round(2) }} кВт
        Щоб зупинити — натисніть **ЗУПИНИТИ**.
        {% elif st == 'Close charging' %}
        ## ⛔ Заряджання заблоковано
        Причина: станції надіслано «Close charging». Натисніть **ЗАПУСТИТИ**,
        щоб дозволити знову — потужність з'явиться за кілька секунд.
        {% elif dev in ['no_connet', 'no_connect', 'disconnected'] %}
        ## ⚪ Дозволено, але авто не підключене
        Станція готова: щойно вставите кабель, заряджання почнеться саме.
        {% else %}
        ## ⚪ Заряджання не йде
        Стан станції: «{{ dev }}». Натисніть **ЗАПУСТИТИ**, якщо кабель у машині.
        {% endif %}

        Ці дві кнопки — **єдиний спосіб** запустити або зупинити сесію.
        Обидві діють за секунди.
    - type: tile
      entity: select.zariadka_7_5kvt_charge_state
      name: Поточна команда станції
      icon: mdi:ev-plug-type2
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      grid_options:
        columns: full
      content: |-
        ⚠️ **Перемикач станції нічого не вмикає й не вимикає — не шукайте його
        тут.** Перевірено двічі 9 серпня: о 12:06 він стояв у «вимкнено», поки
        станція віддавала 6,3 кВт, а о 13:02 його ввімкнули — і потужність
        лишилася нульовою, бо блокування знімається тільки командою вище.
        Причина: LocalTuya прив'язав його до точки даних, яку станція ігнорує.
        Сам перемикач лишився в секції «Що не працює» — щоб бачити його стан,
        але не плутати з керуванням.
  # --- Секція 6 · Скільки заряджали і за скільки ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Скільки заряджали
      icon: mdi:chart-bar
      grid_options:
        columns: full
    - type: statistics-graph
      title: Спожито за добу · 14 днів
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.zariadka_avto_spozhito
        name: Зарядна станція 1
    - type: statistics-graph
      title: Витрачено за добу · 14 днів, грн
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.vitrati_zariadka_avto
        name: Витрати на заряджання
  # --- Секція 7 · Історія сесій ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Коли станція працювала
      icon: mdi:chart-areaspline
      grid_options:
        columns: full
    - type: custom:mini-graph-card
      name: Потужність · 24 години
      hours_to_show: 24
      points_per_hour: 4
      line_width: 3
      animate: true
      show:
        labels: true
        points: false
      color_thresholds:
      - value: 0
        color: '#43a047'
      - value: 3
        color: '#1e88e5'
      - value: 7
        color: '#e53935'
      grid_options:
        columns: full
      entities:
      - entity: sensor.zariadka_7_5kvt_device_kw
        name: Зарядна станція 1
    - type: logbook
      hours_to_show: 168
      grid_options:
        columns: full
      target:
        entity_id:
        # Не switch.zariadka_7_5kvt: ця ж вкладка нижче сама пише, що перемикач
        # ні на що не впливає і міняється сам собою (9 серпня о 13:02 «увімкнено»,
        # через дві хвилини «вимкнено», без жодної команди). Журнал із нього
        # показував події, яких не було.
        - select.zariadka_7_5kvt_charge_state
        - sensor.zariadka_7_5kvt_device_state
        - binary_sensor.zariadka_7_5kvt_fault
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Журнал показує команди станції та її стан за останні 7 днів, і чи
        траплялися несправності. Тривалість і обсяг кожної окремої сесії
        Home Assistant окремо не рахує — для цього довелося б додати сенсор
        сесії, якого зараз немає.
  # --- Секція 8 · Налаштування станції ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Налаштування станції 1
      icon: mdi:tune-variant
      grid_options:
        columns: full
    # Усі три number редагуються просто на картці — слайдером і полем вводу,
    # без відкривання діалогу. Значення йде прямо в станцію.
    - type: tile
      entity: number.zariadka_7_5kvt_set_32a
      name: Максимальний струм заряджання
      icon: mdi:current-ac
      color: amber
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
    - type: tile
      entity: number.zariadka_7_5kvt_set_delay_time
      name: Відкладений старт · години
      icon: mdi:clock-start
      color: cyan
      features_position: bottom
      features:
      - type: numeric-input
        style: box
      grid_options:
        columns: 12
    - type: tile
      entity: number.zariadka_7_5kvt_set_define_time
      name: Обмеження тривалості · години
      icon: mdi:timer-sand
      color: cyan
      features_position: bottom
      features:
      - type: numeric-input
        style: box
      grid_options:
        columns: 12
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set d = states('number.zariadka_7_5kvt_set_delay_time') | float(0) %}
        {% set l = states('number.zariadka_7_5kvt_set_define_time') | float(0) %}
        {% if d == 0 and l == 0 %}
        **Обидва таймери в нулі — це означає «не задано», а не «нуль годин».**
        Причина: станція починає заряджати одразу після підключення авто
        і не зупиняє його за часом.
        {% else %}
        Відкладений старт: {{ d | round(0) }} год · обмеження тривалості:
        {{ 'не задано' if l == 0 else (l | round(0) ~ ' год') }}.
        {% endif %}

        Апаратна межа станції — {{ states('sensor.zariadka_7_5kvt_max_set_ampere') }}.
        Зміни йдуть прямо в зарядну станцію; не чіпайте їх посеред активної сесії
        без потреби.
  # --- Секція 8а · Розклад заряджання ---
  # Власні таймери станції (set_delay_time, set_define_time) відлічують час від
  # підключення авто, а не за годинником, тому нічний тариф ними не спіймати.
  # Розклад веде Home Assistant трьома автоматизаціями ev_schedule_*.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Розклад заряджання
      icon: mdi:calendar-clock
      grid_options:
        columns: full
    - type: tile
      entity: input_boolean.zariadka_rozklad
      name: Заряджати за розкладом
      icon: mdi:calendar-clock
      color: green
      grid_options:
        columns: full
        rows: 1
    - type: tile
      entity: input_datetime.zariadka_pochatok
      name: Початок вікна
      icon: mdi:clock-start
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: input_datetime.zariadka_kinets
      name: Кінець вікна
      icon: mdi:clock-end
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: input_number.zariadka_strum_rozklad
      name: Струм у вікні
      icon: mdi:current-ac
      color: amber
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set on = is_state('input_boolean.zariadka_rozklad', 'on') %}
        {% set a = states('input_datetime.zariadka_pochatok')[:5] %}
        {% set b = states('input_datetime.zariadka_kinets')[:5] %}
        {% set amp = states('input_number.zariadka_strum_rozklad') | int(32) %}
        {% set v = states('sensor.zariadka_7_5kvt_voltage_a') | float(230) %}
        {% set nowt = now().strftime('%H:%M') %}
        {% set inside = (a <= nowt < b) if a <= b else (nowt >= a or nowt < b) %}
        {% set night = states('input_number.tarif_nich_23_00_06_59') | float(0) %}
        {% set day = states('input_number.tarif_den_07_00_22_59') | float(0) %}
        {% if not on %}
        ## ⚪ Розклад вимкнено
        Причина: заряджання відбувається лише вручну кнопками вище.
        {% elif inside %}
        ## 🟢 Зараз усередині вікна {{ a }}–{{ b }}
        Станція має заряджати на {{ amp }} А — це близько
        {{ (amp * v / 1000) | round(1) }} кВт.
        {% else %}
        ## 🌙 Вікно зачинене · відкриється о {{ a }}
        Причина: поза вікном заряджання заблоковане командою «Close charging».
        {% endif %}

        {% if night > 0 and day > 0 %}
        Нічний тариф **{{ night | round(2) }} грн** проти денного
        **{{ day | round(2) }} грн** — повна батарея вночі коштує в
        {{ (day / night) | round(1) }} раза дешевше. Тому типове вікно —
        23:00–06:59.
        {% endif %}

        Якщо машину під'єднати посеред вікна, заряджання почнеться одразу,
        а не наступної ночі.
  # --- Секція 8б · Що станція не віддає ---
  # Перевірено 2026-08-09: LocalTuya створив 23 сутності, з них 10 ніколи не
  # отримували значення. Показуємо це явно, щоб не шукати причину в дашборді.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Що не працює на цій станції
      icon: mdi:alert-circle-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set dead = ['unknown', 'unavailable'] %}
        {% set checks = [
             ('Другий перемикач живлення', 'switch.zariadka_7_5kvt_switch'),
             ('Режим заряджання (Energy/NOW/PCT/Schedule)', 'select.zariadka_7_5kvt_mode'),
             ('Стан підключення до хмари', 'select.zariadka_7_5kvt_online_state'),
             ('Робочий стан', 'sensor.zariadka_7_5kvt_work_state'),
             ('Залишок енергії', 'sensor.zariadka_7_5kvt_energy_balance'),
             ('Енергія сесії', 'sensor.zariadka_7_5kvt_energy_charge'),
             ('Ознака фази', 'sensor.zariadka_7_5kvt_phase_flag'),
             ('Скидання лічильника енергії', 'button.zariadka_7_5kvt_clear_energy')
           ] %}
        {% set ns = namespace(bad=[]) %}
        {% for label, ent in checks %}{% if states(ent) in dead %}{% set ns.bad = ns.bad + [label] %}{% endif %}{% endfor %}
        {% if ns.bad | count == 0 %}
        🟢 Усі контроли станції відповідають.
        {% else %}
        🟠 **Станція не віддає {{ ns.bad | count }} контрол(ів) із {{ checks | count }} перевірених.**
        Причина: LocalTuya налаштований на точки даних, яких ця модель не має або
        не публікує. Це не поломка дашборда — сутності створені, але значення в
        них ніколи не приходило.

        {% for b in ns.bad %}
        · {{ b }}
        {% endfor %}

        Найвідчутніша втрата — **режим заряджання**: вибір між «за енергією»,
        «зараз», «за відсотком» і «за розкладом» недоступний. Полагодити це можна
        лише перенастроюванням точок даних у самій інтеграції LocalTuya
        (Налаштування → Пристрої → LocalTuya → зарядна станція), не в YAML.
        {% endif %}

        Що працює й керується звідси: **зупинка і запуск сесії**, **максимальний
        струм**, **відкладений старт**, **обмеження тривалості**. Читаються
        потужність, струм і напруга фази A, температура, стан пристрою та
        несправність.
    - type: tile
      entity: switch.zariadka_7_5kvt
      name: Перемикач станції · ні на що не впливає
      icon: mdi:toggle-switch-off-outline
      tap_action:
        action: more-info
      grid_options:
        columns: full
        rows: 1
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set sw = states('switch.zariadka_7_5kvt') %}
        {% set p = states('sensor.zariadka_7_5kvt_device_kw') | float(0) %}
        Цей перемикач залишений тут лише для спостереження. Він **не вмикає й не
        вимикає заряджання** і навіть змінюється сам собою: 9 серпня о 13:02 він
        став «увімкнено», а через дві хвилини — «вимкнено», без жодної команди.
        {% if (sw == 'off' and p > 0.1) or (sw == 'on' and p < 0.1) %}

        Просто зараз він показує «{{ 'увімкнено' if sw == 'on' else 'вимкнено' }}»,
        а станція віддає {{ p | round(2) }} кВт — тобто його стан і реальність
        знову розходяться.
        {% endif %}
  # --- Секція 9 · Довідка ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Довідка
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        <details><summary>Як рахується електроенергія і гроші</summary>

        `sensor.zariadka_avto_spozhito` інтегрує фактичну потужність
        `sensor.zariadka_7_5kvt_device_kw` у часі. Стовпчики показують приріст
        цього накопичувального лічильника за кожну добу.
        `sensor.vitrati_zariadka_avto` множить спожите на тариф, що діяв у
        відповідний момент, тому нічне заряджання виходить дешевшим.

        </details>

        <details><summary>Що означає кожне налаштування</summary>

        **Максимальний струм** задає межу навантаження; для цієї однофазної
        станції пристрій повідомляє апаратну межу 32 А.
        **Відкладений старт** — через скільки годин почати заряджання.
        **Обмеження тривалості** — скільки годин дозволено заряджати після
        старту; нуль означає, що таймер не задано.

        </details>

        <details><summary>Чому струм приблизний</summary>

        Датчик струму самої інтеграції має неправильний масштаб і навіть
        помилкову одиницю «V». Тому струм обчислюється як
        потужність × 1000 ÷ напруга і явно позначений як приблизний.

        </details>

        <details><summary>Чому станція названа «Станція 1»</summary>

        Кожну наступну зарядну станцію буде додано окремою секцією з власними
        станом, лічильником, графіками та налаштуваннями — без змішування
        статистики між автомобілями або станціями.

        </details>
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.tarif_peremknuti_lichilniki_den_nich
        name: "Тариф - перемкнути лічильники день/ніч"
      - entity: automation.zariadzhannia_start_vikna_rozkladu
        name: "Заряджання - старт вікна розкладу"
      - entity: automation.zariadzhannia_kinets_vikna_rozkladu
        name: "Заряджання - кінець вікна розкладу"
      - entity: automation.zariadzhannia_avto_pidkliuchili_vseredini_vikna
        name: "Заряджання - авто підключили всередині вікна"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Тариф - перемкнути лічильники день/ніч** — Тримає всі utility_meter у тому самому тарифі, що й sensor.tarif_elektroenergii_zaraz: день 07:00-22:59, ніч 23:00-06:59. Без цієї автоматизації лічильники назавжди лишились би в тарифі, який був активний при створенні, і весь розподіл день/ніч був би неправильний. Тригер на старт Home Assistant обов'язковий: після перезапуску серед ночі лічильники інакше лишалися б у денному тарифі до наступної сьомої ранку. Затримка потрібна, щоб сутності utility_meter встигли з'явитися.

        **Заряджання - старт вікна розкладу** — О часі початку вікна виставляє струм і дозволяє заряджання. Потрібне саме тут, а не в самій станції - її власні таймери set_delay_time і set_define_time відлічують час від підключення авто, а не за годинником, тому нічний тариф ними не спіймати.

        **Заряджання - кінець вікна розкладу** — О часі кінця вікна зупиняє заряджання. Зупиняє саме командою Close charging - перемикач switch.zariadka_7_5kvt на сесію не впливає, це перевірено 2026-08-09.

        **Заряджання - авто підключили всередині вікна** — Якщо машину під'єднали посеред дозволеного вікна, заряджання має початися одразу, а не чекати наступної ночі. Спрацьовує на виході станції зі стану no_connet.
- title: Вентиляція
  path: ventilation
  icon: mdi:hvac
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 1 · Hero: чи свіже повітря ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set co2raw = states('sensor.2_floor_carbon_dioxide') %}
        {% set co2 = co2raw | float(0) %}
        {% set b1 = states('fan.siku_blauberg_fan_192_168_50_27') %}
        {% set b2 = states('fan.siku_blauberg_fan_192_168_50_123') %}
        {% set prana_on = is_state('fan.2_floor_supply_fan', 'on') or is_state('fan.2_floor_extract_fan', 'on') %}
        {% set working = [b1 == 'on', b2 == 'on', prana_on] | select | list | count %}
        {% if co2raw in bad %}
        ## 🟡 Датчик CO₂ не відповідає
        Причина: PRANA не віддає показання — без неї якість повітря оцінити нічим.
        {% elif co2 < 800 %}
        ## 🟢 Повітря свіже · CO₂ {{ co2 | round(0) }} ppm
        {% elif co2 < 1200 %}
        ## 🟠 Повітря прийнятне · CO₂ {{ co2 | round(0) }} ppm
        {% else %}
        ## 🔴 Задушливо · CO₂ {{ co2 | round(0) }} ppm
        {% endif %}

        {% if co2raw not in bad %}
        {% if co2 < 800 %}
        Причина: {{ working }} з трьох пристроїв провітрюють приміщення, і цього досить —
        нижче 800 ppm повітря вважається свіжим.
        {% elif co2 < 1200 %}
        Причина: провітрювання не встигає. Увімкніть посилений режим або додайте швидкості.
        {% else %}
        Причина: приміщення довго не провітрювалося. Увімкніть вентиляцію на максимум
        або відчиніть вікно.
        {% endif %}
        {% endif %}
        {% if not prana_on %}
        PRANA вимкнена повністю — усі її режими в нулі. Це нормальний стан, коли CO₂ у межах норми.
        {% endif %}
    - type: tile
      entity: sensor.2_floor_carbon_dioxide
      name: CO₂
      icon: mdi:molecule-co2
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.2_floor_volatile_organic_compounds_parts
      name: Леткі сполуки
      icon: mdi:air-filter
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.2_floor_humidity
      name: Вологість
      icon: mdi:water-percent
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.2_floor_inside_temperature
      name: Температура в приміщенні
      icon: mdi:thermometer
      grid_options:
        columns: 12
        rows: 1
  # --- Секція 2 · PRANA ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: PRANA · спальня батьків
      icon: mdi:air-filter
      grid_options:
        columns: full
    - type: tile
      entity: fan.2_floor_supply_fan
      name: Приплив
      icon: mdi:weather-windy
      features_position: bottom
      features:
      - type: fan-speed
      grid_options:
        columns: full
    - type: tile
      entity: fan.2_floor_extract_fan
      name: Витяжка
      icon: mdi:fan-chevron-down
      features_position: bottom
      features:
      - type: fan-speed
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set on = is_state('fan.2_floor_supply_fan', 'on') or is_state('fan.2_floor_extract_fan', 'on') %}
        {% if on %}
        🟢 Рекуператор працює. Шість швидкостей на кожен вентилятор.
        {% else %}
        ⚪ **Вимкнена.** Причина: обидва вентилятори зупинені вручну.
        Шість швидкостей на кожен вентилятор стануть доступні після ввімкнення.
        {% endif %}
    - type: entities
      title: Режими роботи
      show_header_toggle: false
      grid_options:
        columns: full
      entities:
      - entity: switch.2_floor_auto
        name: Автоматичний режим
      - entity: switch.2_floor_auto_plus
        name: Розширений автоматичний
      - entity: switch.2_floor_bound
        name: Синхронізувати приплив і витяжку
      - entity: switch.2_floor_heater
        name: Підігрів припливного повітря
      - entity: switch.2_floor_winter
        name: Зимовий режим
      - entity: number.2_floor_display_brightness
        name: Яскравість дисплея
  # --- Секція 3 · Blauberg №1 ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Blauberg №1 · кімната хлопців
      icon: mdi:fan
      grid_options:
        columns: full
    - type: tile
      entity: fan.siku_blauberg_fan_192_168_50_27
      name: Рекуператор
      icon: mdi:fan
      features_position: bottom
      features:
      - type: fan-speed
      - type: fan-preset-modes
        style: dropdown
        preset_modes:
        - auto
        - manual
        - 'on'
        - party
        - sleep
      - type: fan-direction
      - type: fan-oscillate
      grid_options:
        columns: full
    - type: tile
      entity: sensor.siku_blauberg_fan_192_168_50_27_rpm
      name: Оберти
      icon: mdi:rotate-right
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.siku_blauberg_fan_192_168_50_27_humidity
      name: Вологість
      icon: mdi:water-percent
      grid_options:
        columns: 12
        rows: 1
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: button
        entity: button.kimnata_khloptsiv_blauberg_no1_kimnata_khloptsiv_party_mode
        name: Посилений
        icon: mdi:weather-windy
        show_state: false
      - type: button
        entity: button.kimnata_khloptsiv_blauberg_no1_kimnata_khloptsiv_sleep_mode
        name: Нічний
        icon: mdi:weather-night
        show_state: false
    - type: markdown
      grid_options:
        columns: full
      content: '`192.168.50.27` · локально, без хмари · режим {{ states(''sensor.siku_blauberg_fan_192_168_50_27_mode'')
        }}'
  # --- Секція 4 · Blauberg №2 ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Blauberg №2 · кімната Олесі
      icon: mdi:fan
      grid_options:
        columns: full
    - type: tile
      entity: fan.siku_blauberg_fan_192_168_50_123
      name: Рекуператор
      icon: mdi:fan
      features_position: bottom
      features:
      - type: fan-speed
      - type: fan-preset-modes
        style: dropdown
        preset_modes:
        - auto
        - manual
        - 'on'
        - party
        - sleep
      - type: fan-direction
      - type: fan-oscillate
      grid_options:
        columns: full
    - type: tile
      entity: sensor.siku_blauberg_fan_192_168_50_123_rpm
      name: Оберти
      icon: mdi:rotate-right
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.siku_blauberg_fan_192_168_50_123_humidity
      name: Вологість
      icon: mdi:water-percent
      grid_options:
        columns: 12
        rows: 1
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: button
        entity: button.kimnata_olesi_blauberg_no2_kimnata_olesi_party_mode
        name: Посилений
        icon: mdi:weather-windy
        show_state: false
      - type: button
        entity: button.kimnata_olesi_blauberg_no2_kimnata_olesi_sleep_mode
        name: Нічний
        icon: mdi:weather-night
        show_state: false
    - type: markdown
      grid_options:
        columns: full
      content: '`192.168.50.123` · локально, без хмари · режим {{ states(''sensor.siku_blauberg_fan_192_168_50_123_mode'')
        }}'
  # --- Секція 5 · Якість повітря ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Якість повітря
      icon: mdi:molecule-co2
      grid_options:
        columns: full
    - type: gauge
      entity: sensor.2_floor_carbon_dioxide
      name: CO₂
      min: 400
      max: 2000
      needle: true
      severity:
        green: 400
        yellow: 800
        red: 1200
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.2_floor_volatile_organic_compounds_parts
        name: Леткі сполуки (VOC)
      - entity: sensor.2_floor_humidity
        name: Вологість
      - entity: sensor.2_floor_pressure
        name: Атмосферний тиск
    - type: markdown
      grid_options:
        columns: full
      content: |-
        400 ppm — свіже повітря надворі · до 800 свіже · до 1200 прийнятне ·
        понад 1200 задушливо, з'являється сонливість.
  # --- Секція 6 · Історія якості повітря ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Якість повітря за добу
      icon: mdi:chart-line
      grid_options:
        columns: full
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.2_floor_carbon_dioxide
        name: CO₂
      - entity: sensor.2_floor_volatile_organic_compounds_parts
        name: VOC
      - entity: sensor.2_floor_humidity
        name: Вологість
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Нічний пік CO₂ — норма для зачиненої спальні. Різке падіння вранці
        означає, що приміщення провітрили: або вентиляцією, або відчиненим вікном.
  # --- Секція 7 · Температури ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Температури
      icon: mdi:thermometer-lines
      grid_options:
        columns: full
    - type: tile
      entity: sensor.2_floor_inside_temperature
      name: У приміщенні
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.2_floor_outside_temperature
      name: Зовні · датчик 1
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.2_floor_outside_temperature_2
      name: Зовні · датчик 2
      grid_options:
        columns: 12
        rows: 1
    - type: custom:mini-graph-card
      name: Температури PRANA · 24 години
      hours_to_show: 24
      points_per_hour: 2
      line_width: 3
      animate: true
      show:
        labels: true
        points: false
      grid_options:
        columns: full
      entities:
      - entity: sensor.2_floor_inside_temperature
        name: Усередині
      - entity: sensor.2_floor_outside_temperature
        name: Зовні 1
      - entity: sensor.2_floor_outside_temperature_2
        name: Зовні 2
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set i = states('sensor.2_floor_inside_temperature') | float(0) %}
        {% set o = states('sensor.2_floor_outside_temperature') | float(0) %}
        {% if o > i %}
        Надворі тепліше на {{ (o - i) | round(1) }} °C — провітрювання зараз
        нагріє приміщення, а не охолодить.
        {% else %}
        Надворі холодніше на {{ (i - o) | round(1) }} °C — провітрювання
        охолоджує приміщення.
        {% endif %}
  # --- Секція 8 · Обслуговування ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Обслуговування і діагностика
      icon: mdi:wrench-clock
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set units = [
             ('Blauberg №1 · кімната хлопців', 'siku_blauberg_fan_192_168_50_27'),
             ('Blauberg №2 · кімната Олесі', 'siku_blauberg_fan_192_168_50_123')
           ] %}

        | Пристрій | Ресурс фільтра | Таймер | Прошивка | Аварія |
        |---|---|---|---|---|
        {% for name, slug in units -%}
        {% set f = states('sensor.' ~ slug ~ '_filter_timer_countdown') -%}
        {% set t = states('sensor.' ~ slug ~ '_timer_countdown') -%}
        {% set a = states('sensor.' ~ slug ~ '_alarm') -%}
        | {{ name }} | {{ 'н/д' if f in bad else ('лічильник не запущено' if f | float(0) == 0 else f ~ ' діб') }} | {{ 'н/д' if t in bad else ('не заданий' if t | float(0) == 0 else t ~ ' хв') }} | {{ states('sensor.' ~ slug ~ '_firmware_version') }} | {{ '🔴 є' if a | lower in ['true', 'on', '1'] else '🟢 немає' }} |
        {% endfor %}
        **«0 діб» у полі фільтра означає, що лічильник ресурсу ніколи не
        запускали** — а не те, що фільтр вичерпано. Причина: рекуператор починає
        відлік лише після ручного скидання після обслуговування.

        Скидання попередження фільтра свідомо не винесене на картки пристроїв:
        його натискають лише після фактичної заміни або миття фільтра.
  # --- Секція 9 · Довідка ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Довідка
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        <details><summary>Приплив, витяжка, синхронізація — що це і коли вмикати</summary>

        **Приплив** подає свіже повітря, **витяжка** видаляє відпрацьоване.
        Швидкість кожного вентилятора можна змінювати окремо. Режим
        **«Синхронізувати приплив і витяжку»** зв'язує їхні швидкості.
        **Автоматичний режим** керує вентиляцією за датчиками PRANA, а
        **розширений автоматичний** використовує посилений алгоритм пристрою.
        Підігрів і зимовий режим вмикайте за потреби в холодний період.

        </details>

        <details><summary>Режими Blauberg: авто, ручний, посилений, нічний</summary>

        Рекуператори **Blauberg** підключені локально, без хмарного сервісу.
        На їхніх картках доступні живлення, швидкість, автоматичний, ручний,
        посилений і нічний режими, напрямок повітря та чергування напрямків.
        Вологість, оберти, аварійний стан, таймери й версія прошивки винесені
        в таблицю обслуговування вище; історія вологості та обертів
        зберігається у Home Assistant.

        </details>

        <details><summary>Скільки має бути CO₂ і чому це важливо</summary>

        Надворі приблизно 400 ppm. До 800 ppm повітря вважається свіжим,
        до 1200 — прийнятним, вище 1200 з'являється сонливість і падає
        концентрація. Саме за цим показником має сенс керувати вентиляцією,
        а не за відчуттям духоти, яке запізнюється.

        </details>
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.bez_svitla_vimknuti_vazhki_spozhivachi
        name: "Без світла - вимкнути важкі споживачі"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Без світла - вимкнути важкі споживачі** — Вимикає обидва рекуператори Blauberg і припливний вентилятор PRANA разом з догрівачем, щойно будинок переходить на батарею. Вентиляція повертається до роботи вручну.
