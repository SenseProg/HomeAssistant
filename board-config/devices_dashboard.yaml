  # --- Секція 10 · Zigbee-датчики та їхні батареї ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Zigbee-датчики · батареї
      icon: mdi:battery-heart-variant
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set devices = [
             ('2 поверх — температура/вологість', 'sonoff_a4800819f3', true),
             ('Температура будинку — 2 поверх', 'sonoff_a48005e8ed', true),
             ('Вулиця — балкон', 'sonoff_a48005a66a', true),
             ('Гостьова — температура/вологість', 'sonoff_a48001c18f', true),
             ('Гаражні ворота — датчик 1', 'sonoff_a48001bcf2', false),
             ('Гаражні ворота — датчик 2', 'sonoff_a48005b691', false)
           ] %}
        {% set mb = states('sensor.sonoff_a48001bcc7_battery') %}
        {% set motion = states('binary_sensor.sonoff_a48001bcc7') %}
        {% set ns = namespace(offline=0, low=0) %}
        {# Підрахунок робиться одним рядком: перенос усередині циклу розірвав би markdown-таблицю нижче. #}
        {% for name, slug, has_climate in devices %}{% set b = states('sensor.' ~ slug ~ '_battery') %}{% if b in bad %}{% set ns.offline = ns.offline + 1 %}{% elif b | float(100) < 25 %}{% set ns.low = ns.low + 1 %}{% endif %}{% endfor %}
        {% if mb in bad %}{% set ns.offline = ns.offline + 1 %}{% elif mb | float(100) < 25 %}{% set ns.low = ns.low + 1 %}{% endif %}

        | Датчик | Батарея | Показання |
        |---|---|---|
        {% for name, slug, has_climate in devices -%}
        {% set b = states('sensor.' ~ slug ~ '_battery') -%}
        {% set t = states('sensor.' ~ slug ~ '_temperature') if has_climate else 'none' -%}
        | {{ name }} | {{ ('🔴 датчик офлайн' if b in bad else (('🟠 ' if b | float(100) < 25 else '🟢 ') ~ b ~ ' %')) }} | {{ 'н/д' if b in bad else (('дані не надходять' if t in bad else t ~ ' °C · ' ~ states('sensor.' ~ slug ~ '_humidity') ~ ' %') if has_climate else 'на зв\'язку') }} |
        {% endfor -%}
        | Датчик руху | {{ '🔴 датчик офлайн' if mb in bad else '🟢 ' ~ mb ~ ' %' }} | {{ '🟠 виявлено рух' if motion == 'on' else ('руху немає' if motion == 'off' else 'н/д') }} |

        {% if ns.offline > 0 %}
        🔴 **Офлайн датчиків: {{ ns.offline }}.** Причина: Zigbee-пристрій не виходив на зв'язок —
        зазвичай це сіла батарея або пристрій поза радіусом шлюза.
        {% elif ns.low > 0 %}
        🟠 **Батарея сідає в {{ ns.low }} датчика(ів)** — нижче 25 %, варто підготувати заміну.
        {% else %}
        🟢 Усі Zigbee-датчики на зв'язку, батареї в нормі.
        {% endif %}
  # --- Секція 11 · Довідка ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Довідка
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        <details><summary>Чому немає WAN-статусу і зовнішньої IP</summary>

        Вбудовані сенсори WAN-статусу і зовнішньої IP (через UPnP/IGD) на цьому
        роутері нестабільні і завжди повертають `unavailable` / `0.0.0.0`.
        Причина: це обмеження прошивки ASUS, а не Home Assistant. Прибрано з
        дашборда свідомо, щоб не показувати завідомо неправдиві значення.

        </details>

        <details><summary>Можливості точок доступу і що означає dBm</summary>

        **Tenda AC10 v3 / AC1200**, режим точки доступу. Паспортна швидкість: до
        **300 Мбіт/с** на 2,4 ГГц і до **867 Мбіт/с** на 5 ГГц; Ethernet-порти
        гігабітні. Показаний трафік — не швидкість Wi-Fi-з'єднання, а поточний
        корисний трафік клієнтів, який повідомляє сама Tenda.

        **Tenda A9 / N300**, лише 2,4 ГГц, паспортна швидкість до **300 Мбіт/с**.
        Прошивка не віддає фактичну швидкість з'єднання або трафік окремих
        клієнтів, тому показується рівень сигналу аплінка в dBm. Значення ближче
        до нуля — краще; приблизно −60…−70 dBm зазвичай придатне, але запас
        невеликий.

        </details>

        <details><summary>Як визначається «удома» і чому точка Wi-Fi не важлива</summary>

        Людина має стан **удома**, коли хоча б один прив'язаний телефон бачить
        Home Assistant або основний роутер ASUS. Клієнти ASUS, Tenda «Промінь» і
        Tenda-повторювача належать до однієї домашньої мережі, тому конкретна
        точка підключення на присутність не впливає.

        </details>

        <details><summary>Мережеві нотатки автополиву</summary>

        Контролер очікується на `192.168.50.221` (`38:2C:E5:2D:5B:32`), насос — на
        `192.168.50.91` (`80:64:7C:46:E8:D1`), обидва через LocalTuya. Якщо
        локальний зв'язок відсутній, клапани не слід запускати до відновлення
        зв'язку: Home Assistant не зможе їх закрити.

        </details>

        Правило зростання цієї сторінки: новий пристрій додає **рядок у таблицю
        або в акордеон**, а не ще одну картку.
