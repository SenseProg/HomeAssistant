      - entity: sensor.zariadka_7_5kvt_max_set_ampere
        name: Апаратна межа струму
    - type: markdown
      title: Що означають налаштування
      grid_options:
        columns: full
      content: '**Максимальний струм** задає межу навантаження; для цієї однофазної станції пристрій повідомляє
        апаратну межу 32 А. **Відкладений старт** — через скільки годин почати заряджання. **Обмеження
        тривалості** — скільки годин дозволено заряджати після старту; нуль означає, що таймер не задано.

        Зміни застосовуються безпосередньо до зарядної станції. Не змінюйте їх посеред активної сесії
        без потреби.'
