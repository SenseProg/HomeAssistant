        name: "Звʼязок - відеоархів не змонтований"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      content: |-
        **Звʼязок - камера офлайн** — Камера двору .201 не відповідає понад 10 хвилин — пуш; без неї немає ні кліпів, ні знімків руху.

        **Звʼязок - відеоархів не змонтований** — Відеоархів NAS відмонтований понад 15 хвилин — кліпи не пишуться, пуш.
