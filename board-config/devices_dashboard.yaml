views:
- title: Мережа
  path: router
  icon: mdi:router-wireless
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 1 · Hero: стан мережі однією відповіддю ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set asus = states('sensor.spalnia_batkiv_192_168_50_1_devices_connected') %}
        {% set ap_n = states('sensor.tenda_ap_clients') %}
        {% set rep_n = states('sensor.tenda_repeater_clients') %}
        {% set sig = states('sensor.tenda_repeater_signal') %}
        {% set dn = states('sensor.spalnia_batkiv_192_168_50_1_download_speed') | float(0) %}
        {% set up = states('sensor.spalnia_batkiv_192_168_50_1_upload_speed') | float(0) %}
        {% set trackers = states.device_tracker | list %}
        {% set home = trackers | selectattr('state', 'eq', 'home') | list | count %}
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set key_states = [
             is_state('binary_sensor.cloudmate_nas_online', 'on'),
             is_state('binary_sensor.hikvision_camera_online', 'on'),
             states('switch.avtopoliv_kontroler_avtopoliv_klapan_1') not in bad,
             states('switch.mini_switch_k601_2_switch_1_2') not in bad,
             rep_n not in bad,
             is_state('binary_sensor.tcl_tv_online', 'on')
           ] %}
        {% set key_ok = key_states | select | list | count %}
        {% set aps_ok = (asus not in bad) and (ap_n not in bad) and (rep_n not in bad) %}
        {% if aps_ok %}
        ## 🟢 Мережа працює · {{ asus }} пристроїв на зв'язку
        {% else %}
        ## 🔴 Точка доступу не відповідає
        {% endif %}

        {% if aps_ok %}
        Причина: усі три точки доступу онлайн, повторювач тримає аплінк на {{ sig }} dBm.
        {% else %}
        Причина: хоча б одна з точок доступу не віддає дані — перевірте живлення обладнання.
        {% endif %}
        Удома {{ home }} із {{ trackers | count }} відстежуваних пристроїв · інтернет ↓ {{ dn | round(2) }} / ↑ {{ up | round(2) }} Мбіт/с ·
        ключових пристроїв на зв'язку {{ key_ok }} із 6.

        {% if states('sensor.tenda_ap_security') == 'Не встановлено' %}
        ⚠️ **Пароль адміністратора не встановлено — Tenda AC10 «Промінь» і Tenda A9.**
        Будь-хто в домашній мережі може змінити налаштування точок доступу.
        Причина: заводські налаштування ніколи не змінювали.
        {% endif %}
    - type: tile
      entity: sensor.spalnia_batkiv_192_168_50_1_devices_connected
      name: Клієнтів на ASUS
      icon: mdi:lan-connect
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.tenda_ap_clients
      name: Клієнтів на «Промені»
      icon: mdi:access-point
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.tenda_repeater_signal
      name: Сигнал повторювача
      icon: mdi:wifi-sync
      color: green
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
      name: Швидкість завантаження
      icon: mdi:download-network
      color: blue
      grid_options:
        columns: 12
        rows: 1
  # --- Секція 2 · ASUS RT-AX55 ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: ASUS RT-AX55 · «Отаке»
      icon: mdi:router-wireless
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: '`192.168.50.1` · основний роутер'
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_devices_connected
        name: Клієнтів
      - entity: sensor.spalnia_batkiv_192_168_50_1_cpu_temperature
        name: Температура CPU
      - entity: sensor.spalnia_batkiv_192_168_50_1_5ghz_temperature
        name: Радіо 5 ГГц
      - type: divider
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_1_min
        name: Навантаження 1 хв
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_5_min
        name: Навантаження 5 хв
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_15_min
        name: Навантаження 15 хв
  # --- Секція 3 · Tenda AC10 ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Tenda AC10 · «Промінь»
      icon: mdi:access-point
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        `192.168.50.2` · точка доступу
        {% if states('sensor.tenda_ap_security') == 'Не встановлено' %}
        · ⚠️ **без пароля адміністратора**
        {% endif %}
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_ap_clients
        name: Клієнтів
      - entity: sensor.tenda_ap_download_speed
        name: Трафік клієнтів ↓
      - entity: sensor.tenda_ap_upload_speed
        name: Трафік клієнтів ↑
      - type: divider
      - entity: sensor.tenda_ap_status
        name: Прошивка
      - entity: sensor.tenda_ap_security
        name: Пароль адміністратора
  # --- Секція 4 · Tenda A9 ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Tenda A9 · повторювач
      icon: mdi:wifi-sync
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: '`192.168.50.102` · мережа «Отаке» · лише 2,4 ГГц, до 300 Мбіт/с'
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_repeater_clients
        name: Клієнтів
      - entity: sensor.tenda_repeater_status
        name: Стан аплінка
      - entity: sensor.tenda_repeater_signal
        name: Сигнал аплінка
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set s = states('sensor.tenda_repeater_signal') | float(-100) %}
        {% if s >= -60 %}
        🟢 Сигнал впевнений ({{ s | round(0) }} dBm) — запас великий.
        {% elif s >= -70 %}
        🟢 Сигнал придатний ({{ s | round(0) }} dBm), але запас невеликий.
        Причина: ближче до −70 dBm швидкість падає першою.
        {% else %}
        🟠 Сигнал слабкий ({{ s | round(0) }} dBm) — переставте повторювач ближче до роутера.
        {% endif %}
  # --- Секція 5 · Zigbee-шлюз ---
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: SONOFF ZBBridge
      icon: mdi:zigbee
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set bridge = clients | selectattr('devIp', 'defined') | selectattr('devIp', 'equalto', '192.168.50.164') | list %}
        {% if bridge | count > 0 %}
        🟢 **Онлайн** · з'єднаний через повторювач Tenda A9

        `192.168.50.164` · `{{ bridge[0].devMac | upper }}`
        прошивка `1.7.0` · SONOFF ID `100124a572`
        {% else %}
        🔴 **Недоступний** — шлюза немає у списку клієнтів Tenda A9.
        Причина: без шлюза дочірні Zigbee-датчики перестають оновлюватися.
        {% endif %}

        Передає в Home Assistant кліматичні датчики, датчики гаражних воріт і руху.
        Їхні батареї — у секції «Zigbee-датчики» нижче.
  # --- Секція 6 · Швидкість інтернету ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Швидкість інтернету
      icon: mdi:speedometer
      grid_options:
        columns: full
    - type: tile
      entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
      name: Завантаження
      color: green
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.spalnia_batkiv_192_168_50_1_upload_speed
      name: Вивантаження
      color: blue
      grid_options:
        columns: 12
        rows: 1
    - type: history-graph
      hours_to_show: 3
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
        name: Завантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload_speed
        name: Вивантаження
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Лічильники «Завантажено/Вивантажено» роутер не веде — вони завжди 0,00 ГБ
        ({{ states('sensor.spalnia_batkiv_192_168_50_1_download') }} / {{ states('sensor.spalnia_batkiv_192_168_50_1_upload') }} ГБ).
        Причина: прошивка ASUS не віддає накопичувальні лічильники через LAN-опитування.
  # --- Секція 7 · Хто вдома ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Хто зараз удома
      icon: mdi:home-account
      grid_options:
        columns: full
    - type: tile
      entity: person.dim_kovtuni
      name: Дмитро
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: person.katerina
      name: Катерина
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: person.olesia
      name: Олеся
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: person.babusia_sima
      name: Бабуся Сіма
      grid_options:
        columns: 12
        rows: 1
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Людина має стан **удома**, коли хоча б один прив'язаний телефон бачить
        Home Assistant або основний роутер ASUS. Точка Wi-Fi значення не має:
        клієнти ASUS, «Променя» і повторювача належать до однієї домашньої мережі.
  # --- Секція 8 · Ключові пристрої однією таблицею ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Ключові пристрої
      icon: mdi:server-network
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set irr = states('switch.avtopoliv_kontroler_avtopoliv_klapan_1') %}
        {% set pump = states('switch.mini_switch_k601_2_switch_1_2') %}
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set bridge_on = (clients | selectattr('devIp', 'defined') | selectattr('devIp', 'equalto', '192.168.50.164') | list | count) > 0 %}

        | Пристрій | Адреса | Підключення | Стан |
        |---|---|---|---|
        | CloudMate — NAS QNAP | `192.168.50.25` | 🔌 Ethernet · ASUS | {{ '🟢 доступний' if is_state('binary_sensor.cloudmate_nas_online','on') else ('🔴 недоступний' if is_state('binary_sensor.cloudmate_nas_online','off') else '🟡 визначається') }} |
        | Камера Hikvision — двір | `192.168.50.201` | 🔌 Ethernet · ASUS | {{ '🟢 доступна' if is_state('binary_sensor.hikvision_camera_online','on') else ('🔴 недоступна' if is_state('binary_sensor.hikvision_camera_online','off') else '🟡 визначається') }} |
        | Контролер автополиву Tuya — 8 зон | `192.168.50.221` | 📶 Wi-Fi 2,4 ГГц · ASUS | {{ '🟢 LocalTuya 3.4' if irr not in bad else '🔴 локального зв\'язку немає' }} |
        | Насос автополиву K601 | `192.168.50.91` | 📶 Wi-Fi 2,4 ГГц · ASUS | {{ ('🟢 увімкнений' if pump == 'on' else '🟢 вимкнений') if pump not in bad else '🔴 локального зв\'язку немає' }} |
        | SONOFF ZBBridge — Zigbee-шлюз | `192.168.50.164` | 📶 Wi-Fi 2,4 ГГц · Tenda A9 | {{ '🟢 онлайн' if bridge_on else '🔴 недоступний' }} |
        | Телевізор TCL — Google Cast | `192.168.50.175` | 📶 Wi-Fi · ASUS | {{ '🟢 увімкнений' if is_state('binary_sensor.tcl_tv_online','on') else ('⚪ вимкнений — це норма' if is_state('binary_sensor.tcl_tv_online','off') else '🟡 визначається') }} |

        <details><summary>Мережеві подробиці цих пристроїв</summary>

        **CloudMate** — `00:08:9B:ED:62:EF`, адреса закріплена в ASUS RT-AX55.

        **Камера Hikvision** — `10:12:FB:F7:95:AD`, сервіси HTTP `80` · RTSP `554` ·
        Hikvision SDK `8000`. Живе відео й датчики руху — на вкладці «Камера і рух».

        **Контролер автополиву** — `38:2C:E5:2D:5B:32`, LocalTuya, протокол 3.4,
        опитування кожні 5 с. Старий IP `192.168.50.223` більше не використовується.
        Контролер не з'являється в загальному списку клієнтів, бо AsusWRT не створює
        для нього окремий `device_tracker`, а до Tenda він не підключений.

        **Насос K601** — `80:64:7C:46:E8:D1`, LocalTuya через TCP `6668`.
        Картка лишається тут незалежно від того, чи створив AsusWRT для насоса
        окремий `device_tracker`.

        **Телевізор TCL** — `F0:35:75:B3:31:80`, TCL BeyondTV · Google Cast.
        Коли телевізор вимкнений, його мережевий модуль теж вимикається — тому
        «вимкнений» тут нормальний стан, а не проблема. Керувати ним або надсилати
        фото до ввімкнення неможливо.

        </details>
  # --- Секція 9 · Невідомі пристрої ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Невідомі пристрої
      icon: mdi:help-network
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {# Невідомий = клієнт, якому ніхто не дав людської назви: його немає в
           наших словниках, ASUS не завів для нього device_tracker, і точка
           доступу не повідомила осмислений hostname. Інфраструктуру (роутер,
           обидві Tenda, плату HA) виключаємо за IP. #}
        {% set named_macs = [
             '00:08:9b:ed:62:ef', '04:d6:f4:70:ad:b3', '08:3a:f2:2d:32:30',
             '14:2b:2f:e1:54:60', '30:83:98:c1:6e:ac', '3c:0b:59:11:9a:13',
             '80:64:7c:46:e8:d1', '84:cc:a8:96:28:a7', '98:f4:ab:ee:a5:c5',
             '98:f4:ab:ee:a8:4e', 'd4:27:87:50:23:6c', 'd8:d6:68:31:ba:49',
             'e0:98:06:af:b7:41', 'dc:6a:e7:a1:09:f2', '62:1a:51:f4:b2:ee',
             '38:2c:e5:2d:5b:32', 'f0:35:75:b3:31:80', '10:12:fb:f7:95:ad',
             '1e:c0:d2:73:2c:c9', 'c0:35:32:c4:8a:4b'
           ] %}
        {% set named_ips = [
             '192.168.50.13', '192.168.50.25', '192.168.50.27', '192.168.50.36',
             '192.168.50.91', '192.168.50.118', '192.168.50.123', '192.168.50.157',
             '192.168.50.164', '192.168.50.175', '192.168.50.176', '192.168.50.179',
             '192.168.50.201', '192.168.50.219', '192.168.50.221'
           ] %}
        {% set infra_ips = ['192.168.50.1', '192.168.50.2', '192.168.50.102', '192.168.50.141'] %}
        {# Наш довідник трекерів. Ім'я від роутера НЕ робить пристрій відомим:
           «ESP_EEA5C5» — це заводський hostname, а не назва, яку дали ми. #}
        {% set our_trackers = [
             'device_tracker.homemate', 'device_tracker.ok3568',
             'device_tracker.s23_ultra_dvk', 'device_tracker.s24_koristuvaca_kateryna',
             'device_tracker.s20_fe_koristuvaca_kateryna',
             'device_tracker.s21_pol_zovatela_kateryna',
             'device_tracker.a24_koristuvaca_vasilij', 'device_tracker.galaxy_j8',
             'device_tracker.laptop_u1i8pnmk', 'device_tracker.cloudmate',
             'device_tracker.esp_eea5c5', 'device_tracker.esp_eea84e'
           ] %}
        {% set tm = namespace(macs=[]) %}
        {% for t in states.device_tracker %}
        {%- set m = t.attributes.mac | default('', true) | lower -%}
        {%- if m and t.entity_id in our_trackers %}{% set tm.macs = tm.macs + [m] %}{% endif -%}
        {% endfor %}
        {% set ns = namespace(rows=[], macs=[]) %}
        {% for t in states.device_tracker if t.state == 'home' %}
        {%- set m = t.attributes.mac | default('', true) | lower -%}
        {%- set ip = t.attributes.ip | default('', true) -%}
        {%- if m and ip and m not in ns.macs and m not in named_macs and m not in tm.macs
               and ip not in named_ips and ip not in infra_ips -%}
        {%- set ns.macs = ns.macs + [m] -%}
        {%- set ns.rows = ns.rows + [(m, ip, t.name, 'ASUS RT-AX55')] -%}
        {%- endif -%}
        {% endfor %}
        {% for c in (state_attr('sensor.tenda_ap_clients', 'onlineList') or []) %}
        {%- set m = c.qosListMac | default('', true) | lower -%}
        {%- set ip = c.qosListIP | default('', true) -%}
        {%- set host = c.qosListHostname | default('', true) -%}
        {%- if m and m not in ns.macs and m not in named_macs and m not in tm.macs
               and ip not in named_ips and ip not in infra_ips -%}
        {%- set ns.macs = ns.macs + [m] -%}
        {%- set ns.rows = ns.rows + [(m, ip, host, 'Tenda AC10 · «Промінь»')] -%}
        {%- endif -%}
        {% endfor %}
        {% for c in (state_attr('sensor.tenda_repeater_clients', 'onlineList') or []) %}
        {%- set m = c.devMac | default('', true) | lower -%}
        {%- set ip = c.devIp | default('', true) -%}
        {%- set host = c.devName | default('', true) -%}
        {%- if m and m not in ns.macs and m not in named_macs and m not in tm.macs
               and ip not in named_ips and ip not in infra_ips -%}
        {%- set ns.macs = ns.macs + [m] -%}
        {%- set ns.rows = ns.rows + [(m, ip, host, 'Tenda A9 · повторювач')] -%}
        {%- endif -%}
        {% endfor %}
        {% if ns.rows | count == 0 %}
        🟢 **Усі пристрої в мережі впізнані.** Кожен клієнт має або назву в
        нашому довіднику, або ім'я від роутера.
        {% else %}
        🟠 **У мережі {{ ns.rows | count }} пристрій(ів), яким ми не дали назви.**
        Причина: вони підключилися, але їх немає в нашому довіднику. Ім'я в
        таблиці — це те, що повідомив сам пристрій або роутер, а не назва, яку
        дали ми. Саме тут з'явиться кожен новий пристрій, який ви щойно увімкнули
        в розетку.

        | Як себе назвав | Адреса | MAC | Підключений через |
        |---|---|---|---|
        {% for m, ip, host, where in ns.rows -%}
        | {{ host if host and host | lower not in ['unknown', 'unknow'] else '— не повідомив —' }} | {{ ip if ip and ip != 'UnKnown' else 'IP не отримано' }} | `{{ m | upper }}` | {{ where }} |
        {% endfor %}
        {% endif %}

        <details><summary>Що з цим робити</summary>

        **Якщо пристрій ваш** — закріпіть за ним адресу в ASUS RT-AX55
        (`192.168.50.1` → Network Map → Clients) і дайте зрозумілу назву. Після
        цього він зникне з цього списку й з'явиться у «Ключових пристроях» або в
        повному переліку клієнтів.

        **Якщо пристрій не ваш** — це привід перевірити, хто підключений до
        домашньої мережі. Обидві точки доступу Tenda зараз без пароля
        адміністратора, тож почніть саме з нього.

        MAC, що починається з 02, 06, 0A, 0E, 12… (друга цифра 2, 6, A або E) —
        це рандомізована адреса телефона чи ноутбука. Такий пристрій щоразу
        приходить під новим MAC, і впізнати його за адресою неможливо.

        </details>
