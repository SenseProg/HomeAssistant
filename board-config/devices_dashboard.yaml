- title: Інвертор Deye
  path: deye-inverter
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Deye · трифазний гібридний інвертор
      icon: mdi:solar-power-variant
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: "{% set missing = ['unknown', 'unavailable', 'none', ''] %}\n{% set connected = is_state('binary_sensor.inverter_connection',\
        \ 'on') %}\n{% set state = states('sensor.inverter_device_state') %}\n{% set alarm = states('sensor.inverter_device_alarm')\
        \ %}\n{% set fault = states('sensor.inverter_device_fault') %}\n{% if not connected or state in\
        \ missing %}\n# \U0001F534 ІНВЕРТОР НЕ ВІДПОВІДАЄ\n\nПеревірте мережеве підключення Deye `192.168.50.179`\
        \ та живлення пристрою.\n{% elif alarm != 'OK' or fault != 'OK'\n      or is_state('binary_sensor.inverter_battery_alarm',\
        \ 'on')\n      or is_state('binary_sensor.inverter_battery_fault', 'on') %}\n# \U0001F534 ПОТРІБНА\
        \ УВАГА\n\n**Стан:** {{ state }} · **аварія:** {{ alarm }} · **несправність:** {{ fault }}\n{%\
        \ else %}\n# \U0001F7E2 DEYE ПРАЦЮЄ НОРМАЛЬНО\n\n**Навантаження:** {{ (states('sensor.inverter_load_power')\
        \ | float(0) / 1000) | round(2) }} кВт ·\n**мережа:** {{ (states('sensor.inverter_grid_power')\
        \ | float(0) / 1000) | round(2) }} кВт ·\n**акумулятор:** {{ states('sensor.inverter_battery')\
        \ }}%\n{% endif %}\n\nЗв'язок: **{{ 'є' if connected else 'немає' }}** · оновлення кожні\n{{ states('sensor.inverter_update_interval')\
        \ | float(0) | round(1) }} с ·\nтемпература {{ states('sensor.inverter_temperature') }} °C.\n\n\
        [Відкрити детальну панель «Потужність»](/power-dashboard/inverter)\n"
