  # Розклад нагріву. Час у helper'ах, а не в автоматизації, саме щоб його можна
  # було правити звідси. Вимикач "нагрів за розкладом" стосується лише вмикання:
  # вимкнення о кінці вікна відбувається безумовно, інакше бойлер міг би лишитись
  # гріти на денному тарифі.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Розклад нагріву
      icon: mdi:calendar-clock
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set a = states('input_datetime.boiler_babusi_pochatok')[:5] %}
        {% set b = states('input_datetime.boiler_babusi_kinets')[:5] %}
        {% set on = is_state('input_boolean.boiler_babusi_rozklad','on') %}
        {% if on %}Гріє з **{{ a }}** до **{{ b }}**{% else %}Розклад вимкнено — бойлер лише під ручним керуванням{% endif %}
        Нічний тариф діє 23:00–06:59.{% if on and b > '06:59' %} ⚠️ Кінець вікна виходить за нічний тариф.{% endif %}
    - type: tile
      entity: input_boolean.boiler_babusi_rozklad
      name: Нагрів за розкладом
      icon: mdi:calendar-clock
      features_position: bottom
      features:
      - type: toggle
      grid_options:
        columns: full
        rows: 1
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: input_datetime.boiler_babusi_pochatok
        name: Початок нагріву
      - entity: input_datetime.boiler_babusi_kinets
        name: Кінець нагріву
  # Спожито з розділенням на тарифи - той самий utility_meter, що і в решти
  # приладів, тож цифри порівнянні між собою.
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Спожито за тарифами
      icon: mdi:cash-clock
      grid_options:
        columns: full
    - type: tile
      entity: sensor.boiler_babusi_za_tarifom_nich
      name: Нічний тариф
      icon: mdi:weather-night
      grid_options:
        columns: 6
        rows: 1
    - type: tile
      entity: sensor.boiler_babusi_za_tarifom_den
      name: Денний тариф
      icon: mdi:weather-sunny
      grid_options:
        columns: 6
        rows: 1
    - type: history-graph
      title: Споживання за 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.smart_plug_power
        name: Потужність
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.boiler_babusi_pochatok_nagrivu
        name: "Бойлер бабусі - початок нагріву"
      - entity: automation.boiler_babusi_kinets_nagrivu
        name: "Бойлер бабусі - кінець нагріву"
      - entity: automation.svitlo_nagadati_pro_boiler
        name: "Світло - нагадати про бойлер"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Бойлер бабусі - початок нагріву** — Вмикає розетку бойлера о часі з input_datetime.boiler_babusi_pochatok. Час тримається в helper, а не тут, щоб міняти його з дашборда без правки YAML. Нічний тариф 23:00-06:59, тож типове вікно 04:00-07:00 повністю в ньому. Керування ЛОКАЛЬНЕ - switch.boiler_babusi_socket з LocalTuya. Раніше тут стояв хмарний switch.smart_plug_socket_1, і 27 серпня о 04:00 хмара Tuya відповіла "Remote api run unknown failed": скрипт обірвався на першій же дії, бойлер не грівся цілу добу, а помітили це лише за порожнім графіком споживання. continue_on_error лишається обов'язковим і на локальному каналі: без нього виняток інтеграції валить весь скрипт, і жоден повтор не відпрацює. П'ять спроб по дві хвилини - це десять хвилин, вони цілком уміщаються в нічний тариф навіть при старті о 04:00. Стільки спроб потрібно й локально: після рестарту Home Assistant LocalTuya піднімає зʼєднання близько трьох хвилин, і команда, віддана в цьому вікні, просто нікуди не йде. Шоста спроба - хмарою. Це єдине місце, де хмара ще потрібна для бойлера: коли локальна сесія мертва, вона лишається єдиним способом дістати розетку. Тобто токен Tuya більше не вирішує, чи буде гаряча вода, - він вирішує лише, чи спрацює запасний вихід. Якщо не вдалося - приходить сповіщення. Тихий провал гірший за будь-який інший: бойлер не гріє, а дізнаєшся про це аж коли по воді.

        **Бойлер бабусі - кінець нагріву** — Вимикає розетку о часі з input_datetime.boiler_babusi_kinets. Вимикає безумовно, навіть якщо розклад був вимкнений посеред нагріву - інакше бойлер лишився б гріти на денному тарифі. Керування таке саме локальне, як і на вмиканні: switch.boiler_babusi_socket, а хмарний switch.smart_plug_socket_1 лишився шостою, запасною спробою. Тут повтори важать більше, ніж на вмиканні. Провалене вмикання коштує однієї холодної доби; провалене вимикання лишає бойлер грітися по 5 грн за кВт·год доти, доки хтось не помітить. Тому пауза між спробами коротша - хвилина, а не дві, і сповіщення написане як тривога, а не як зауваження. Успіх зараховується, якщо off підтвердив БУДЬ-ЯКИЙ із двох каналів. Вимагати згоди обох означало б бити на сполох щоразу, коли один із них недоступний, хоча розетка вже розімкнена.

        **Світло - нагадати про бойлер** — Назад бойлер сам не вмикається - рішення, коли гріти воду, лишається за людьми, а не за автоматикою. Тому лише нагадування.
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.boiler_vidklasti_dezinfektsiiu_do_23_00
        name: "Бойлер - відкласти дезінфекцію до 23:00"
      - entity: automation.boiler_zapustiti_vidkladenu_dezinfektsiiu_o_23_00
        name: "Бойлер - запустити відкладену дезінфекцію о 23:00"
      - entity: automation.boiler_babusi_pochatok_nagrivu
        name: "Бойлер бабусі - початок нагріву"
      - entity: automation.boiler_babusi_kinets_nagrivu
        name: "Бойлер бабусі - кінець нагріву"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Бойлер - відкласти дезінфекцію до 23:00** — Якщо Midea сам починає дезінфекцію вдень за денним тарифом — зупиняє її і відкладає на 23:00.

        **Бойлер - запустити відкладену дезінфекцію о 23:00** — О 23:00, уже в нічному тарифі, запускає відкладену дезінфекцію.

        **Бойлер бабусі - початок нагріву** — Вмикає розетку бойлера бабусі о часі початку вікна (типово 04:00), якщо ввімкнено «нагрів за розкладом».

        **Бойлер бабусі - кінець нагріву** — Вимикає розетку о часі кінця вікна (типово 06:59 — останні хвилини нічного тарифу).
  # --- Сповіщення відокремлено від автоматизацій 02.09.2026 на прохання власника:
  #     інформаційний засіб живе окремо, з власним перемикачем і часом останнього спрацювання. ---
  - type: grid
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.svitlo_nagadati_pro_boiler
        name: "Світло - нагадати про бойлер"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      grid_options:
        columns: full
      content: |-
        **Світло - нагадати про бойлер** — Коли світло повертається — нагадує увімкнути бойлер, якщо його вимкнула автоматика блекауту.
