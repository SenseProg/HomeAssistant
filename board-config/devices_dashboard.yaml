      name: Наступне заживлення
      grid_options:
        columns: 12
        rows: 1
    - type: calendar
      title: Заплановані та імовірні відключення
      initial_view: listWeek
      entities:
      - calendar.yasno_kiiv_3_1_planned_outages
      - calendar.yasno_kiiv_3_1_probable_outages
      grid_options:
        columns: full
  # --- Секція 7 · Історія ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Останні три доби
      icon: mdi:history
      grid_options:
        columns: full
    - type: history-graph
      hours_to_show: 72
      grid_options:
        columns: full
      entities:
      - entity: binary_sensor.svitlo_vidsutnie
        name: Мережа зникла
      - entity: binary_sensor.invertor_zviazok
        name: Зв'язок з інвертором
    - type: history-graph
      hours_to_show: 72
      grid_options:
        columns: full
      entities:
      - entity: sensor.inverter_battery
        name: Батарея, %
- title: Сповіщення
  path: alerts
  icon: mdi:bell-outline
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 1 · Hero: скільки нових, і одна кнопка ---
  # Джерело - власний журнал сповіщень (config/scripts/notify_log.py,
  # notifications.db). Він ловить КОЖЕН виклик notify.* і
  # persistent_notification.create, тому тут є і те, що прийшло на телефон,
  # і те, що показала панель, і те, що зникло при рестарті.
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set n = states('sensor.spovishchennia_zhurnal') | int(0) %}
        {% set sohodni = state_attr('sensor.spovishchennia_zhurnal', 'today') | int(0) %}
        {% set usoho = state_attr('sensor.spovishchennia_zhurnal', 'total') | int(0) %}
        ## {{ '🔵 ' ~ n ~ ' нових' if n > 0 else '✅ Нових немає' }} · {{ sohodni }} за добу · {{ usoho }} у журналі
        Прочитано до {{ state_attr('sensor.spovishchennia_zhurnal', 'last_read') }}. Записи лишаються назавжди: старі відповідають на «коли це почалося» і «чи було таке раніше».
    - type: button
      name: Позначити прочитаними
      icon: mdi:email-open-outline
      entity: input_button.spovishchennia_prochytano
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.spovishchennia_prochytano
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.spovishchennia_zhurnal
      name: Нових
      icon: mdi:bell-badge-outline
      grid_options:
        columns: 12
        rows: 1
  # --- Секція 2 · Журнал ---
  # Один запис на подію: script.spovistyty_vsikh шле той самий текст на три
  # телефони, тому notify_log.py згортає сусідні дублі і віддає kopii.
  # Кожен рядок списку - в один рядок Jinja: перенос усередині {% if %} у циклі
  # ламає розмітку (пастка з dashboard-design).
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Журнал
      icon: mdi:history
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set items = state_attr('sensor.spovishchennia_zhurnal', 'items') or [] %}
        {% if items | count == 0 %}Журнал порожній або сенсор ще не оновився.{% endif %}
        {% for it in items %}
        - {{ '🔵' if it.nove else '▫️' }} **{{ it.chas[5:] }}** {{ '📱' if 'mobile_app' in (it.service or '') else '🔔' }} **{{ it.title }}**{{ ' ×' ~ it.kopii if (it.kopii | default(1) | int) > 1 else '' }} — {{ it.message }}
        {% endfor %}
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        <details><summary>Як читати</summary>

        🔵 — нове, ще не позначене прочитаним. 📱 — пішло на телефони, 🔔 — показане на панелі Home Assistant. «×3» — той самий текст на три телефони, згорнуто в один рядок.
        Кнопка «Позначити прочитаними» ставить одну мітку на весь журнал (поштова модель). Закриття сповіщення на панелі HA робить те саме автоматично.
        Сенсор оновлюється раз на п'ять хвилин і одразу після натискання кнопки.
        </details>
- title: Зв'язок
  path: links
  icon: mdi:lan-connect
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  # --- Секція 1 · Hero: три канали одним рядком ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set lt_ok = is_state('binary_sensor.localtuya', 'on') %}
        {% set cl_ok = is_state('binary_sensor.tuya_khmara', 'on') %}
        {% set inv_ok = is_state('binary_sensor.invertor_zviazok', 'on') %}
        {% set poza = state_attr('binary_sensor.localtuya', 'poza_zviazkom') or '' %}
        ## {{ '🟢' if lt_ok and cl_ok and inv_ok else '🟠' }} Локально {{ '✅' if lt_ok else '❌' }} · Хмара Tuya {{ '✅' if cl_ok else '❌' }} · Інвертор {{ '✅' if inv_ok else '❌' }}
        {{ 'Поза звʼязком: ' ~ poza ~ '.' if poza else 'Усі опорні локальні пристрої на звʼязку.' }} LocalTuya: {{ state_attr('binary_sensor.localtuya', 'nedostupno') }} із {{ state_attr('binary_sensor.localtuya', 'usoho') }} сутностей недоступні · хмара Tuya: {{ state_attr('binary_sensor.tuya_khmara', 'nedostupno') }} із {{ state_attr('binary_sensor.tuya_khmara', 'usoho') }}.
    - type: tile
      entity: binary_sensor.localtuya
      name: Локально (LocalTuya)
      grid_options:
        columns: 16
        rows: 1
    - type: tile
      entity: binary_sensor.tuya_khmara
      name: Хмара Tuya
      grid_options:
        columns: 16
        rows: 1
    - type: tile
      entity: binary_sensor.invertor_zviazok
      name: Інвертор Deye
      grid_options:
        columns: 16
        rows: 1
  # --- Секція 2 · Таблиця каналів по пристроях ---
  # Довідник пар «локальна сутність / хмарна сутність» - з
  # .claude/skills/home-assistant/references/tuya.md. Новий пристрій Tuya =
  # один рядок у списку d нижче, більше нічого правити не треба.
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: 'Пристрої Tuya: яким каналом працюють'
      icon: mdi:swap-horizontal
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set bad = ['unavailable', 'unknown'] %}
        {% set d = [
          ['Контролер поливу', '.221', 'switch.avtopoliv_kontroler_avtopoliv_klapan_1', 'switch.avtopoliv_kontroler_switch_1'],
          ['Насос поливу K601', '.91', 'switch.mini_switch_k601_2_switch_1_2', 'switch.mini_switch_k601_2_switch_1'],
          ['Лічильник вводу', '.219', 'sensor.energy_meter_phase_a_power_2', 'sensor.energy_meter_total_energy'],
          ['Зарядка авто', '.36', 'sensor.zariadka_7_5kvt_device_kw', 'switch.zariadka_7_5kvt_switch'],
          ['Насос свердловини T34', '.26', 'switch.t34_smart_plug_switch_1_2', 'switch.t34_smart_plug_switch_1'],
          ['Бойлер бабусі', '', 'switch.boiler_babusi_socket', 'switch.smart_plug_socket_1'],
          ['Мала пралка', '.82', 'switch.mala_pralna_mashina_socket', 'switch.mala_pralka_socket_cloud'],
          ['Сушарка', '', 'switch.sushka_socket', 'switch.sushka_socket_cloud'],
          ['Дім бабусі, температура', '', none, 'sensor.2i_poverkh_t_h_temperature'],
          ['Надворі, температура', '', none, 'sensor.na_dvori_t_h_temperature'],
          ['Велика пралка', '', none, 'switch.velika_pralka_socket_1']] %}
        | Пристрій | IP | Локально | Хмара | Керує |
        |---|---|---|---|---|
        {% for n, ip, l, c in d %}| {{ n }} | {{ ip }} | {{ '—' if l is none else ('✅' if states(l) not in bad else '❌') }} | {{ '—' if c is none else ('✅' if states(c) not in bad else '❌') }} | {{ 'лише хмара' if l is none else ('локально' if states(l) not in bad else ('хмара (резерв)' if c is not none and states(c) not in bad else 'ніхто')) }} |
        {% endfor %}
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        <details><summary>Що означають канали</summary>

        **Локально (LocalTuya)** — Home Assistant тримає TCP-сесію з пристроєм у своїй мережі; працює без інтернету і без акаунта Tuya. Це виконавчий шлях поливу, насосів, лічильника і зарядки.
        **Хмара Tuya** — пристрій → сервери Tuya → HA; залежить від інтернету і токена акаунта (протухав 09.08 на десять днів). Хмарна копія лишається як ручний резерв на дашборді і як останній повтор в автоматизаціях.
        **Лише хмара** — датчики температури на батарейках; локального шляху немає без Zigbee-шлюзу.
        Правило проєкту: автоматизація, лічильник чи джерело Energy ніколи не прив'язується до хмарної сутності, якщо є локальний двійник.
        </details>
  # --- Секція 3 · Решта інтеграцій ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Інші інтеграції
      icon: mdi:lan
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set bad = ['unavailable', 'unknown'] %}
        {% set ns = namespace(sonoff=0, solar=0, siku=0, terneo=0) %}
        {% for e in integration_entities('sonoff') if states(e) in bad %}{% set ns.sonoff = ns.sonoff + 1 %}{% endfor %}
        {% for e in integration_entities('solarman') if states(e) in bad %}{% set ns.solar = ns.solar + 1 %}{% endfor %}
        {% for e in integration_entities('siku') if states(e) in bad %}{% set ns.siku = ns.siku + 1 %}{% endfor %}
        {% for e in integration_entities('terneo') if states(e) in bad %}{% set ns.terneo = ns.terneo + 1 %}{% endfor %}
        | Інтеграція | Шлях | Недоступно / усього |
        |---|---|---|
        | Sonoff / eWeLink (Zigbee-датчики, реле) | хмара eWeLink + LAN | {{ ns.sonoff }} / {{ integration_entities('sonoff') | count }} |
        | Deye через Solarman | локально, TCP 8899 | {{ ns.solar }} / {{ integration_entities('solarman') | count }} |
        | Blauberg / Siku | локально, UDP 4000 | {{ ns.siku }} / {{ integration_entities('siku') | count }} |
        | Terneo (тепла підлога) | локально, HTTP | {{ ns.terneo }} / {{ integration_entities('terneo') | count }} |
        | Камера Hikvision | локально | {{ 'на звʼязку' if is_state('binary_sensor.hikvision_camera_online', 'on') else 'офлайн' }} |
        | NAS CloudMate | локально, NFS | {{ 'на звʼязку' if is_state('binary_sensor.cloudmate_nas_online', 'on') else 'офлайн' }} |
  # --- Хто відвалюється за 7 днів: рахує scripts/flaky_devices.py з recorder ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Хто відвалюється за 7 днів
      icon: mdi:lan-disconnect
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set rows = state_attr('sensor.prystroi_khytkist', 'rows') or [] %}
        {% set gen = state_attr('sensor.prystroi_khytkist', 'generated') %}
        {% set err = state_attr('sensor.prystroi_khytkist', 'error') %}
        {% if err %}Таблиця не порахована: {{ err }}.{% elif rows | count == 0 %}Ще не пораховано (перший розрахунок — після старту HA, далі раз на шість годин).{% else %}
        Понад 5 % часу недоступні: **{{ states('sensor.prystroi_khytkist') }}** із {{ rows | count }} · пораховано {{ gen }}. Рестарт HA дає епізод усім одночасно — 4–6 епізодів на тиждень при малому часі це фон, а не проблема.

        | Пристрій | Епізодів | Недоступний, год | % | Зараз |
        |---|---|---|---|---|
        {% for r in rows %}| {{ r.name }} | {{ r.episodes if r.episodes is not none else '—' }} | {{ r.hours if r.hours is not none else '—' }} | {{ ('🔴 ' if (r.pct or 0) > 20 else ('🟠 ' if (r.pct or 0) > 5 else '')) ~ (r.pct if r.pct is not none else '—') }} | {{ r.state }} |
        {% endfor %}{% endif %}
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.zhurnal_zapisati_spovishchennia
        name: "Журнал - записати сповіщення"
      - entity: automation.zhurnal_poznachiti_spovishchennia_prochitanimi
        name: "Журнал - позначити сповіщення прочитаними"
      - entity: automation.zhurnal_povernuti_neprochitani_v_panel_pislia_startu
        name: "Журнал - повернути непрочитані в панель після старту"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Журнал - записати сповіщення** — Ловить кожен виклик notify.* і persistent_notification.create, пише в notifications.db і дзеркалить пуш у панель сповіщень HA.

        **Журнал - позначити сповіщення прочитаними** — Кнопка «прочитано» або закриття сповіщення в панелі HA: закрили одне — прочитаний саме той запис, кнопка — усе.

        **Журнал - повернути непрочитані в панель після старту** — Після рестарту повертає в панель HA все, що ще не прочитано: панель живе в оперативній памʼяті, журнал — на диску.
  # --- Сповіщення відокремлено від автоматизацій 02.09.2026 на прохання власника:
  #     інформаційний засіб живе окремо, з власним перемикачем і часом останнього спрацювання. ---
  - type: grid
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.disk_poperedzhennia_pro_zapovnennia_userdata
        name: "Диск - попередження про заповнення /userdata"
        secondary_info: last-triggered
      - entity: automation.disk_kritichno_malo_mistsia_na_userdata
        name: "Диск - критично мало місця на /userdata"
        secondary_info: last-triggered
      - entity: automation.disk_failova_sistema_userdata_poshkodzhena
        name: "Диск - файлова система /userdata пошкоджена"
        secondary_info: last-triggered
      - entity: automation.zviazok_kontroler_polivu_nedostupnii
        name: "Звʼязок - контролер поливу недоступний"
        secondary_info: last-triggered
      - entity: automation.zviazok_kamera_oflain
        name: "Звʼязок - камера офлайн"
        secondary_info: last-triggered
      - entity: automation.zviazok_videoarkhiv_ne_zmontovanii
        name: "Звʼязок - відеоархів не змонтований"
        secondary_info: last-triggered
      - entity: automation.invertor_nemaie_zviazku
        name: "Інвертор - немає звʼязку"
        secondary_info: last-triggered
      - entity: automation.invertor_zviazok_vidnovleno
        name: "Інвертор - звʼязок відновлено"
        secondary_info: last-triggered
      - entity: automation.storozh_gotovnist_do_vidkliuchennia
        name: "Сторож - готовність до відключення"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      grid_options:
        columns: full
      content: |-
        **Диск - попередження про заповнення /userdata** — Вільного місця на /userdata менше порогу пів години поспіль — доба до біди при ~130 МБ бази на день.

        **Диск - критично мало місця на /userdata** — Критичний поріг — дім за крок від зупинки Home Assistant.

        **Диск - файлова система /userdata пошкоджена** — Суперблок з помилками після знеструмлення: пуш і запис у панель після старту і щодня о 09:30, поки не полагоджено.

        **Звʼязок - контролер поливу недоступний** — Контролер клапанів .221 недоступний понад 10 хвилин — пуш. Це про звʼязок, а не про режим насоса: насос без відкритого клапана — норма.

        **Звʼязок - камера офлайн** — Камера двору .201 не відповідає понад 10 хвилин — пуш; без неї немає ні кліпів, ні знімків руху.

        **Звʼязок - відеоархів не змонтований** — Відеоархів NAS відмонтований понад 15 хвилин — кліпи не пишуться, пуш.

        **Інвертор - немає звʼязку** — Десять хвилин без даних від логера Deye — термінове сповіщення: поки так, сповіщення про світло, пороги батареї і автовимикання не працюють.

        **Інвертор - звʼязок відновлено** — Парне «на звʼязку» з витримкою три хвилини, щоб хитання логера не давало десятки пушів.

        **Сторож - готовність до відключення** — Кожні шість годин і після старту перевіряє, чи ввімкнені всі автоматизації блекауту і чи на звʼязку прилади, які вони мають гасити.
