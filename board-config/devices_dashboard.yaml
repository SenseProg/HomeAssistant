        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: '{% set power = states(''sensor.zariadka_7_5kvt_device_kw'') | float(0) %} {% set voltage
        = states(''sensor.zariadka_7_5kvt_voltage_a'') | float(0) %} {% set device_state = states(''sensor.zariadka_7_5kvt_device_state'')
        | lower %} {% if is_state(''binary_sensor.zariadka_7_5kvt_fault'', ''on'') %} # 🔴 НЕСПРАВНІСТЬ
        ЗАРЯДНОЇ СТАНЦІЇ {% elif power > 0.1 or device_state in [''charing'', ''charging''] %} # 🟢 ЗАРЯДЖАННЯ
        ТРИВАЄ {% elif is_state(''switch.zariadka_7_5kvt'', ''off'') %} # ⚪ ЗАРЯДНУ СТАНЦІЮ ВИМКНЕНО {%
        else %} # 🟡 ПІДКЛЮЧЕНО, ОЧІКУЄ АВТОМОБІЛЬ {% endif %}

        **Зараз:** {{ power | round(2) }} кВт · {{ voltage | round(1) }} В {% if power > 0 and voltage
        > 0 %} · приблизно {{ (power * 1000 / voltage) | round(1) }} А{% endif %}

        **Температура станції:** {{ states(''sensor.zariadka_7_5kvt_device_temperature'') }} °C'
