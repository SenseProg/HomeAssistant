      content: |-
        Обидва прилади під розетками Tuya з лічильником. Розетка вимірює
        справжню потужність, тож за нею видно, коли прилад працює, навіть якщо
        сам прилад нічого про себе не повідомляє.

        Третя розетка, **«велика пралка»**, зараз недоступна — або знеструмлена,
        або поза мережею. Щойно вона озветься, її показники підхопляться самі.
  - type: grid
    cards:
    - type: heading
      heading: Як це працює
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        Машина під'єднана через **SmartThings**, тобто через хмару Samsung —
        працює лише коли є інтернет. Локального керування Samsung не дає.

        **Повідомлення надходять** на всі три телефони, коли цикл завершився,
        і окремо — якщо машина працює, поки немає світла.

        **Під час відключення машину не вимикають навмисно.** Обірваний цикл
        означає воду в баку і мокру білизну, тож автоматика лише попереджає,
        а рішення лишається за людиною.

        **Щоб запустити прання дистанційно**, на самій машині треба спершу
        натиснути «Дистанційне керування» — інакше команда не подіє. Це вимога
        Samsung: захист від запуску незакритої машини.
    - type: logbook
      hours_to_show: 72
      grid_options:
        columns: full
      target:
        entity_id:
        - sensor.pralnia_pralna_mashina_machine_state
        - select.pralnia_pralna_mashina
  - type: grid
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.pralna_mashina_prannia_zaversheno
        name: "Пральна машина - прання завершено"
        secondary_info: last-triggered
      - entity: automation.bez_svitla_pralna_mashina_pratsiuie
        name: "Без світла - пральна машина працює"
        secondary_info: last-triggered
    - type: markdown
      title: Що вони повідомляють
      grid_options:
        columns: full
      content: |-
        **Пральна машина - прання завершено** — Тригер саме на перехід run -> stop, а не на job_state finish: finish буває коротким і його легко проґавити, а перехід стану машини надійний і не повторюється після перезавантаження Home Assistant.

        **Без світла - пральна машина працює** — Окрема автоматизація, а не рядок у переліку важких споживачів: пральну машину не можна просто вимкнути, як бойлер. Обірваний цикл означає воду в баку і мокру білизну, тому тут лише попередження - рішення за людиною.
- title: Блекаут
  path: blackout
  icon: mdi:transmission-tower-off
  type: sections
  max_columns: 4
  dense_section_placement: true
  # Сторінка зібрана 02.09.2026 на прохання власника: усе про відключення в
  # одному місці. Тумблери і пороги тут — ті самі сутності, що й на вкладках
  # «Інвертор Deye», «Бойлер», «Пральня»; це дублювання навмисне.
  # Довідник підсистеми: .claude/skills/home-assistant/references/outage.md
  sections:
  # --- Секція 1 · Hero: чи є світло, скільки протримаємось ---
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set inv = is_state('binary_sensor.invertor_zviazok', 'on') %}
        {% set off = is_state('binary_sensor.svitlo_vidsutnie', 'on') %}
        {% set soc = states('sensor.inverter_battery') %}
        {% set load = states('sensor.spozhyvannia_zaraz_kvt') %}
        {% set avt = states('sensor.avtonomiia_batarei') %}
        {% set since = states.binary_sensor.svitlo_vidsutnie.last_changed if states.binary_sensor.svitlo_vidsutnie else none %}
        {% if not inv %}## ⚠️ Інвертор не відповідає — стан мережі невідомий
        Логер Deye мовчить з {{ (states.sensor.inverter_battery.last_changed | as_local).strftime('%d.%m %H:%M') if states.sensor.inverter_battery else '—' }}. Поки так, сповіщення про світло, пороги батареї і автовимикання **не працюють**: «світло є» нижче означає лише «даних немає». Найчастіше допомагає перезапуск інвертора.
        {% elif off %}## 🔴 Світла немає з {{ (since | as_local).strftime('%H:%M') if since else '—' }} · батарея {{ soc }} % · вистачить ≈ {{ avt }} год
        Споживання {{ load }} кВт. Автономія рахується до критичного порогу {{ states('input_number.batareia_porih_krytychno') }} % при поточному навантаженні: вимкнете зайве — час зросте.
        {% else %}## 🟢 Мережа є · батарея {{ soc }} % · при відключенні вистачить ≈ {{ avt }} год
        Споживання {{ load }} кВт. Оцінка — при такому самому навантаженні і до критичного порогу {{ states('input_number.batareia_porih_krytychno') }} %; ємність з налаштувань інвертора: {{ state_attr('sensor.avtonomiia_batarei', 'iemnist_kvtg') }} кВт·год.
        {% endif %}
    - type: gauge
      entity: sensor.inverter_battery
      name: Батарея
      unit: '%'
      min: 0
      max: 100
      needle: false
      severity:
        red: 0
        yellow: 25
        green: 40
      grid_options:
        columns: 8
    - type: tile
      entity: sensor.avtonomiia_batarei
      name: Автономія
      icon: mdi:battery-clock
      grid_options:
        columns: 10
        rows: 1
    - type: tile
      entity: sensor.spozhyvannia_zaraz_kvt
      name: Споживання
      icon: mdi:flash
      grid_options:
        columns: 10
        rows: 1
    - type: tile
      entity: binary_sensor.svitlo_vidsutnie
      name: Мережа зникла
      grid_options:
        columns: 10
        rows: 1
    - type: tile
      entity: binary_sensor.invertor_zviazok
      name: Зв'язок з інвертором
      grid_options:
        columns: 10
        rows: 1
  # --- Секція 2 · Що вимкнеться без світла ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Що вимкнеться без світла
      icon: mdi:power-plug-off
      grid_options:
        columns: full
    - type: tile
      entity: input_boolean.bez_svitla_vymykaty
      name: Вимикати важкі споживачі автоматично
      features_position: bottom
      features:
      - type: toggle
      grid_options:
        columns: full
        rows: 1
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: water_heater.144036023323246_water_heater
        name: Бойлер Midea
      - entity: switch.terneo_1_power
        name: Тепла підлога, контур 1
      - entity: switch.terneo_2_power
        name: Тепла підлога, контур 2
      - entity: switch.sushka_socket
        name: Сушарка
      - entity: switch.2_floor_heater
        name: Обігрів другого поверху (PRANA)
      - entity: fan.siku_blauberg_fan_192_168_50_27
        name: Рекуператор, хлопці
      - entity: fan.siku_blauberg_fan_192_168_50_123
        name: Рекуператор, Олеся
      - entity: fan.2_floor_supply_fan
        name: PRANA, приплив
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        Вимикаються при переході на батарею і знову, якщо хтось увімкнув їх посеред відключення. Пральна машина **не** вимикається ніколи — лише попередження. Насоси поливу і свердловини автоматика блекауту не чіпає.
  # --- Секція 3 · Пороги ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Пороги сповіщень
      icon: mdi:tune
      grid_options:
        columns: full
    - type: tile
      entity: input_number.bez_svitla_porih_kvt
      name: Завелике споживання без світла
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
        rows: 2
    - type: tile
      entity: input_number.bez_svitla_zatrymka_hv
      name: Витримка перед сповіщенням
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
        rows: 2
    - type: tile
      entity: input_number.batareia_porih_uvaha
      name: Батарея · попередження
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
        rows: 2
    - type: tile
      entity: input_number.batareia_porih_krytychno
      name: Батарея · критично
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: full
        rows: 2
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        Значення живуть тут, не в YAML, і з 02.09.2026 переживають рестарт (раніше `initial:` скидав їх при кожному відключенні).
  # --- Секція 4 · Сповіщення (тумблери) ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Сповіщення
      icon: mdi:bell-ring-outline
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.svitlo_zniklo
        name: Світло зникло
        secondary_info: last-triggered
      - entity: automation.svitlo_z_iavilos
        name: Світло з'явилось
        secondary_info: last-triggered
      - entity: automation.bez_svitla_zavelike_spozhivannia
        name: Завелике споживання без світла
        secondary_info: last-triggered
      - entity: automation.batareia_poperedzhennia
        name: Батарея · попередження
        secondary_info: last-triggered
      - entity: automation.batareia_kritichnii_riven
        name: Батарея · критично
        secondary_info: last-triggered
      - entity: automation.bez_svitla_pralna_mashina_pratsiuie
        name: Пральна машина працює без світла
        secondary_info: last-triggered
      - entity: automation.svitlo_nagadati_pro_boiler
        name: Нагадати про бойлер
        secondary_info: last-triggered
      - entity: automation.invertor_nemaie_zviazku
        name: Інвертор не відповідає
        secondary_info: last-triggered
      - entity: automation.invertor_zviazok_vidnovleno
        name: Інвертор на зв'язку
        secondary_info: last-triggered
      - entity: automation.storozh_gotovnist_do_vidkliuchennia
        name: Сторож готовності
        secondary_info: last-triggered
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        Усі йдуть на три телефони через один скрипт і лягають у журнал. Вимкнений тумблер — сповіщення мовчить; сторож готовності раз на шість годин нагадає, що щось вимкнене.
  # --- Секція 5 · Автоматизації (керуючі) ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.bez_svitla_vimknuti_vazhki_spozhivachi
        name: Вимкнути важкі споживачі
        secondary_info: last-triggered
      - entity: automation.boiler_babusi_pochatok_nagrivu
        name: Бойлер бабусі · початок нагріву
      - entity: automation.boiler_babusi_kinets_nagrivu
        name: Бойлер бабусі · кінець нагріву
      - entity: automation.zariadzhannia_start_vikna_rozkladu
        name: Заряджання авто · старт вікна
      - entity: automation.zariadzhannia_kinets_vikna_rozkladu
        name: Заряджання авто · кінець вікна
    - type: markdown
