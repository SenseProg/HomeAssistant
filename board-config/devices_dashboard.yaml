        '
- title: Медіа
  path: media
  icon: mdi:television-play
  type: sections
  max_columns: 4
  sections:
  # --- Секція 1 · Телевізор і фотозаставка ---
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Телевізор
      icon: mdi:television
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set online = is_state('binary_sensor.tcl_tv_online', 'on') %}
        {% set mp = states('media_player.televizor_tcl') %}
        {% set slideshow = is_state('script.tv_idle_slideshow', 'on') %}
        {% if not online %}## Телевізор вимкнений
        Це нормальний стан, а не збій: TCL зникає з мережі, коли його вимикають з пульта,
        і сутність стає `unavailable`. Керування з'явиться тут, щойно телевізор увімкнуть.
        {% elif slideshow %}## Показує фотозаставку
        Заставка запускається сама після пʼяти хвилин простою і зупиняється, щойно на телевізорі
        починають щось дивитись.
        {% elif mp == 'playing' %}## Щось відтворюється
        {{ state_attr('media_player.televizor_tcl', 'media_title') or 'Назву джерело не повідомляє' }}
        {% else %}## Увімкнений, нічого не відтворює
        Через пʼять хвилин простою автоматика запустить фотозаставку.
        {% endif %}
    # Керування показуємо лише коли є чим керувати: media-control на вимкненому
    # телевізорі малює сірий прямокутник із написом «Недоступно».
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.tcl_tv_online
        state: 'on'
      card:
        type: media-control
        entity: media_player.televizor_tcl
      grid_options:
        columns: 24
    - type: tile
      entity: binary_sensor.tcl_tv_online
      name: Телевізор у мережі
      icon: mdi:television-classic
      grid_options:
        columns: 12
        rows: 1
    - type: button
      name: Запустити фотозаставку
      icon: mdi:image-multiple
      grid_options:
        columns: 12
      tap_action:
        action: call-service
        service: script.tv_idle_slideshow
  # --- Секція 2 · Альбом заставки ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Альбом заставки
      icon: mdi:folder-image
      grid_options:
        columns: full
    - type: tile
      entity: input_select.tv_zastavka_album
      name: Показувати з альбому
      icon: mdi:folder-image
      features_position: bottom
      features:
      - type: select-options
      grid_options:
        columns: full
    # Стрілки. Телевізор показує сторінку Home Assistant, а не голе фото, тому
    # гортати доводиться звідси: Cast передає зображення на екран, але кнопки
    # пульта назад у Home Assistant не повертаються.
    - type: horizontal-stack
      grid_options:
        columns: full
      cards:
      - type: button
        name: Попереднє
        icon: mdi:chevron-left
        show_state: false
        tap_action:
          action: call-service
          service: script.tv_foto_poperednie
      - type: button
        name: Наступне
        icon: mdi:chevron-right
        show_state: false
        tap_action:
          action: call-service
          service: script.tv_foto_nastupne
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set n = state_attr('sensor.tv_kadr','name') %}
        {% set t = state_attr('sensor.tv_kadr','taken') %}
        {% set i = state_attr('sensor.tv_kadr','idx') %}
        {% set tot = state_attr('sensor.tv_kadr','total') %}
        {% if n %}
        **Зараз на екрані** {% if t %}· знято {{ t }}{% endif %}

        `{{ n }}`

        Кадр {{ i }} з {{ tot }} у памʼяті — стрілкою «Попереднє» можна
        повернутися до вже побаченого.
        {% else %}
        Заставка ще не бралася до роботи — знімок зʼявиться тут після першого показу.
        {% endif %}
  # --- Секція 3 · Автоматика заставки ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Автоматика заставки
      icon: mdi:motion-play
      grid_options:
        columns: full
    - type: tile
      entity: automation.tcl_zapustiti_fotozastavku_pislia_5_khvilin_prostoiu
      name: Запуск після простою
      icon: mdi:play-circle-outline
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: automation.tcl_zupiniti_fotozastavku_pri_aktivnosti
      name: Зупинка при активності
      icon: mdi:stop-circle-outline
      grid_options:
        columns: 12
        rows: 1
    - type: markdown
      title: Як це працює
      grid_options:
        columns: full
      content: |-
        Фотозаставка бере знімки з теки `/mnt/homemate_media/foto` — це NFS-монт
        альбому з NAS, тільки для читання. Телевізор отримує їх через Google Cast,
        тому працює лише коли він у мережі.

        В альбомі 87 758 фотографій, і повний обхід NAS триває дві хвилини — надто
        довго, щоб шукати на льоту. Тому раз на добу о 04:20 таймер
        `tv-photo-cache` перебирає теку і складає списки шляхів, окремо на кожен
        рік і альбом. Заставка бере випадковий рядок зі списку миттєво, а тоді
        готує кадр: зменшує знімок під екран і читає з нього дату зйомки. Разом
        це близько двох секунд.

        На екран іде не голе фото, а сторінка Home Assistant, тому внизу
        вміщаються дата зйомки, годинник, погода і курси. Через це ж гортати
        доводиться звідси, з панелі: зображення на телевізор Cast передає, а
        кнопки пульта назад у Home Assistant не повертаються.

        «Попереднє» працює завдяки памʼяті на 300 останніх кадрів — якщо
        знімок змінився зарано, до нього можна повернутися.

        Нові фотографії на NAS зʼявляться у заставці наступного дня, після
        чергового оновлення списків.

        Обидві автоматизації тут можна вимкнути, якщо заставка заважає: тоді
        телевізор просто лишатиметься на своєму джерелі.
  # --- Секція 4 · Журнал ---
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Що відбувалось
      icon: mdi:history
      grid_options:
        columns: full
    - type: logbook
      hours_to_show: 48
      grid_options:
        columns: full
      target:
        entity_id:
        - binary_sensor.tcl_tv_online
        - script.tv_idle_slideshow
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.tcl_zapustiti_fotozastavku_pislia_5_khvilin_prostoiu
        name: "TCL - запустити фотозаставку після 5 хвилин простою"
      - entity: automation.tcl_zupiniti_fotozastavku_pri_aktivnosti
        name: "TCL - зупинити фотозаставку при активності"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **TCL - запустити фотозаставку після 5 хвилин простою** — Не вмикає телевізор. Стартує лише якщо вже ввімкнений TCL безперервно перебуває у стані idle п'ять хвилин.

        **TCL - зупинити фотозаставку при активності** — Не дає заставці перебивати відео чи застосунок, який запустив користувач. Дві секунди потрібні, щоб не прийняти власний запуск JPEG через стандартний Cast receiver за сторонню активність.
- title: Пральня
  path: pralka
  icon: mdi:washing-machine
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Що зараз робить
      icon: mdi:washing-machine
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |-
        {% set m = states('sensor.pralnia_pralna_mashina_machine_state') %}
        {% set j = states('sensor.pralnia_pralna_mashina_job_state') %}
        {% set faza = {'wash': 'прання', 'rinse': 'полоскання', 'spin': 'віджим',
        'pre_wash': 'замочування', 'drying': 'сушіння', 'cooling': 'охолодження',
        'weight_sensing': 'зважування білизни', 'wrinkle_prevent': 'проти зминання',
        'ai_wash': 'розумне прання', 'ai_rinse': 'розумне полоскання',
        'ai_spin': 'розумний віджим', 'air_wash': 'освіження',
        'delay_wash': 'відкладений старт', 'finish': 'завершено',
        'freeze_protection': 'захист від замерзання'}.get(j, j) %}
        {% if m == 'run' %}
        **Працює** — {{ faza }}.
        {% set t = states('sensor.pralnia_pralna_mashina_completion_time') %}
        {% if t not in ['unknown', 'unavailable', ''] %}
        Закінчить приблизно о **{{ as_timestamp(t) | timestamp_custom('%H:%M', true) }}**.
        {% endif %}
        Зараз бере {{ states('sensor.pralnia_pralna_mashina_power') }} Вт.
        {% elif m == 'pause' %}
        **На паузі** — {{ faza }}.
        {% else %}
        Машина не працює.
        {% endif %}
    - type: tile
      entity: sensor.pralnia_pralna_mashina_machine_state
      name: Стан
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.pralnia_pralna_mashina_job_state
      name: Фаза циклу
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.pralnia_pralna_mashina_power
      name: Потужність зараз
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.pralnia_pralna_mashina_completion_time
      name: Закінчить о
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Керування
      icon: mdi:tune-variant
      grid_options:
        columns: full
    # Дистанційний запуск працює лише тоді, коли на самій машині натиснуто
    # «Дистанційне керування». Поки цей рядок «Вимкнено», кнопка «Запустити»
    # нижче не подіє - це захист Samsung, а не обмеження Home Assistant.
    - type: entities
