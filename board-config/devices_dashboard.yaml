    cards:
    - type: heading
      heading: Зона 1
      grid_options:
        columns: full
    - type: tile
      entity: input_number.poliv_zona_1_hvylyn
      name: Тривалість (хв)
      grid_options:
        columns: full
      features:
      - type: numeric-input
        style: buttons
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: switch.avtopoliv_kontroler_switch_1
        name: Клапан
      - entity: script.poliv_zona_1
        name: Йде полив
    - type: button
      name: Старт
      icon: mdi:play
      grid_options:
        columns: 6
      tap_action:
        action: call-service
        service: script.poliv_zona_1
    - type: button
      name: Стоп
      icon: mdi:stop
      grid_options:
        columns: 6
      tap_action:
        action: call-service
        service: homeassistant.turn_off
        target:
