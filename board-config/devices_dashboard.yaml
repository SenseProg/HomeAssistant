        name: Завантаження
      - entity: sensor.tenda_ap_upload_speed
        name: Вивантаження
    - type: markdown
      title: Можливості точки доступу
      grid_options:
        columns: full
      content: >
        **Tenda AC10 v3 / AC1200**, режим точки доступу. Паспортна швидкість:
        до **300 Мбіт/с** на 2,4 ГГц і до **867 Мбіт/с** на 5 ГГц; Ethernet-порти
        гігабітні. Значення вище — не швидкість Wi-Fi-з'єднання, а поточний
        корисний трафік клієнтів, який повідомляє сама Tenda.
  - type: grid
    cards:
    - type: heading
      heading: Tenda A9 · повторювач «Отаке»
      icon: mdi:wifi-sync
      grid_options:
        columns: full
    - type: entities
      title: Tenda A9 · 192.168.50.102 · повторювач «Отаке»
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_repeater_status
        name: Стан аплінка
      - entity: sensor.tenda_repeater_signal
        name: Сигнал до основної мережі
      - entity: sensor.tenda_repeater_clients
        name: Підключених клієнтів
    - type: markdown
      title: Підключені через повторювач
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set names = {
          '192.168.50.13': 'Термостат Terneo — контур 1',
          '192.168.50.27': 'Рекуператор Blauberg',
          '192.168.50.36': 'Зарядна станція авто — 7,5 кВт',
          '192.168.50.118': 'Бойлер Midea',
          '192.168.50.157': 'Термостат Terneo — контур 2',
          '192.168.50.164': 'SONOFF ZBBridge — Zigbee-шлюз',
          '192.168.50.176': 'Контролер гаражних воріт — Sonoff/eWeLink',
          '192.168.50.179': 'Інвертор Deye',
          '192.168.50.219': 'Трифазний лічильник електроенергії будинку'
        } %}
        {% set mac_names = {
          'DC:6A:E7:A1:09:F2': 'Xiaomi — модель не визначена',
          '62:1A:51:F4:B2:EE': 'Samsung Galaxy A24 — Василь'
        } %}
        {% set ns = namespace(found=false) %}
        {% for client in clients if client.devIp is defined %}
        {% set ns.found = true %}
        - **{{ names.get(client.devIp, mac_names.get(client.devMac | upper, client.devName if client.devName not in ['', 'UnKnown'] else 'Невідомий пристрій')) }}**
          — {% if client.devIp not in ['', 'UnKnown'] %}`{{ client.devIp }}`{% else %}IP не отримано{% endif %} · `{{ client.devMac | upper }}`
        {% endfor %}
        {% if not ns.found %}
        Немає активних клієнтів або повторювач недоступний.
        {% endif %}
    - type: history-graph
      title: Сигнал повторювача за 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_repeater_signal
        name: Сигнал аплінка
    - type: markdown
      title: Можливості повторювача
      grid_options:
        columns: full
      content: >
        **Tenda A9 / N300**, лише 2,4 ГГц, паспортна швидкість до
        **300 Мбіт/с**. Прошивка не віддає фактичну швидкість з'єднання або
        трафік окремих клієнтів, тому тут показується реальний рівень сигналу
        аплінка в dBm. Значення ближче до 0 — краще; приблизно −60…−70 dBm
        зазвичай придатне, але запас невеликий.

        ⚠️ На повторювачі зараз не встановлено пароль адміністратора.
  - type: grid
    cards:
    - type: heading
      heading: SONOFF ZBBridge — Zigbee-мережа
      icon: mdi:zigbee
      grid_options:
        columns: full
    - type: markdown
      title: Шлюз · 192.168.50.164
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set bridge = clients | selectattr('devIp', 'equalto', '192.168.50.164') | list %}
        {% if bridge | count > 0 %}
        ## 🟢 Онлайн
        **SONOFF ZBBridge** з'єднаний через повторювач Tenda A9.

        IP: `192.168.50.164` · MAC: `{{ bridge[0].devMac | upper }}` ·
        прошивка `1.7.0` · SONOFF ID `100124a572`
        {% else %}
        ## 🔴 Недоступний
        Шлюз відсутній у поточному списку клієнтів Tenda A9. Дочірні
        Zigbee-датчики можуть не оновлюватися.
        {% endif %}

        Шлюз передає у Home Assistant показники кліматичних датчиків,
        датчиків гаражних воріт і руху.
    - type: markdown
      title: Підключені Zigbee-пристрої
      grid_options:
        columns: full
      content: |
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set t = states('sensor.sonoff_a4800819f3_temperature') %}
        {% set h = states('sensor.sonoff_a4800819f3_humidity') %}
        {% set b = states('sensor.sonoff_a4800819f3_battery') %}
        - **2 поверх — температура/вологість** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set t = states('sensor.sonoff_a48005e8ed_temperature') %}
        {% set h = states('sensor.sonoff_a48005e8ed_humidity') %}
        {% set b = states('sensor.sonoff_a48005e8ed_battery') %}
        - **Температура будинку — 2 поверх** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set t = states('sensor.sonoff_a48005a66a_temperature') %}
        {% set h = states('sensor.sonoff_a48005a66a_humidity') %}
        {% set b = states('sensor.sonoff_a48005a66a_battery') %}
        - **Вулиця — балкон** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set t = states('sensor.sonoff_a48001c18f_temperature') %}
        {% set h = states('sensor.sonoff_a48001c18f_humidity') %}
        {% set b = states('sensor.sonoff_a48001c18f_battery') %}
        - **Гостьова — температура/вологість** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set b = states('sensor.sonoff_a48001bcf2_battery') %}
        - **Гаражні ворота — датчик 1** — {% if b in bad %}🔴 недоступний{% else %}🟢 на зв'язку · батарея {{ b }}%{% endif %}

        {% set b = states('sensor.sonoff_a48005b691_battery') %}
        - **Гаражні ворота — датчик 2** — {% if b in bad %}🔴 недоступний{% else %}🟢 на зв'язку · батарея {{ b }}%{% endif %}

        {% set motion = states('binary_sensor.sonoff_a48001bcc7') %}
        {% set b = states('sensor.sonoff_a48001bcc7_battery') %}
        - **Датчик руху** — {% if motion == 'on' %}🟠 виявлено рух · батарея {{ b }}%{% elif motion == 'off' %}🟢 руху немає · батарея {{ b }}%{% else %}🔴 недоступний{% endif %}
