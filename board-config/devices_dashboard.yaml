        name: Температура зовні · датчик 1
      - entity: sensor.2_floor_outside_temperature_2
        name: Температура зовні · датчик 2
    - type: history-graph
      title: Температури · 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.2_floor_inside_temperature
        name: Усередині
      - entity: sensor.2_floor_outside_temperature
        name: Зовні 1
      - entity: sensor.2_floor_outside_temperature_2
        name: Зовні 2
  - type: grid
    cards:
    - type: heading
      heading: Blauberg · 2 рекуператори
      icon: mdi:fan
      grid_options:
        columns: full
    - type: markdown
      title: Кімната хлопців та кімната Олесі
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set unit_27 = clients | selectattr('devIp', 'equalto', '192.168.50.27') | list %}
        - **Blauberg №1** — `192.168.50.27` · `98:F4:AB:EE:A5:C5` · {% if unit_27 | count > 0 %}🟢 у мережі{% else %}🔴 недоступний{% endif %}

        - **Blauberg №2** — `192.168.50.123` · `98:F4:AB:EE:A8:4E` · {% if is_state('device_tracker.esp_eea84e', 'home') %}🟢 у мережі{% else %}🔴 недоступний{% endif %}

        Один рекуператор встановлений у **кімнаті хлопців**, другий — у
        **кімнаті Олесі**. Який IP відповідає якій кімнаті, ще потрібно
        фізично зіставити.

        ⚠️ Зараз Home Assistant бачить лише їхню присутність у мережі.
        Керування швидкістю, напрямком і режимами Blauberg ще не інтегроване.
  - type: grid
    cards:
    - type: heading
      heading: Пояснення
      icon: mdi:information-outline
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: >-
        **Приплив** подає свіже повітря, **витяжка** видаляє відпрацьоване.
        Швидкість кожного вентилятора можна змінювати окремо. Режим
        **«Синхронізувати приплив і витяжку»** зв'язує їхні швидкості.
        **Автоматичний режим** керує вентиляцією за датчиками PRANA, а
        **розширений автоматичний режим** використовує посилений алгоритм
        пристрою. Підігрів і зимовий режим вмикайте за потреби в холодний
        період.

        Рекуператори Blauberg показані окремо як мережеві пристрої. Повні
        елементи керування з'являться після підключення їхнього локального
        протоколу до Home Assistant.
- title: Присутність
  path: presence
  icon: mdi:map-marker-account
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Де хто зараз
      grid_options:
        columns: full
    - type: map
      default_zoom: 17
      theme_mode: auto
      aspect_ratio: '1'
      grid_options:
        columns: full
      entities:
      - person.dim_kovtuni
      - person.katerina
      - person.olesia
      - zone.home
    - type: entities
      title: Особи
      grid_options:
        columns: full
      entities:
      - entity: person.dim_kovtuni
        name: Дім
      - entity: person.katerina
        name: Катерина
      - entity: person.olesia
        name: Олеся
  - type: grid
    cards:
    - type: heading
      heading: Телефони в мережі
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: device_tracker.sm_s918b
        name: SM-S918B (GPS)
      - entity: device_tracker.s24_koristuvaca_kateryna
        name: S24 (Катерина)
      - entity: device_tracker.s20_fe_koristuvaca_kateryna
        name: S20 FE (Олеся)
      - entity: device_tracker.s23_ultra_dvk
        name: S23 Ultra
      - entity: device_tracker.s21_pol_zovatela_kateryna
        name: S21
      - entity: device_tracker.a24_koristuvaca_vasilij
        name: A24 (Василь)
      - entity: device_tracker.galaxy_j8
        name: Galaxy J8
      - entity: device_tracker.galaxy_m12
        name: Galaxy M12
    - type: markdown
      title: Що мапа показує, а що ні
      grid_options:
        columns: full
      content: >
        На мапі видно лише тих, у кого є координати - тобто лише телефони з
        встановленим застосунком Home Assistant (зараз це один SM-S918B).
        Решта телефонів визначаються роутером і мають лише два стани: вдома
        або ні. Роутер бачить факт підключення до Wi-Fi, а не місце, тому
        поставити їх на мапу неможливо в принципі.

        Мережі «Отаке» і «Промінь» - це одна підмережа 192.168.50.0/24. Tenda
        на 192.168.50.2 працює точкою доступу без власного WAN, тож її клієнти
        отримують адреси від ASUS і теж видимі. Окремо трекати «Промінь» не
        треба - усе вже тут.
