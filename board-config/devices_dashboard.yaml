        name: Спожито всього
    - type: statistics-graph
      title: Спожито за добу - контур 2
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.terneo_2_heating_energy
        name: Контур 2
  - type: grid
    cards:
    - type: history-graph
      title: Потужність обох контурів за 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.terneo_1_current_power
        name: Контур 1
      - entity: sensor.terneo_2_current_power
        name: Контур 2
    - type: markdown
      title: Як рахується
      grid_options:
        columns: full
      # Блок літеральний (|-), а не в лапках: усередині є одинарні лапки Jinja,
      # які в YAML-рядку 'у лапках' обірвали б скаляр.
      content: |-
        На відміну від бойлера, тут нічого оцінювати не треба - термостат Terneo сам віддає `heating_energy`
        у кВт-год. Але це теж не вимір: всередині немає лічильника, і термостат рахує енергію з часу замикання
        реле, помноженого на задану потужність контуру. Якщо реальна потужність кабелю відрізняється від
        тієї, що прошита в термостаті, цифра поїде пропорційно.

        {% set nezhyvi = [] %}{% if not has_value('sensor.terneo_1_floor_temperature') %}{% set nezhyvi = nezhyvi + ['1'] %}{% endif %}{% if not has_value('sensor.terneo_2_floor_temperature') %}{% set nezhyvi = nezhyvi + ['2'] %}{% endif %}{% if nezhyvi %}Контур {{ nezhyvi | join(' і ') }} фізично не ввімкнений, тому його сутності показують `unavailable`. Ніяких дій робити не треба - контур уже доданий і в цей дашборд, і в Energy-дашборд, і почне рахувати сам, щойно на нього подадуть живлення.{% else %}Обидва контури на звʼязку.{% endif %}

        Номер контуру визначається станом сутностей, а не вписаний у текст: до 22 серпня 2026 тут
        стояло «контур 2», тоді як насправді мовчав контур 1, і сторінка суперечила власним же
        показникам поруч.
  - type: grid
    cards:
    - type: heading
      heading: Автоматизації
      icon: mdi:robot
      grid_options:
        columns: full
    - type: entities
      grid_options:
        columns: full
      entities:
      - entity: automation.bez_svitla_vimknuti_vazhki_spozhivachi
        name: "Без світла - вимкнути важкі споживачі"
      - entity: automation.svitlo_zniklo
        name: "Світло - зникло"
    - type: markdown
      title: Що вони роблять
      grid_options:
        columns: full
      content: |-
        **Без світла - вимкнути важкі споживачі** — Щойно зникає мережа, вимикає обидва контури підлоги разом з рештою важких споживачів. Спрацьовує і тоді, коли підлогу вмикають уже під час відключення.

        **Світло - зникло** — Повідомляє всім про зникнення мережі й перелічує, що лишилось увімкненим. Якщо терморегулятори при цьому поза звʼязком, так і пише: стан невідомий, а не «вимкнено».
