        **Камера - знімок при виявленні руху** — При спрацюванні датчика руху зберігає кадр з камери, оновлює `latest.jpg` для дашборда і лишає останні 30 знімків.

        **Камера - відеокліп при виявленні руху** — Пише 15 секунд відео на NAS від моменту руху. Пре-ролю немає навмисно: він потребує постійного потоку з камери, а це розхитувало живлення плати. Кліпи пишуться лише коли мережева шара змонтована — інакше вони лягали б на саму плату.
