        {% set w = states('sensor.boiler_babusi_power') | float(0) %}
        {% set v = states('sensor.boiler_babusi_voltage') | float(0) %}
        ## {% if not on %}Вимкнено{% elif w > 100 %}Гріє — {{ w | round(0) }} Вт{% else %}Живлення є, не гріє{% endif %}
        {% if on and v > 0 %}Напруга {{ v | round(0) }} В{% endif %}
    - type: tile
      entity: switch.boiler_babusi_socket
      name: Живлення бойлера
      icon: mdi:water-boiler
      color: red
      grid_options:
        columns: full
