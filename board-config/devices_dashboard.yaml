        name: Насос
    - type: markdown
      title: Як рахується
      grid_options:
        columns: full
      content: 'Реле Tuya Mini switch K601, яким керується насос, лічильника енергії не має - воно вміє
        лише вмикати і вимикати. Тому споживання рахується як час роботи реле, помножений на потужність
        із поля вище.

        Потужність 1100 Вт виміряна 2026-08-03 по стрибку загального лічильника будинку: контрольований
        запуск дав 994 Вт, два реальні пуски о 19:11 і 19:13 - 1119 і 1426 Вт. Взято медіану. Якщо захочеш
        уточнити - зміни значення у полі вище, графіки перерахуються від моменту зміни.

        Насос присутній у системі двічі - через хмару Tuya і локально (LocalTuya). Головною є ЛОКАЛЬНА
        сутність: поки вона віддає on або off, рішення приймається лише за нею. Хмарна працює резервом
        і враховується тільки тоді, коли локальна недоступна. Якщо мовчать обидві - потужність вважається
        нульовою, щоб не нараховувати вигадане споживання.

        '
- title: Заряджання авто
