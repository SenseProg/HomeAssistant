- title: Автополив
  path: poliv
  icon: mdi:sprinkler-variant
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Розклад поливу
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: >-
        **Автоматичний старт:** за 30 хвилин до сходу сонця.

        **Наступний запуск:**
        {{ (as_timestamp(state_attr('sun.sun', 'next_rising')) - 1800)
           | timestamp_custom('%d.%m.%Y %H:%M', true) }}
    - type: entities
      grid_options:
        columns: full
      entities:
      - type: section
        label: Дні тижня
      - entity: input_boolean.poliv_pn
        name: Понеділок
      - entity: input_boolean.poliv_vt
        name: Вівторок
      - entity: input_boolean.poliv_sr
        name: Середа
