views:
- title: Мережа
  path: router
  icon: mdi:router-wireless
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: entities
      title: Стан пристрою
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_devices_connected
        name: Пристроїв підключено
      - entity: sensor.spalnia_batkiv_192_168_50_1_cpu_temperature
        name: Температура CPU
      - entity: sensor.spalnia_batkiv_192_168_50_1_5ghz_temperature
        name: Температура 5GHz радіо
      - type: divider
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_1_min
        name: Навантаження (1 хв)
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_5_min
        name: Навантаження (5 хв)
      - entity: sensor.spalnia_batkiv_192_168_50_1_average_load_15_min
        name: Навантаження (15 хв)
    - type: entities
      title: Швидкість LAN-опитування
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
        name: Швидкість завантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload_speed
        name: Швидкість вивантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_download
        name: Завантажено (лічильник)
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload
        name: Вивантажено (лічильник)
    - type: history-graph
      title: Швидкість за 3 години
      hours_to_show: 3
      grid_options:
        columns: full
      entities:
      - entity: sensor.spalnia_batkiv_192_168_50_1_download_speed
        name: Завантаження
      - entity: sensor.spalnia_batkiv_192_168_50_1_upload_speed
        name: Вивантаження
    - type: markdown
      title: Про WAN-сенсори
      grid_options:
        columns: full
      content: >
        Вбудовані сенсори WAN-статусу і зовнішньої IP (через UPnP/IGD)
        на цьому роутері нестабільні і завжди повертають
        unavailable/0.0.0.0 - це обмеження прошивки ASUS, не Home
        Assistant. Прибрано з дашборда свідомо.
  - type: grid
    cards:
    - type: entities
      title: Хто вдома (presence detection)
      grid_options:
        columns: full
      entities:
      - entity: device_tracker.homemate
        name: HomeMate (ПК)
      - entity: device_tracker.ok3568
        name: Плата ok3568
      - entity: device_tracker.samsung
        name: Samsung
      - entity: device_tracker.s20_fe_koristuvaca_kateryna
        name: S20 FE (Катерина)
      - entity: device_tracker.s21_pol_zovatela_kateryna
        name: Samsung Galaxy S21 — бабуся Сіма
      - entity: device_tracker.s23_ultra_dvk
        name: S23 Ultra
      - entity: device_tracker.laptop_u1i8pnmk
        name: Ноутбук
      - entity: device_tracker.noteasus
        name: NoteAsus
      - entity: device_tracker.esp_eea5c5
        name: ESP пристрій (EEA5C5)
      - entity: device_tracker.esp_eea84e
        name: ESP пристрій (EEA84E)
      - entity: device_tracker.sm_s918b
        name: Телефон (mobile app)
  - type: grid
    cards:
    - type: heading
      heading: Tenda — точка доступу
      icon: mdi:access-point
      grid_options:
        columns: full
    - type: entities
      title: Tenda AC10 v3 · 192.168.50.2
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_ap_status
        name: Прошивка
      - entity: sensor.tenda_ap_clients
        name: Прямих Wi-Fi клієнтів
      - entity: sensor.tenda_ap_download_speed
        name: Поточне завантаження клієнтів
      - entity: sensor.tenda_ap_upload_speed
        name: Поточне вивантаження клієнтів
      - entity: sensor.tenda_ap_security
        name: Пароль адміністратора
    - type: markdown
      title: Підключені безпосередньо до точки доступу
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_ap_clients', 'onlineList') or [] %}
        {% set wifi = clients | selectattr('qosListConnectType', 'equalto', 'wifi') | list %}
        {% set names = {
          '1E:C0:D2:73:2C:C9': 'Samsung Galaxy S21 — бабуся Сіма'
        } %}
        {% if wifi | count == 0 %}
        Немає активних прямих Wi-Fi-клієнтів.
        {% else %}
        {% for client in wifi %}
        - **{{ names.get(client.qosListMac | upper, client.qosListHostname if client.qosListHostname not in ['', 'Unknown'] else 'Невідомий пристрій') }}**
          — `{{ client.qosListIP }}` · `{{ client.qosListMac | upper }}` ·
          {{ '2,4 ГГц' if client.qosListAccessType | default('') == 'wifi_2G' else ('5 ГГц' if client.qosListAccessType | default('') == 'wifi_5G' else 'Wi-Fi') }} ·
          ↓ {{ client.qosListDownSpeed | float(0) | round(1) }} кБ/с ·
          ↑ {{ client.qosListUpSpeed | float(0) | round(1) }} кБ/с
        {% endfor %}
        {% endif %}
    - type: history-graph
      title: Трафік точки доступу за 3 години
      hours_to_show: 3
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_ap_download_speed
        name: Завантаження
      - entity: sensor.tenda_ap_upload_speed
        name: Вивантаження
    - type: markdown
      title: Можливості точки доступу
      grid_options:
        columns: full
      content: >
        **Tenda AC10 v3 / AC1200**, режим точки доступу. Паспортна швидкість:
        до **300 Мбіт/с** на 2,4 ГГц і до **867 Мбіт/с** на 5 ГГц; Ethernet-порти
        гігабітні. Значення вище — не швидкість Wi-Fi-з'єднання, а поточний
        корисний трафік клієнтів, який повідомляє сама Tenda.
  - type: grid
    cards:
    - type: heading
      heading: Tenda — повторювач
      icon: mdi:wifi-sync
      grid_options:
        columns: full
    - type: entities
      title: Tenda A9 · 192.168.50.102
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_repeater_status
        name: Стан аплінка
      - entity: sensor.tenda_repeater_signal
        name: Сигнал до основної мережі
      - entity: sensor.tenda_repeater_clients
        name: Підключених клієнтів
    - type: markdown
      title: Підключені через повторювач
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set names = {
          '192.168.50.13': 'Термостат Terneo — контур 1',
          '192.168.50.27': 'Рекуператор Blauberg',
          '192.168.50.36': 'Зарядна станція авто — 7,5 кВт',
          '192.168.50.118': 'Бойлер Midea',
          '192.168.50.157': 'Термостат Terneo — контур 2',
          '192.168.50.164': 'SONOFF ZBBridge — Zigbee-шлюз',
          '192.168.50.176': 'Контролер гаражних воріт — Sonoff/eWeLink',
          '192.168.50.179': 'Інвертор Deye',
          '192.168.50.219': 'Трифазний лічильник електроенергії будинку'
        } %}
        {% set mac_names = {
          'DC:6A:E7:A1:09:F2': 'Xiaomi — модель не визначена'
        } %}
        {% set ns = namespace(found=false) %}
        {% for client in clients if client.devIp is defined %}
        {% set ns.found = true %}
        - **{{ names.get(client.devIp, mac_names.get(client.devMac | upper, client.devName if client.devName not in ['', 'UnKnown'] else 'Невідомий пристрій')) }}**
          — {% if client.devIp not in ['', 'UnKnown'] %}`{{ client.devIp }}`{% else %}IP не отримано{% endif %} · `{{ client.devMac | upper }}`
        {% endfor %}
        {% if not ns.found %}
        Немає активних клієнтів або повторювач недоступний.
        {% endif %}
    - type: history-graph
      title: Сигнал повторювача за 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.tenda_repeater_signal
        name: Сигнал аплінка
    - type: markdown
      title: Можливості повторювача
      grid_options:
        columns: full
      content: >
        **Tenda A9 / N300**, лише 2,4 ГГц, паспортна швидкість до
        **300 Мбіт/с**. Прошивка не віддає фактичну швидкість з'єднання або
        трафік окремих клієнтів, тому тут показується реальний рівень сигналу
        аплінка в dBm. Значення ближче до 0 — краще; приблизно −60…−70 dBm
        зазвичай придатне, але запас невеликий.

        ⚠️ На повторювачі зараз не встановлено пароль адміністратора.
  - type: grid
    cards:
    - type: heading
      heading: SONOFF ZBBridge — Zigbee-мережа
      icon: mdi:zigbee
      grid_options:
        columns: full
    - type: markdown
      title: Шлюз · 192.168.50.164
      grid_options:
        columns: full
      content: |
        {% set clients = state_attr('sensor.tenda_repeater_clients', 'onlineList') or [] %}
        {% set bridge = clients | selectattr('devIp', 'equalto', '192.168.50.164') | list %}
        {% if bridge | count > 0 %}
        ## 🟢 Онлайн
        **SONOFF ZBBridge** з'єднаний через повторювач Tenda A9.

        IP: `192.168.50.164` · MAC: `{{ bridge[0].devMac | upper }}` ·
        прошивка `1.7.0` · SONOFF ID `100124a572`
        {% else %}
        ## 🔴 Недоступний
        Шлюз відсутній у поточному списку клієнтів Tenda A9. Дочірні
        Zigbee-датчики можуть не оновлюватися.
        {% endif %}

        Шлюз передає у Home Assistant показники кліматичних датчиків,
        датчиків гаражних воріт і руху.
    - type: markdown
      title: Підключені Zigbee-пристрої
      grid_options:
        columns: full
      content: |
        {% set bad = ['unknown', 'unavailable', 'none', ''] %}
        {% set t = states('sensor.sonoff_a4800819f3_temperature') %}
        {% set h = states('sensor.sonoff_a4800819f3_humidity') %}
        {% set b = states('sensor.sonoff_a4800819f3_battery') %}
        - **2 поверх — температура/вологість** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set t = states('sensor.sonoff_a48005e8ed_temperature') %}
        {% set h = states('sensor.sonoff_a48005e8ed_humidity') %}
        {% set b = states('sensor.sonoff_a48005e8ed_battery') %}
        - **Температура будинку — 2 поверх** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set t = states('sensor.sonoff_a48005a66a_temperature') %}
        {% set h = states('sensor.sonoff_a48005a66a_humidity') %}
        {% set b = states('sensor.sonoff_a48005a66a_battery') %}
        - **Вулиця — балкон** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set t = states('sensor.sonoff_a48001c18f_temperature') %}
        {% set h = states('sensor.sonoff_a48001c18f_humidity') %}
        {% set b = states('sensor.sonoff_a48001c18f_battery') %}
        - **Гостьова — температура/вологість** — {% if t in bad %}🔴 недоступний{% else %}🟢 {{ t }} °C · {{ h }}% · батарея {{ b }}%{% endif %}

        {% set b = states('sensor.sonoff_a48001bcf2_battery') %}
        - **Гаражні ворота — датчик 1** — {% if b in bad %}🔴 недоступний{% else %}🟢 на зв'язку · батарея {{ b }}%{% endif %}

        {% set b = states('sensor.sonoff_a48005b691_battery') %}
        - **Гаражні ворота — датчик 2** — {% if b in bad %}🔴 недоступний{% else %}🟢 на зв'язку · батарея {{ b }}%{% endif %}

        {% set motion = states('binary_sensor.sonoff_a48001bcc7') %}
        {% set b = states('sensor.sonoff_a48001bcc7_battery') %}
        - **Датчик руху** — {% if motion == 'on' %}🟠 виявлено рух · батарея {{ b }}%{% elif motion == 'off' %}🟢 руху немає · батарея {{ b }}%{% else %}🔴 недоступний{% endif %}
- title: Бойлер
  path: midea
  icon: mdi:water-boiler
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: thermostat
      entity: water_heater.144036023323246_water_heater
      name: Електричний водонагрівач
      grid_options:
        columns: full
    - type: entities
      title: Деталі
      grid_options:
        columns: full
      entities:
      - entity: water_heater.144036023323246_water_heater
        name: Стан
    - type: history-graph
      title: Температура за 24 години
      hours_to_show: 24
      entities:
      - entity: water_heater.144036023323246_water_heater
        name: Водонагрівач
  - type: grid
    cards:
    - type: heading
      heading: Спожита електроенергія
      grid_options:
        columns: full
    - type: tile
      entity: sensor.boiler_potuzhnist
      name: Потужність зараз
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.boiler_spozhito
      name: Спожито всього
      grid_options:
        columns: 6
    - type: statistics-graph
      title: Спожито за добу
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.boiler_spozhito
        name: Бойлер
    - type: history-graph
      title: Потужність за 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.boiler_potuzhnist
        name: Потужність тена
    - type: markdown
      title: Як рахується
      grid_options:
        columns: full
      content: >
        Бойлер не має вбудованого лічильника енергії, тому споживання
        оцінюється. Апарат повідомляє прапорець `heating` (тен працює) і поле
        `heating_power`, яке дорівнює 2200 Вт лише коли увімкнений верхній
        тен; коли гріє лише нижній, воно дорівнює нулю. Тому формула бере
        `heating_power`, а якщо той нульовий при активному нагріві -
        підставляє 800 Вт. Обидві цифри звірені зі стрибком загального
        лічильника будинку: вимкнення верхнього тена давало -2.18 і -1.92 кВт,
        нижнього - близько -0.75 кВт. Похибка очікується в межах 10-15 %.
- title: Тепла підлога
  path: floor
  icon: mdi:heating-coil
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Контур 1
      grid_options:
        columns: full
    - type: thermostat
      entity: climate.terneo_1
      name: Тепла підлога 1
      grid_options:
        columns: full
    - type: entities
      title: Стан
      grid_options:
        columns: full
      entities:
      - entity: switch.terneo_1_power
        name: Живлення
      - entity: sensor.terneo_1_floor_temperature
        name: Температура підлоги
      - entity: sensor.terneo_1_target_temperature
        name: Уставка
      - type: divider
      - entity: sensor.terneo_1_heating_active
        name: Нагрів активний
      - entity: sensor.terneo_1_current_power
        name: Потужність зараз
      - entity: sensor.terneo_1_heating_time
        name: Час нагріву
      - entity: sensor.terneo_1_heating_energy
        name: Спожито всього
    - type: statistics-graph
      title: Спожито за добу - контур 1
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.terneo_1_heating_energy
        name: Контур 1
  - type: grid
    cards:
    - type: heading
      heading: Контур 2
      grid_options:
        columns: full
    - type: thermostat
      entity: climate.terneo_2
      name: Тепла підлога 2
      grid_options:
        columns: full
    - type: entities
      title: Стан
      grid_options:
        columns: full
      entities:
      - entity: switch.terneo_2_power
        name: Живлення
      - entity: sensor.terneo_2_floor_temperature
        name: Температура підлоги
      - entity: sensor.terneo_2_air_temperature
        name: Температура повітря
      - entity: sensor.terneo_2_target_temperature
        name: Уставка
      - type: divider
      - entity: sensor.terneo_2_heating_active
        name: Нагрів активний
      - entity: sensor.terneo_2_current_power
        name: Потужність зараз
      - entity: sensor.terneo_2_heating_time
        name: Час нагріву
      - entity: sensor.terneo_2_heating_energy
        name: Спожито всього
    - type: statistics-graph
      title: Спожито за добу - контур 2
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      grid_options:
        columns: full
      entities:
      - entity: sensor.terneo_2_heating_energy
        name: Контур 2
  - type: grid
    cards:
    - type: history-graph
      title: Потужність обох контурів за 24 години
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: sensor.terneo_1_current_power
        name: Контур 1
      - entity: sensor.terneo_2_current_power
        name: Контур 2
    - type: markdown
      title: Як рахується
      grid_options:
        columns: full
      content: >
        На відміну від бойлера, тут нічого оцінювати не треба - термостат
        Terneo сам віддає `heating_energy` у кВт-год. Але це теж не вимір:
        всередині немає лічильника, і термостат рахує енергію з часу
        замикання реле, помноженого на задану потужність контуру. Якщо
        реальна потужність кабелю відрізняється від тієї, що прошита в
        термостаті, цифра поїде пропорційно.

        Контур 2 фізично не ввімкнений, тому всі його сутності показують
        `unavailable`. Ніяких дій для нього робити не треба - він уже
        доданий і в цей дашборд, і в Energy-дашборд, і почне рахувати сам,
        щойно на нього подадуть живлення.
