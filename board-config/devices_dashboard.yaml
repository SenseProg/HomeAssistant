    - type: entities
      title: Стан
      grid_options:
        columns: full
      entities:
      - entity: switch.terneo_2_power
        name: Живлення
      - entity: sensor.terneo_2_floor_temperature
        name: Температура підлоги
      - entity: sensor.terneo_2_air_temperature
        name: Температура повітря
      - entity: sensor.terneo_2_target_temperature
        name: Уставка
      - type: divider
      - entity: sensor.terneo_2_heating_active
        name: Нагрів активний
      - entity: sensor.terneo_2_current_power
        name: Потужність зараз
