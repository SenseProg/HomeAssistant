      grid_options:
        columns: full
      content: 'Бойлер не має вбудованого лічильника енергії, тому споживання оцінюється. Апарат повідомляє
        прапорець `heating` (тен працює) і поле `heating_power`, яке дорівнює 2200 Вт лише коли увімкнений
        верхній тен; коли гріє лише нижній, воно дорівнює нулю. Тому формула бере `heating_power`, а якщо
        той нульовий при активному нагріві - підставляє 800 Вт. Обидві цифри звірені зі стрибком загального
        лічильника будинку: вимкнення верхнього тена давало -2.18 і -1.92 кВт, нижнього - близько -0.75
